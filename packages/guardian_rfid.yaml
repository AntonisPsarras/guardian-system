# RFID slot helpers, occupancy sensors, and the slot-id whitelist.
#
# The key rack is pre-declared at the keypad cap of 9 (one digit, ENROLL_DUP
# encodes the slot as a single character). After the portal firmware that
# reads sensor.guardian_rfid_slot_map.length() is flashed once, add/remove is
# enroll / guardian_clear_rfid_slot from the Guardian panel — no YAML edit
# and no second flash. Empty positions are free slots, not residents:
# occupancy readers skip any id whose card_id is not 16 lowercase hex.
#
# Do not leave a whitelist id without helpers: process_rfid_scan would try to
# write a missing entity. Do not leave helpers without a whitelist id: a
# leftover card_id would still match.
#
# These helpers used to be created by hand in Settings -> Helpers. Declaring
# them here is what makes max: 64 a guarantee rather than a DEPLOY.md warning,
# and what makes a visitor policy exist at all. On an existing install the UI
# helpers MUST be deleted before this package is deployed, or Home Assistant
# will refuse the colliding entity ids. See DEPLOY.md (ninth pass).

input_boolean:
  # Session flag for enrollment, not a per-slot setting. Press 0 on the portal
  # keypad while enrollment is on to toggle it; the next card (or a tap of an
  # already-registered card) is recorded as a visitor. Cleared whenever
  # enrollment mode turns on or off, so a leftover press cannot silently mark
  # tomorrow's resident card as a guest.
  guardian_enroll_as_visitor:
    name: Guardian Enroll As Visitor
    icon: mdi:account-clock-outline
    initial: false

# YAML input_text / input_select with `initial:` skip restore on every Home
# Assistant start (the value is applied instead). That is what made enrolled
# cards vanish after a restart: initial: '' wiped the hashes, occupancy went
# to ----, and the next tap was DENIED_CARD. Stolen/Lost and visitor would
# have reset the same way (stolen card grants again; visitor counts as home).
#
# Do not put initial: on credential or name helpers. Occupancy already treats
# anything that is not a 16-character hex card_id after trim/lower — '',
# unknown, truncated — as empty, so a first-boot unset card_id is a free slot.
# Enrollment always writes presence and policy. guardian_enroll_as_visitor
# and guardian_enroll_pending_name keep initial: because a leftover guest
# flag or name after a restart is a session leak, not a credential.
#
# rfid_N_hash is no longer the credential. It stays so a leftover UI helper
# id does not collide, and so guardian_clear_rfid_slot can still wipe a UID
# digest that would otherwise remain a cloning oracle (F-20). Occupancy and
# matching read rfid_N_card_id. Person names live on rfid_N_name; the
# input_select friendly_name stays "RFID N" for the helper id.
input_text:
  guardian_enroll_pending_name:
    name: Guardian Enroll Pending Name
    icon: mdi:account-edit-outline
    max: 32
    initial: ''
  # Whether each enrolled card's payload is password-protected ON THE CARD, as
  # last reported by a reader. Written only by process_rfid_scan, read only by
  # the panel's key list. It gates nothing.
  #
  # FORMAT: comma-separated `<slot><flag>`, flag `p` for protected and `u` for
  # unprotected - "1p,3u,4p". Nine slots is at most 27 characters.
  #
  # A PAIR LIST RATHER THAN A PLAIN LIST OF UNPROTECTED IDS, and that is the
  # whole design. A bare list has two states and this has three: protected,
  # unprotected, and NEVER REPORTED. Absence from a bare list would mean "safe"
  # and "nobody has ever looked" at the same time, and the second is the state
  # every key in this house is actually in - both devices on this door run
  # firmware older than the field, so they say nothing on every scan. Drawing
  # that as "protected" would tell a household their keys had been checked and
  # passed, which is the one thing this must not do.
  #
  # NO initial:, deliberately, and for the opposite reason to most helpers here.
  # `initial:` is applied on every start and skips restore_state, so a helper
  # that declares one cannot carry anything across a restart. This holds a
  # finding about physical cards; it does not stop being true because Home
  # Assistant restarted, and re-deriving it would mean waiting for every key in
  # the house to be tapped again.
  guardian_card_protection:
    name: Guardian Card Protection
    icon: mdi:shield-key-outline
    max: 64
  rfid_1_hash:
    name: RFID 1 Hash
    max: 64
    mode: password
  rfid_2_hash:
    name: RFID 2 Hash
    max: 64
    mode: password
  rfid_3_hash:
    name: RFID 3 Hash
    max: 64
    mode: password
  rfid_4_hash:
    name: RFID 4 Hash
    max: 64
    mode: password
  rfid_5_hash:
    name: RFID 5 Hash
    max: 64
    mode: password
  rfid_6_hash:
