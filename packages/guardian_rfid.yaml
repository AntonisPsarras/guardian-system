template:
  - sensor:
      # THE runtime whitelist. Scripts and automations loop this instead of
      # range(1, 5) or ['1','2','3','4']. Occupancy sensors below also loop it;
      # they are trigger-based so a Jinja-built entity id is legal (the
      # listener extractor never sees those templates).
      #
      # Static on purpose: a template that listed the hash helpers here would
      # be a fourth copy of the slot list. The keypad cap is 9, so the
      # whitelist is the full rack; empty positions are free slots, not people.
      - name: Guardian RFID Slots
        unique_id: guardian_rfid_slots
        icon: mdi:card-account-details-outline
        state: '1,2,3,4,5,6,7,8,9'
        attributes:
          count: >-
            {{ (this.state | string).split(',') | map('trim')
               | reject('eq', '') | list | count }}

  # Trigger-based so the state templates can loop. Home Assistant's listener
  # extractor only sees a complete quoted entity id; building
  # 'input_text.rfid_' ~ i ~ '_card_id' inside a normal template sensor is how the
  # portal enrollment screen announced ALL SLOTS FULL on an empty house
  # (DEPLOY.md fifth pass). The trigger entity_id list is the remaining unroll,
  # sitting next to the helper declarations above.
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
          - input_text.rfid_1_card_id
          - input_text.rfid_2_card_id
          - input_text.rfid_3_card_id
          - input_text.rfid_4_card_id
          - input_text.rfid_5_card_id
          - input_text.rfid_6_card_id
          - input_text.rfid_7_card_id
          - input_text.rfid_8_card_id
          - input_text.rfid_9_card_id
          - input_text.rfid_1_hash
          - input_text.rfid_2_hash
          - input_text.rfid_3_hash
          - input_text.rfid_4_hash
          - input_text.rfid_5_hash
          - input_text.rfid_6_hash
          - input_text.rfid_7_hash
          - input_text.rfid_8_hash
          - input_text.rfid_9_hash
          - input_text.rfid_1_name
          - input_text.rfid_2_name
          - input_text.rfid_3_name
          - input_text.rfid_4_name
          - input_text.rfid_5_name
          - input_text.rfid_6_name
          - input_text.rfid_7_name
          - input_text.rfid_8_name
          - input_text.rfid_9_name
          - input_text.guardian_enrollment_slot
          - input_select.rfid_1
          - input_select.rfid_2
          - input_select.rfid_3
          - input_select.rfid_4
          - input_select.rfid_5
          - input_select.rfid_6
          - input_select.rfid_7
          - input_select.rfid_8
          - input_select.rfid_9
          - input_select.rfid_1_policy
          - input_select.rfid_2_policy
          - input_select.rfid_3_policy
          - input_select.rfid_4_policy
          - input_select.rfid_5_policy
          - input_select.rfid_6_policy
          - input_select.rfid_7_policy
          - input_select.rfid_8_policy
          - input_select.rfid_9_policy
    sensor:
      # How many slots hold no well-formed card_id. Same "not 16 hex characters
      # after trim/lower" rule process_rfid_scan uses to pick a slot.
      - name: Guardian RFID Free Slots
        unique_id: guardian_rfid_free_slots
        icon: mdi:card-multiple-outline
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set ns = namespace(n=0) %}
          {% for i in slots %}
            {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                       | string | trim | lower %}
            {% if not (c | length == 16 and c is match('^[0-9a-f]{16}$')) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}

      # One character per slot: "X" occupied, "-" free. The portal draws this
      # string's length as the box count, so the firmware does not have a
      # compiled slot count of its own.
      - name: Guardian RFID Slot Map
        unique_id: guardian_rfid_slot_map
        icon: mdi:view-grid-outline
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set ns = namespace(s='') %}
          {% for i in slots %}
            {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                       | string | trim | lower %}
            {% set ns.s = ns.s ~ ('X' if c | length == 16 and c is match('^[0-9a-f]{16}$') else '-') %}
          {% endfor %}
          {{ ns.s }}

      # Keypad choice if it is a real slot id, otherwise the first free slot,
      # "none" when every slot is occupied and nothing has been chosen.
      - name: Guardian Enrollment Target Slot
        unique_id: guardian_enrollment_target_slot
        icon: mdi:card-plus-outline
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set chosen = states('input_text.guardian_enrollment_slot')
                          | string | trim %}
          {% if chosen in slots %}{{ chosen }}
          {%- else %}
            {% set ns = namespace(slot='none') %}
            {% for i in slots %}
              {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                         | string | trim | lower %}
              {% if ns.slot == 'none' and not (c | length == 16 and c is match('^[0-9a-f]{16}$')) %}
                {% set ns.slot = i %}
              {% endif %}
            {% endfor %}
            {{ ns.slot }}
          {%- endif %}

      # Occupied resident slots only. Empty rack positions and visitors are
      # not occupants; they must not turn "2/2 home" into "2/9 home".
      - name: Guardian Presence Summary
        unique_id: guardian_presence_summary
        icon: mdi:home-account
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set ns = namespace(home=[], total=0) %}
          {% for i in slots %}
            {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                       | string | trim | lower %}
            {% set occupied = c | length == 16 and c is match('^[0-9a-f]{16}$') %}
            {% if occupied and states('input_select.rfid_' ~ i ~ '_policy') != 'visitor' %}
              {% set s = 'input_select.rfid_' ~ i %}
              {% if states(s) not in ['unavailable', 'unknown'] %}
                {% set ns.total = ns.total + 1 %}
                {% if states(s) == 'At home' %}
                  {% set raw = states('input_text.rfid_' ~ i ~ '_name')
                     | string | trim %}
                  {% set label = raw if raw not in ['', 'unknown', 'unavailable']
                     else 'Key ' ~ i %}
                  {% set ns.home = ns.home + [label.split(' ') | first] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.home | length }}/{{ ns.total }} home{% if ns.home %} · {{ ns.home
          | join(', ') }}{% endif %}

      # Packed roster for the portal idle page: "Anton|HOME;Sam|AWAY;Maria|GUEST".
      # Firmware splits on ';' / '|' and never draws those separators (the
      # glyph set has no '|'). Occupied keys only, visitors included, first
      # word of the name, 12 characters. Empty string means no keys.
      - name: Guardian Presence Roster
        unique_id: guardian_presence_roster
        icon: mdi:account-group-outline
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set ns = namespace(rows=[]) %}
          {% for i in slots %}
            {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                       | string | trim | lower %}
            {% set occupied = c | length == 16 and c is match('^[0-9a-f]{16}$') %}
            {% if occupied %}
              {% set raw = states('input_text.rfid_' ~ i ~ '_name')
                 | string | trim %}
              {% set label = raw if raw not in ['', 'unknown', 'unavailable']
                 else 'Key ' ~ i %}
              {% set label = (label.split(' ') | first)
                 | replace('|', '') | replace(';', '') %}
              {% set label = label[:12] %}
              {% set pol = states('input_select.rfid_' ~ i ~ '_policy') %}
              {% set pres = states('input_select.rfid_' ~ i) %}
              {% if pres in ['Stolen', 'Stolen/Lost'] %}
                {% set st = 'LOST' %}
              {% elif pol == 'visitor' %}
                {% set st = 'GUEST' %}
              {% elif pres == 'At home' %}
                {% set st = 'HOME' %}
              {% else %}
                {% set st = 'AWAY' %}
              {% endif %}
              {% set ns.rows = ns.rows + [label ~ '|' ~ st] %}
            {% endif %}
          {% endfor %}
          {{ ns.rows | join(';') }}

      # Same whitelist order as the slot map. Occupied names (first word,
      # 8 characters); "-" when empty. The portal enrollment boxes and
      # ENROLL_DUP read this so the keypad still uses 1-9 while the
      # labels are people.
      - name: Guardian RFID Key Labels
        unique_id: guardian_rfid_key_labels
        icon: mdi:card-account-details-outline
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set ns = namespace(rows=[]) %}
          {% for i in slots %}
            {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                       | string | trim | lower %}
            {% set occupied = c | length == 16 and c is match('^[0-9a-f]{16}$') %}
            {% if occupied %}
              {% set raw = states('input_text.rfid_' ~ i ~ '_name')
                 | string | trim %}
              {% set label = raw if raw not in ['', 'unknown', 'unavailable']
                 else 'Key' ~ i %}
              {% set label = (label.split(' ') | first)
                 | replace('|', '') | replace(';', '') %}
              {% set ns.rows = ns.rows + [label[:8]] %}
            {% else %}
              {% set ns.rows = ns.rows + ['-'] %}
            {% endif %}
          {% endfor %}
          {{ ns.rows | join(';') }}

  # Who has changed their notification preferences away from the default, and
  # what to. DIAGNOSTICS ONLY.
  #
  # Read this twice: nothing on the delivery path may depend on this sensor.
  # guardian_notify_person and guardian_notify_broadcast read
  # input_select.rfid_N_notify_level and input_text.rfid_N_notify_mute
  # DIRECTLY, in the same slot loop they already use for the phone picker. That
  # is deliberate and it is the whole lesson of the note further down this file:
  # a trigger-based sensor renders `unknown` after a template reload, and the
  # last time an alert path trusted one, every mapped alert in the house was
  # silently skipped with a phone plainly selected in the panel. A preferences
  # sensor that went `unknown` would do something worse - it would make every
  # person look like they had opted out of everything.
  #
  # Trigger-based because the state template loops the rack to build entity
  # ids, which a plain state template may not do (see the listener-extractor
  # note above sensor.guardian RFID Free Slots). That is exactly the property
  # that disqualifies it from the delivery path, and it is fine here: the panel
  # reads the helpers directly too, and this exists for Developer Tools, for
  # the Diagnostics page, and for answering "why did Sam not get that?" without
  # opening nine helpers by hand.
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
          - input_select.rfid_1_notify_level
          - input_select.rfid_2_notify_level
          - input_select.rfid_3_notify_level
          - input_select.rfid_4_notify_level
          - input_select.rfid_5_notify_level
          - input_select.rfid_6_notify_level
          - input_select.rfid_7_notify_level
          - input_select.rfid_8_notify_level
          - input_select.rfid_9_notify_level
          - input_text.rfid_1_notify_mute
          - input_text.rfid_2_notify_mute
          - input_text.rfid_3_notify_mute
          - input_text.rfid_4_notify_mute
          - input_text.rfid_5_notify_mute
          - input_text.rfid_6_notify_mute
          - input_text.rfid_7_notify_mute
          - input_text.rfid_8_notify_mute
          - input_text.rfid_9_notify_mute
    sensor:
      - name: Guardian Notify Prefs
        unique_id: guardian_notify_prefs
        icon: mdi:bell-cog-outline
        # How many occupied keys have moved off the default (Important, nothing
        # muted). 0 means the whole house is on the shipped default, which is
        # the first thing worth knowing when alerts seem quiet.
        state: >-
          {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}
          {% set ns = namespace(n=0) %}
          {% for i in slots %}
            {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                       | string | trim | lower %}
            {% set lvl = states('input_select.rfid_' ~ i ~ '_notify_level')
                         | string | trim %}
            {% set mute = states('input_text.rfid_' ~ i ~ '_notify_mute')
                          | string | trim %}
            {% if c | length == 16 and c is match('^[0-9a-f]{16}$')
               and (lvl not in ['Important', 'unknown', 'unavailable', '']
                    or mute not in ['', 'unknown', 'unavailable']) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          # The full table, as a list of mappings, so a state cap of 255 can
          # never truncate it. Same shape the delivery path computes inline.
          prefs: >-
            {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                           | map('trim') | reject('eq', '') | list %}
            {% set ns = namespace(rows=[]) %}
            {% for i in slots %}
              {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                         | string | trim | lower %}
              {% set lvl = states('input_select.rfid_' ~ i ~ '_notify_level')
                           | string | trim %}
              {% set mute = states('input_text.rfid_' ~ i ~ '_notify_mute')
                            | string | trim %}
              {% set target = states('input_select.rfid_' ~ i ~ '_notify_target')
                              | string | trim %}
              {% set ns.rows = ns.rows + [{
                   'slot': i,
                   'occupied': c | length == 16 and c is match('^[0-9a-f]{16}$'),
                   'target': target if target not in ['unknown', 'unavailable', '']
                             else 'none',
                   'level': lvl if lvl in ['Everything', 'Important',
                                           'Urgent only', 'Off'] else 'Important',
                   'muted': (mute.split(',') | map('trim') | reject('eq', '')
                             | list) if mute not in ['unknown', 'unavailable', '']
                            else [] }] %}
            {% endfor %}
            {{ ns.rows }}

  # Every notify target a household could pick, minus Guardian's own internal
  # ones. Object ids only (the part after notify.), comma-joined, sorted.
  #
  # This used to be trigger-based on start / entity_registry_updated / a ten
  # minute tick, reading integration_entities('mobile_app'). That is what broke
  # every phone link on the live house: a trigger-based sensor renders `unknown`
  # after a template reload and stays that way until the next tick, and
  # integration_entities() comes back empty in the window where the mobile_app
  # entries have not finished loading. Meanwhile the picker on Keys renders from
  # input_select.rfid_N_notify_target's own `options` attribute, which persists
  # in .storage forever - so the panel kept showing the right phone, the Send
  # test alert button stayed enabled, and script.guardian_notify_person's
  # `mapped` template decided the slot was unlinked because the object id was
  # not in this CSV. "Nothing was sent", with a phone plainly selected.
  #
  # So: a plain state-driven template sensor over the notify domain. It is never
  # `unknown`, it re-renders the moment a notify entity appears or disappears,
  # and it needs no periodic tick to become correct. Do not filter by an
  # entity-id prefix such as mobile_app_ - real device names on this install do
  # not follow that convention (e.g. notify.ipad_kitchen), and tablets are a
  # legitimate place to send a door alert.
  #
  # `phones` carries the same list as a real list. A state is capped at 255
  # characters and a rack of long device names can exceed that, which would put
  # the entity into an error state and take every link down with it; consumers
  # that can read an attribute should prefer it over splitting the state.
  - sensor:
      - name: Guardian Notify Targets Available
        unique_id: guardian_notify_targets_available
        icon: mdi:cellphone-message
        state: >-
          {% set skip = ['guardian_data_log', 'persistent_notification',
                         'guardian_alerts'] %}
          {% set ids = states.notify
                       | map(attribute='object_id')
                       | reject('in', skip) | unique | list | sort %}
          {{ ids | join(',') }}
        attributes:
          phones: >-
            {% set skip = ['guardian_data_log', 'persistent_notification',
                           'guardian_alerts'] %}
            {{ states.notify | map(attribute='object_id')
               | reject('in', skip) | unique | list | sort }}
          # Counted from the domain, not from this.state: in a state-based
          # template entity `this` is the state as it was BEFORE this render,
          # so a count taken from it would report the previous list.
          count: >-
            {% set skip = ['guardian_data_log', 'persistent_notification',
                           'guardian_alerts'] %}
            {{ states.notify | map(attribute='object_id')
               | reject('in', skip) | unique | list | count }}

      # Twin of sensor.guardian_version, declaring the version of THIS file.
      # Two packages can go stale independently - they are two copies - and this
      # one is the one that matters most for alerts: it owns
      # sensor.guardian_rfid_slots, which script.guardian_notify_person consults
      # before it will read a slot's phone link at all. If this file is missing
      # or failed to merge, that sensor is absent, and every alert in the house
      # is skipped no matter how healthy the rest of the install is.
      #
      # Its mere existence is the useful signal; the literal tells the panel
      # whether it matches the other halves. See the long note on
      # sensor.guardian_version in packages/guardian.yaml for why any of this
      # exists and what to bump together.
      - name: Guardian RFID Version
        unique_id: guardian_rfid_version
        icon: mdi:tag-check-outline
        state: '2.32.5'
