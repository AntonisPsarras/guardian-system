    options:
      - none
  # Per-person notification preferences, half one: the severity floor.
  #
  # Unlike rfid_N_notify_target above, the options here are STATIC - a closed
  # set of four words that cannot depend on what hardware is registered. That
  # single difference removes the whole apparatus that surrounds the phone
  # picker: no runtime set_options, no rfid_N_notify_level_saved mirror, no
  # refresh script. Home Assistant restores the chosen option by itself,
  # because the option it is restoring is always still in the list.
  #
  # Important is listed FIRST on purpose, and it is the only reason the order
  # is not the obvious loudest-to-quietest. A helper that has never been set
  # comes up on its first option, and Important is the default a new key
  # should have: everything the household actually needs, minus the routine
  # chatter. Encoding the default as position is what lets these have no
  # initial: (so they restore) while still defaulting correctly on a fresh
  # install - the alternative, initial: Important, would silently reset every
  # person's choice on every restart, which is precisely the bug documented at
  # the top of the input_text block.
  #
  # The panel does not render this order. guardian-panel.js draws its own
  # segmented control in reading order (Everything, Important, Urgent only,
  # Off); this list is only ever seen in Developer Tools.
