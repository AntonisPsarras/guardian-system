  # Per-person notification preferences, half two: the muted-category list.
  # A comma-separated set of category tokens this person does NOT want, drawn
  # from the closed six: mine, security, access, presence, camera, system.
  #
  # Empty is the default and means nothing is muted - all six on. That matters
  # for more than tidiness: an unset helper, a helper wiped by a bad restore,
  # and a person who has muted nothing must all read the same, and they must
  # all read as "send it". A preference store whose failure mode is silence is
  # the wrong way round on a security system. The reader in scripts.yaml treats
  # any unparseable value as empty for exactly that reason.
  #
  # No initial:, so it restores (see the note above input_text). max: 60 fits
  # all six tokens joined with commas (44 characters) with room to spare; the
  # tokens are a closed set, so this can never grow unbounded.
  rfid_1_notify_mute:
