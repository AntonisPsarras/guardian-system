- id: '1774279935578'
  alias: 'Guardian: RFID Scanned'
  description: Single dispatcher for both readers; avoids double-processing interior
    scans. New firmware sends result/card_id/counter; a uid-only event is the
    pre-authenticator overlap and is passed through for one-restart matching.
  triggers:
  - trigger: event
    event_type: esphome.rfid_scanned
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.source is defined and\n   trigger.event.data.source
      in ['doorbell', 'interior_portal'] }}"
  actions:
  - action: script.process_rfid_scan
    data:
      uid: '{{ trigger.event.data.uid | default('''', true) }}'
      source: '{{ trigger.event.data.source }}'
      result: '{{ trigger.event.data.result | default('''', true) }}'
      card_id: '{{ trigger.event.data.card_id | default('''', true) }}'
      counter: '{{ trigger.event.data.counter | default(0, true) }}'
      rotated: '{{ trigger.event.data.rotated | default(false, true) }}'
      # DEFAULTS TO EMPTY, NOT false, and the difference is the whole point.
      # Both readers have published this field since the forty-third pass and
      # this dispatcher dropped it on the floor, so nothing downstream could read
      # it however much it wanted to - which is why DEPLOY.md's claim that the
      # protection state was "surfaced" described an event with no subscriber.
      #
      # An absent field means the reader is running firmware that predates it,
      # and both devices on this door are running exactly such a build today.
      # Defaulting that to false would report every key in the house as
      # unprotected and clonable, which is an accusation rather than a finding.
      # Empty travels through process_rfid_scan as "not stated" and records
      # nothing.
      protected: '{{ trigger.event.data.protected | default('''', true) }}'
  mode: queued
  max: 10
- id: '1786500000016'
  alias: 'Guardian: RFID Scan Debug'
  description: >-
    One persistent notification per scan, showing everything needed to tell the
    four ways a card can fail apart. OFF unless
    input_boolean.guardian_verbose_notifications is on.

    Answers, in one place and with no file access or event-bus listening:

      * Did Home Assistant receive the scan at all? The note exists, or it does
        not - which separates a reader/API problem from a matching problem.
      * Is the UID stable? Tap one card several times and compare the UID line.
        ESPHome's RC522 runs a single anticollision cascade level, so a 7-byte
        UID can enumerate differently on each tap; such a card enrols one hash
        and presents another, and can never match no matter what the rest of the
        system does.
      * Is the stored hash even a hash? Each slot prints its LENGTH. Anything
        other than 64 is a truncated or malformed helper - the silent failure
        input_text.set_value produces when a helper's max is under 64.
      * Does this card match, and which slot? Printed outright.

    Deliberately its own automation rather than logging inside
    process_rfid_scan: it must report what arrived even when that script rejects
    it, drops it, or is not reached at all.
  triggers:
  - trigger: event
    event_type: esphome.rfid_scanned
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_verbose_notifications
    state: 'on'
  actions:
  - variables:
      uid: "{{ trigger.event.data.uid | default('', true) | string }}"
      src: "{{ trigger.event.data.source | default('?', true) }}"
      result: "{{ trigger.event.data.result | default('', true) | string }}"
      card_id: "{{ trigger.event.data.card_id | default('', true) | string | trim | lower }}"
      counter: "{{ trigger.event.data.counter | default(0, true) }}"
      rotated: "{{ trigger.event.data.rotated | default(false, true) }}"
      uid_bytes: "{{ trigger.event.data.uid_bytes | default(((uid | length) + 1) // 3, true) }}"
      matched: >-
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% set cid = trigger.event.data.card_id | default('', true) | string | trim | lower %}
        {% set ns = namespace(slot='NO MATCH') %}
        {% for i in ids %}
          {% set stored = states('input_text.rfid_' ~ i ~ '_card_id')
                          | string | trim | lower %}
          {% if stored | length == 16 and stored is match('^[0-9a-f]{16}$') and stored == cid %}
            {% set ns.slot = 'slot ' ~ i %}
          {% endif %}
        {% endfor %}
        {{ ns.slot }}
      slots: >-
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(s=[]) %}
        {% for i in ids %}
          {% set stored = states('input_text.rfid_' ~ i ~ '_card_id')
                          | string | trim | lower %}
          {% set ns.s = ns.s + [i ~ ': len=' ~ (stored | length) ~ ' c=' ~
             states('input_number.rfid_' ~ i ~ '_counter') ~
             ' [' ~ states('input_select.rfid_' ~ i) ~ '/' ~
             states('input_select.rfid_' ~ i ~ '_policy') ~ ']'] %}
        {% endfor %}
        {{ ns.s | join('\n') }}
  - action: persistent_notification.create
    data:
      notification_id: "guardian_scan_debug_{{ now().strftime('%H%M%S') }}"
      title: "Scan {{ now().strftime('%H:%M:%S') }} · {{ src }} · {{ matched }}"
      message: >-
        result: {{ result }}  ({{ uid_bytes }}-byte UID, not logged)

        card_id_len: {{ card_id | length }} · counter {{ counter }} · rotated {{ rotated }}

        Result: {{ matched }}


        Stored slots:

        {{ slots }}


        Enrollment: {{ states('input_boolean.guardian_enrollment_mode') }}
        · target slot {{ states('sensor.guardian_enrollment_target_slot') }}
        · free {{ states('sensor.guardian_rfid_free_slots') }}
        · map {{ states('sensor.guardian_rfid_slot_map') }}

        Elevated: {{ states('binary_sensor.guardian_elevated_mode') }}
        · display {{ states('input_text.portal_display_state') }}
        · seq {{ states('input_number.portal_display_seq') }}
  mode: queued
  max: 10
- id: '1789200000001'
  alias: 'Guardian: Portal Tamper Alert'
  description: >-
    Restored with the portal firmware that emits esphome.tamper_alert. The
    forty-first pass deleted the previous automation because nothing emitted
    that event; an honest comment in an automation list is not a feature.

    Magnet defeat is the leaf rotating while the reed still reads closed.
    Spoofed contact is the reed opening while the leaf never rotated. Both
    are decided on the portal. This automation only escalates: it fires
    guardian.major_alarm first, so the Major Alarm Handler owns the siren,
    the ALARM screen, and the non-maskable broadcast. A log write or a
    badge must never stand in front of that.
  triggers:
  - trigger: event
    event_type: esphome.tamper_alert
  actions:
  - event: guardian.major_alarm
    event_data:
      reason: >-
        {% set r = trigger.event.data.reason | default('', true) | string | trim %}
        {% if r == 'magnet_defeat' %}Portal tamper: magnet defeat
        {% elif r == 'spoofed_contact' %}Portal tamper: spoofed contact
        {% else %}Portal tamper: {{ r if r else 'unknown' }}{% endif %}
  - action: persistent_notification.create
    continue_on_error: true
    data:
      title: 'Guardian: portal tamper'
      notification_id: guardian_portal_tamper
      message: >-
        {% set r = trigger.event.data.reason | default('', true) | string | trim %}
        {% if r == 'magnet_defeat' %}
          The door leaf rotated while the contact still read closed.
        {% elif r == 'spoofed_contact' %}
          The door contact opened but the leaf never rotated.
        {% else %}
          Portal tamper ({{ r if r else 'unknown' }}).
        {% endif %}
  mode: queued
  max: 5
- id: '1774280492831'
  alias: 'Guardian: Stolen Card Alert'
  triggers:
  - trigger: event
    event_type: guardian.stolen_card_scanned
  actions:
  # Push first, badge second - the Major Alarm Handler's rule, which this
  # automation was the last alerting path not to follow. The persistent
  # notification is presentation: it is a badge in the web UI that somebody
  # sees eventually. The push is the alert. Unguarded and standing first, a
  # raise here ended the sequence and the push was never sent.
  #
  # It could raise. Every other interpolation on this path carries a default;
  # trigger.event.data.source did not, and a bare missing key on an event
  # payload is a template error, not an empty string. The one emitter always
  # sets it - but the trigger is an event type, and anything that can fire an
  # event can reach this automation without it.
  - action: script.guardian_notify_person
    continue_on_error: true
    data:
      slot: "{{ trigger.event.data.slot | default('', true) | string | trim }}"
      critical: true
      category: security
      severity: urgent
      # One of the three alerts that ignore notification preferences entirely.
      # Somebody is standing at the door with a key that was reported stolen;
      # a setting made months ago must not be the reason nobody hears about it.
      nonmaskable: true
      title: ⚠️ STOLEN/LOST CARD
      message: >-
        {% set who = trigger.event.data.name | default('', true) | string | trim %}
        {% set slot = trigger.event.data.slot | default('', true) | string | trim %}
        {% set src = trigger.event.data.source | default('an unknown reader', true) %}
        {{ who if who else 'Key ' ~ slot }} was scanned at
        {{ src }}. The alarm sounded immediately.
      data:
        priority: high
        ttl: 0
  - action: persistent_notification.create
    continue_on_error: true
    data:
      title: ⚠️ Stolen/lost card scanned
      message: >-
        {% set who = trigger.event.data.name | default('', true) | string | trim %}
        {% set slot = trigger.event.data.slot | default('', true) | string | trim %}
        {% set src = trigger.event.data.source | default('an unknown reader', true) %}
        {{ who if who else 'Key ' ~ slot }} was scanned at
        {{ src }}. The alarm sounded immediately.
      notification_id: guardian_stolen_card
  mode: queued
- id: '1774799624807'
  alias: 'Guardian: Portal LED Mirror'
  # Triggers on the SEQUENCE COUNTER, not on the display string.
  #
  # input_text.set_value writing a value the helper already holds emits no
  # state_changed event, so a repeated verdict never re-triggered this - and
  # because the GRANTED branch below sleeps three seconds and then writes IDLE,
  # the earlier run went on to clear the screen underneath the newer verdict it
  # had never seen. Scanning a card immediately after enrolling it is exactly
  # that sequence (GRANTED, then GRANTED again), which is why a freshly enrolled
  # card produced no on-screen confirmation while unknown cards - which write the
  # different string DENIED_CARD - were always rejected visibly.
  #
  # script.guardian_set_display bumps the counter on every write, so mode:
  # restart now correctly restarts the three-second window on a repeat verdict.
  # No loop is possible: this automation's own IDLE write bumps the counter once,
  # re-enters at the default branch, and stops.
  description: Mirrors the portal display verdict onto the portal LED.
  triggers:
  - trigger: state
    entity_id: input_number.portal_display_seq
  actions:
  - variables:
      st: "{{ states('input_text.portal_display_state') | string | trim }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ st == 'GRANTED' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guardian_interior_portal_portal_led
        data:
          rgb_color:
          - 0
          - 255
          - 0
          brightness_pct: 100
          effect: none
      - delay: 00:00:03
      - action: script.guardian_set_display
        data:
          value: IDLE
    # DENIED_CARD is the card-rejection twin of DENIED. They look the same here
    # - red flash, back to IDLE after three seconds - but the portal renders
    # them differently, because DENIED carries a "N PIN tries left" subtitle
    # that has no meaning when a card was the thing rejected.
    #
    # ENROLL_PICK ("all slots are full, press a slot digit") and ENROLL_DUP:N ("that
    # card is already in slot N") are enrollment rejections and behave the same
    # way. ENROLL_DUP carries its slot number after a colon, so it is matched as
    # a prefix.
    - conditions:
      - condition: template
        value_template: "{{ st in ['DENIED', 'DENIED_CARD', 'STOLEN', 'CLONE',
          'UNSUPPORTED', 'ENROLL_PICK'] or (st | string).startswith('ENROLL_DUP') }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guardian_interior_portal_portal_led
        data:
          effect: red_flash
      - delay: 00:00:03
      # Returning to IDLE would wipe the "AUTHENTICATE" screen while its clock is
      # still running towards an alarm. A wrong PIN during a challenge is
      # restored to CHALLENGE by the PIN handler itself; this just stays out of
      # the way. Same for keypad PIN-change: the handler restores PIN_CHANGE_*
      # after DENIED, and an IDLE write here would drop the person out of the
      # flow with the mode still on.
      - condition: state
        entity_id: input_boolean.guardian_entry_challenge
        state: 'off'
      - condition: state
        entity_id: input_boolean.guardian_doorbell_exit_pin
        state: 'off'
      - condition: state
        entity_id: input_boolean.guardian_pin_change_mode
        state: 'off'
      - action: script.guardian_set_display
        data:
          value: IDLE
    - conditions:
      - condition: template
        value_template: "{{ st == 'MFA' or (st | string).startswith('PIN_CHANGE') }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guardian_interior_portal_portal_led
        data:
          rgb_color:
          - 255
          - 200
          - 0
          effect: yellow_pulse
    - conditions:
      - condition: template
        value_template: "{{ st == 'HOLD' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guardian_interior_portal_portal_led
        data:
          rgb_color:
          - 255
          - 200
          - 0
          brightness_pct: 100
          effect: yellow_pulse
      - delay: 00:00:03
      - condition: state
        entity_id: input_boolean.guardian_entry_challenge
        state: 'off'
      - condition: state
        entity_id: input_boolean.guardian_doorbell_exit_pin
        state: 'off'
      - condition: state
        entity_id: input_boolean.guardian_pin_change_mode
        state: 'off'
      - action: script.guardian_set_display
        data:
          value: IDLE
    # An open grace challenge. Amber and pulsing, and deliberately with no
    # return-to-IDLE delay: this screen must persist until the challenge is
    # answered or times out.
    - conditions:
      - condition: template
        value_template: "{{ st == 'CHALLENGE' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guardian_interior_portal_portal_led
        data:
          rgb_color:
          - 255
          - 150
          - 0
          brightness_pct: 100
          effect: yellow_pulse
    - conditions:
      - condition: template
        value_template: "{{ st == 'ALARM' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.guardian_interior_portal_portal_led
        data:
          effect: red_flash
    default:
    - action: light.turn_off
      target:
        entity_id: light.guardian_interior_portal_portal_led
  mode: restart
- id: '1775063433362'
  alias: 'Guardian: Door Open Direction'
  description: Physical lever first, then authorized-reader intent if physics is
    silent, then confirmed swing. A 20s RFID window no longer outranks a lever
    that cannot move from outside. Unexplained opens are stashed until
    door_closed so late swing can still classify them.
  triggers:
  - trigger: event
    event_type: esphome.door_opened
  actions:
  - choose:
    # Physical inside + both windows: reader intent no longer disambiguates
    # on its own. IMU / lever / recency pick which window this opening
    # belongs to. Own reason values so Unscanned Key Entry (key_entry_no_lever)
    # and Forgetful Exit (lever_rotation) are unaffected.
    - conditions:
      - condition: template
        value_template: "{{ physical_inside and both_authorized and both_choice ==
          'entry' }}"
      sequence:
      - event: guardian.door_opened_from_outside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: '{{ both_confidence }}'
          reason: '{{ both_reason }}'
          verdict: '{{ verdict }}'
          device_confidence: '{{ device_confidence }}'
    - conditions:
      - condition: template
        value_template: "{{ physical_inside and both_authorized }}"
      sequence:
      - event: guardian.door_opened_from_inside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: '{{ both_confidence }}'
          reason: '{{ both_reason }}'
          verdict: '{{ verdict }}'
          device_confidence: '{{ device_confidence }}'
    # Lever agrees with an interior scan: keep recent_interior_rfid so
    # Forgetful Exit (wants lever_rotation) stays quiet on a registered exit.
    - conditions:
      - condition: template
        value_template: '{{ physical_inside and exit_authorized }}'
      sequence:
      - event: guardian.door_opened_from_inside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: high
          reason: recent_interior_rfid
          lever_peak_deg: '{{ lever_peak }}'
          device_confidence: '{{ device_confidence }}'
    # The exterior of this door is a fixed plate with a euro cylinder - the
    # inside lever physically cannot move during an entry from outside. A
    # qualified lever rotation is proof of an opening from inside, including
    # when an exterior RFID window is also running (the window is stale
    # intent, not physics).
    - conditions:
      - condition: template
        value_template: '{{ physical_inside }}'
      sequence:
      - event: guardian.door_opened_from_inside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: high
          reason: lever_rotation
          lever_peak_deg: '{{ lever_peak }}'
          device_confidence: '{{ device_confidence }}'
    - conditions:
      - condition: template
        value_template: "{{ both_authorized and both_choice == 'entry' }}"
      sequence:
      - event: guardian.door_opened_from_outside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: '{{ both_confidence }}'
          reason: '{{ both_reason }}'
          verdict: '{{ verdict }}'
          device_confidence: '{{ device_confidence }}'
    - conditions:
      - condition: template
        value_template: "{{ both_authorized and both_choice == 'exit' }}"
      sequence:
      - event: guardian.door_opened_from_inside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: '{{ both_confidence }}'
          reason: '{{ both_reason }}'
          verdict: '{{ verdict }}'
          device_confidence: '{{ device_confidence }}'
    # Confirmed swing, lever at rest, during an interior RFID window: this is
    # a key entry (or jimmy, F-18), not an exit. Prefer physics so Unscanned
    # Key Entry still fires and presence is not flipped to Away.
    - conditions:
      - condition: template
        value_template: '{{ physical_outside and exit_authorized }}'
      sequence:
      - event: guardian.door_opened_from_outside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: medium
          reason: key_entry_during_exit_window
          device_confidence: '{{ device_confidence }}'
    - conditions:
      - condition: template
        value_template: '{{ entry_authorized }}'
      sequence:
      - event: guardian.door_opened_from_outside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: high
          reason: recent_exterior_rfid
    - conditions:
      - condition: template
        value_template: '{{ exit_authorized }}'
      sequence:
      - event: guardian.door_opened_from_inside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: high
          reason: recent_interior_rfid
    - conditions:
      - condition: template
        value_template: '{{ physical_outside }}'
      sequence:
      - event: guardian.door_opened_from_outside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: medium
          reason: key_entry_no_lever
          device_confidence: '{{ device_confidence }}'
    default:
    # Reed edge often fires before 1.5 deg of swing has integrated. Stash
    # this open and let "Guardian: Door Direction Late Resolve" classify it
    # from the close payload instead of emitting unknown now.
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_pending_direction
      data:
        value: "{{ now().isoformat() }}|{{ trigger.event.data.device_id |
          default('', true) }}"
    - stop: Direction deferred until door_closed
  # Reached only when a branch above classified the opening. Clear a stale
  # pending from a previous unmatched open.
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_pending_direction
    data:
      value: none
  mode: queued
  max: 5
  variables:
    verdict: "{{ trigger.event.data.verdict | default('unknown') | string | lower }}"
    device_confidence: '{{ trigger.event.data.confidence | default(0) | int(0) }}'
    lever_peak: '{{ trigger.event.data.lever_peak_deg | default(0) | float(0) }}'
    lever_onset: '{{ trigger.event.data.lever_onset_ms_before_open | default(-1)
      | float(-1) }}'
    lever_held: "{{ trigger.event.data.lever_held_at_open | default('false')
      | string | lower == 'true' }}"
    swing_confirmed: "{{ trigger.event.data.swing_confirmed | default('false')
      | string | lower == 'true' }}"
    imu_ok: "{{ trigger.event.data.imu_healthy | default('true') | string | lower
      == 'true' }}"
    entry_authorized: "{{ is_state('timer.guardian_entry_window', 'active') }}"
    exit_authorized: "{{ is_state('timer.guardian_exit_window', 'active') }}"
    both_authorized: '{{ entry_authorized and exit_authorized }}'
    # F-21: prefer the authenticated ESPHome state channel. Match the
    # portal's handle_lookback (2500 ms), not the old 10 s window. A 100 ms
    # qualified press is often gone before HA sees binary_sensor on, so also
    # accept lever_held_at_open from this same device event when the peak and
    # onset look like a real press rather than a stale IMU rest sample.
    lever_corroborated: "{{ is_state('binary_sensor.guardian_interior_portal_handle_depressed',
      'on') or (is_state('binary_sensor.guardian_interior_portal_handle_depressed',
      'off') and (now() -
      states.binary_sensor.guardian_interior_portal_handle_depressed.last_changed).total_seconds()
      <= 2.5) }}"
    event_lever_ok: "{{ lever_held and imu_ok and lever_peak >= 12 and lever_onset
      >= 80 and lever_onset <= 2500 }}"
    physical_inside: '{{ lever_corroborated or event_lever_ok }}'
    physical_outside: '{{ (not physical_inside) and swing_confirmed and
      device_confidence >= 70 }}'
    # Both windows are 20s, so "finishes later" == "started later" == "scanned
    # most recently". state_attr returns None on an idle timer; as_timestamp's
    # second argument makes that 0 rather than raising.
    entry_finishes: "{{ as_timestamp(state_attr('timer.guardian_entry_window',
      'finishes_at'), 0) | float(0) }}"
    exit_finishes: "{{ as_timestamp(state_attr('timer.guardian_exit_window',
      'finishes_at'), 0) | float(0) }}"
    # Tie-break ladder, consulted only when BOTH windows are open:
    #   1. Physical inside / outside - lever cannot move from outside.
    #   2. IMU verdict when physics is silent.
    #   3. Neither: assume the most recent scanner is the one at the door.
    #      Ties resolve to entry, the conservative choice - it marks someone
    #      "At home" rather than "Away" (see F-16).
    both_choice: "{{ 'exit' if physical_inside
      else ('entry' if physical_outside
      else ('exit' if verdict == 'inside'
      else ('entry' if verdict == 'outside'
      else ('entry' if entry_finishes >= exit_finishes else 'exit')))) }}"
    both_reason: "{{ 'both_windows_lever' if physical_inside
      else ('both_windows_imu_verdict' if physical_outside or verdict in
      ['inside', 'outside']
      else 'both_windows_recency') }}"
    both_confidence: "{{ 'high' if physical_inside or verdict in ['inside',
      'outside']
      else ('medium' if physical_outside or lever_corroborated else 'low') }}"
- id: '1786500100020'
  alias: 'Guardian: Door Direction Late Resolve'
  description: >-
    Completes an opening that Door Open Direction deferred at the reed edge.
    Close-time max_open_angle and closed_verdict recover key-entry swing that
    had not integrated yet, and lever-during-open peeks the HA handle sensor
    missed. Existing data-log of door_direction_resolved records the delayed
    event. Never overrides an opening already classified at open.
  triggers:
  - trigger: event
    event_type: esphome.door_closed
  conditions:
  - condition: template
    value_template: "{{ pending_raw not in ['none', 'unknown', 'unavailable',
      ''] }}"
  - condition: template
    value_template: '{{ device_matches }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ closed_verdict == 'inside' }}"
      sequence:
      - event: guardian.door_opened_from_inside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: high
          reason: lever_during_open
          device_confidence: '{{ close_confidence }}'
    - conditions:
      - condition: template
        value_template: '{{ max_open >= 5 }}'
      sequence:
      - event: guardian.door_opened_from_outside
        event_data:
          timestamp: '{{ now().isoformat() }}'
          confidence: medium
          reason: key_entry_late_swing
          device_confidence: '{{ close_confidence }}'
          max_open_angle_deg: '{{ max_open }}'
    default:
    - event: guardian.door_direction_unknown
      event_data:
        timestamp: '{{ now().isoformat() }}'
        reason: no_reader_lever_or_swing_evidence
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_pending_direction
    data:
      value: none
  mode: queued
  max: 5
  variables:
    pending_raw: "{{ states('input_text.guardian_pending_direction') | string
      | trim }}"
    closed_verdict: "{{ trigger.event.data.closed_verdict | default('unknown')
      | string | lower }}"
    max_open: '{{ trigger.event.data.max_open_angle_deg | default(0) | float(0) }}'
    close_confidence: '{{ trigger.event.data.confidence | default(0) | int(0) }}'
    device_matches: >-
      {% set raw = states('input_text.guardian_pending_direction') | string | trim %}
      {% set parts = raw.split('|') %}
      {% set pending_dev = parts[1] | trim if parts | count > 1 else '' %}
      {{ pending_dev == '' or pending_dev == (trigger.event.data.device_id |
         default('', true) | string) }}
- id: '1775063494119'
  alias: 'Guardian: Forgetful Exit Warning'
  description: Warns when the interior handle precedes an opening without an interior
    RFID scan.
  triggers:
  - trigger: event
    event_type: guardian.door_opened_from_inside
  conditions:
  # Previously this read input_text.pending_exit_slot, which "Complete Authorized
  # Passage" clears in response to the SAME event. The two automations run
  # concurrently with no ordering guarantee, so whenever the clear landed first a
  # correctly scanned exit was reported as "exit not registered" (audit F-12).
  #
  # "Guardian: Door Open Direction" already recorded WHY it classified this
  # opening as from-inside, in the event payload. lever_rotation is the
  # forgetful case at the reed edge; lever_during_open is the same fact
  # recovered at close when the HA handle sensor missed the press. Neither
  # reason is used when an interior RFID window was active (those emit
  # recent_interior_rfid). Reading the immutable event payload instead of
  # shared mutable state removes the F-12 race.
  #
  # If these strings ever stop matching, the warning silently never fires.
  - condition: template
    value_template: "{{ trigger.event.data.reason | default('', true) in
      ['lever_rotation', 'lever_during_open'] }}"
  # Suppressed in elevated mode, where the Elevated Opening Supervisor handles
  # the same opening far more seriously. Reads the shared entity rather than a
  # fourth inline copy of the mode expression.
  - condition: state
    entity_id: binary_sensor.guardian_elevated_mode
    state: 'off'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.guardian_lamp_rejected
  - action: script.guardian_notify_broadcast
    continue_on_error: true
    data:
      category: access
      severity: important
      title: '⚠️ Guardian: exit not registered'
      message: The door opened from inside without an interior RFID scan.
  mode: single
- id: '1776094800001'
  alias: 'Guardian: Unscanned Key Entry'
  description: >-
    The door was unlocked from outside with a key and no card was scanned,
    outside elevated mode. Covers swing-at-open, swing-at-close, and a key
    entry that happened during a stale interior RFID window. Notifies only -
    in elevated mode the same opening is challenged, pushed and escalated by
    the Elevated Opening Supervisor.
  triggers:
  - trigger: event
    event_type: guardian.door_opened_from_outside
  conditions:
  # Only the physics-derived branch. A verdict backed by an exterior RFID scan
  # is an authorized entry and must not land here.
  - condition: template
    value_template: "{{ trigger.event.data.reason | default('', true) in
      ['key_entry_no_lever', 'key_entry_late_swing',
       'key_entry_during_exit_window'] }}"
  # List-aware: the helper now holds "2,4"-style lists, so an equality test
  # against 'none' no longer detects "empty". Anything that is not a real slot
  # id parses away, leaving an empty list.
  - condition: template
    value_template: "{{ (states('input_text.pending_entry_slot') | string).split(',')
      | map('trim') | select('in', (states('sensor.guardian_rfid_slots') | string).split(',')
      | map('trim') | reject('eq', '') | list) | list | count == 0 }}"
  # Elevated mode is handled entirely by "Guardian: Elevated Opening Supervisor",
  # which fires on the same opening: it opens the grace challenge, pushes the
  # high-priority "unauthorised opening" notice, and owns the alarm decision
  # (timeout, three wrong PINs, or immediately when the opening was from inside
  # an empty house). This automation used to push its own elevated-mode variant
  # of that notice, which was a second message about one opening - and only ever
  # covered the keyed-entry direction. Leave the elevated case to the supervisor.
  - condition: state
    entity_id: binary_sensor.guardian_elevated_mode
    state: 'off'
  actions:
  # Normal daytime: someone in the household letting themselves in with keys
  # is routine, so this notifies without the siren.
  - action: script.guardian_notify_broadcast
    continue_on_error: true
    data:
      category: security
      severity: urgent
      title: '🔑 Guardian: keyed entry'
      message: The door was unlocked from outside with a key. No card was scanned.
  mode: single
- id: '1776094800002'
  alias: 'Guardian: Door Event Log'
  description: Records how the last opening ended - who closed it and how long it
    stood open - for the portal display and for history.
  triggers:
  - trigger: event
    event_type: esphome.door_closed
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_last_door_summary
    data:
      # Kept short: the portal renders this verbatim on its diagnostics page and
      # input_text tops out at 255 characters.
      value: "{{ trigger.event.data.closed_verdict | default('unknown') }} ·
        {{ (trigger.event.data.dwell_ms | default(0) | int(0) / 1000) | round(0)
        | int }}s · {{ trigger.event.data.max_open_angle_deg | default(0)
        | float(0) | round(0) | int }}°"
  mode: single
- id: '1775063581369'
  alias: 'Guardian: Occupancy Simulation'
  description: Occasional warm pulse in elevated mode; restores the previous lamp
    state.
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: binary_sensor.guardian_elevated_mode
    state: 'on'
  # Was gated on sensor.guardian_camera_luminance being a number at or below the
  # dark threshold. That sensor is deliberately unavailable between samples - it
  # only produces a reading while guardian_sample_ambient_light is actively
  # running - so is_number() was false almost always and occupancy simulation
  # silently never ran. Sun elevation answers the same question ("is it dark
  # out?") and is available every second of the day.
  - condition: template
    value_template: "{{ states('sun.sun') not in ['unknown', 'unavailable'] and\n
      \  state_attr('sun.sun', 'elevation') | float(0) < -6 }}"
  - condition: template
    value_template: '{{ range(0, 3) | random == 0 }}'
  actions:
  - action: script.guardian_occupancy_pulse
  mode: single
- id: '1775063592101'
  alias: 'Guardian: Major Alarm Handler'
  description: Central alarm loop; stops when the display state leaves ALARM.
  triggers:
  - trigger: event
    event_type: guardian.major_alarm
  actions:
  # ORDER IS THE SAFETY PROPERTY OF THIS AUTOMATION, not a style choice.
  #
  # Everything an alarm must actually do is either the push or the siren. Every
  # other step here is presentation - the reason string on the portal screen, the
  # lamp going red - and presentation used to run FIRST, unguarded, in front of
  # both. Any step that raises ends the sequence, so a helper that did not exist
  # or a template entity that had not rendered yet took the whole alarm down
  # silently. That is the one failure mode a burglar alarm may not have.
  #
  # The rule now: get the push out first, because nothing else in this sequence
  # is a precondition for it; guard every cosmetic step with continue_on_error;
  # and leave exactly one step unguarded - guardian_set_display - because the
  # siren loop below gates on the state it writes, so if that fails the siren
  # genuinely cannot run and the error belongs in the log rather than swallowed.
  #
  # "First" means STARTED first, not FINISHED first. This was
  # "action: script.guardian_notify_broadcast", which waits: that script walks
  # every linked phone serially calling notify.mobile_app_*, which is HTTPS to
  # Apple's or Google's push infrastructure. With the house's internet down -
  # the cut line, the failed router, the outage a burglar caused on purpose -
  # each recipient burns its own client timeout before failing, and the display
  # write and the siren loop below sat behind all of them. The local response to
  # a break-in was gated on reaching the internet.
  #
  # script.turn_on is the same idiom, and the same reasoning, as the challenge
  # push in "Guardian: Elevated Opening Supervisor" 300 lines below - which
  # learned this lesson first, and wrote it down, for a chirp. Fired
  # non-blocking the push cannot be cancelled by anything under it AND cannot
  # delay anything under it, which is strictly better on both axes than the
  # ordering it replaces.
  - action: script.turn_on
    continue_on_error: true
    target:
      entity_id: script.guardian_notify_broadcast
    data:
      variables:
        category: security
        severity: urgent
        # The alarm itself. If a preference could silence this one, the settings
        # screen would be a way to turn the alarm off without saying so.
        nonmaskable: true
        title: "\U0001F6A8 GUARDIAN ALARM"
        message: 'Reason: {{ trigger.event.data.reason | default(''Unknown'') }}'
        payload:
          priority: high
          ttl: 0
          actions:
          - action: MUTE_GUARDIAN_ALARM
            title: Disable Alarm
            destructive: true
  # The reason existed only as event data once, so the portal's ALARM screen
  # structurally could not say why it was alarming. It must be persisted BEFORE
  # the display state flips, or the screen renders an empty reason for a moment -
  # which is why this sits here rather than after guardian_set_display.
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_alarm_reason
    data:
      value: "{{ (trigger.event.data.reason | default('Unknown', true))[:100] }}"
  # The one unguarded step. The siren loop's while-condition reads what this
  # writes, so a failure here means no siren no matter what we do, and hiding it
  # would only delay finding out.
  - action: script.guardian_set_display
    data:
      value: ALARM
  # With no lamp picked, sensor.guardian_lamp_entity renders the literal string
  # "none", which Home Assistant accepts as ENTITY_MATCH_NONE - matches nothing,
  # succeeds, harmless. The case that bit was the SENSOR being unavailable rather
  # than resolved to none: a half-copied install with no packages/guardian.yaml,
  # or the template entity not yet rendered in the startup window that "Guardian:
  # Startup State Recovery" can re-fire an alarm into. states() then returns
  # unknown, which is neither a valid entity id nor the none sentinel.
  #
  # THE continue_on_error ON THIS STEP NEVER COVERED THAT CASE, and this line
  # said it did for two releases. An entity_id that is not a valid entity id
  # fails the service SCHEMA, which raises voluptuous.Invalid - and Home
  # Assistant's _ScriptRun._handle_exception re-raises vol.Invalid, TemplateError
  # and ServiceNotFound REGARDLESS of continue_on_error, because those are
  # misconfiguration rather than a device being unreachable. So on exactly the
  # half-copied install and the startup window named above, this step ended the
  # sequence and THE SIREN LOOP BELOW NEVER RAN. The alarm pushed to every phone
  # and the house stayed silent. That is the fortieth pass's own failure mode,
  # still live, in the one automation it was written for.
  #
  # Guarding harder cannot fix it. The argument itself has to become incapable
  # of being invalid, so the template falls back to the `none` sentinel, which
  # is always schema-valid and matches nothing. continue_on_error stays for what
  # it genuinely does catch: a lamp that exists and is unreachable.
  - action: light.turn_on
    continue_on_error: true
    target:
      entity_id: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness_pct: 100
      transition: 0
  # The siren. continue_on_error is load-bearing here and is NOT cosmetic
  # guarding - it is what makes this loop a loop.
  #
  # An error inside a repeat sequence ends the whole run, and this press targets
  # a PORTAL entity, which raises whenever the portal is disconnected. So one
  # failed press used to END THE SIREN PERMANENTLY. Two ways in, both ordinary:
  # the portal was already off the network when the alarm fired - the case the
  # fortieth pass fixed upstream in process_rfid_scan, at which point the alarm
  # reached here and died anyway - or the portal dropped mid-alarm, which is
  # what pulling its power or flapping the Wi-Fi looks like. Either way the
  # ALARM screen came back on reconnect and nothing ever sounded again, because
  # nothing re-enters this loop.
  #
  # Guarded, the loop simply retries every three seconds for as long as the
  # display reads ALARM, and resumes on its own the moment the portal answers.
  # "Guardian: Resume Alarm On Portal Reconnect" closes the up-to-3s gap; this
  # line is what makes the loop still be there for it to close.
  #
  # BOUNDED. `repeat: while` on a helper value, with no count and no timeout,
  # is an unbounded actuator loop: it sounds a siren for as long as one
  # input_text says ALARM and has no other opinion about when to stop.
  #
  # The forty-second pass wrote "cap the total duration" as a constraint on the
  # OFFLINE siren, which did not exist yet. The online one, which has been
  # running in a house for the whole life of this system, had no cap at all and
  # nobody noticed - the constraint was written for the hypothetical feature and
  # not applied to the real one standing next to it.
  #
  # Two ways this ran forever. The ordinary one: nobody is home to acknowledge
  # it, so nothing writes a non-ALARM state and the siren runs until someone
  # returns - which in most jurisdictions is also illegal, audible alarms being
  # capped at 15-20 minutes. The subtle one: the only way out is a write through
  # script.guardian_set_display, which is `mode: queued, max: 25` - and a
  # blocking call to a queued script already at max is DISCARDED SILENTLY, with
  # no error and the caller proceeding as though it ran. That script's own
  # comment reasons carefully about a dropped write meaning no alarm STARTS. The
  # mirror case, where the dropped write is the IDLE that would have ENDED one,
  # is not considered anywhere and leaves the siren on with nothing logged.
  #
  # 400 iterations x 3 s = 20 minutes. The loop still exits the moment the
  # display stops reading ALARM, so nothing about the normal path changes; this
  # only bounds the abnormal one. A household that wants longer should be
  # changing a number, not editing a repeat.
  # Kept as `while` with a second condition rather than converted to a counted
  # repeat with a condition inside it. A bare `condition:` step inside a repeat
  # sequence ends the whole run, which is the same outcome here but by a much
  # less obvious route - and this is the alarm loop, so it is the last place to
  # rely on a reader knowing that. Two while-conditions say "keep going while
  # the alarm is live AND we are under the cap" in the shape that means it.
  - repeat:
      while:
      - condition: state
        entity_id: input_text.portal_display_state
        state: ALARM
      # `repeat is defined` guarded, and that is not superstition: this template
      # is evaluated to decide whether the SIREN runs, and a raise here is a
      # TemplateError, which continue_on_error does not catch and which would
      # end the alarm before a single press. Home Assistant does set the repeat
      # variable before the first while-condition evaluation, so the bare form
      # is believed to be fine - but "believed to be fine" is exactly the
      # standard that put a lamp in front of this siren twice, and the cost of
      # not having to be right is one conditional expression.
      - condition: template
        value_template: '{{ (repeat.index if repeat is defined else 1) <= 400 }}'
      sequence:
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.guardian_interior_portal_play_alarm
      - delay: 00:00:03
  mode: restart
- id: '1787318400001'
  alias: 'Guardian: Sound Alarm On Portal Reconnect'
  description: >-
    Presses the siren the instant the portal comes back during a live alarm,
    rather than waiting out the rest of the Major Alarm Handler's three-second
    cadence.

    This is the latency trim, not the fix. The fix is the continue_on_error on
    the press inside that loop: without it the loop was ended outright by the
    first press into a disconnected portal and there was no loop left to
    resume. With it the loop is still running and pressing into the void, so
    the worst case here is three seconds - this makes it immediate.

    Deliberately a press and NOT a re-fire of guardian.major_alarm. Re-firing
    would restart the handler and send a second "GUARDIAN ALARM" push, so a
    portal flapping between access points during an alarm would push once per
    flap. The siren is what this needs to recover; the phones already have the
    first one.
  triggers:
  # Three seconds, not the offline watchdog's thirty. That wait exists to keep
  # a routine restart from announcing itself; this one only has to outlast the
  # moment between the API connecting and the button entity being registered,
  # and every second of it is a second of an alarm not sounding.
  - trigger: state
    entity_id: binary_sensor.guardian_interior_portal_status
    to: 'on'
    for: 00:00:03
  conditions:
  - condition: state
    entity_id: input_text.portal_display_state
    state: ALARM
  actions:
  # Guarded for the same reason as the loop it is helping: a portal that
  # answered its status entity and is not yet answering button presses must not
  # turn this into a logged failure. The loop will get the next one.
  - action: button.press
    continue_on_error: true
    target:
      entity_id: button.guardian_interior_portal_play_alarm
  mode: single
- id: '1775221552333'
  alias: 'Guardian: Elevated Opening Supervisor'
  description: >-
    An elevated-mode opening with no completed passage window now opens a timed
    authentication challenge instead of an immediate siren. BOTH a registered
    card AND the master PIN, in either order, within the window, end it.
    Silence ends it as an alarm.

    The one case that still alarms instantly is an opening from INSIDE while the
    house is believed empty. Everything else - an entry from outside, an
    ambiguous verdict, or someone inside who simply forgot to scan - is far more
    often a family member than an intruder, and the previous behaviour (siren, at
    2am, for a forgotten scan) is what makes people switch super surveillance off
    entirely. An unanswered challenge still raises the full alarm, so leniency
    here costs a delay, never a detection.
  triggers:
  - trigger: event
    event_type: esphome.door_opened
  conditions:
  - condition: state
    entity_id: binary_sensor.guardian_elevated_mode
    state: 'on'
  # Already challenging. A door that swings, re-latches and is pushed again fires
  # a second reed edge; restarting the clock on it would let someone extend the
  # window indefinitely by working the door.
  - condition: state
    entity_id: input_boolean.guardian_entry_challenge
    state: 'off'
  # Already alarming. Entry Challenge Timeout (and the three-wrong-PINs path)
  # turns the challenge flag off after raising the siren so the amber hold can
  # see ALARM and not undo it. Without this, that teardown re-armed this
  # automation: the next reed edge opened a fresh CHALLENGE, overwrote ALARM,
  # and the siren loop (while display == ALARM) stopped. Working the door then
  # bought another grace window indefinitely. Leave the siren running; do not
  # start a second countdown. Dismiss Alarm from Phone is the only way back.
  - condition: not
    conditions:
    - condition: state
      entity_id: input_text.portal_display_state
      state: ALARM
  actions:
  # A running passage window used to be a CONDITION here, which meant any window
  # that happened to be active swallowed the opening entirely: "Guardian: Door
  # Open Direction" then classifies it as recent_exterior_rfid /
  # recent_interior_rfid, so Forgetful Exit (wants lever_rotation), Unscanned Key
  # Entry (wants key_entry_no_lever) and Uncertain Direction (wants
  # door_direction_unknown) all decline, and Complete Authorized Passage is a
  # no-op on an empty pending list. Net: an unexplained elevated opening with
  # nothing at all behind it produced total silence.
  #
  # The window on its own is not evidence. The evidence is a passage that
  # actually COMPLETED against a real slot, which is exactly the one thing
  # "Guardian: Complete Authorized Passage" announces. So wait briefly for that
  # announcement instead of trusting the timer.
  #
  # Deliberately a wait rather than a re-read of pending_entry_slot /
  # pending_exit_slot: those are cleared by Complete Authorized Passage in
  # response to the same opening, with no ordering guarantee, so reading them
  # here would reintroduce the F-12 race in reverse and open a challenge on a
  # correctly scanned walk-through. The event is immutable and can only be
  # emitted by a genuine slot-backed completion.
  - if:
    - condition: template
      value_template: '{{ window_active | bool }}'
    then:
    - wait_for_trigger:
      - trigger: event
        event_type: guardian.passage_completed
      timeout: 00:00:03
      continue_on_timeout: true
    # A real scan explains this opening. Stop - silently, exactly as before.
    # "stop", not a bare "condition", so the intent is explicit and it is the
    # same idiom the enrollment and passage scripts already use to bail out.
    - if:
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      then:
      - stop: Opening explained by a completed authorized passage.
    # A second reed edge that got here first may have opened a challenge during
    # the wait. The anti-extend rule still applies: do not restart its clock.
    - if:
      - condition: state
        entity_id: input_boolean.guardian_entry_challenge
        state: 'on'
      then:
      - stop: A challenge for this opening is already running.
  # The trigger-time condition above cannot see an ALARM that started during
  # the 3s escrow (MFA timeout, clone, a sibling major_alarm). Re-check before
  # the choose that would write CHALLENGE over it.
  - if:
    - condition: state
      entity_id: input_text.portal_display_state
      state: ALARM
    then:
    - stop: Alarm already owns this opening; do not replace it with a challenge.
  - choose:
    # Opened from inside, corroborated, with every card recorded Away AND the
    # phones agreeing: nobody should be in here to open it. This is the
    # exit-with-your-belongings case, and there is nobody to offer a grace window
    # to.
    #
    # The tracker term is new and it is the whole point. house_empty reads the
    # rfid_N presence selects and nothing else, so a resident who came home
    # without scanning, or whose exit was double-counted, reads Away - and this,
    # the only instant-siren path in the system, fired on them opening their own
    # front door at 2am with no grace window at all. A lone visitor in the house
    # did the same, because visitor slots are deliberately skipped. Requiring the
    # phones to agree before skipping the window is strictly more conservative
    # than what was here: it can only ever produce fewer instant sirens, never
    # more. Precedence copied from "Guardian: Frigate Person Detected While
    # Away", which prefers guardian_presence_trackers over card state for exactly
    # this reason (F-16).
    #
    # With no trackers configured trackers_say_empty is false, so this branch
    # never wins and the opening falls through to a SHORTENED challenge below -
    # detection fully preserved, because an unanswered short challenge raises the
    # same major alarm, while a mis-recorded card buys seconds to prove otherwise.
    - conditions:
      - condition: template
        value_template: "{{ origin == 'inside' and house_empty | bool(false)
          and trackers_say_empty | bool(false) }}"
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.guardian_challenge_origin
        data:
          value: inside
      - event: guardian.major_alarm
        event_data:
          reason: Elevated-mode inside opening with house believed empty
    default:
    # How long this particular challenge gets. An inside opening with the cards
    # reading empty and nothing corroborating it is the case that used to fire
    # the siren instantly; it is not a routine forgotten scan, so it gets a much
    # shorter window than one. Everything else keeps the full grace period.
    #
    # Computed here rather than read at each use, so the timer, the push and the
    # helper below can never disagree about which number applied.
    - variables:
        challenge_seconds: >-
          {{ (states('input_number.guardian_empty_house_grace_seconds') | int(10))
             if (origin == 'inside' and house_empty | bool(false))
             else (states('input_number.guardian_entry_challenge_seconds') | int(30)) }}
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_challenge_origin
      data:
        value: '{{ origin }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.guardian_entry_challenge
    # The first chirp, before anything else this branch does.
    #
    # The repeat at the foot of this sequence has always been triggered by the
    # reed edge, not by a scan - but it sat behind a display write, a lamp
    # script, an event and a blocking phone broadcast, so the first sound the
    # household actually heard was the one-shot chirp process_rfid_scan plays
    # when someone gives up and scans. That reads as "the challenge tone only
    # starts once you scan", and it is the wrong lesson to teach: the tone is
    # what tells a person at the door that the system is waiting on them, so it
    # has to be the first observable effect of the door opening.
    #
    # continue_on_error because a portal that is offline must not abort the
    # challenge; the timer and the alarm behind it matter more than the sound.
    - action: button.press
      continue_on_error: true
      target:
        entity_id: button.guardian_interior_portal_play_mfa_challenge
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.guardian_challenge_pin_ok
    # A card already scanned for MFA is the card factor of this challenge.
    # Cancel the 40s MFA clock so it cannot fire a second major alarm after
    # this 30s window; the PIN handler still accepts digits because the
    # challenge flag is on.
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.portal_mfa_pending
          state: 'on'
        - condition: template
          value_template: "{{ (states('input_text.pending_mfa_slot') | string | trim)
            in ((states('sensor.guardian_rfid_slots') | string).split(',')
                | map('trim') | reject('eq', '') | list) }}"
        sequence:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.guardian_challenge_card_ok
      default:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_challenge_card_ok
    - action: timer.cancel
      target:
        entity_id: timer.guardian_mfa_window
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.portal_mfa_pending
    # Recorded BEFORE the timer starts, so nothing renders a progress bar against
    # a stale number even for one tick. "Guardian Portal Countdown Total" and
    # "Guardian: Entry Challenge Timeout" both read this instead of
    # guardian_entry_challenge_seconds, because that helper is the CONFIGURED
    # length and no longer always the applied one - a short empty-house challenge
    # would otherwise leave the portal bar scaled to 30s and pinned full for the
    # first two thirds, and make the timeout alarm claim it waited 30 seconds
    # when it waited 10. Both readers only consult it while the entry challenge
    # timer is active or has just finished, so a value left over from the
    # previous challenge is unreachable and needs no reset.
    #
    # continue_on_error because this helper lives in packages/guardian.yaml and
    # this automation does not. Copying automations.yaml to the Pi without the
    # package, or before a restart has created the helper, would otherwise abort
    # the run here - no timer, no display, no chirp, no alarm - and turn a
    # cosmetic progress-bar detail into the exact silent-opening failure the rest
    # of this work exists to remove. A mis-scaled bar is survivable; a challenge
    # that never opens is not. Both readers fall back to the configured length.
    - action: input_number.set_value
      continue_on_error: true
      target:
        entity_id: input_number.guardian_challenge_seconds_applied
      data:
        value: '{{ challenge_seconds | int(30) }}'
    - action: timer.start
      target:
        entity_id: timer.guardian_entry_challenge
      data:
        duration: >-
          {{ '00:%02d:%02d' % (
               (challenge_seconds | int(30)) // 60,
               (challenge_seconds | int(30)) % 60) }}
    - action: script.guardian_set_display
      data:
        value: "{{ 'MFA' if is_state('input_boolean.guardian_challenge_card_ok', 'on')
          else 'CHALLENGE' }}"
    # script.turn_on, NOT "action: script.guardian_lamp_warning". That script
    # holds the lamp amber by waiting on the challenge flag for up to five
    # minutes, and "action:" waits for the called script to return - so calling
    # it directly would park this automation for the whole challenge and the
    # chirp loop below would never run at all.
    - action: script.turn_on
      target:
        entity_id: script.guardian_lamp_warning
    - event: guardian.entry_challenge_started
      event_data:
        origin: '{{ origin }}'
        verdict: '{{ verdict }}'
        device_confidence: '{{ device_confidence }}'
        house_empty: '{{ house_empty }}'
        timestamp: '{{ now().isoformat() }}'
    # The countdown, the amber lamp and the chirp all reach whoever is standing
    # at the door. This reaches everyone who is NOT - which, at 2am, is the point
    # of the whole mode. It has to be here, in the one place that knows a
    # challenge actually opened, because the three automations that used to
    # carry the phone alert each filter on a direction 'reason' and between them
    # left the most common case uncovered: an opening from inside, corroborated
    # by the lever, produced no push at all (Forgetful Exit Warning is
    # deliberately suppressed while elevated).
    #
    # MUST stay above the repeat below. That loop runs for the whole challenge,
    # so anything after it does not execute until the challenge is already over.
    #
    # script.turn_on, NOT "action: script.guardian_notify_broadcast", for the
    # same reason as guardian_lamp_warning above. That script fans out to every
    # linked phone serially over the network, and "action:" waits for it: a
    # phone that is asleep or off-wifi parked this sequence for seconds before
    # the chirp loop below could start. The one-shot press above now covers the
    # opening edge regardless, but a push must never be able to hold the
    # challenge's own sound hostage.
    #
    # guardian_notify_broadcast, not notify_person: nobody has authenticated
    # yet, so there is no slot to address this to. It carries no PIN and no PIN
    # field - it is a notice that a challenge is running, exactly like the
    # keyed-entry push it replaces.
    - action: script.turn_on
      continue_on_error: true
      target:
        entity_id: script.guardian_notify_broadcast
      data:
        variables:
          category: security
          severity: urgent
          title: '🚨 Guardian: unauthorised opening'
          message: >-
            The door opened {{ 'from inside' if origin == 'inside'
            else ('from outside with a key' if origin == 'outside'
            else 'from an unresolved direction') }} with no card scan while
            elevated mode was on. A {{ challenge_seconds | int(30) }}s
            authentication challenge is running at the portal - a registered card
            AND the master PIN. If nobody answers it, this becomes a full alarm.
          payload:
            priority: high
            ttl: 0
    # A short repeating chirp, not the siren. It has to be loud enough that
    # someone walking in at night realises the system is waiting on them, and
    # quiet enough that a forgotten scan does not wake the street. The tone is
    # the existing MFA challenge sound - it already means "authenticate now", so
    # no new DFPlayer file is needed.
    - repeat:
        while:
        - condition: state
          entity_id: input_boolean.guardian_entry_challenge
          state: 'on'
        # Bounded so a stranded flag cannot chirp forever; the timeout
        # automation ends a real challenge long before this.
        - condition: template
          value_template: '{{ repeat.index <= 40 }}'
        sequence:
        # Delay first, press second. The opening edge is already covered by the
        # one-shot press up at the top of this branch; pressing again here on
        # iteration one would double-chirp the same instant.
        - delay: 00:00:05
        - action: button.press
          target:
            entity_id: button.guardian_interior_portal_play_mfa_challenge
          continue_on_error: true
  # single, not restart. This was restart "so the chirp loop of a superseded run
  # is torn down rather than overlapping a new one" - a case the conditions above
  # already make unreachable, because a second reed edge while
  # guardian_entry_challenge is on never starts a run at all, and the chirp loop
  # self-terminates within one 5s iteration when that flag goes off.
  #
  # What restart DID reach was the one window the conditions cannot cover. The
  # run opens with a wait_for_trigger of up to three seconds before it turns the
  # challenge flag on, and for those three seconds every condition above still
  # passes - so a second door_opened cancelled the in-flight run and started the
  # escrow over. A door worked open, shut and open again faster than every three
  # seconds deferred the challenge, and therefore the alarm, indefinitely. That
  # is precisely the attack the comment on the challenge-already-running
  # condition describes and believes it has closed: "restarting the clock on it
  # would let someone extend the window indefinitely by working the door." The
  # guard covered the window after the flag was set. The window before it was
  # left open by the mode.
  #
  # Under single a duplicate edge inside the escrow is DROPPED with a log
  # warning, which is exactly the intent those conditions already state. Not
  # queued: a run that sat behind a 200-second chirp loop and then reasoned
  # about a three-minute-old door event is worse than one that never ran.
  mode: single
  variables:
    # Deliberately still triggered on the raw esphome.door_opened rather than on
    # the derived guardian.door_opened_from_* events: "Guardian: Complete
    # Authorized Passage" cancels the passage timers in response to those same
    # events, so waiting for them would race the window condition above against
    # the thing that clears it.
    #
    # The direction rules below are the ones "Guardian: Door Open Direction"
    # applies to the same payload. Keep the two in step - physical_inside
    # accepts the HA handle sensor (2.5s lookback) or a sane lever_held_at_open
    # on this device event, because a 100 ms press often never reaches HA (F-21).
    verdict: "{{ trigger.event.data.verdict | default('unknown') | string | lower }}"
    device_confidence: '{{ trigger.event.data.confidence | default(0) | int(0) }}'
    lever_peak: '{{ trigger.event.data.lever_peak_deg | default(0) | float(0) }}'
    lever_onset: '{{ trigger.event.data.lever_onset_ms_before_open | default(-1)
      | float(-1) }}'
    lever_held: "{{ trigger.event.data.lever_held_at_open | default('false')
      | string | lower == 'true' }}"
    swing_confirmed: "{{ trigger.event.data.swing_confirmed | default('false')
      | string | lower == 'true' }}"
    imu_ok: "{{ trigger.event.data.imu_healthy | default('true') | string | lower
      == 'true' }}"
    # Evaluated once, at the reed edge, before anything downstream can cancel a
    # timer. Only decides WHETHER to wait for a completion announcement; it is
    # never on its own a reason to stay quiet.
    window_active: "{{ is_state('timer.guardian_entry_window', 'active')
      or is_state('timer.guardian_exit_window', 'active') }}"
    lever_corroborated: "{{ is_state('binary_sensor.guardian_interior_portal_handle_depressed',
      'on') or (is_state('binary_sensor.guardian_interior_portal_handle_depressed',
      'off') and (now() -
      states.binary_sensor.guardian_interior_portal_handle_depressed.last_changed).total_seconds()
      <= 2.5) }}"
    event_lever_ok: "{{ lever_held and imu_ok and lever_peak >= 12 and lever_onset
      >= 80 and lever_onset <= 2500 }}"
    physical_inside: '{{ lever_corroborated or event_lever_ok }}'
    physical_outside: '{{ (not physical_inside) and swing_confirmed and
      device_confidence >= 70 }}'
    origin: "{{ 'inside' if physical_inside
      else ('outside' if physical_outside else 'unknown') }}"
    # "Believed empty" has to mean every OCCUPIED RESIDENT slot positively
    # reads Away. Visitors are authorized keys, not occupants, and must not
    # block or cause the empty-house siren. Empty rack positions (no 16-hex
    # card_id) are not people either: counting them would make nine unused
    # slots look like a full house, and a leftover At home after retire
    # would suppress the siren forever. A slot that is unknown, unavailable,
    # or flagged Stolen/Lost still says nothing about who is in the house,
    # and treating silence as absence would turn a missing helper into an
    # instant siren.
    house_empty: >-
      {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                   | map('trim') | reject('eq', '') | list %}
      {% set ns = namespace(all_away=true) %}
      {% for i in ids %}
        {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                   | string | trim | lower %}
        {% set occupied = c | length == 16 and c is match('^[0-9a-f]{16}$') %}
        {% if occupied and states('input_select.rfid_' ~ i ~ '_policy') != 'visitor'
             and states('input_select.rfid_' ~ i) != 'Away' %}
          {% set ns.all_away = false %}
        {% endif %}
      {% endfor %}
      {{ ns.all_away }}
    # Independent corroboration for house_empty, and the ONLY thing that can now
    # authorise an instant siren. Phone presence does not depend on anyone
    # remembering to scan, which is the exact weakness of the card reading above:
    # the system deliberately tolerates unscanned exits and entries, so a card
    # can say Away while its owner is asleep upstairs.
    #
    # Parse and expand inlined in one template, mirroring the condition in
    # "Guardian: Frigate Person Detected While Away" rather than splitting the
    # tracker list into its own variable - a template whose whole result is a
    # list gets native-typed, and chaining that through a second variable is a
    # needless place for it to arrive as a string.
    #
    # false when nothing is configured, which is deliberate and is what makes
    # this safe to add before guardian_presence_trackers is populated: no
    # trackers means no corroboration means no instant siren, and the opening
    # gets the shortened challenge instead. Do not "fix" that to true.
    trackers_say_empty: >-
      {% set trackers_raw = states('sensor.guardian_presence_trackers_resolved') %}
      {% set trackers = (trackers_raw if trackers_raw not in
        ['', 'none', 'unknown', 'unavailable'] else '') | replace(' ', '') | trim %}
      {% set trackers = trackers.split(',') | reject('eq', '') | list %}
      {% if trackers | count > 0 %}
        {{ expand(trackers) | selectattr('state', 'eq', 'home') | list | count == 0 }}
      {% else %}
        false
      {% endif %}
- id: '1775222975763'
  alias: 'Guardian: Master PIN Entry Handler'
  description: >-
    Accepts PINs while an MFA challenge is open, while an entry challenge is
    counting down after an unauthorized elevated-mode opening, or while a
    doorbell-exit phone-PIN window is open (keypad fallback). The master PIN
    is one of two required factors for an entry challenge, never sufficient
    on its own.
  triggers:
  - trigger: event
    event_type: esphome.pin_entered
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.portal_mfa_pending
      state: 'on'
    - condition: state
      entity_id: input_boolean.guardian_entry_challenge
      state: 'on'
    - condition: state
      entity_id: input_boolean.guardian_doorbell_exit_pin
      state: 'on'
  actions:
  # Canonical compare - do not re-derive trim/lower/sha256 here (F-32/F-33).
  - action: script.guardian_pin_matches
    data:
      pin: '{{ trigger.event.data.pin }}'
    response_variable: pin_check
  - choose:
    # Correct PIN answering a doorbell-exit window from the keypad. The owner
    # came back inside; this is the false-alarm safety net when the phone
    # prompt was missed or the slot has no linked phone.
    - conditions:
      - condition: template
        value_template: '{{ pin_check.matches | bool }}'
      - condition: state
        entity_id: input_boolean.guardian_doorbell_exit_pin
        state: 'on'
      sequence:
      - action: script.guardian_clear_doorbell_exit_pin
        data:
          method: keypad
          slot: "{{ states('input_text.guardian_doorbell_exit_slot') }}"
      - action: script.guardian_set_display
        data:
          value: GRANTED
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_welcome
    # Correct PIN answering an entry challenge. Card AND PIN are required;
    # PIN alone records the PIN factor and leaves the 30s clock running.
    - conditions:
      - condition: template
        value_template: '{{ pin_check.matches | bool }}'
      - condition: state
        entity_id: input_boolean.guardian_entry_challenge
        state: 'on'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_challenge_pin_ok
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.guardian_challenge_card_ok
            state: 'on'
          sequence:
          - action: script.guardian_clear_entry_challenge
            data:
              method: pin
              detail: master PIN at the portal (card already presented)
              slot: "{{ states('input_text.pending_mfa_slot') }}"
          - action: script.guardian_set_display
            data:
              value: GRANTED
          - action: button.press
            target:
              entity_id: button.guardian_interior_portal_play_welcome
          - action: script.turn_on
            target:
              entity_id: script.guardian_lamp_success
        default:
        # PIN is in; card is not. Do not count this as a failed attempt and
        # do not GRANTED. The CHALLENGE screen plus the MFA chirp is the
        # prompt to present a registered card.
        - action: script.guardian_set_display
          data:
            value: CHALLENGE
        - action: button.press
          target:
            entity_id: button.guardian_interior_portal_play_mfa_challenge
          continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ pin_check.matches | bool }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.guardian_mfa_window
      - action: input_number.set_value
        target:
          entity_id: input_number.mfa_failed_attempts
        data:
          value: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.portal_mfa_pending
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ (slot | string | trim) in ((states('sensor.guardian_rfid_slots')
              | string).split(',') | map('trim') | reject('eq', '') | list) and source in
              ['doorbell', 'interior_portal'] }}"
          - condition: state
            entity_id: binary_sensor.guardian_interior_portal_door_contact
            state: 'off'
          sequence:
          - action: script.guardian_authorize_passage
            data:
              slot: '{{ slot }}'
              source: '{{ source }}'
          - action: script.guardian_set_display
            data:
              value: GRANTED
          - action: button.press
            target:
              entity_id: button.guardian_interior_portal_play_welcome
        - conditions:
          - condition: template
            value_template: "{{ (slot | string | trim) in ((states('sensor.guardian_rfid_slots')
              | string).split(',') | map('trim') | reject('eq', '') | list) and source in
              ['doorbell', 'interior_portal'] }}"
          - condition: state
            entity_id: binary_sensor.guardian_interior_portal_door_contact
            state: 'on'
          sequence:
          # Still an intrusion signature: a PIN typed after the door opened, with
          # NO entry challenge open, means the opening was never supervised - it
          # happened outside elevated mode or while a passage window was running
          # and something else has since gone wrong. The branch above handles the
          # supervised case, which is the one this used to block.
          - event: guardian.major_alarm
            event_data:
              reason: Door was already open when MFA was completed
        default:
        - action: script.guardian_set_display
          data:
            value: DENIED
        - action: button.press
          target:
            entity_id: button.guardian_interior_portal_play_denied
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_mfa_slot
        data:
          value: none
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_mfa_source
        data:
          value: none
    default:
    # Read-modify-write must happen at EXECUTION time, not trigger time.
    # Automation-level variables: are rendered when the automation is triggered,
    # before the run is queued, so with several rapid attempts every queued run
    # would render the same stale counter value and write the same number. The
    # counter would stick at 1 and the 3-strike lockout would never fire, which
    # would have left the F-13 brute-force bypass open despite mode: queued.
    # Action data: templates are rendered per-run during execution, and queued
    # runs execute sequentially, so this increments correctly.
    - action: input_number.set_value
      target:
        entity_id: input_number.mfa_failed_attempts
      data:
        value: "{{ states('input_number.mfa_failed_attempts') | int(0) + 1 }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ states('input_number.mfa_failed_attempts') | int(0)
            >= 3 }}"
        sequence:
        - action: input_number.set_value
          target:
            entity_id: input_number.mfa_failed_attempts
          data:
            value: 0
        - action: timer.cancel
          target:
            entity_id:
            - timer.guardian_mfa_window
            # Three wrong PINs is already the alarm; leaving the challenge clock
            # running would fire a SECOND major alarm seconds later with a
            # misleading "not authenticated in time" reason.
            - timer.guardian_entry_challenge
            - timer.guardian_doorbell_exit_pin_window
        - action: input_boolean.turn_off
          target:
            entity_id:
            - input_boolean.portal_mfa_pending
            - input_boolean.guardian_entry_challenge
            - input_boolean.guardian_challenge_card_ok
            - input_boolean.guardian_challenge_pin_ok
            - input_boolean.guardian_doorbell_exit_pin
        - action: input_text.set_value
          target:
            entity_id:
            - input_text.pending_mfa_slot
            - input_text.pending_mfa_source
            - input_text.guardian_doorbell_exit_slot
          data:
            value: none
        - action: persistent_notification.dismiss
          continue_on_error: true
          data:
            notification_id: guardian_doorbell_exit_pin
        - event: guardian.major_alarm
          event_data:
            reason: Maximum PIN attempts exceeded
      default:
      - action: script.guardian_set_display
        data:
          value: DENIED
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - action: script.turn_on
        target:
          entity_id: script.guardian_lamp_rejected
      - delay: 00:00:03
      # Put the right screen back. An entry challenge outranks a PIN challenge:
      # its clock is the one counting down to an alarm, and leaving DENIED up
      # (or letting the LED mirror drop it to IDLE) would hide the countdown from
      # the person who still has seconds left to get the PIN right.
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.guardian_entry_challenge
            state: 'on'
          sequence:
          - action: script.guardian_set_display
            data:
              value: "{{ 'MFA' if is_state('input_boolean.guardian_challenge_card_ok', 'on')
                else 'CHALLENGE' }}"
        - conditions:
          - condition: state
            entity_id: input_boolean.portal_mfa_pending
            state: 'on'
          sequence:
          - action: script.guardian_set_display
            data:
              value: MFA
        - conditions:
          - condition: state
            entity_id: input_boolean.guardian_doorbell_exit_pin
            state: 'on'
          sequence:
          - action: script.guardian_set_display
            data:
              value: MFA
  # Was mode: single. The wrong-PIN branch ends with a 3s delay, during which
  # the automation is still running, so HA silently DISCARDED any pin_entered
  # event that arrived. A discarded attempt never incremented
  # mfa_failed_attempts and never contributed to the 3-strike alarm, so an
  # attacker entering PINs faster than one per 3s could brute-force a 4-6 digit
  # PIN with the lockout never triggering (audit F-13).
  #
  # queued counts every attempt. The 3s delay then also serialises attempts,
  # rate-limiting to roughly one per 3s as a side benefit.
  mode: queued
  max: 10
  variables:
    # Hash compare is script.guardian_pin_matches at the top of actions, not
    # these variables. A second copy of trim/lower/sha256 here is how F-32/F-33
    # happened. slot/source still have to be trigger-time: they identify which
    # challenge this PIN is answering.
    slot: '{{ states(''input_text.pending_mfa_slot'') }}'
    source: '{{ states(''input_text.pending_mfa_source'') }}'
- id: '1775227345893'
  alias: 'Guardian: Doorbell Chime'
  triggers:
  - trigger: event
    event_type: esphome.doorbell_pressed
  actions:
  - action: button.press
    target:
      entity_id: button.guardian_interior_portal_play_doorbell
  mode: restart
- id: '1782305575426'
  alias: 'Guardian: Dismiss Alarm from Phone'
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: MUTE_GUARDIAN_ALARM
  actions:
  - action: script.guardian_set_display
    data:
      value: IDLE
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.portal_mfa_pending
      - input_boolean.guardian_lamp_sampling
      # Same reasoning as the PIN lockout path: an entry challenge left running
      # after the alarm it caused was dismissed would simply raise it again when
      # its clock ran out.
      - input_boolean.guardian_entry_challenge
      - input_boolean.guardian_challenge_card_ok
      - input_boolean.guardian_challenge_pin_ok
      - input_boolean.guardian_doorbell_exit_pin
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.pending_mfa_slot
      - input_text.pending_mfa_source
      - input_text.guardian_challenge_origin
      - input_text.guardian_doorbell_exit_slot
    data:
      value: none
  - action: timer.cancel
    target:
      entity_id:
      - timer.guardian_mfa_window
      - timer.guardian_entry_challenge
      - timer.guardian_doorbell_exit_pin_window
  - action: persistent_notification.dismiss
    continue_on_error: true
    data:
      notification_id: guardian_doorbell_exit_pin
  # The fail counter is NOT per-challenge unless every path that ends a
  # challenge zeroes it. This one did not, so dismissing an alarm from the phone
  # left the count standing - and since the portal renders "3 - count" as "PIN
  # tries left" on both the MFA and the DENIED screens, a stale count made the
  # next challenge start at "1 left" and poisoned the card screen too.
  - action: input_number.set_value
    target:
      entity_id: input_number.mfa_failed_attempts
    data:
      value: 0
  # The alarm handler pins the lamp full red, so it must be cleared - but a bare
  # light.turn_off was the whole story here, which meant dismissing an alarm at
  # 3am killed the lamp until the next sampling tick with no reference to
  # whether it should be on. Clear the red, then hand the lamp back to automatic
  # control. Turning it off first matters: guardian_sample_ambient_light has
  # entry conditions and can decline to run, and a lamp left glowing red is a
  # worse outcome than a lamp briefly off.
  # Same fallback as the alarm handler, and for the same reason it was not
  # enough there: an unavailable sensor.guardian_lamp_entity renders unknown,
  # which is not a valid entity id, and the resulting vol.Invalid is one of the
  # exceptions continue_on_error re-raises. Unguarded by the sentinel this
  # aborted before guardian_sample_ambient_light could hand the lamp back to
  # automatic control, leaving the bulb wherever the alarm left it.
  - action: light.turn_off
    continue_on_error: true
    target:
      entity_id: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
  - action: script.guardian_sample_ambient_light
  mode: restart
- id: '1786384435880'
  alias: 'Guardian: Complete Authorized Passage'
  description: Changes presence only after an authorized scan and a matching physical
    door opening. Completes every slot queued in that direction's window, and
    leaves the opposite window running so a concurrent passage survives.
  triggers:
  - trigger: event
    event_type: guardian.door_opened_from_outside
    id: entry
  - trigger: event
    event_type: guardian.door_opened_from_inside
    id: exit
  conditions:
  - condition: template
    value_template: '{{ slots | count > 0 }}'
  actions:
  # Emitted FIRST, before the presence writes, because "Guardian: Elevated
  # Opening Supervisor" waits up to 3s on this event to decide whether an
  # elevated-mode opening that happened during a passage window was actually
  # explained by a scan. The condition above is what makes it trustworthy: this
  # automation only runs when the window is backed by at least one real slot, so
  # the event means "a registered card accounts for this opening", never merely
  # "a timer was running". Emitting it after the repeat would put nine
  # input_select writes between the opening and the answer.
  - event: guardian.passage_completed
    event_data:
      direction: '{{ trigger.id }}'
      slots: '{{ slots | join(",") }}'
      timestamp: '{{ now().isoformat() }}'
  - repeat:
      for_each: '{{ slots }}'
      sequence:
      # Visitors still consume the passage window (so the opening is classified
      # as authorized) but they are never occupants. Write Away only as hygiene
      # if they somehow sit at At home; never write At home.
      - variables:
          write_option: "{{ 'Away' if (states('input_select.rfid_' ~ repeat.item
            ~ '_policy') | string | trim) == 'visitor' else desired_option }}"
          should_write: "{{ (states('input_select.rfid_' ~ repeat.item ~ '_policy')
            | string | trim) != 'visitor' or
            states('input_select.rfid_' ~ repeat.item) == 'At home' }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ should_write | bool and write_option in
              (state_attr('input_select.rfid_' ~ repeat.item, 'options')
               | default([], true) | list) }}"
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.rfid_{{ repeat.item }}
            data:
              option: '{{ write_option }}'
        - conditions:
          - condition: template
            value_template: '{{ should_write | bool }}'
          sequence:
          - action: system_log.write
            data:
              level: warning
              logger: guardian.passage
              message: "Guardian: input_select.rfid_{{ repeat.item }} has no option
                '{{ write_option }}'; presence for that slot left unchanged."
  # Only this direction's window is consumed. The opposite one, if running,
  # keeps its remaining time for the person still to walk through.
  - action: timer.cancel
    target:
      entity_id: '{{ ''timer.guardian_entry_window'' if trigger.id == ''entry'' else
        ''timer.guardian_exit_window'' }}'
  - action: input_text.set_value
    target:
      entity_id: '{{ ''input_text.pending_entry_slot'' if trigger.id == ''entry''
        else ''input_text.pending_exit_slot'' }}'
    data:
      value: none
  # Presence only. The scan (or the PIN that called authorize_passage) already
  # fired guardian_lamp_success. A second queued green here recaptured was_on
  # after the first turn_on, and restore preferred that rgb, so the Tapo stayed
  # on-green after a walk-through.
  mode: queued
  max: 5
  variables:
    desired_option: "{{ 'At home' if trigger.id == 'entry' else 'Away' }}"
    # The pending helpers now hold comma-separated LISTS, so one opening can
    # complete everyone who scanned in that direction. This never raises:
    # states() always returns a string, and 'none'/'unknown'/'unavailable'/''
    # all split into tokens the whitelist rejects, yielding an empty list.
    slots: "{{ (states('input_text.pending_entry_slot') | string
      if trigger.id == 'entry'
      else states('input_text.pending_exit_slot') | string).split(',')
      | map('trim') | select('in', (states('sensor.guardian_rfid_slots') | string).split(',')
      | map('trim') | reject('eq', '') | list) | unique | list }}"
- id: '1786384452124'
  alias: 'Guardian: Clear Expired Passage'
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_entry_window
    id: entry
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_exit_window
    id: exit
  actions:
  - action: input_text.set_value
    target:
      entity_id: '{{ ''input_text.pending_entry_slot'' if trigger.id == ''entry''
        else ''input_text.pending_exit_slot'' }}'
    data:
      value: none
  mode: queued
- id: '1786384497270'
  alias: 'Guardian: Uncertain Door Direction'
  triggers:
  - trigger: event
    event_type: guardian.door_direction_unknown
  actions:
  # This branch means the door opened with no active passage window AND no recent
  # handle motion - Guardian cannot explain the opening at all. Previously it
  # produced only a persistent notification, a badge in the web UI that nobody
  # sees for hours, which made a daytime forced entry the quietest event in the
  # system (audit F-17). Requiring both conditions keeps the false-positive cost
  # low, so this is safe to escalate to a push.
  #
  # Not while elevated, where "Guardian: Elevated Opening Supervisor" pushes for
  # the same opening and its message is strictly better - it names the running
  # countdown and says what answers it. Tested on the mode rather than on
  # input_boolean.guardian_entry_challenge because the supervisor may still be
  # inside its passage-completion escrow when this runs, and a state test would
  # race that: an unexplained opening would sometimes get two pushes and
  # sometimes one. Elevated openings the supervisor declines are the ones a live
  # challenge is already covering, which have pushed once already.
  #
  # The push runs BEFORE the persistent notification below, and the notification
  # is guarded, for the reason F-17 exists: this path was already the quietest
  # event in the system and the push is the whole remedy. Standing first and
  # unguarded, the badge could take the remedy down with it - its message
  # interpolated trigger.event.data.timestamp with no default, and a missing key
  # on an event payload raises rather than rendering empty.
  - if:
    - condition: state
      entity_id: binary_sensor.guardian_elevated_mode
      state: 'off'
    then:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: security
        severity: important
        title: '⚠️ Guardian: unexplained door opening'
        message: The door opened with no card scan and no handle motion. Presence
          was not changed.
        payload:
          priority: high
          ttl: 0
  - action: persistent_notification.create
    continue_on_error: true
    data:
      title: Guardian could not classify door direction
      message: >-
        The door opened without recent RFID or handle-motion evidence at
        {{ trigger.event.data.timestamp | default('an unrecorded time', true) }}.
        Presence was not changed.
      notification_id: guardian_unknown_direction
  mode: single
- id: '1786384572740'
  alias: 'Guardian: MFA Timeout'
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_mfa_window
  conditions:
  - condition: state
    entity_id: input_boolean.portal_mfa_pending
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.portal_mfa_pending
  - action: input_text.set_value
    target:
      entity_id: input_text.pending_mfa_slot
    data:
      value: none
  - action: input_text.set_value
    target:
      entity_id: input_text.pending_mfa_source
    data:
      value: none
  # A timeout ends the challenge, so the fail counter must end with it. This was
  # the most common way for a stale count to survive: walk away from a challenge
  # after one wrong digit, and the next challenge - days later - started at
  # "2 left" and alarmed on its second attempt.
  - action: input_number.set_value
    target:
      entity_id: input_number.mfa_failed_attempts
    data:
      value: 0
  - event: guardian.major_alarm
    event_data:
      reason: MFA authentication timed out
  mode: single
- id: '1786500000010'
  alias: 'Guardian: Entry Challenge Timeout'
  description: >-
    The grace window after an unauthorized elevated-mode opening expired with
    both factors (registered card and master PIN) not yet presented. This is
    the alarm the Elevated Opening Supervisor used to raise instantly.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_entry_challenge
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_entry_challenge
    state: 'on'
  actions:
  # Raise the alarm FIRST, and only then tear the challenge down. The alarm
  # handler writes ALARM to the display and pins the lamp full red;
  # script.guardian_lamp_warning wakes as soon as the boolean clears and checks
  # that display state before restoring the lamp, so doing this in the other
  # order would let the warning lamp quietly undo the most visible part of a
  # live alarm.
  #
  # The applied length, not the configured one. An inside opening with the cards
  # reading empty and no tracker corroboration now gets a shortened challenge, so
  # reading guardian_entry_challenge_seconds here would have the alarm claim it
  # waited thirty seconds when it waited ten. The supervisor writes the number it
  # actually used before it starts the timer.
  - event: guardian.major_alarm
    event_data:
      reason: >-
        Elevated-mode opening from {{ states('input_text.guardian_challenge_origin')
        }} not authenticated within
        {{ states('input_number.guardian_challenge_seconds_applied')
        | int(states('input_number.guardian_entry_challenge_seconds') | int(30)) }}s
  - delay: 00:00:01
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.guardian_entry_challenge
      - input_boolean.guardian_challenge_card_ok
      - input_boolean.guardian_challenge_pin_ok
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_challenge_origin
    data:
      value: none
  mode: single
- id: '1786500000030'
  alias: 'Guardian: Doorbell Exit PIN Timeout'
  description: >-
    The 10-minute window after an elevated doorbell-exit scan expired with no
    correct master PIN from the owner's phone or the interior keypad. Same
    shape as Entry Challenge Timeout: alarm first, then tear the flag down.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_doorbell_exit_pin_window
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    state: 'on'
  actions:
  - event: guardian.major_alarm
    event_data:
      reason: >-
        Elevated-mode doorbell exit by slot
        {{ states('input_text.guardian_doorbell_exit_slot') }} not confirmed
        with the master PIN within
        {{ states('input_number.guardian_doorbell_exit_pin_minutes') | int(10) }}m
  - delay: 00:00:01
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_doorbell_exit_pin
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_doorbell_exit_slot
    data:
      value: none
  - action: persistent_notification.dismiss
    continue_on_error: true
    data:
      notification_id: guardian_doorbell_exit_pin
  mode: single
- id: '1786500000031'
  alias: 'Guardian: Doorbell Exit PIN Reply'
  description: >-
    Collects the master PIN from the owner's Companion textInput action.
    Compare is script.guardian_pin_matches only (F-32/F-33). The prompt was
    sent to one mapped device; a forged event still has to present the PIN.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: GUARDIAN_DOORBELL_EXIT_PIN
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    state: 'on'
  actions:
  - action: script.guardian_apply_doorbell_exit_pin
    data:
      pin: "{{ trigger.event.data.reply_text | default(trigger.event.data.replyText, true) | default('', true) }}"
      method: phone
  mode: queued
  max: 10
- id: '1786500000032'
  alias: 'Guardian: Doorbell Exit PIN Reminder'
  description: >-
    Resends the same tagged owner-only PIN prompt every 2 minutes while the
    window is open. Replacement tag, not a new notification, so the shade does
    not fill. Nothing alarm-like: no siren, no red lamp.
  triggers:
  - trigger: time_pattern
    minutes: /2
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    state: 'on'
  - condition: state
    entity_id: timer.guardian_doorbell_exit_pin_window
    state: active
  actions:
  - action: script.guardian_doorbell_exit_pin_prompt
    data:
      slot: "{{ states('input_text.guardian_doorbell_exit_slot') }}"
  mode: single
- id: '1786500000011'
  alias: 'Guardian: Enrollment Slot Selected'
  description: >-
    A digit pressed on the portal keypad while enrollment mode is on chooses
    which card slot the next card is written to.

    This is what makes enrollment usable at all once every slot is occupied.
    Previously the only allocation rule was first-free-wins, so with everything
    occupied the feature simply refused to work, and re-enrolling one person's
    card meant clearing that person's helper by hand in the Home Assistant UI
    first. The system deliberately still never picks a slot to overwrite on its
    own - replacing somebody's card is a decision, not a default.
  triggers:
  - trigger: event
    event_type: esphome.enrollment_slot_selected
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_enrollment_mode
    state: 'on'
  - condition: template
    value_template: "{{ (trigger.event.data.slot | default('') | string | trim) in
      ([''] + ((states('sensor.guardian_rfid_slots') | string).split(',')
      | map('trim') | reject('eq', '') | list)) }}"
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_enrollment_slot
    data:
      value: "{{ trigger.event.data.slot | default('') | string | trim }}"
  # Somebody is standing at the panel operating it, so the idle expiry restarts.
  - action: timer.start
    target:
      entity_id: timer.guardian_enrollment_window
  mode: queued
  max: 10
- id: '1786500000017'
  alias: 'Guardian: Enrollment Guest Toggled'
  description: >-
    Pressing 0 on the portal keypad during enrollment toggles whether the next
    card is recorded as a visitor (always away, never an occupant) or a
    resident. An already-registered card presented in this session picks up
    the same flag without rewriting its hash.
  triggers:
  - trigger: event
    event_type: esphome.enrollment_guest_toggled
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_enrollment_mode
    state: 'on'
  actions:
  - action: input_boolean.toggle
    target:
      entity_id: input_boolean.guardian_enroll_as_visitor
  - action: timer.start
    target:
      entity_id: timer.guardian_enrollment_window
  mode: queued
  max: 10
- id: '1786500000012'
  alias: 'Guardian: Enrollment Cancel'
  description: >-
    The # key ends an enrollment session from the portal. Enrollment no longer
    disables itself after one card, so there has to be a way out that does not
    involve walking to a computer - that is the whole point of the "# to exit"
    line on the enrollment screen.
  triggers:
  - trigger: event
    event_type: esphome.enrollment_cancel
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_enrollment_mode
  mode: single
- id: '1786500000013'
  alias: 'Guardian: Enrollment Mode Changed'
  description: >-
    Sets up and tears down an enrollment session. Turning the mode on always
    starts from no slot selection, resident enrollment and an empty pending
    name, so a digit, a leftover guest flag or yesterday's name from a
    previous session can never silently target somebody's card, mark it a
    visitor, or label a new key.
  triggers:
  - trigger: state
    entity_id: input_boolean.guardian_enrollment_mode
    to: 'on'
    id: enrollment_on
  - trigger: state
    entity_id: input_boolean.guardian_enrollment_mode
    to: 'off'
    id: enrollment_off
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_enrollment_slot
    data:
      value: ''
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_enroll_pending_name
    data:
      value: ''
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_enroll_as_visitor
  - action: persistent_notification.dismiss
    data:
      notification_id: guardian_enrollment_full
    continue_on_error: true
  - action: persistent_notification.dismiss
    data:
      notification_id: guardian_enrollment_write_failed
    continue_on_error: true
  - action: persistent_notification.dismiss
    data:
      notification_id: guardian_enrollment_name_failed
    continue_on_error: true
  - choose:
    - conditions:
      - condition: trigger
        id: enrollment_on
      sequence:
      # Dismissed only when a session STARTS. Doing it on 'off' as well would
      # race the timeout automation, which turns the boolean off and then posts
      # this very notification - the dismiss could land first and swallow it.
      - action: persistent_notification.dismiss
        data:
          notification_id: guardian_enrollment_timeout
        continue_on_error: true
      # Mutually exclusive with keypad PIN change. The newly enabled mode is
      # the one that is refused - PIN-change stays on, enrollment turns back
      # off, no slot timer starts.
      - if:
        - condition: state
          entity_id: input_boolean.guardian_pin_change_mode
          state: 'on'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.guardian_enrollment_mode
        - action: persistent_notification.create
          data:
            notification_id: guardian_pin_change_blocked
            title: 'Guardian: enrollment not started'
            message: >-
              Enrollment was turned on while a keypad PIN-change session was
              already open, so enrollment was switched back off. Finish or
              cancel the PIN change first.
        - stop: Enrollment blocked by PIN change.
      - action: timer.start
        target:
          entity_id: timer.guardian_enrollment_window
    default:
    - action: timer.cancel
      target:
        entity_id: timer.guardian_enrollment_window
    # Take the enrollment screen down immediately rather than leaving whatever
    # verdict was last shown sitting there.
    - if:
      - condition: template
        value_template: "{{ states('input_text.portal_display_state')
          not in ['ALARM', 'IDLE', 'CHALLENGE', 'MFA']
          and not (states('input_text.portal_display_state') | string).startswith('PIN_CHANGE') }}"
      then:
      - action: script.guardian_set_display
        data:
          value: IDLE
  mode: queued
  max: 5
- id: '1786500000015'
  alias: 'Guardian: Card Enrolled'
  description: >-
    Confirms each enrollment off the panel.

    guardian.card_enrolled has been fired since the feature existed and consumed
    by nothing, which mattered little while the mode disabled itself after one
    card. Now that a session stays open and can write several slots - including
    replacing an occupied one from the keypad - a durable record of which slot
    changed is the difference between "a card was added" and "whose card did I
    just overwrite".
  triggers:
  - trigger: event
    event_type: guardian.card_enrolled
  actions:
  - action: script.guardian_notify_person
    continue_on_error: true
    data:
      slot: "{{ trigger.event.data.slot | string | trim }}"
      critical: false
      category: mine
      severity: important
      title: 'Guardian: card enrolled'
      message: >-
        {% set slot = trigger.event.data.slot | string | trim %}
        {% set event_name = trigger.event.data.name | default('', true)
           | string | trim %}
        {% set stored = states('input_text.rfid_' ~ slot ~ '_name')
           | string | trim %}
        {% set who = event_name if event_name not in ['', 'unknown', 'unavailable']
           else (stored if stored not in ['', 'unknown', 'unavailable']
                 else 'Slot ' ~ slot) %}
        {{ who }} now holds a new card, enrolled at the
        {{ 'doorbell (outside)' if trigger.event.data.source == 'doorbell'
           else 'interior portal (inside)' }} reader. Enrollment mode is still
        on - press # on the portal to end the session.
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'card_enrolled', 'timestamp': now().isoformat(),
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 5
- id: '1786500000014'
  alias: 'Guardian: Enrollment Timeout'
  description: >-
    Idle expiry for enrollment mode.

    Enrollment used to switch itself off after a single card, which bounded the
    exposure by accident. Now that the mode is deliberately held open so several
    cards can be added in one session, this is the thing that bounds it - and it
    matters, because while enrollment is on ANY unrecognised card presented by
    ANYONE is written into a slot and granted.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_enrollment_window
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_enrollment_mode
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_enrollment_mode
  - action: persistent_notification.create
    data:
      notification_id: guardian_enrollment_timeout
      title: 'Guardian: enrollment mode expired'
      message: >-
        Enrollment mode was left on with no card presented and has been switched
        off automatically. No card was added. Turn it back on to continue.
  mode: single
- id: '1786500000020'
  alias: 'Guardian: PIN Change Mode Changed'
  description: >-
    Sets up and tears down a keypad PIN-change session. Turning the HA toggle
    on does not change the PIN: the portal still has to verify the current PIN,
    then accept a new one with #. Mutually exclusive with enrollment and with a
    live MFA or entry challenge - the newly enabled mode is the one that is
    refused.
  triggers:
  - trigger: state
    entity_id: input_boolean.guardian_pin_change_mode
    to: 'on'
    id: pin_change_on
  - trigger: state
    entity_id: input_boolean.guardian_pin_change_mode
    to: 'off'
    id: pin_change_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: pin_change_on
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: input_boolean.guardian_enrollment_mode
            state: 'on'
          - condition: state
            entity_id: input_boolean.portal_mfa_pending
            state: 'on'
          - condition: state
            entity_id: input_boolean.guardian_entry_challenge
            state: 'on'
          - condition: state
            entity_id: input_boolean.guardian_doorbell_exit_pin
            state: 'on'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.guardian_pin_change_mode
        - action: persistent_notification.create
          data:
            notification_id: guardian_pin_change_blocked
            title: 'Guardian: PIN change not started'
            message: >-
              PIN-change mode was turned on while enrollment or an
              authentication challenge was already open, so it was switched
              back off. The master PIN was not changed.
        - stop: PIN change blocked by enrollment or challenge.
      - if:
        - condition: template
          value_template: "{{ states('input_text.portal_pin_hash') | string
            | trim | lower | length != 64 }}"
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.guardian_pin_change_mode
        - action: persistent_notification.create
          data:
            notification_id: guardian_pin_change_no_hash
            title: 'Guardian: PIN change not started'
            message: >-
              No well-formed master PIN hash is stored, so a keypad change
              cannot verify the current PIN. Set one with script.guardian_set_pin
              first. The stored value was not changed.
        - stop: PIN change blocked; no stored hash.
      - action: persistent_notification.dismiss
        data:
          notification_id: guardian_pin_change_blocked
        continue_on_error: true
      - action: persistent_notification.dismiss
        data:
          notification_id: guardian_pin_change_no_hash
        continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.guardian_pin_change_step
        data:
          value: current
      - action: input_number.set_value
        target:
          entity_id: input_number.guardian_pin_change_fails
        data:
          value: 0
      # Fresh three attempts while elevated, matching MFA's per-challenge
      # reset (F-35). Not elevated: do not touch mfa_failed_attempts at all.
      - if:
        - condition: state
          entity_id: binary_sensor.guardian_elevated_mode
          state: 'on'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.mfa_failed_attempts
          data:
            value: 0
      - action: timer.start
        target:
          entity_id: timer.guardian_pin_change_window
      - action: script.guardian_set_display
        data:
          value: PIN_CHANGE_CURRENT
      - repeat:
          while:
          - condition: state
            entity_id: input_boolean.guardian_pin_change_mode
            state: 'on'
          - condition: template
            value_template: '{{ repeat.index <= 40 }}'
          sequence:
          - action: button.press
            target:
              entity_id: button.guardian_interior_portal_play_mfa_challenge
            continue_on_error: true
          - delay: 00:00:05
    default:
    - action: timer.cancel
      target:
        entity_id: timer.guardian_pin_change_window
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_pin_change_step
      data:
        value: none
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_pin_change_fails
      data:
        value: 0
    - if:
      - condition: template
        value_template: "{{ states('input_text.portal_display_state')
          not in ['ALARM', 'IDLE', 'CHALLENGE', 'MFA'] }}"
      then:
      - action: script.guardian_set_display
        data:
          value: IDLE
  # restart, so the chirp loop of a session that just ended is torn down
  # rather than overlapping the next one - same reason as the entry-challenge
  # supervisor.
  mode: restart
- id: '1786500000021'
  alias: 'Guardian: PIN Change Handler'
  description: >-
    Accepts keypad PINs while PIN-change mode is open and no MFA or entry
    challenge is running. Current PIN + #, then new PIN + #, then
    script.guardian_set_pin. Turning the mode on from the UI never reaches
    this automation by itself.
  triggers:
  - trigger: event
    event_type: esphome.pin_entered
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_pin_change_mode
    state: 'on'
  - condition: state
    entity_id: input_boolean.portal_mfa_pending
    state: 'off'
  - condition: state
    entity_id: input_boolean.guardian_entry_challenge
    state: 'off'
  - condition: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    state: 'off'
  actions:
  - action: script.guardian_pin_matches
    data:
      pin: '{{ trigger.event.data.pin }}'
    response_variable: pin_check
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_text.guardian_pin_change_step')
          | string | trim == 'current' }}"
      - condition: template
        value_template: '{{ pin_check.matches | bool }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.guardian_pin_change_step
        data:
          value: new
      - action: timer.start
        target:
          entity_id: timer.guardian_pin_change_window
      - action: script.guardian_set_display
        data:
          value: PIN_CHANGE_NEW
    - conditions:
      - condition: template
        value_template: "{{ states('input_text.guardian_pin_change_step')
          | string | trim == 'current' }}"
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.guardian_elevated_mode
            state: 'on'
          sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.mfa_failed_attempts
            data:
              value: "{{ states('input_number.mfa_failed_attempts') | int(0) + 1 }}"
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ states('input_number.mfa_failed_attempts')
                  | int(0) >= 3 }}"
              sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.mfa_failed_attempts
                data:
                  value: 0
              - action: timer.cancel
                target:
                  entity_id:
                  - timer.guardian_mfa_window
                  - timer.guardian_entry_challenge
                  - timer.guardian_doorbell_exit_pin_window
              - action: input_boolean.turn_off
                target:
                  entity_id:
                  - input_boolean.portal_mfa_pending
                  - input_boolean.guardian_entry_challenge
                  - input_boolean.guardian_doorbell_exit_pin
                  - input_boolean.guardian_challenge_card_ok
                  - input_boolean.guardian_challenge_pin_ok
              - action: input_text.set_value
                target:
                  entity_id:
                  - input_text.pending_mfa_slot
                  - input_text.pending_mfa_source
                  - input_text.guardian_doorbell_exit_slot
                data:
                  value: none
              - event: guardian.pin_change
                event_data:
                  outcome: escalated
                  elevated: true
                  timestamp: '{{ now().isoformat() }}'
              - event: guardian.major_alarm
                event_data:
                  reason: Maximum PIN attempts exceeded
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.guardian_pin_change_mode
            default:
            - action: script.guardian_set_display
              data:
                value: DENIED
            - action: button.press
              target:
                entity_id: button.guardian_interior_portal_play_denied
            - action: script.turn_on
              target:
                entity_id: script.guardian_lamp_rejected
            - delay: 00:00:03
            - if:
              - condition: state
                entity_id: input_boolean.guardian_pin_change_mode
                state: 'on'
              - condition: template
                value_template: "{{ states('input_text.guardian_pin_change_step')
                  | string | trim == 'current' }}"
              then:
              - action: timer.start
                target:
                  entity_id: timer.guardian_pin_change_window
              - action: script.guardian_set_display
                data:
                  value: PIN_CHANGE_CURRENT
        default:
        - action: input_number.set_value
          target:
            entity_id: input_number.guardian_pin_change_fails
          data:
            value: "{{ states('input_number.guardian_pin_change_fails') | int(0) + 1 }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ states('input_number.guardian_pin_change_fails')
                | int(0) >= 3 }}"
            sequence:
            - event: guardian.pin_change
              event_data:
                outcome: failed_mild
                elevated: false
                timestamp: '{{ now().isoformat() }}'
            - action: persistent_notification.create
              data:
                notification_id: guardian_pin_change_blocked
                title: 'Guardian: PIN change cancelled'
                message: >-
                  Three incorrect current-PIN attempts during a keypad PIN
                  change. The master PIN was not changed, and this was not
                  raised as an alarm.
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.guardian_pin_change_mode
          default:
          - action: script.guardian_set_display
            data:
              value: DENIED
          - action: button.press
            target:
              entity_id: button.guardian_interior_portal_play_denied
          - action: script.turn_on
            target:
              entity_id: script.guardian_lamp_rejected
          - delay: 00:00:03
          - if:
            - condition: state
              entity_id: input_boolean.guardian_pin_change_mode
              state: 'on'
            - condition: template
              value_template: "{{ states('input_text.guardian_pin_change_step')
                | string | trim == 'current' }}"
            then:
            - action: timer.start
              target:
                entity_id: timer.guardian_pin_change_window
            - action: script.guardian_set_display
              data:
                value: PIN_CHANGE_CURRENT
    - conditions:
      - condition: template
        value_template: "{{ states('input_text.guardian_pin_change_step')
          | string | trim == 'new' }}"
      - condition: template
        value_template: "{{ trigger.event.data.pin | string | trim
          is match('^[0-9]{4,6}$') }}"
      sequence:
      - action: script.guardian_set_pin
        data:
          pin: '{{ trigger.event.data.pin }}'
      - event: guardian.pin_change
        event_data:
          outcome: success
          elevated: "{{ is_state('binary_sensor.guardian_elevated_mode', 'on') }}"
          timestamp: '{{ now().isoformat() }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_pin_change_mode
      - action: script.guardian_set_display
        data:
          value: GRANTED
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_welcome
    - conditions:
      - condition: template
        value_template: "{{ states('input_text.guardian_pin_change_step')
          | string | trim == 'new' }}"
      sequence:
      - action: script.guardian_set_display
        data:
          value: DENIED
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - delay: 00:00:03
      - if:
        - condition: state
          entity_id: input_boolean.guardian_pin_change_mode
          state: 'on'
        - condition: template
          value_template: "{{ states('input_text.guardian_pin_change_step')
            | string | trim == 'new' }}"
        then:
        - action: timer.start
          target:
            entity_id: timer.guardian_pin_change_window
        - action: script.guardian_set_display
          data:
            value: PIN_CHANGE_NEW
  mode: queued
  max: 10
- id: '1786500000022'
  alias: 'Guardian: PIN Change Cancel'
  description: >-
    A short # on the portal during PIN-change mode ends the session with no
    PIN change, matching enrollment's # and the entry-challenge cleanup.
  triggers:
  - trigger: event
    event_type: esphome.pin_change_cancel
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_pin_change_mode
    state: 'on'
  actions:
  # Firmware used to fire this event on every # that submitted a PIN, because
  # it cleared the buffer and then treated length < 4 as cancel. Wait, then
  # ignore a cancel that arrived in the same keypress as pin_entered, so a
  # correct current PIN can advance to NEW instead of tearing the session down.
  # A real short-# cancel does not trigger the PIN Change Handler, so it still
  # lands here after the delay.
  - delay:
      milliseconds: 400
  - condition: state
    entity_id: input_boolean.guardian_pin_change_mode
    state: 'on'
  - condition: template
    value_template: >-
      {% set ns = namespace(recent=false) %}
      {% for s in states.automation %}
        {% if s.name == 'Guardian: PIN Change Handler' %}
          {% set last = state_attr(s.entity_id, 'last_triggered') %}
          {% if last is not none and (now() - last).total_seconds() <= 2 %}
            {% set ns.recent = true %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ not ns.recent }}
  - event: guardian.pin_change
    event_data:
      outcome: abandoned
      elevated: "{{ is_state('binary_sensor.guardian_elevated_mode', 'on') }}"
      timestamp: '{{ now().isoformat() }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_pin_change_mode
  mode: single
- id: '1786500000023'
  alias: 'Guardian: PIN Change Timeout'
  description: >-
    Per-step 40s window expired. Clean exit: no PIN change, and not a strike
    even while elevated - a timeout is not a wrong current PIN.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.guardian_pin_change_window
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_pin_change_mode
    state: 'on'
  actions:
  - event: guardian.pin_change
    event_data:
      outcome: abandoned
      elevated: "{{ is_state('binary_sensor.guardian_elevated_mode', 'on') }}"
      timestamp: '{{ now().isoformat() }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_pin_change_mode
  mode: single
- id: '1786500000024'
  alias: 'Guardian: PIN Change Abort On Challenge'
  description: >-
    An MFA, entry, or doorbell-exit challenge outranks PIN-change keypad
    capture. Abort the PIN-change session so it cannot resume a half-typed new
    PIN after the challenge ends. The PIN is not changed.
  triggers:
  - trigger: state
    entity_id: input_boolean.portal_mfa_pending
    to: 'on'
  - trigger: state
    entity_id: input_boolean.guardian_entry_challenge
    to: 'on'
  - trigger: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_pin_change_mode
    state: 'on'
  actions:
  - event: guardian.pin_change
    event_data:
      outcome: abandoned
      elevated: "{{ is_state('binary_sensor.guardian_elevated_mode', 'on') }}"
      timestamp: '{{ now().isoformat() }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_pin_change_mode
  mode: single
- id: '1786384748574'
  alias: 'Guardian: Camera-Based Lamp Control'
  description: Samples actual scene luminance on an adaptive cadence, independent
    of clock daylight - every 10 minutes while the lamp is off, every 30 while it
    is on.
  triggers:
  # Was "hours: /3" AND "minutes: /10", which is not "every three hours" as the
  # description claimed: it fires at :00,:10,...,:50 of hours 0,3,6,9,12,15,18,21
  # and never at all for the other sixteen hours of the day. At 22:20 the next
  # sample was 00:00, so the lamp could sit dark for an hour and forty minutes
  # after dusk.
  - trigger: time_pattern
    minutes: /10
    id: scheduled
  - trigger: homeassistant
    event: start
    id: startup
  conditions:
  # Sampling blacks the bulb out for a few seconds to read true ambient light.
  # That is invisible while the lamp is already off, so poll fast then and catch
  # dusk within 10 minutes. While the lamp is ON the blackout is visible, so
  # back off to 30 minutes - twice an hour rather than six times.
  #
  # last_triggered is None before the first run, which as_timestamp's second
  # argument turns into 0 rather than raising: that reads as "long ago", so the
  # first sample after a restart always runs.
  - condition: template
    value_template: >-
      {{ trigger.id == 'startup' or
         states('sensor.guardian_lamp_entity') in ['none', 'unknown', 'unavailable', ''] or
         not is_state(states('sensor.guardian_lamp_entity'), 'on') or
         (as_timestamp(now()) -
          as_timestamp(state_attr('script.guardian_sample_ambient_light',
                                  'last_triggered'), 0)) >= 1800 }}
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''startup'' }}'
    then:
    - delay: 120
  - action: script.guardian_sample_ambient_light
  # A time_pattern trigger landing during the 120s startup delay would be
  # dropped by mode: single with a warning. queued/max: 2 absorbs that one
  # overlap; the script is itself queued and guarded by
  # input_boolean.guardian_lamp_sampling, so it cannot double-sample.
  #
  # That script was mode: single until the forty-fifth pass and this comment used
  # to say so, as part of the argument that a redundant sample here was harmless.
  # It was not harmless: single has no queue, so it discarded the second blocking
  # call outright and its caller was told nothing. It is queued/max: 10 now, which
  # serialises the same way without the drop, so the reasoning above still holds
  # and the sample is merely late rather than lost.
  mode: queued
  max: 2
- id: '1786384760025'
  alias: 'Guardian: Lamp Sampling Watchdog'
  description: >-
    Recovers from a sample that never finished. Clearing the flag was only half
    the job: the sampler blacks the bulb out as its first act, so an interrupted
    run left the lamp OFF with nothing anywhere holding the state needed to put
    it back. At night that is indistinguishable from "the lamp turned itself
    off". guardian_lamp_presample is written before the blackout precisely so
    this automation can undo it.
  triggers:
  - trigger: state
    entity_id: input_boolean.guardian_lamp_sampling
    to: 'on'
    for: 60
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_lamp_sampling
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_lamp_sampling
  - variables:
      stash: "{{ states('input_text.guardian_lamp_presample') | string | trim }}"
  - if:
    - condition: template
      value_template: "{{ stash not in ['', 'none', 'unknown', 'unavailable'] }}"
    then:
    - action: script.guardian_restore_lamp
      data:
        # "off" or "on|<brightness>|<kelvin>". prev_rgb is deliberately omitted:
        # guardian_restore_lamp prefers rgb when it is present, and the stash
        # cannot carry a tuple through an input_text without quoting games.
        was_on: "{{ stash.split('|')[0] == 'on' }}"
        prev_brightness: "{{ (stash.split('|')[1] | int(255))
          if '|' in stash else 255 }}"
        prev_kelvin: "{{ (stash.split('|')[2] | int(0)) if stash.split('|') | count
          > 2 else 0 }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_presample
      data:
        value: none
    - action: persistent_notification.create
      data:
        notification_id: guardian_lamp_sample_stuck
        title: 'Guardian: ambient light sample did not finish'
        message: >-
          A sample was interrupted with the lamp switched off for measurement.
          The lamp has been restored to "{{ stash }}". If this recurs, the
          camera snapshot or the luminance sensor is hanging - see
          input_text.guardian_lamp_last_result.
  mode: restart
- id: '1787145600001'
  alias: 'Guardian: Lamp Sun-Mismatch Fallback'
  description: >-
    Hard time-based fallback so the Tapo lamp cannot stay in a state that
    disagrees with sun elevation. Separate from the sampler's immediate sun
    clamp, which only acts when a valid reading crosses a threshold. This
    fires even when the camera number is valid but has been wrong for too
    long (typically a hold-band reading fooled by the downstairs window), and
    even when sampling is not running.

    Ticks at :30 of every ten-minute mark so it does not share the exact
    second as Camera-Based Lamp Control (:00). A simultaneous sample is
    skipped here; the sampler applies the same script at the end of the run.
    Do not use a for:-on-lamp-state trigger: the sampler's 5s blackout every
    30 minutes while the lamp is on would reset an "on too long" clock
    forever.
  triggers:
  - trigger: time_pattern
    minutes: /10
    seconds: 30
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_lamp_sampling
    state: 'off'
  - condition: state
    entity_id: script.guardian_lamp_feedback
    state: 'off'
  - condition: template
    value_template: "{{ states('input_text.portal_display_state') | string | trim
      not in ['ALARM', 'CHALLENGE', 'MFA'] }}"
  - condition: template
    value_template: "{{ states('sensor.guardian_lamp_entity') not in ['none', 'unknown', 'unavailable', '']
      and states(states('sensor.guardian_lamp_entity')) not in ['unknown', 'unavailable'] }}"
  actions:
  - action: script.guardian_apply_lamp_sun_mismatch
    data:
      from_sampler: false
  mode: single
- id: '1786384798502'
  alias: 'Guardian: Frigate Person Detected While Away'
  description: Uses the configured Frigate camera name and Guardian RFID presence
    states.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.type == 'new' and\n   trigger.payload_json.after.label
      == 'person' and\n   trigger.payload_json.after.camera == states('input_text.guardian_frigate_camera_name')
      and\n   not (trigger.payload_json.after.false_positive | default(false)) }}"
  # Nobody home. If presence trackers are configured they are authoritative,
  # because phone presence does not depend on anyone remembering to scan out;
  # otherwise fall back to the original all-cards-away gate (audit F-16).
  - condition: template
    value_template: >-
      {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                   | map('trim') | reject('eq', '') | list %}
      {% set ns = namespace(n=0) %}
      {% for i in ids %}
        {% set c = states('input_text.rfid_' ~ i ~ '_card_id')
                   | string | trim | lower %}
        {% set occupied = c | length == 16 and c is match('^[0-9a-f]{16}$') %}
        {% if occupied and states('input_select.rfid_' ~ i ~ '_policy') != 'visitor'
             and states('input_select.rfid_' ~ i) == 'At home' %}
          {% set ns.n = ns.n + 1 %}
        {% endif %}
      {% endfor %}
      {% set raw = states('sensor.guardian_presence_trackers_resolved') %}
      {% set trackers = (raw if raw not in ['', 'none', 'unknown', 'unavailable']
        else '') | replace(' ', '') | trim %}
      {% set trackers = trackers.split(',') | reject('eq', '') | list %}
      {% if trackers | count > 0 %}
        {{ expand(trackers) | selectattr('state', 'eq', 'home') | list | count == 0 }}
      {% else %}
        {{ ns.n == 0 }}
      {% endif %}
  actions:
  - action: script.guardian_notify_broadcast
    continue_on_error: true
    data:
      category: camera
      severity: urgent
      title: "\U0001F6A8 PERSON DETECTED"
      message: The Guardian door camera detected a person while all resident cards
        are away.
      payload:
        priority: high
        ttl: 0
  mode: queued
  max: 5
- id: '1786500000001'
  alias: 'Guardian: Portal Offline Watchdog'
  description: The portal is the only source of door events. If it drops off the
    network the door can be opened with no system response whatsoever, and nothing
    previously monitored that (audit F-19).
  triggers:
  # The portal now publishes a real API status entity, so availability is read
  # directly rather than inferred from the door contact going unavailable.
  #
  # That inference was serviceable but ambiguous - "unavailable" is also what a
  # renamed or deleted entity looks like - and it could not distinguish the
  # device being off the network from the integration having reloaded. The
  # status entity is the thing itself: Home Assistant keeps it available and
  # flips it to off when the device disconnects.
  - trigger: state
    entity_id: binary_sensor.guardian_interior_portal_status
    to: 'off'
    for: 00:05:00
    id: offline
  # The five minutes above was completely mode-agnostic: the same wait applied at
  # lunchtime with the mode off as at 3am with it on. For those five minutes an
  # elevated-mode front door is undetectable - the portal is the only source of
  # esphome.door_opened, so no challenge can open, no chirp can sound and no
  # alarm can be raised no matter what happens at the door - and nobody had been
  # told. Ninety seconds still rides out a reboot or an access-point roam, and it
  # is the mode where an unnoticed outage costs the most.
  - trigger: state
    entity_id: binary_sensor.guardian_interior_portal_status
    to: 'off'
    for: 00:01:30
    id: offline_elevated
  - trigger: state
    entity_id: binary_sensor.guardian_interior_portal_status
    to: 'on'
    for: 00:00:30
    id: online
  actions:
  - choose:
    # One outage, one push. Both offline branches require the latch to be off, so
    # whichever fires first claims it and the other declines: elevated sets it at
    # 1:30 and the 5:00 trigger then finds it on, while a non-elevated outage
    # fails this branch's mode condition, falls through a choose with no default
    # and leaves the latch untouched for the 5:00 branch. Do not move the latch
    # test out of the branch conditions - that is the thing making this work.
    - conditions:
      - condition: trigger
        id: offline_elevated
      - condition: state
        entity_id: binary_sensor.guardian_elevated_mode
        state: 'on'
      - condition: state
        entity_id: input_boolean.guardian_portal_offline_notified
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_portal_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: urgent
          title: '⚠️ Guardian: portal offline in elevated mode'
          message: >-
            The interior portal has been unreachable for 90 seconds and elevated
            mode is ON. Door openings are NOT being detected - no challenge, no
            chirp and no alarm can be raised until it comes back.
          payload:
            priority: high
            ttl: 0
    - conditions:
      - condition: trigger
        id: offline
      - condition: state
        entity_id: input_boolean.guardian_portal_offline_notified
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_portal_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: important
          title: '⚠️ Guardian: portal offline'
          message: The interior portal has been unreachable for 5 minutes. Door
            openings are NOT being detected.
          payload:
            priority: high
            ttl: 0
    - conditions:
      - condition: trigger
        id: online
      # Only announce recovery if an outage was actually reported, so routine
      # restarts stay silent.
      - condition: state
        entity_id: input_boolean.guardian_portal_offline_notified
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_portal_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: routine
          title: 'Guardian: portal back online'
          message: Door detection has resumed.
  mode: queued
  max: 5
- id: '1786500000006'
  alias: 'Guardian: Doorbell Offline Watchdog'
  description: >-
    The doorbell had no health monitoring of any kind. It is the exterior RFID
    reader, so while it is offline nobody can be admitted from outside and the
    doorbell button does nothing - and the only symptom was a DOORBELL token
    appearing in the portal's fault strip, which nothing alerted on.

    Five minutes matches the portal watchdog and rides out a reboot or a brief
    access-point roam without crying wolf.
  triggers:
  - trigger: state
    entity_id: binary_sensor.guardian_doorbell_online
    to: 'off'
    for: 00:05:00
    id: offline
  - trigger: state
    entity_id: binary_sensor.guardian_doorbell_online
    to: 'on'
    for: 00:00:30
    id: online
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: offline
      - condition: state
        entity_id: input_boolean.guardian_doorbell_offline_notified
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_doorbell_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: important
          title: '⚠️ Guardian: doorbell offline'
          message: >-
            The doorbell has been unreachable for 5 minutes. Cards cannot be
            scanned from outside and the doorbell button will not chime.
          payload:
            priority: high
            ttl: 0
    - conditions:
      - condition: trigger
        id: online
      # Only announce recovery if an outage was actually reported, so routine
      # restarts and reflashes stay silent.
      - condition: state
        entity_id: input_boolean.guardian_doorbell_offline_notified
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_doorbell_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: routine
          title: 'Guardian: doorbell back online'
          message: Exterior card scanning has resumed.
  mode: queued
  max: 5
- id: '1787318400002'
  alias: 'Guardian: Record An Interrupted Flow At Shutdown'
  description: >-
    Writes down that an authentication flow was live when Home Assistant went
    down, so the next start can say so. "Guardian: Startup State Recovery" is
    the only reader; it consumes both latches on the way past.

    The flags themselves cannot carry this. All four are declared initial:
    false, which is applied on every start and skips restore_state, so by the
    time anything at start looks at them they are off - which is why the two
    notifications in Startup State Recovery had never fired once. The flags keep
    that boot-clear, because a restored guardian_entry_challenge would block the
    Elevated Opening Supervisor from challenging or alarming an opening for the
    thirty seconds before the reset runs.

    HONEST LIMIT: the shutdown trigger fires on EVENT_HOMEASSISTANT_FINAL_WRITE,
    the last stage at which a write still reaches the restore snapshot. That
    covers a restart, a reload and a clean host shutdown. It does NOT cover a
    power cut, a kernel panic or a killed container - those write nothing and
    send no notice. This is a courtesy after a planned restart, not evidence.
  triggers:
  - trigger: homeassistant
    event: shutdown
  actions:
  # Guarded end to end. This runs during shutdown, when integrations are already
  # unloading; an error here must not stop the other listener on the same event.
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.portal_mfa_pending
        state: 'on'
      - condition: state
        entity_id: input_boolean.guardian_entry_challenge
        state: 'on'
      - condition: state
        entity_id: input_boolean.guardian_doorbell_exit_pin
        state: 'on'
    then:
    - action: input_boolean.turn_on
      continue_on_error: true
      target:
        entity_id: input_boolean.guardian_restart_mid_challenge
  - if:
    - condition: state
      entity_id: input_boolean.guardian_pin_change_mode
      state: 'on'
    then:
    - action: input_boolean.turn_on
      continue_on_error: true
      target:
        entity_id: input_boolean.guardian_restart_mid_pin_change
  mode: single
- id: '1786500000002'
  alias: 'Guardian: Startup State Recovery'
  description: Restores states that do not survive a restart (audit F-19).
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  # Let the ESPHome API reconnect and helpers restore before inspecting state.
  - delay: 00:00:30
  # Was a challenge or a PIN change running when Home Assistant went down?
  #
  # This used to read the flags themselves - portal_mfa_pending,
  # guardian_entry_challenge, guardian_doorbell_exit_pin and
  # guardian_pin_change_mode - on the reasoning that guardian_reset_auth below is
  # about to erase the evidence. It reads them thirty seconds into a start, and
  # all four carry initial: false, which Home Assistant applies on every start
  # and which skips restore_state. So both variables were ALWAYS false and
  # neither notification below has ever been sent, on any install, since they
  # were written. A household whose PIN challenge was killed by a routine restart
  # was told nothing, which is the exact gap these two branches exist to close.
  #
  # The evidence now crosses the restart in a pair of latches that DO restore,
  # written by "Guardian: Record An Interrupted Flow At Shutdown" at final-write.
  # Reading a latch rather than dropping initial: false from the four flags is
  # deliberate: a restored guardian_entry_challenge is a condition on the
  # Elevated Opening Supervisor, so letting it survive would leave the front door
  # unchallenged and unalarmed for the thirty seconds before the reset below runs.
  # See the helper comments in packages/guardian.yaml.
  - variables:
      was_mid_challenge: "{{ is_state('input_boolean.guardian_restart_mid_challenge', 'on') }}"
      was_pin_change: "{{ is_state('input_boolean.guardian_restart_mid_pin_change', 'on') }}"
  # WAS AN ALARM SOUNDING WHEN HOME ASSISTANT WENT DOWN?
  #
  # READ HERE, ACTED ON AT THE FOOT OF THIS AUTOMATION, and the distance between
  # those two points is deliberate: script.guardian_reset_auth below ends by
  # writing IDLE through guardian_set_display whenever the display is neither
  # ALARM nor IDLE - which at boot it never is - and that write clears the latch.
  # So the value has to be snapshotted into a variable before the reset runs and
  # tested after it, or the reset erases the evidence on its way past.
  #
  # This replaces a condition that could not be true. The branch below used to
  # test input_text.portal_display_state for ALARM, and that helper is declared
  # initial: none, which Home Assistant applies on every start and which SKIPS
  # restore_state - the same trap, in the same automation, that the comment above
  # describes finding in the four challenge flags. It was found there, fixed for
  # those four, and left standing in the one branch that resumes the burglar
  # alarm. It had therefore never fired on any install, and a Home Assistant
  # restart - a nightly update, an add-on install, a reboot - ended a live alarm
  # in silence.
  #
  # Three separate variables: blocks, not one. A variables: mapping has no
  # ordering guarantee, so an entry may not read a sibling of its own map.
  - variables:
      alarm_latch: "{{ states('input_text.guardian_alarm_latch') | string | trim }}"
  - variables:
      # as_timestamp WITH AN EXPLICIT DEFAULT. It returns the default instead of
      # raising on anything that is not a timestamp - the literal `none`, an
      # empty helper on a fresh install, a hand-edited value. A raise here is a
      # TemplateError, which continue_on_error does not catch and which would end
      # this automation in front of every recovery step below it.
      alarm_ts: "{{ as_timestamp(alarm_latch, 0) | float(0) }}"
  - variables:
      alarm_age_minutes: "{{ ((now().timestamp() - alarm_ts) / 60) | round(1) }}"
      # Why an age at all, rather than a bare flag. A restore_state snapshot can
      # be up to fifteen minutes stale, so the latch proves an alarm was running
      # at SOME point and only its age separates "restarted during a break-in"
      # from "the power came back after an eight-hour cut". Resuming the second
      # is a siren at 3am for nothing, which is how a household learns to unplug
      # the system. The portal makes the same trade on the device side and has to
      # guess, having no clock; Home Assistant has one, so this bound is honest.
      resume_within: "{{ states('input_number.guardian_alarm_resume_minutes') | int(30) }}"
  # Consumed here, immediately after the read and before anything that could
  # fail, so one restart produces at most one notice. A latch that survived a
  # failure further down would announce the same cancelled challenge again at
  # every subsequent start, which is how a household learns to ignore Guardian.
  - action: input_boolean.turn_off
    continue_on_error: true
    target:
      entity_id:
      - input_boolean.guardian_restart_mid_challenge
      - input_boolean.guardian_restart_mid_pin_change
  # One call covers everything that used to be spelled out here: both passage
  # timers, both pending lists, the MFA trio, the fail counter, and the display.
  #
  # It also fixes an ordering bug. The fail counter reset used to sit INSIDE
  # "if portal_mfa_pending == on", so the one state most likely to be stale
  # after a restart was only cleared in the one case where it was least likely
  # to matter. guardian_reset_auth resets it unconditionally.
  #
  # Clearing grants nothing: a fresh scan and PIN are still required, and the
  # Elevated Opening Supervisor still alarms on any unauthorised opening.
  - action: script.guardian_reset_auth
  # The major alarm handler drives its siren from a repeat-while loop, and a
  # restart kills the loop. Re-fire the event to re-arm it rather than trying to
  # rebuild the loop's state: the handler writes ALARM, sounds the siren and
  # pushes, which is the whole of what was lost.
  #
  # Runs after guardian_reset_auth on purpose. That script deliberately leaves an
  # ALARM display alone, and firing here rather than earlier means the resumed
  # alarm is the last thing to touch the screen.
  #
  # NOTHING CLEARS THE LATCH HERE, and that is not an omission. Every path out of
  # this branch goes through guardian_set_display, which is the only writer:
  # resuming fires the handler, which writes ALARM and stamps a fresh timestamp;
  # not resuming leaves guardian_reset_auth's IDLE write above to have already
  # cleared it. A direct write from here would be a second writer, and the
  # latch's whole guarantee is that it cannot disagree with the screen.
  - if:
    - condition: template
      value_template: '{{ alarm_ts | float(0) > 0 and (alarm_age_minutes | float(0)) <= (resume_within | float(30)) }}'
    then:
    - event: guardian.major_alarm
      event_data:
        # Says what it established and nothing more. The original reason lived in
        # input_text.guardian_alarm_reason, which carries initial: none and so did
        # not survive - claiming a cause here would be inventing one.
        reason: >-
          Alarm was still active {{ alarm_age_minutes }} minutes ago when Home
          Assistant restarted; the original reason did not survive the restart
  # An alarm too old to resume is still worth saying out loud, because the
  # alternative is a house that sounded an alarm, lost power for the night, and
  # tells nobody in the morning. Notifies rather than alarming: the bound above
  # exists precisely because re-sounding this is the wrong answer.
  - if:
    - condition: template
      value_template: '{{ alarm_ts | float(0) > 0 and (alarm_age_minutes | float(0)) > (resume_within | float(30)) }}'
    then:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: security
        severity: important
        title: 'Guardian: alarm ended by an outage'
        message: >-
          An alarm was sounding {{ alarm_age_minutes }} minutes ago and Home
          Assistant has only just come back. It was not resumed, because that is
          longer than the {{ resume_within }} minutes set on Guardian Alarm
          Resume Minutes. Check the door and the camera history.
  # Notifies rather than alarming: a deliberate restart that happens to coincide
  # with a challenge is not an intrusion.
  - if:
    - condition: template
      value_template: '{{ was_mid_challenge }}'
    then:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: security
        severity: important
        title: 'Guardian: challenge cancelled'
        message: Home Assistant restarted during an authentication challenge. The
          challenge was cancelled and no access was granted. Scan again to retry.
  - if:
    - condition: template
      value_template: '{{ was_pin_change }}'
    then:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: security
        severity: important
        title: 'Guardian: PIN change cancelled'
        message: Home Assistant restarted during a keypad PIN-change session. The
          session was cancelled and the master PIN was not changed.
  # input_boolean restores across a restart but the enrollment timer does not
  # (restore: false), so a session that was open when Home Assistant went down
  # comes back with the mode ON and nothing counting down - the exact unbounded
  # window the idle expiry exists to prevent. Re-arm it.
  - if:
    - condition: state
      entity_id: input_boolean.guardian_enrollment_mode
      state: 'on'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_enrollment_slot
      data:
        value: ''
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_enroll_pending_name
      data:
        value: ''
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.guardian_enroll_as_visitor
    - action: timer.start
      target:
        entity_id: timer.guardian_enrollment_window
  mode: single
- id: '1786500000003'
  alias: 'Guardian: Auth State Watchdog'
  description: >-
    Repairs an authentication state machine that has become internally
    inconsistent. Both conditions below are states the system cannot reach by
    any legitimate route, and neither could previously resolve itself: the MFA
    timer is restore: false, so a challenge whose timer vanished had no way to
    expire, and nothing at all watched the display state. The result was a
    portal stuck on ENTER PIN, or - worse - a PIN handler that accepted attempts
    against a pending_mfa_slot of "none" and denied every one of them.
  triggers:
  # Pending with no timer behind it. This is what a restart, a cancelled timer,
  # or leaving elevated mode used to leave behind.
  - trigger: state
    entity_id: input_boolean.portal_mfa_pending
    to: 'on'
    for: 00:02:00
    id: pending_without_timer
  # The mirror: the portal is asking for a PIN that nothing will accept.
  - trigger: state
    entity_id: input_text.portal_display_state
    to: MFA
    for: 00:02:00
    id: mfa_display_without_pending
  # The same mirror for the challenge screen, which had none. This is exactly the
  # residue the swallowed guardian_clear_entry_challenge key left behind: the
  # supervisor wrote CHALLENGE to the display, the clear script it called was
  # actually guardian_lamp_warning, and the boolean went off while the screen
  # stayed. "Guardian: Portal LED Mirror" deliberately gives the CHALLENGE screen
  # no return-to-IDLE delay - it is meant to hold for as long as the challenge
  # runs - so nothing else could ever take it down and the portal sat on
  # AUTHENTICATE indefinitely.
  - trigger: state
    entity_id: input_text.portal_display_state
    to: CHALLENGE
    for: 00:02:00
    id: challenge_display_without_flag
  # Same class of fault on the entry challenge, which is worse to strand: its
  # timer is also restore: false, so a challenge whose timer vanished holds the
  # lamp amber, chirps, and blocks the Elevated Opening Supervisor from ever
  # supervising another opening.
  - trigger: state
    entity_id: input_boolean.guardian_entry_challenge
    to: 'on'
    for: 00:02:00
    id: challenge_without_timer
  - trigger: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    to: 'on'
    for: 00:02:00
    id: doorbell_exit_without_timer
  # The PIN-change boolean stranded with no timer behind it. This description
  # used to say the boolean "restores" across a restart; it does not - it carries
  # initial: false, like the three flags above it, so Home Assistant forces it off
  # on every start. The stranded states this watchdog repairs are the ones a
  # cancelled timer or a mode change leaves behind WHILE RUNNING, which is the
  # majority of them and the only ones a "for: 2 minutes" state trigger could ever
  # have seen anyway: a value restored at boot is not a transition to 'on' and
  # would never have fired this. Nothing about the behaviour changes; the reason
  # written next to it is now the true one.
  - trigger: state
    entity_id: input_boolean.guardian_pin_change_mode
    to: 'on'
    for: 00:02:00
    id: pin_change_without_timer
  - trigger: state
    entity_id: input_text.portal_display_state
    to: PIN_CHANGE_CURRENT
    for: 00:02:00
    id: pin_change_display_current
  - trigger: state
    entity_id: input_text.portal_display_state
    to: PIN_CHANGE_NEW
    for: 00:02:00
    id: pin_change_display_new
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: pending_without_timer
      - condition: not
        conditions:
        - condition: state
          entity_id: timer.guardian_mfa_window
          state: active
    - condition: and
      conditions:
      - condition: trigger
        id: mfa_display_without_pending
      - condition: state
        entity_id: input_boolean.portal_mfa_pending
        state: 'off'
    - condition: and
      conditions:
      - condition: trigger
        id: challenge_display_without_flag
      - condition: state
        entity_id: input_boolean.guardian_entry_challenge
        state: 'off'
    - condition: and
      conditions:
      - condition: trigger
        id: challenge_without_timer
      - condition: not
        conditions:
        - condition: state
          entity_id: timer.guardian_entry_challenge
          state: active
    - condition: and
      conditions:
      - condition: trigger
        id: doorbell_exit_without_timer
      - condition: not
        conditions:
        - condition: state
          entity_id: timer.guardian_doorbell_exit_pin_window
          state: active
    - condition: and
      conditions:
      - condition: trigger
        id: pin_change_without_timer
      - condition: not
        conditions:
        - condition: state
          entity_id: timer.guardian_pin_change_window
          state: active
    - condition: and
      conditions:
      - condition: trigger
        id:
        - pin_change_display_current
        - pin_change_display_new
      - condition: state
        entity_id: input_boolean.guardian_pin_change_mode
        state: 'off'
  actions:
  - action: script.guardian_reset_auth
  - action: persistent_notification.create
    data:
      notification_id: guardian_auth_watchdog
      title: 'Guardian: authentication state repaired'
      message: >-
        A PIN challenge was left in an impossible state
        ({{ trigger.id }}) and has been cleared automatically. No access was
        granted. If this keeps happening, check whether elevated mode is being
        switched off mid-challenge, or run script.guardian_reset.
  mode: single
- id: '1786500000004'
  alias: 'Guardian: Elevated Mode Deactivated'
  description: >-
    Cleans up when elevated mode ends. A live challenge, MFA window, or
    doorbell-exit PIN still running would otherwise expire into a major alarm
    after Super Surveillance (or the night window) has already ended.

    The Tapo is handed back to automatic lamp control on every elevated-off
    edge, even when no auth flag is on. Challenge amber is not a colour to
    restore; the same turn_off-then-sample path as Dismiss Alarm from Phone
    is the owner, not a third lamp script.
  triggers:
  - trigger: state
    entity_id: binary_sensor.guardian_elevated_mode
    to: 'off'
    # A template entity is briefly unknown at startup before it first renders,
    # so without this a restart looks like elevated mode ending and would post a
    # misleading notification. Startup is handled by Startup State Recovery.
    not_from:
    - unknown
    - unavailable
  actions:
  - variables:
      challenge_open: "{{ is_state('input_boolean.portal_mfa_pending', 'on')
        or is_state('input_boolean.guardian_entry_challenge', 'on')
        or is_state('input_boolean.guardian_doorbell_exit_pin', 'on') }}"
      alarming: "{{ is_state('input_text.portal_display_state', 'ALARM') }}"
  - if:
    - condition: template
      value_template: '{{ challenge_open | bool }}'
    then:
    - action: script.guardian_reset_auth
    - action: persistent_notification.create
      data:
        notification_id: guardian_auth_watchdog
        title: 'Guardian: challenge cancelled'
        message: >-
          Elevated mode ended while a challenge was open, so the challenge was
          cancelled. No access was granted, and no alarm was raised. Scan again if
          you still need to pass.
  # Alarm owns the bulb full red. Anything else, including leftover challenge
  # amber after the flags are already off, goes back to the sampler.
  - if:
    - condition: template
      value_template: '{{ not (alarming | bool) }}'
    then:
    # Same `none` fallback and the same continue_on_error as the alarm handler
    # and the phone dismissal. The fallback is the part that carries the
    # half-installed case; continue_on_error only covers an unreachable bulb.
    - action: light.turn_off
      continue_on_error: true
      target:
        entity_id: >-
          {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
          {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
    - action: script.guardian_sample_ambient_light
  mode: single
- id: '1786500000005'
  alias: 'Guardian: Reset Button'
  description: Binds input_button.guardian_reset to script.guardian_reset.
  triggers:
  - trigger: state
    entity_id: input_button.guardian_reset
  conditions:
  # An input_button's state is the timestamp of its last press, and it restores
  # across a restart - so Home Assistant starting up produces a state change to
  # a perfectly valid but possibly weeks-old timestamp. Testing the timestamp
  # itself is what separates "pressed just now" from "restored at startup";
  # filtering on from_state would also have rejected the very first press, when
  # the previous state legitimately is unknown.
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) < 30 }}
  actions:
  - action: script.guardian_reset
  mode: single

# ---------------------------------------------------------------------------
# Guardian: Data Log - * (5 automations below)
#
# Append-only training data for offline analysis of the inside/outside door
# classifier. Each writes one JSON line to /config/guardian_data_log.jsonl via
# the "File" notify integration (notify.guardian_data_log - see DEPLOY.md for
# the one-time setup, this cannot be provisioned by YAML alone). No
# correlation happens here - every event is logged with its own timestamp and
# matched up against other rows later, offline, by time.
#
# Setting up notify.guardian_data_log with its "Timestamp" option ON would
# prepend a plain-text timestamp to every line, which breaks JSONL parsing.
# Leave it OFF; each payload already carries its own 'timestamp' field.
# ---------------------------------------------------------------------------
- id: '1786500100001'
  alias: 'Guardian: Data Log - Door Opened'
  description: "Full esphome.door_opened payload plus write-time context, for
    later comparison against 'Guardian: Door Open Direction'. Not used for any
    live decision."
  triggers:
  - trigger: event
    event_type: esphome.door_opened
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'door_opened', 'timestamp': now().isoformat(),
           'event': trigger.event.data,
           'entry_window_active': entry_window_active,
           'exit_window_active': exit_window_active,
           'super_surveillance_mode': super_surveillance_mode,
           'elevated_mode': elevated_mode,
           'presence': presence,
           'handle_depressed_state': handle_depressed_state,
           'handle_depressed_last_changed': handle_depressed_last_changed}
           | to_json }}
  mode: queued
  max: 10
  variables:
    entry_window_active: "{{ is_state('timer.guardian_entry_window', 'active') }}"
    exit_window_active: "{{ is_state('timer.guardian_exit_window', 'active') }}"
    super_surveillance_mode: "{{ states('input_boolean.super_surveillance_mode') }}"
    # The Elevated Opening Supervisor branches on the effective elevated flag and
    # on believed occupancy, so both have to be in the row or a challenge/alarm
    # decision cannot be replayed offline from the log.
    elevated_mode: "{{ states('binary_sensor.guardian_elevated_mode') }}"
    presence: >-
      {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                   | map('trim') | reject('eq', '') | list %}
      {% set ns = namespace(p=[]) %}
      {% for i in ids %}
        {% set ns.p = ns.p + [i ~ '=' ~ states('input_select.rfid_' ~ i)
           ~ '/' ~ states('input_select.rfid_' ~ i ~ '_policy')] %}
      {% endfor %}
      {{ ns.p }}
    handle_depressed_state: "{{ states('binary_sensor.guardian_interior_portal_handle_depressed')
      }}"
    handle_depressed_last_changed: "{{ states.binary_sensor.guardian_interior_portal_handle_depressed.last_changed.isoformat()
      if states.binary_sensor.guardian_interior_portal_handle_depressed else none
      }}"
- id: '1786500100002'
  alias: 'Guardian: Data Log - Door Closed'
  description: Full esphome.door_closed payload, for later comparison against
    dwell time and close-swing behaviour.
  triggers:
  - trigger: event
    event_type: esphome.door_closed
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'door_closed', 'timestamp': now().isoformat(),
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 10
- id: '1786500100003'
  alias: 'Guardian: Data Log - Door Direction Resolved'
  description: "The HA-derived door-direction verdict - guardian.door_opened_from_inside,
    guardian.door_opened_from_outside or guardian.door_direction_unknown, from
    'Guardian: Door Open Direction'. This is the label to compare device
    verdicts against, since a scanned card is authoritative."
  triggers:
  - trigger: event
    event_type: guardian.door_opened_from_inside
  - trigger: event
    event_type: guardian.door_opened_from_outside
  - trigger: event
    event_type: guardian.door_direction_unknown
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'door_direction_resolved', 'timestamp': now().isoformat(),
           'source_event_type': trigger.event.event_type,
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 10
- id: '1786500100004'
  alias: 'Guardian: Data Log - RFID Scanned'
  description: Scan metadata only - no UID, no card_id, no MAC. Those are
    credentials (F-20 / F-57).
  triggers:
  - trigger: event
    event_type: esphome.rfid_scanned
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'rfid_scanned', 'timestamp': now().isoformat(),
           'source': trigger.event.data.source | default(''),
           'result': trigger.event.data.result | default(''),
           'counter': trigger.event.data.counter | default(''),
           'rotated': trigger.event.data.rotated | default(''),
           'uid_bytes': trigger.event.data.uid_bytes | default('')} | to_json }}
  mode: queued
  max: 10
- id: '1786500100007'
  alias: 'Guardian: Data Log - Card Rejected'
  description: >-
    Every card the system did not recognise. Does not log UID or hash.
  triggers:
  - trigger: event
    event_type: guardian.unknown_card_scanned
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'card_rejected', 'timestamp': now().isoformat(),
           'source': trigger.event.data.source | default(''),
           'result': trigger.event.data.result | default('')} | to_json }}
  mode: queued
  max: 10
- id: '1786500100012'
  alias: 'Guardian: Data Log - Clone Card'
  description: Stale-counter presentation of a known card. Name and slot, no secrets.
  triggers:
  - trigger: event
    event_type: guardian.clone_card_scanned
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'clone_card', 'timestamp': now().isoformat(),
           'slot': trigger.event.data.slot | default(''),
           'name': trigger.event.data.name | default(''),
           'source': trigger.event.data.source | default(''),
           'counter': trigger.event.data.counter | default('')} | to_json }}
  mode: queued
  max: 10
- id: '1786500100008'
  alias: 'Guardian: Data Log - Entry Challenge'
  description: >-
    Both ends of every elevated-mode grace challenge: the opening that started
    it, with the direction verdict and the occupancy the decision was based on,
    and how it ended - card, PIN, or nothing.

    This is the evidence for whether the grace window is the right length and
    whether the inside/outside split is behaving. A challenge that is routinely
    answered in the last two seconds means the window is too short; one that
    routinely times out on an 'inside' verdict means the occupancy rule is
    reading the wrong thing.
  triggers:
  - trigger: event
    event_type: guardian.entry_challenge_started
  - trigger: event
    event_type: guardian.entry_challenge_cleared
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'entry_challenge', 'timestamp': now().isoformat(),
           'source_event_type': trigger.event.event_type,
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 10
- id: '1786500100009'
  alias: 'Guardian: Data Log - PIN Change'
  description: >-
    Outcome of a keypad PIN-change session: success, a mild (non-elevated)
    failed or abandoned attempt, or an elevated-mode escalation to major
    alarm. Timestamp and outcome only - never the PIN or its hash.
  triggers:
  - trigger: event
    event_type: guardian.pin_change
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'pin_change', 'timestamp': now().isoformat(),
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 10
- id: '1786500100006'
  alias: 'Guardian: Data Log - Presence Corrected'
  description: Every time a scan proved a card's recorded location wrong and
    Guardian self-corrected. Useful for measuring how often scans are actually
    missed, and by whom, which is the real input to any future tuning of the
    passage windows.
  triggers:
  - trigger: event
    event_type: guardian.presence_corrected
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'presence_corrected', 'timestamp': now().isoformat(),
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 10
- id: '1786500100005'
  alias: 'Guardian: Data Log - Frigate Person Detected'
  description: Frigate person-detection events on the door camera, both the
    'new' and 'end' transitions, so a door event can later be checked against
    whether anyone was visible on camera around it. 'update' events are
    skipped - they fire on every tracked-object tick and would dwarf
    everything else in the log.
  triggers:
  - trigger: mqtt
    topic: frigate/events
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.type in ['new', 'end'] and\n   trigger.payload_json.after.label
      == 'person' and\n   trigger.payload_json.after.camera == states('input_text.guardian_frigate_camera_name')
      }}"
  actions:
  # Same MQTT payload the log already writes. Firing a HA event lets the
  # Guardian panel show live person-detection rows to non-admin household
  # members without reading the JSONL log (audit F-57 / F-58). Camera, type
  # and label only — no snapshot, no hash.
  - event: guardian.person_detected
    event_data:
      camera: '{{ trigger.payload_json.after.camera }}'
      type: '{{ trigger.payload_json.type }}'
      label: '{{ trigger.payload_json.after.label }}'
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'person_detected', 'timestamp': now().isoformat(),
           'frigate_event_type': trigger.payload_json.type,
           'event': trigger.payload_json} | to_json }}
  mode: queued
  max: 10
# id was '1786500000020', which "Guardian: PIN Change Mode Changed" already uses.
# An automation's id is its unique_id: Home Assistant registers the first one it
# sees and REJECTS the duplicate, so a copy-pasted id makes this quietly not
# exist. Keep these ids unique.
- id: '1786500000033'
  alias: 'Guardian: Refresh RFID Notify Target Options'
  description: >-
    Copies currently-registered mobile_app notify object ids onto every
    rfid_N_notify_target select, always prepending none, then re-applies
    rfid_N_notify_saved if that object id is in the refreshed list. If a
    stored target disappears from the refreshed list, Home Assistant
    resets that select to none — the desired fail-safe.

    Start is delayed so the discovery sensor has time to enumerate; a periodic
    tick covers the case where the sensor restores the same CSV and emits no
    state_changed. YAML options are only none, so without this (and the
    persist automation) a restart would drop every linked phone.
  triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: sensor.guardian_notify_targets_available
    id: sensor
  - trigger: event
    event_type: event_template_reloaded
    id: reload
  - trigger: time_pattern
    minutes: "/10"
    id: tick
  actions:
  - if:
    - condition: trigger
      id: start
    then:
    - delay: 00:00:08
  - action: script.guardian_refresh_notify_target_options
  mode: queued
  max: 5
- id: '1786500000035'
  alias: 'Guardian: Persist RFID Notify Targets'
  description: >-
    Mirrors each rfid_N_notify_target selection into rfid_N_notify_saved.
    The select's YAML options are only none, so Home Assistant cannot
    restore a phone that is not in that list. The input_text has no
    initial:, so it restores. script.guardian_refresh_notify_target_options
    re-applies the saved value after rebuilding options.

    A transition TO none is deliberately not mirrored. Home Assistant resets a
    select to none by itself whenever the selected option leaves the options
    list - a phone that has not checked in yet, a discovery gap on boot - and
    mirroring that wiped the only copy the restore could work from, making the
    link unrecoverable. Only the panel's Not linked path clears the mirror, and
    it writes both helpers itself.
  triggers:
  - trigger: state
    entity_id:
    - input_select.rfid_1_notify_target
    - input_select.rfid_2_notify_target
    - input_select.rfid_3_notify_target
    - input_select.rfid_4_notify_target
    - input_select.rfid_5_notify_target
    - input_select.rfid_6_notify_target
    - input_select.rfid_7_notify_target
    - input_select.rfid_8_notify_target
    - input_select.rfid_9_notify_target
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    - none
    - ''
  actions:
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.{{ trigger.to_state.object_id | replace('_notify_target', '_notify_saved') }}
    data:
      value: '{{ trigger.to_state.state }}'
  mode: queued
  max: 20
- id: '1786500000036'
  alias: 'Guardian: Refresh Lamp Options'
  description: >-
    Copies discovered light object ids onto input_select.guardian_lamp_target,
    always prepending none, then re-applies guardian_lamp_saved if that light
    is still discovered. YAML options are only none, so without this a restart
    would drop the selected bulb. Nothing saved means the target stays none
    until a bulb is picked; there is no built-in preferred light.
  triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: sensor.guardian_lights_available
    id: sensor
  - trigger: event
    event_type: event_template_reloaded
    id: reload
  - trigger: time_pattern
    minutes: "/10"
    id: tick
  actions:
  - if:
    - condition: trigger
      id: start
    then:
    - delay: 00:00:08
  - action: script.guardian_refresh_lamp_options
  mode: queued
  max: 5
- id: '1786500000037'
  alias: 'Guardian: Persist Lamp Target'
  description: >-
    Mirrors input_select.guardian_lamp_target into input_text.guardian_lamp_saved.
    The select's YAML options are only none, so Home Assistant cannot restore a
    light that is not in that list. The input_text has no initial:, so it restores.
  triggers:
  - trigger: state
    entity_id: input_select.guardian_lamp_target
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  actions:
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_lamp_saved
    data:
      value: '{{ trigger.to_state.state }}'
  mode: queued
  max: 5
- id: '1787145600002'
  alias: 'Guardian: Door Left Open'
  description: >-
    Nothing anywhere watched how long the door stays OPEN. esphome.door_closed
    carries dwell_ms, but it is only formatted into
    input_text.guardian_last_door_summary after the fact, and there was no
    duration trigger in any automation in this file. So an opening that was
    answered, or one that alarmed and was dismissed, could leave the front door
    wide open all night in elevated mode with no further signal of any kind.

    Two minutes to push and five to alarm. A door genuinely propped open on a
    summer evening with the mode on WILL trip this - those two "for" values are
    the thing to raise if that becomes a nuisance.
  # The reed. The portal firmware documents this the other way round from the
  # usual convention: the magnet halves meet when the door is CLOSED, so the
  # contact is on = OPEN. Everything downstream reads it that way.
  triggers:
  - trigger: state
    entity_id: binary_sensor.guardian_interior_portal_door_contact
    to: 'on'
    for: 00:02:00
    id: open_warn
  - trigger: state
    entity_id: binary_sensor.guardian_interior_portal_door_contact
    to: 'on'
    for: 00:05:00
    id: open_alarm
  conditions:
  - condition: state
    entity_id: binary_sensor.guardian_elevated_mode
    state: 'on'
  # A live challenge already owns this opening and is counting down to its own
  # alarm, with the portal, the lamp and the chirp all saying so. Pushing a
  # second, differently-worded warning about the same door in the middle of that
  # would be noise, and raising the alarm early would cut the grace window short
  # from the side. This is for the door that is open with nothing watching it.
  - condition: state
    entity_id: input_boolean.guardian_entry_challenge
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: open_warn
      sequence:
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: access
          severity: urgent
          title: '🚪 Guardian: door still open'
          message: >-
            The front door has been open for two minutes and elevated mode is
            on. It becomes a full alarm if it is still open in another three.
          payload:
            priority: high
            ttl: 0
    - conditions:
      - condition: trigger
        id: open_alarm
      sequence:
      - event: guardian.major_alarm
        event_data:
          reason: Front door left open for five minutes in elevated mode
  # single is safe and no latch helper is needed, which is worth stating because
  # every other repeating alert in this file has one. A "for" state trigger fires
  # once per continuous period in the state, so neither of these can repeat
  # without the door actually closing and reopening; the two thresholds are
  # distinct trigger ids three minutes apart on the same period, and each run
  # here completes instantly, so the first can never still be holding the slot
  # when the second arrives.
  mode: single

# ---------------------------------------------------------------------------
# First boot. The one thing a fresh install could not do for itself.
#
# Guardian's helpers all live in packages/ now, so nothing has to be created by
# hand - but several of them deliberately carry no YAML `initial:`, because
# `initial:` is applied on every Home Assistant start and SKIPS restore_state,
# which is how enrolled card hashes were once wiped on every restart. The cost
# of that correct decision is that a helper with no `initial:` and nothing to
# restore - a genuinely first boot - falls back to its `min`, so a brand-new
# install comes up with a dark threshold of 0 and a 10-second entry challenge
# and says nothing about it.
#
# This runs the wizard once to apply the values DEPLOY.md has recommended since
# the thirty-fourth pass, and to leave one persistent notification naming
# everything a fresh Home Assistant still needs that YAML cannot provide.
# ---------------------------------------------------------------------------
- id: '1786500000038'
  alias: 'Guardian: First Boot Setup'
  description: >-
    Runs script.guardian_setup_wizard on the first start after Guardian is
    installed, then never again: the wizard sets
    input_boolean.guardian_setup_complete, and this automation is conditioned on
    it being off. Clear that helper to deliberately re-run the defaults.
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.guardian_setup_complete
    state: 'off'
  actions:
  # Home Assistant start is not the same moment as "everything has loaded".
  # sensor.guardian_notify_targets_available is state-driven and correct
  # immediately, but the notify entities it counts are registered by the
  # mobile_app and File integrations as they finish setting up, and the ESPHome
  # devices connect later still. Running at t=0 would report "no phones" and
  # "the portal is missing" on a perfectly healthy install - a wrong answer is
  # worse here than a late one, because this notice is the household's first
  # impression of whether the system works.
  - delay: '00:02:00'
  # script.turn_on, not a blocking `- action: script.guardian_setup_wizard`.
  # The wizard is mode: single and blocks on guardian_selfcheck; there is
  # nothing here that needs its response, and a blocking call from an
  # automation is how this repo has previously filled an execution queue and
  # silently dropped every later trigger.
  - action: script.turn_on
    target:
      entity_id: script.guardian_setup_wizard
  # single: two Home Assistant starts inside two minutes would otherwise queue
  # a second run, and the wizard's own guard is checked when it runs, not when
  # it is scheduled.
  mode: single
- id: '1787232000001'
  # VERSION MARKER for automations.yaml. Never triggers, does nothing.
  #
  # Guardian ships as loose files that nothing forces to arrive together, and
  # the half-copied install is the failure this repo actually has. Five files
  # carried a version literal so a mismatch could be caught before it became a
  # symptom somewhere else. This file did not - and this file holds the Major
  # Alarm Handler, every watchdog and every detection path.
  #
  # What stood in for a version here was a presence probe: guardian_selfcheck
  # asked whether ONE automation entity existed, and sensor.guardian_version's
  # "automations" attribute asked the same question of the same entity. A
  # 2.22.0 automations.yaml beside a 2.24.0 everything-else answered "present"
  # to both, so preflight passed clean and More -> Diagnostics said "Guardian
  # is healthy" while the alarm logic was from a different release. Presence is
  # not agreement.
  #
  # Same idiom as script.guardian_version_marker: the version is the last
  # space-separated token of the alias, and sensor.guardian_version reads it
  # from friendly_name. Bump it with the other five - packages/guardian.yaml,
  # packages/guardian_rfid.yaml, the marker script's alias, GUARDIAN_UI_VERSION
  # in guardian-panel.js and the two ?v= in configuration.yaml.
  #
  # The trigger is an event type nothing emits. An automation needs a trigger to
  # load at all, and this is the cheapest one that can never fire: no state
  # subscription, no time pattern, no listener on a busy bus.
  alias: Guardian - Automations Version 2.32.5
  description: >-
    Version marker for automations.yaml, read by sensor.guardian_version and
    script.guardian_selfcheck and shown on More -> Diagnostics. Never triggers
    and does nothing. Bump the version in this alias whenever the other halves
    are bumped.
  triggers:
  - trigger: event
    event_type: guardian_version_marker_never_fires
  actions:
  - stop: Version marker
  mode: single
- id: '1787232000002'
  alias: 'Guardian: Frigate Heartbeat'
  description: >-
    Stamps input_datetime.guardian_frigate_last_seen every time Frigate speaks.

    Frigate publishes frigate/stats roughly once a minute whether or not
    anything moved, so this is liveness rather than activity. frigate/events is
    included because a busy camera is also proof of life, and because a Frigate
    build that does not publish stats still publishes events.

    Home Assistant start also stamps it, and that is not fabricating evidence -
    it is the honest state. At restart Guardian has no information either way
    about a channel it has not heard from yet, and the two alternatives are both
    wrong: an unstamped helper reads as 1970 and would fire "camera detection
    offline" seconds after every fresh install, before MQTT had connected, and a
    stamp restored from before a long outage would fire it after every planned
    restart. Both are the watchdog crying wolf, which is what teaches a
    household to ignore it - the exact failure the Frigate watchdog's own gate
    on the camera name exists to avoid.

    Stamping at start gives the channel one staleness window to prove itself
    instead. If Frigate really is dead, the stamp goes stale fifteen minutes
    later and the alert fires as it should; the only cost is that a genuine
    outage spanning a restart is reported up to fifteen minutes late.
  triggers:
  - trigger: mqtt
    topic: frigate/stats
  - trigger: mqtt
    topic: frigate/events
  - trigger: homeassistant
    event: start
  actions:
  - action: input_datetime.set_datetime
    continue_on_error: true
    target:
      entity_id: input_datetime.guardian_frigate_last_seen
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  # A message a second during a busy event is normal and none of them needs to
  # queue behind another - the only thing being written is "most recently".
  mode: single
  max_exceeded: silent
- id: '1787232000003'
  alias: 'Guardian: Frigate Detection Watchdog'
  description: >-
    Alerts when Frigate person detection stops answering, and again when it
    comes back. This is the third detection channel and it was the only one with
    no health monitoring: if the MQTT broker died, the Frigate add-on stopped,
    or the camera key stopped matching, "person detected while all cards are
    away" silently never fired again and nothing said so.

    Watching the heartbeat rather than an availability topic is deliberate. The
    frigate/available LWT only arrives if the BROKER is alive to publish it, so
    it cannot report the case where the broker itself is the thing that died.
    A stale heartbeat covers both, and covers a network partition between Home
    Assistant and the broker as well.
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  # Only for households that actually run Frigate. The camera key is the same
  # predicate script.guardian_setup_wizard uses to decide whether to report the
  # MQTT chain at all, so a house with no Frigate is never told its Frigate is
  # down - which is the failure mode that trains people to ignore alerts.
  - condition: template
    value_template: >-
      {{ states('input_text.guardian_frigate_camera_name') | string | trim
         not in ['', 'none', 'unknown', 'unavailable'] }}
  actions:
  - variables:
      # Never-seen reads as stale, but only once the helper has had a chance to
      # be stamped. A restart clears nothing here - input_datetime restores - so
      # the only way to reach the epoch default is a genuinely fresh install,
      # where "Frigate has never spoken" is exactly what wants reporting.
      last: "{{ states('input_datetime.guardian_frigate_last_seen') }}"
      # Anything unreadable counts as NOT stale. That is the opposite of the
      # usual fail-closed instinct and it is deliberate: the only ways to get
      # here are a helper that has not merged yet or a heartbeat that has never
      # run, and both mean "Guardian cannot tell", not "Frigate is down".
      # Reporting a channel dead on no evidence is how a watchdog gets muted.
      # A genuinely dead channel still trips this within one window of the next
      # Home Assistant start, because start stamps the helper.
      stale: >-
        {% set raw = states('input_datetime.guardian_frigate_last_seen') %}
        {% if raw in ['unknown', 'unavailable', 'none', ''] %}
          {{ false }}
        {% else %}
          {{ (as_timestamp(now()) - as_timestamp(raw, 0)) > 900 }}
        {% endif %}
      notified: "{{ is_state('input_boolean.guardian_frigate_offline_notified', 'on') }}"
  - choose:
    # Gone quiet, and we have not said so yet. Fifteen minutes is three missed
    # stats intervals plus room for a slow restart of the add-on; shorter than
    # that and a Frigate upgrade cries wolf every time.
    - conditions:
      - condition: template
        value_template: '{{ stale | bool and not (notified | bool) }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_frigate_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: important
          title: '⚠️ Guardian: camera detection offline'
          message: >-
            Frigate has not reported for 15 minutes. Person detection while the
            house is empty is NOT running. Check the Frigate add-on and the MQTT
            broker.
          payload:
            priority: high
            ttl: 0
    # Talking again, and we did say so. Same "only if an outage was actually
    # reported" rule as the portal and doorbell watchdogs, so an add-on upgrade
    # that finishes inside the window stays silent.
    - conditions:
      - condition: template
        value_template: '{{ not (stale | bool) and notified | bool }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_frigate_offline_notified
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: routine
          title: 'Guardian: camera detection back'
          message: Frigate is reporting again. Person detection has resumed.
  mode: single
- id: '1787232000004'
  alias: 'Guardian: Data Log - Major Alarm'
  description: >-
    The alarm firing, with its reason. The data log carried eleven kinds of
    event - every door opening, every card, every PIN change, every presence
    correction - and not the one the whole system exists to produce. "The alarm
    went off at some point last night" was answerable only from Home Assistant's
    own logbook, which rolls off on the recorder's purge schedule and is not the
    append-only record the rest of these lines are.

    A separate automation on the same event rather than a step inside the Major
    Alarm Handler, and deliberately so: a log write must never be able to stand
    in front of the siren. Here it cannot, because it is not in that sequence at
    all.
  triggers:
  - trigger: event
    event_type: guardian.major_alarm
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'major_alarm', 'timestamp': now().isoformat(),
           'reason': trigger.event.data.reason | default('Unknown', true),
           'elevated': states('binary_sensor.guardian_elevated_mode'),
           'event': trigger.event.data} | to_json }}
  # queued, not restart: two alarms in quick succession are two lines. A
  # restart mode would drop the first, which is the one that says what started
  # it.
  mode: queued
  max: 10
- id: '1789200000002'
  alias: 'Guardian: Data Log - Portal Tamper'
  description: >-
    The portal's own tamper event, with its reason. A separate automation on
    esphome.tamper_alert rather than a step inside Portal Tamper Alert, for
    the same reason the major-alarm log is not inside the Major Alarm
    Handler: a log write must never be able to stand in front of the siren.
  triggers:
  - trigger: event
    event_type: esphome.tamper_alert
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      message: >-
        {{ {'log_type': 'tamper', 'timestamp': now().isoformat(),
           'reason': trigger.event.data.reason | default('unknown', true),
           'elevated': states('binary_sensor.guardian_elevated_mode'),
           'event': trigger.event.data} | to_json }}
  mode: queued
  max: 10
- id: '1787232000005'
  alias: 'Guardian: Data Log - Alarm Dismissed'
  description: >-
    The alarm being silenced from a phone. The counterpart to the line above,
    and the more important of the two to have: "Guardian: Dismiss Alarm from
    Phone" ends a live alarm on a bare notification action, with no PIN and no
    record of which device sent it, and the Disable Alarm button reaches every
    linked phone on a lock screen.

    That is a defensible choice for a household - an alarm nobody can stop from
    the phone in their hand is an alarm people disable permanently instead. It
    is not defensible for it to leave no trace. This does not add a factor; it
    records what happened, so an alarm that was raised and silenced inside a
    minute is visible afterwards rather than being indistinguishable from an
    alarm that never fired.

    Whether to require a factor before dismissal is a design decision, not a
    bug, and is left alone here.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: MUTE_GUARDIAN_ALARM
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.guardian_data_log
    continue_on_error: true
    data:
      # device_id is what the Companion app puts on the action event. It names
      # the phone that pressed the button, which is the question this line is
      # asked to answer, and it is not a credential.
      #
      # The alarm reason is safe to read here: "Guardian: Dismiss Alarm from
      # Phone" clears the display, the timers and the challenge flags, but it
      # deliberately does not clear guardian_alarm_reason, so this still names
      # the alarm being silenced.
      #
      # portal_display_state is NOT recorded, though it is the obvious thing to
      # want. Both automations trigger on this same event and run concurrently,
      # so a read here races the dismiss automation's own write of IDLE and
      # would land on either value with no ordering guarantee. A field that is
      # right most of the time is worse in an audit log than no field.
      message: >-
        {{ {'log_type': 'alarm_dismissed', 'timestamp': now().isoformat(),
           'source': 'mobile_app_notification_action',
           'device_id': trigger.event.data.device_id | default('unknown', true),
           'reason_at_dismissal': states('input_text.guardian_alarm_reason')} | to_json }}
  mode: queued
  max: 10
- id: '1787500000001'
  alias: 'Guardian: Offline Siren Report'
  description: >-
    The interior portal sounded its own siren while Home Assistant was
    unreachable, and is now reporting what it did. UNBUILT AND UNHEARD - the
    firmware half of this has never been compiled, flashed or heard, so until
    DEPLOY.md steps 275-281 have been run this automation has never fired.

    This is the falsifiability half of the offline siren. A siren nobody can
    prove sounded is the same evidence as a siren that did not, so the portal
    counts what happened in restore_value globals and hands them over on
    reconnect. Without this the household would have no way to distinguish "it
    worked", "it never fired" and "that firmware was never flashed".

    Urgent and nonmaskable: this says the house was broken into during an
    outage, which is the highest-value thing this system can ever tell somebody
    and is not a preference.
  triggers:
  - trigger: event
    event_type: esphome.offline_siren_report
  conditions:
  # The portal only sends this when it has something to say, but a malformed or
  # zero payload must not produce a push claiming an alarm happened.
  - condition: template
    value_template: >-
      {{ (trigger.event.data.events | default(0, true) | int(0)) > 0 }}
  actions:
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.guardian_data_log
    data:
      message: >-
        {{ {'log_type': 'offline_siren_report', 'timestamp': now().isoformat(),
            'source': trigger.event.data.source | default('unknown', true),
            'events': trigger.event.data.events | default('0', true),
            'seconds': trigger.event.data.seconds | default('0', true),
            'last_stop_reason': trigger.event.data.last_stop_reason
                                | default('0', true)} | to_json }}
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_alarm_reason
    data:
      value: >-
        Offline alarm while Home Assistant was down
  # script.turn_on, not a blocking call. The fortieth and forty-first passes
  # both landed on this: a blocking guardian_notify_broadcast walks every linked
  # phone serially over HTTPS, so with the internet still down each recipient
  # burns its own timeout before failing. Nothing here needs to wait for that.
  - action: script.turn_on
    target:
      entity_id: script.guardian_notify_broadcast
    data:
      variables:
        category: security
        severity: urgent
        nonmaskable: true
        title: '🚨 Guardian: alarm sounded while offline'
        message: >-
          The door was opened while Home Assistant was unreachable and the
          portal sounded the siren on its own
          ({{ trigger.event.data.events | default('?', true) }} time(s),
          {{ trigger.event.data.seconds | default('?', true) }}s total,
          ended by {{ {'0': 'unknown', '1': 'a valid key', '2': 'the local
          silence button', '3': 'the duration cap', '4': 'Home Assistant
          reconnecting'}.get(trigger.event.data.last_stop_reason
          | default('0', true) | string, 'unknown') }}).
          Check the door and the Activity log.
  mode: queued
  max: 5
