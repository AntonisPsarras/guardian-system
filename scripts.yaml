guardian_set_display:
  alias: Guardian - Set Portal Display
  description: >-
    The single way to put a verdict on the portal. Writes the state string and
    then bumps input_number.portal_display_seq.

    The bump is the whole point. input_text.set_value writing a value the helper
    ALREADY holds emits no state_changed event, and two consumers depended on
    that event: "Guardian: Portal LED Mirror", whose GRANTED branch sleeps three
    seconds and then writes IDLE, and the portal's own repaint/backlight wake,
    which tested "st != ui_prev_state".

    So a second identical verdict arriving inside the first one's three-second
    window was swallowed entirely - the screen never acknowledged it, and the
    FIRST run's delay still dropped the screen to IDLE underneath it. Scanning a
    card immediately after enrolling it is exactly that sequence (enrollment
    writes GRANTED, the scan writes GRANTED again), which is why a freshly
    enrolled card appeared to be ignored while its welcome tone and green lamp
    still fired. Unknown cards write a DIFFERENT value, DENIED_CARD, so they
    always changed state and always rendered - the asymmetry that made this look
    like a card-matching bug.

    A counter that always changes makes every verdict observable, repeat or not.
  # queued: this is a read-modify-write on the counter and several automations
  # can call it at once. Queued runs execute sequentially, and action data
  # templates render per-run at execution time, so the increment cannot lose a
  # write the way an automation-level variable would.
  #
  # max is 25 rather than 10 because ONE caller must never be dropped. A
  # blocking "action: script.guardian_set_display" against a queued script that
  # is already at max is DISCARDED with a log warning - it does not raise, and
  # the caller carries on as if it had run. In "Guardian: Major Alarm Handler"
  # that call is the one deliberately unguarded step, on the reasoning that a
  # failure there means the siren cannot run anyway; the siren loop's
  # while-condition reads the state this script writes. So a dropped run there
  # is an alarm that pushes, returns cleanly, and produces NO siren, NO ALARM
  # screen and no error anywhere - the queue depth is the only thing standing
  # between that and a burst of display writes from a keypad, an enrollment and
  # a scan arriving together. Runs are two helper writes and finish in
  # milliseconds; the depth costs nothing and is not a substitute for keeping
  # this script cheap.
  mode: queued
  max: 25
  fields:
    value:
      description: Display state string, e.g. GRANTED, DENIED_CARD, CHALLENGE, IDLE
      required: true
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.portal_display_state
    data:
      value: '{{ value }}'
  # THE ALARM'S ONLY MEMORY ACROSS A RESTART, and it is written here rather than
  # at any of the fifty-odd call sites deliberately.
  #
  # portal_display_state is declared initial: none, which Home Assistant applies
  # on every start and which skips restore_state - so the display cannot carry an
  # alarm across a restart, and "Guardian: Startup State Recovery" spent its whole
  # life testing it for ALARM in a branch that could never be true. A restart
  # ended a live alarm in total silence: no siren, no second push, and the code
  # written to resume it was unreachable.
  #
  # This script's own alias is "the single way to put a verdict on the portal",
  # and that is exactly the property the latch needs. Setting it here means the
  # latch and the screen move together or not at all - every existing writer,
  # including "Guardian: Dismiss Alarm from Phone" and guardian_reset, clears the
  # latch correctly with no edit, and a future one cannot forget to. Writing it
  # from the call sites instead would be fifty chances to disagree with the
  # screen about whether the house is alarming.
  #
  # GUARDED, AND IT MATTERS WHICH SIDE OF THE DISPLAY WRITE IT SITS ON.
  #
  # The write above is the one deliberately unguarded step in the alarm path,
  # because the siren loop's while-condition reads what it writes: if that fails
  # the siren genuinely cannot run and the error belongs in the log. THIS step
  # does not have that property. Failing to record the latch means an alarm will
  # not survive a restart, which is strictly less bad than an alarm that never
  # sounds - so it must not be able to take the sounding one with it.
  #
  # And it would have been able to. guardian_set_display is called BLOCKING from
  # "Guardian: Major Alarm Handler", so a step that ends this script ends the
  # handler too - in front of its own siren loop. That is the exact fault the
  # fortieth and forty-second passes each fixed once: a cosmetic step standing in
  # front of the siren, with a comment above it explaining why it was safe. On a
  # half-installed tree - packages/guardian.yaml not copied, or copied and only
  # reloaded rather than fully restarted - this helper does not exist, and that
  # is precisely the case the alarm path has already been found failing in.
  #
  # The entity_id is a literal constant, so it cannot fail the service schema and
  # the one failure mode left is a missing or unavailable entity, which is what
  # continue_on_error genuinely does catch.
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_alarm_latch
    data:
      # A timestamp, not a flag: the startup reader needs to know HOW LONG AGO,
      # because a restore snapshot can be fifteen minutes stale and an alarm that
      # started eight hours ago is a power cut, not an intrusion.
      value: "{{ now().isoformat() if value == 'ALARM' else 'none' }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.portal_display_seq
    data:
      value: "{{ (states('input_number.portal_display_seq') | int(0) + 1) % 10000 }}"

process_rfid_scan:
  alias: Guardian - Process RFID Scan
  description: >-
    Validates one scan and starts an entry, exit, or MFA passage window.

    NOTHING in here may block. Every lamp call is fired with script.turn_on
    rather than "action: script.guardian_lamp_*", because "action:" WAITS for the
    called script to finish and guardian_lamp_feedback takes 2-3 seconds on a
    good day: a 15s wait_template on the sampling flag, a light.turn_on against a
    cloud-connected Tapo bulb, a 1s hold, then a restore.

    That is how this script silently stopped seeing cards. It is queued with
    max: 10, so ten runs each parked on the lamp fill the queue and Home
    Assistant DROPS every further scan with only a warning in the log - no
    screen change, no audio, nothing on the ESP. It went unnoticed while
    enrollment disabled itself after a single card; now that a session stays
    open and cards are presented one after another, the queue fills in seconds
    and the reader appears to go dead.

    The remaining "action: script.*" calls are guardian_set_display,
    guardian_reconcile_presence, guardian_authorize_passage and
    guardian_clear_entry_challenge. All of them are helper writes and events;
    none wait on the lamp or a delay. They stay as "action:" because the
    branch after them depends on their result. Do not convert them to
    script.turn_on, and do not put a delay or a lamp wait back in this script.
  mode: queued
  max: 10
  fields:
    uid:
      description: Legacy factory UID from pre-authenticator firmware. Ignored when result is set.
      required: false
    source:
      description: doorbell or interior_portal
      required: true
    result:
      description: ok, enrolled, write_fail, bad_mac, or unsupported_tag
      required: false
    card_id:
      description: 16-character hex card_id from the on-card authenticator
      required: false
    counter:
      description: Counter reported by the reader (post-rotate when rotated is true)
      required: false
    rotated:
      description: true if the reader wrote the next counter to the card
      required: false
    protected:
      description: >-
        "true" or "false" from the reader: whether this tag's payload is
        password-protected on the card. EMPTY MEANS UNKNOWN, not false - a
        reader running firmware older than the forty-third pass does not send
        this field at all, and every device in this house is currently running
        such a build. Recorded only; it gates nothing.
      required: false
  sequence:
  - variables:
      scan_result: '{{ result | default('''', true) | string | trim | lower }}'
      card_id_norm: '{{ card_id | default('''', true) | string | trim | lower }}'
      counter_n: '{{ counter | default(0, true) | int(0) }}'
      rotated_b: '{{ (rotated | default(false, true) | string | lower) in [''true'', ''on'', ''1''] }}'
      uid_raw: '{{ uid | default('''', true) | string | trim }}'
      uid_hash: '{{ uid | default('''', true) | string | trim | sha256 if (uid | default('''', true) | string | trim | length) > 0 else '''' }}'
      slot_ids: "{{ (states('sensor.guardian_rfid_slots') | string).split(',')
                   | map('trim') | reject('eq', '') | list }}"
      # Occupied = 16 hex card_id. A leftover rfid_N_hash is not a credential.
      matched_slot: >-
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% set cid = card_id | default('', true) | string | trim | lower %}
        {% set ns = namespace(slot='') %}
        {% if cid | length == 16 and cid is match('^[0-9a-f]{16}$') %}
          {% for i in ids %}
            {% set stored = states('input_text.rfid_' ~ i ~ '_card_id')
                            | string | trim | lower %}
            {% if stored | length == 16 and stored is match('^[0-9a-f]{16}$')
                 and stored == cid %}
              {% set ns.slot = i | string %}
            {% endif %}
          {% endfor %}
        {% elif (result | default('', true) | string | trim | length) == 0 %}
          {# Pre-flash firmware still sends uid and no result. Match the old
             hash for the one-restart overlap, then it dies: enrollment no
             longer writes hashes, and flashed readers always send result. #}
          {% set uh = uid | default('', true) | string | trim | sha256 %}
          {% for i in ids %}
            {% set stored = states('input_text.rfid_' ~ i ~ '_hash')
                            | string | trim | lower %}
            {% if stored | length == 64 and stored == uh %}
              {% set ns.slot = i | string %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.slot }}
      empty_slot: >-
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(slot='') %}
        {% for i in ids %}
          {% set value = states('input_text.rfid_' ~ i ~ '_card_id')
                         | string | trim | lower %}
          {% if ns.slot == '' and not (value | length == 16
               and value is match('^[0-9a-f]{16}$')) %}
            {% set ns.slot = i | string %}
          {% endif %}
        {% endfor %}
        {{ ns.slot }}
      # Single source of truth - see binary_sensor.guardian_elevated_mode in
      # packages/guardian.yaml. This used to read
      # "super_surveillance_mode == on or now().hour < 5" inline, one of four
      # copies, which meant the clock half could not be switched off and no
      # automation anywhere could react to elevated mode ending. Elevated is
      # now the manual boolean OR the Super Surveillance schedule.
      elevated_mode: "{{ is_state('binary_sensor.guardian_elevated_mode', 'on') }}"
      enroll_mode: "{{ is_state('input_boolean.guardian_enrollment_mode', 'on') }}"
      enroll_as_visitor: "{{ is_state('input_boolean.guardian_enroll_as_visitor', 'on') }}"
      # A grace challenge is open: the door was opened in elevated mode without a
      # completed passage window, and someone has a few seconds to present BOTH
      # a registered card and the master PIN. One factor is not enough.
      challenge_active: "{{ is_state('input_boolean.guardian_entry_challenge', 'on') }}"
      # Which slot an enrollment writes to. The keypad choice wins; otherwise the
      # first free slot; empty when every slot is occupied and nothing was
      # chosen, which is now an explicit "pick a slot" prompt on the portal
      # rather than a silent refusal.
      #
      # sensor.guardian_enrollment_target_slot computes exactly this and is what
      # the portal renders, but it is deliberately NOT read here: a template
      # sensor is recomputed from a state change, and enrolling two cards back to
      # back would race it - the second card could be written into the slot the
      # first one just took. This is derived from the helpers directly so the
      # write is always against current truth.
      target_slot: >-
        {%- set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                      | map('trim') | reject('eq', '') | list -%}
        {%- set chosen = states('input_text.guardian_enrollment_slot')
                         | string | trim -%}
        {{- chosen if chosen in ids else (empty_slot | string | trim) -}}
      # Home Assistant coerces a script variable whose rendered value is only
      # digits into an int. empty_slot / target_slot / matched_slot therefore
      # arrive at the choose as 1, not "1". Jinja's `1 in ['1','2']` is
      # false, so enrollment with empty hashes took ENROLL_PICK ("no
      # target slot") while the trace printed target_slot: '1'. Every
      # comparison below must `| string | trim` before testing membership.
      slot_ok: "{{ (matched_slot | string | trim) in ((states('sensor.guardian_rfid_slots')
        | string).split(',') | map('trim') | reject('eq', '') | list) }}"
      target_ok: "{{ (target_slot | string | trim) in ((states('sensor.guardian_rfid_slots')
        | string).split(',') | map('trim') | reject('eq', '') | list) }}"
      # Freshness window against the last counter Home Assistant stored.
      # seen is the counter that was on the card BEFORE a successful rotate.
      # Accept stored-1 (last write did not stick) and anything newer (HA missed
      # a rotate, or the other reader already wrote). Older than stored-1 is a
      # dump clone. The old stored+1 cap treated a double-scan the reader
      # ingested once as CLONE; that high cap is not clone detection.
      #
      # The `not (rot and reported <= stored)` clause is REPLAY protection, and
      # it is deliberately narrow. esphome.rfid_scanned is an ordinary event on
      # the bus: any account that can authenticate to Home Assistant can POST one
      # to /api/events/esphome.rfid_scanned, and the two values needed to build a
      # convincing payload - input_text.rfid_N_card_id and
      # input_number.rfid_N_counter - are readable from the states API. The
      # firmware's HMAC is not checked here; only this window is.
      #
      # Work out which case actually changes. For a rotated scan the old rule
      # reduces to `stored <= reported` (substitute seen = reported - 1). The new
      # clause requires `stored < reported`. So the ONLY behaviour that changes is
      # rotated scans where reported == stored exactly - a card claiming to have
      # just rotated INTO a value Home Assistant has already recorded. A genuine
      # tap can never do that: the write-back below stores `reported`, so the next
      # genuine tap of the same card reports stored + 1. Replaying a captured
      # event verbatim is precisely the case that produces reported == stored.
      #
      # Non-rotated scans (rot false, the card write failed) are untouched, and
      # so is the stale-dump case, which the lower bound already caught.
      #
      # The cost of a false positive here is not small - this branch produces the
      # CLONE verdict, a critical push, and a major alarm if a challenge is open -
      # so if a real double-tap ever reports CLONE, this clause is the first thing
      # to look at, not the branch ordering further down.
      window_ok: >-
        {% set slot = matched_slot | string | trim %}
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% if slot not in ids %}
          {{ false }}
        {% else %}
          {% set stored = states('input_number.rfid_' ~ slot ~ '_counter') | int(0) %}
          {% set reported = counter | default(0, true) | int(0) %}
          {% set rot = (rotated | default(false, true) | string | lower)
                       in ['true', 'on', '1'] %}
          {% set seen = reported - (1 if rot and reported > 0 else 0) %}
          {{ (stored - 1 <= seen) and not (rot and reported <= stored) }}
        {% endif %}
      tag_unsupported: "{{ scan_result == 'unsupported_tag' }}"
      enroll_hold: "{{ scan_result in ['write_fail', 'bad_mac'] }}"
      # THREE-VALUED ON PURPOSE: 'true', 'false', or '' for not-stated. Anything
      # the reader did not send stays '' and is recorded as nothing at all,
      # because a firmware that predates this field is indistinguishable from one
      # reporting an unprotected tag if the two are collapsed - and the whole
      # point of surfacing this is to tell a household which of their keys are
      # clonable. Reading silence as "unprotected" would accuse every key in the
      # house; reading it as "protected" would clear them all. It reads as
      # neither.
      protected_norm: >-
        {% set p = protected | default('', true) | string | trim | lower %}
        {{ 'true' if p in ['true', 'on', '1', 'yes']
           else ('false' if p in ['false', 'off', '0', 'no'] else '') }}
  # A key flagged Stolen/Lost, presented at EITHER reader, sounds the alarm here
  # and now - before the decision trace, before reconcile, before the counter
  # write, before the choose. Both readers reach this line: the doorbell and the
  # portal both dispatch through "Guardian: RFID Scanned" into this one script,
  # and both are heard on the portal's DFPlayer, which is where every other
  # scan sound already comes from.
  #
  # The assumption is that the person holding a key its owner reported missing
  # is an intruder standing at the door right now, so this must not wait on
  # anything that can be slow or absent. It reads two local helpers and presses
  # one ESPHome button on the LAN: no phone link, no cloud bulb, no broadcast.
  # This press, and ONLY this press, is what has to happen with no latency. It
  # is not routed through guardian.major_alarm because that handler writes the
  # reason, sets the display and fires notify_broadcast before it reaches its
  # play loop. The alarm proper is raised a few lines below, once matched_name
  # exists; that is what sustains the siren, lights the screen and offers the
  # phone its Disable Alarm button. This is just the first note of it, early.
  #
  # Nothing above it may suppress it either. There is no cooldown or
  # "already alarming" test here on purpose: a second stolen tap means someone
  # is still at the door, and a silent second tap is the failure this exists to
  # prevent.
  #
  # continue_on_error, and it is the whole difference between an early note and
  # a silent alarm. The press targets an entity on the PORTAL; the scan can come
  # from the DOORBELL, which does not need the portal to be up. With the portal
  # unavailable - rebooting, roaming between access points, the five minutes
  # "Guardian: Portal Offline Watchdog" exists to announce - button.press raises,
  # and a raising step ends the sequence. Unguarded, this line took the whole
  # script down with it: guardian.major_alarm below never fired, so there was no
  # push, no reason written, no ALARM display and no siren loop to resume when
  # the portal came back, and the rest of process_rfid_scan - trace, reconcile,
  # counter write, the entire choose - never ran either. A stolen key at the
  # door produced silence.
  #
  # This is the same class of fault the Major Alarm Handler was fixed for in
  # 8e89db4, on a worse path: it needs no half-copied install and no startup
  # race, only a portal that is briefly off the network. The guard costs
  # nothing - continue_on_error adds no latency and does not defer the press,
  # it only stops a failed press from suppressing everything after it. If the
  # speaker cannot sound, the alarm proper below still must.
  - if:
    - condition: template
      value_template: "{{ slot_ok | bool and
        states('input_select.rfid_' ~ (matched_slot | string | trim))
          in ['Stolen', 'Stolen/Lost'] }}"
    then:
    - action: button.press
      continue_on_error: true
      target:
        entity_id: button.guardian_interior_portal_play_alarm
  - variables:
      # Person name for user-facing copy. Recomputed here so it can read
      # matched_slot from the previous variables block (same-block keys cannot
      # reference each other).
      matched_name: >-
        {% set i = matched_slot | string | trim %}
        {% set raw = states('input_text.rfid_' ~ i ~ '_name') | string | trim %}
        {{ raw if raw not in ['', 'unknown', 'unavailable']
           else ('Key ' ~ i if i else '') }}
      # Presence BEFORE reconcile. A doorbell scan of an "At home" card is an
      # exit that already left the house; reconcile would flip it to Away and
      # hide that from every later branch. Capture it here, then never read
      # input_select.rfid_N again for this decision.
      presence_before: >-
        {% set i = matched_slot | string | trim %}
        {{ states('input_select.rfid_' ~ i) | string | trim }}
      door_closed: "{{ is_state('binary_sensor.guardian_interior_portal_door_contact', 'off') }}"
      # Exterior reader, door shut, elevated: the keypad is unreachable. Either
      # a live 30s challenge (they just walked out) or presence still At home
      # (they left without scanning inside) is an exit that needs the 10-minute
      # phone PIN, not MFA at a keypad they cannot reach.
      doorbell_exit: "{{ (elevated_mode | bool) and (source == 'doorbell')
        and (door_closed | bool) and (slot_ok | bool)
        and ((challenge_active | bool) or (presence_before == 'At home')) }}"
  # Raise the alarm proper for a Stolen/Lost key, still ahead of the trace,
  # reconcile, the counter write and the choose. The siren already started
  # above; this is what keeps it going and makes it stoppable.
  #
  # Everything the previous version of this had to invent, the major alarm
  # already owns, which is why it is now raised unconditionally here rather
  # than only when a challenge happened to be live:
  #
  #   * the siren repeats on a 3s cadence for as long as the display says
  #     ALARM, instead of a fixed count that ran out while the intruder was
  #     still at the door;
  #   * "Guardian: Dismiss Alarm from Phone" answers MUTE_GUARDIAN_ALARM by
  #     writing IDLE, which is what ends that loop - the phone button the
  #     super surveillance alarm already offers now stops this one too;
  #   * the portal paints its full-screen ALARM with the reason below. The
  #     STOLEN screen could not be used for this: "Guardian: Portal LED Mirror"
  #     drops STOLEN back to IDLE after three seconds, so the screen went blank
  #     while the siren kept sounding.
  #
  # The reason is rendered at 35 characters on a 240px panel, so it leads with
  # the two words that matter and abbreviates the reader rather than letting a
  # long name push them off the end.
  - if:
    - condition: template
      value_template: "{{ slot_ok | bool and
        states('input_select.rfid_' ~ (matched_slot | string | trim))
          in ['Stolen', 'Stolen/Lost'] }}"
    then:
    - event: guardian.major_alarm
      event_data:
        reason: >-
          Stolen key: {{ matched_name if matched_name else 'Key ' ~
          (matched_slot | string | trim) }} at {{ 'door' if source == 'doorbell'
          else 'portal' }}
  # Decision trace. OFF unless input_boolean.guardian_verbose_notifications is on.
  #
  # This lives HERE, inside the script, rather than in an automation watching the
  # event, because it has to report the variables the choose below will actually
  # branch on. Every other vantage point - the device log, the event bus, a
  # template sensor - shows an input to this decision rather than the decision,
  # and the failures being chased have all been cases where the inputs looked
  # right and the outcome was still wrong.
  #
  # It names the branch outright, computed from the same conditions in the same
  # order, so "which branch ran" stops being an inference from an LED colour.
  - if:
    - condition: state
      entity_id: input_boolean.guardian_verbose_notifications
      state: 'on'
    then:
    # continue_on_error: this is a diagnostic, and it sits in front of every
    # alert the scan can raise - the stolen-key alarm, the clone push and the
    # clone alarm all come after it. A trace that can cancel the thing it exists
    # to explain is worse than no trace.
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: "guardian_scan_trace_{{ now().strftime('%H%M%S') }}"
        title: >-
          {{ now().strftime('%H:%M:%S') }} {{ source }} ->
          {%- set m = matched_slot | string | trim -%}
          {%- set valid = slot_ok | bool -%}
          {% if valid and states('input_select.rfid_' ~ m)
                in ['Stolen', 'Stolen/Lost'] %} STOLEN
          {%- elif doorbell_exit | bool %} DOORBELL EXIT PIN
          {%- elif challenge_active | bool and valid %} CHALLENGE CARD
          {%- elif enroll_mode | bool and valid %} ENROLL_DUP
          {%- elif valid and not (window_ok | bool) and scan_result not in ['', 'enrolled'] %} CLONE
          {%- elif enroll_hold | bool %} HOLD
          {%- elif valid and elevated_mode | bool %} MFA
          {%- elif valid %} GRANTED (passage)
          {%- elif enroll_mode | bool and tag_unsupported | bool %} UNSUPPORTED
          {%- elif enroll_mode | bool and enroll_hold | bool %} HOLD
          {%- elif enroll_mode | bool and target_ok | bool %} ENROLL -> slot {{ target_slot | string | trim }}
          {%- elif enroll_mode | bool %} ENROLL_PICK (no target slot)
          {%- elif tag_unsupported | bool %} UNSUPPORTED
          {%- else %} DENIED_CARD{% endif %}
        message: >-
          result: {{ scan_result }}
          · card_id_len: {{ card_id_norm | length }}
          · counter: {{ counter_n }}
          · rotated: {{ rotated_b }}
          · window: {{ window_ok }}

          matched_slot: '{{ matched_slot | string | trim }}'
          · empty_slot: '{{ empty_slot | trim }}'
          · target_slot: '{{ target_slot | string | trim }}'

          enroll_mode: {{ enroll_mode }}
          · guest: {{ enroll_as_visitor }}
          · elevated: {{ elevated_mode }}
          · challenge: {{ challenge_active }}
          · doorbell_exit: {{ doorbell_exit }}
          · presence_before: '{{ presence_before }}'

          enrollment_slot helper: '{{ states('input_text.guardian_enrollment_slot') }}'

          stored: {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                               | map('trim') | reject('eq', '') | list %}{% for i in ids %}{{ i }}={{
            states('input_text.rfid_' ~ i ~ '_card_id') | string | trim | lower | length }}ch/c{{
            states('input_number.rfid_' ~ i ~ '_counter') | int(0) }} {% endfor %}
  # Self-correction, before any branch. The reader a card was presented to tells
  # us which side of the door that card is physically on, so a card recorded as
  # "Away" and scanned on the interior portal - or "At home" and scanned at the
  # doorbell - is provably out of date from an earlier missed scan. Fix it now
  # rather than letting the error persist.
  #
  # Placed ahead of the choose so it covers the normal path AND the elevated
  # MFA path from one call site. Stolen cards are excluded: their branch is a
  # security response, and their input_select state must not be touched.
  - if:
    - condition: template
      value_template: "{{ slot_ok | bool and
        (scan_result == '' or window_ok | bool) and
        states('input_select.rfid_' ~ (matched_slot | string | trim))
          not in ['Stolen', 'Stolen/Lost'] }}"
    then:
    - action: script.guardian_reconcile_presence
      data:
        slot: '{{ matched_slot | string | trim }}'
        source: '{{ source }}'
  # Record the new counter only after the window accepted it, and only when the
  # reader actually wrote. A failed rotate leaves HA where it was so the next
  # tap still matches. A clone (window fail) must not advance this.
  - if:
    - condition: template
      value_template: "{{ slot_ok | bool and rotated_b | bool and
        (scan_result == '' or window_ok | bool) }}"
    then:
    - action: input_number.set_value
      continue_on_error: true
      target:
        entity_id: input_number.rfid_{{ matched_slot | string | trim }}_counter
      data:
        value: "{{ [states('input_number.rfid_' ~ (matched_slot | string | trim) ~ '_counter')
          | int(0), counter_n | int(0)] | max }}"
  # Read back before any grant. continue_on_error above means a missing helper
  # cannot abort the stolen-key path that already ran, but it also used to
  # swallow a persist that never landed - then GRANTED still fired, and the
  # next tap looked like a replay. Fail closed: if this rotate did not stick
  # on the helper, no passage window.
  - variables:
      counter_ok: "{{ (not (slot_ok | bool) or not (rotated_b | bool)) or
        (states('input_number.rfid_' ~ (matched_slot | string | trim) ~ '_counter')
         | int(0) >= (counter_n | int(0))) }}"
  # WHETHER THIS KEY IS PASSWORD-PROTECTED ON THE CARD. Recorded here, shown in
  # the panel's key list, and USED FOR NOTHING ELSE.
  #
  # The reader has published this on every scan since the forty-third pass and
  # nothing has ever read it - the field went onto the event bus and stopped
  # there, while DEPLOY.md recorded it as "surfaced to the household". An
  # unprotected NTAG's payload can be read by any reader, and a readable bearer
  # token is a clonable card, so the household has a reason to know which of
  # their keys are in that state.
  #
  # IT MUST NEVER GATE ACCESS, and that is not caution, it is the two lessons
  # this component has already paid for: refusing an unprotected tag would lock
  # out every card enrolled before the protection fix existed, which is the
  # entire house, and it is the population that most needs to be let in and told.
  # This step writes one CSV helper. It is not read by any condition on any path
  # that opens a door.
  #
  # Only writes on a definite verdict. protected_norm is '' when the reader did
  # not state it, and a slot is then left exactly as it was rather than being
  # cleared - a scan from an old firmware must not erase a finding a new one made.
  - if:
    - condition: template
      value_template: "{{ slot_ok | bool and protected_norm in ['true', 'false'] }}"
    then:
    - action: input_text.set_value
      continue_on_error: true
      target:
        entity_id: input_text.guardian_card_protection
      data:
        # Rebuilt from the current value on every write rather than appended to,
        # so the string cannot accumulate duplicate or stale entries. Entries for
        # slots that no longer exist are dropped, this slot's old entry is
        # replaced by the fresh verdict, and the result is sorted so two
        # identical sets are always the same string - a helper that flickers
        # between equivalent orderings would repaint the panel for no reason.
        value: >-
          {%- set slot = matched_slot | string | trim -%}
          {%- set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                        | map('trim') | reject('eq', '') | list -%}
          {%- set held = (states('input_text.guardian_card_protection') | string)
                         .split(',') | map('trim') | reject('eq', '') | list -%}
          {%- set ns = namespace(out=[]) -%}
          {%- for e in held -%}
            {%- if e is match('^[0-9]+[pu]$') -%}
              {%- set who = e[:-1] -%}
              {%- if who != slot and who in ids -%}
                {%- set ns.out = ns.out + [e] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set ns.out = ns.out
                + [slot ~ ('u' if protected_norm == 'false' else 'p')] -%}
          {{- ns.out | sort | join(',') -}}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ tag_unsupported | bool }}'
      sequence:
      - event: guardian.unknown_card_scanned
        event_data:
          source: '{{ source }}'
          result: unsupported_tag
      - action: script.guardian_set_display
        data:
          value: UNSUPPORTED
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - action: script.turn_on
        target:
          entity_id: script.guardian_lamp_rejected
    - conditions:
      - condition: template
        value_template: '{{ slot_ok | bool and scan_result not in ['''', ''enrolled'']
          and not (window_ok | bool) and states(''input_select.rfid_'' ~
          (matched_slot | string | trim)) not in [''Stolen'', ''Stolen/Lost''] }}'
      sequence:
      - event: guardian.clone_card_scanned
        event_data:
          slot: '{{ matched_slot | string | trim }}'
          name: '{{ matched_name }}'
          source: '{{ source }}'
          counter: '{{ counter_n }}'
      - action: script.guardian_notify_person
        continue_on_error: true
        data:
          slot: '{{ matched_slot | string | trim }}'
          critical: true
          category: security
          severity: urgent
          title: 'Guardian: copied key rejected'
          message: >-
            {{ matched_name if matched_name else 'Key ' ~ (matched_slot | string | trim) }}
            presented a stale counter at the {{ source }} reader. The real key
            still works; this copy does not. Flag Stolen/Lost if the original
            is missing.
      - action: script.guardian_set_display
        data:
          value: CLONE
      # Guarded for the same reason as the stolen-key press above: this targets
      # a PORTAL entity and a clone can be presented at the doorbell, so an
      # offline portal made this raise and end the branch - taking the
      # guardian.major_alarm below with it. guardian_set_display above stays
      # unguarded on the Major Alarm Handler's rule: the display state is what
      # the siren loop repeats on, so a failure there means no siren regardless
      # and the error belongs in the log rather than swallowed.
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - action: script.turn_on
        target:
          entity_id: script.guardian_lamp_rejected
      # Same escalation as the stolen branch below, for the same reason. This
      # branch is evaluated BEFORE the challenge-factor branch and wins, so a
      # forged copy presented to answer a live challenge used to produce CLONE
      # on the display, a critical push and a red flash - and then nothing, until
      # the challenge ran out 30 seconds later and alarmed with the generic "not
      # authenticated" reason. A copy of a card that is still in its owner's
      # pocket is at least as strong an intruder signal as one already reported
      # missing, and the person holding it is standing at the door now. Do not
      # reorder the branches to "fix" this instead - the clone verdict has to win
      # so the display and the counter logic stay correct.
      - if:
        - condition: template
          value_template: '{{ challenge_active | bool }}'
        then:
        - event: guardian.major_alarm
          event_data:
            reason: >-
              Cloned key ({{ (matched_name ~ ', ') if matched_name else '' }}slot
              {{ matched_slot | string | trim }}) presented to answer an
              elevated-mode entry challenge
    - conditions:
      - condition: template
        value_template: '{{ enroll_mode | bool and not (slot_ok | bool)
          and enroll_hold | bool }}'
      sequence:
      - action: script.guardian_set_display
        data:
          value: HOLD
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - action: timer.start
        target:
          entity_id: timer.guardian_enrollment_window
    - conditions:
      - condition: template
        value_template: '{{ slot_ok | bool }}'
      - condition: template
        value_template: '{{ states(''input_select.rfid_'' ~ (matched_slot | string | trim))
          in [''Stolen'', ''Stolen/Lost''] }}'
      sequence:
      - event: guardian.stolen_card_scanned
        event_data:
          slot: '{{ matched_slot | string | trim }}'
          name: '{{ matched_name }}'
          source: '{{ source }}'
      # This branch now announces the scan and nothing else. The major alarm
      # raised at the top of the script owns the screen, the lamp and the
      # speaker for the rest of this event, and each of the three things that
      # used to be done here actively fought it:
      #
      #   * set_display STOLEN raced the handler's own write of ALARM. Landing
      #     second, it took the screen off ALARM - which is the exact condition
      #     the siren loop repeats on - and silenced the alarm about a second
      #     after it started.
      #   * play_denied replaced the alarm track on the DFPlayer, which plays
      #     one file at a time, so a stolen key sounded like an unknown one.
      #   * lamp_rejected flashed red three times and ended on light.turn_off,
      #     then hit its own "Alarm owns the lamp" stop before restoring
      #     anything - leaving the bulb DARK for the rest of an alarm the
      #     handler had just pinned solid red.
      #
      # The escalation that used to be conditional on challenge_active is gone
      # for the same reason: the alarm is now raised for every stolen scan,
      # which is what a key its owner reported missing warrants regardless of
      # whether a challenge happened to be open.
    - conditions:
      - condition: template
        value_template: '{{ slot_ok | bool and rotated_b | bool
          and not (counter_ok | bool) }}'
      sequence:
      # The card write was reported, but input_number.rfid_N_counter did not
      # take the new value. Granting here would play welcome and open a
      # passage window while HA still holds the old counter - or, if a later
      # retry then persisted, the next genuine tap would look like a replay.
      - action: persistent_notification.create
        continue_on_error: true
        data:
          notification_id: guardian_rfid_counter_write_failed
          title: 'Guardian: key counter did not save'
          message: >-
            Slot {{ matched_slot | string | trim }} reported counter
            {{ counter_n | int(0) }} from the {{ source }} reader, but
            input_number.rfid_{{ matched_slot | string | trim }}_counter
            still reads
            {{ states('input_number.rfid_' ~ (matched_slot | string | trim)
               ~ '_counter') | int(0) }}. Passage was not granted.
            Re-present the key after the helper is writable. Hold still and
            retry; do not re-enroll unless the same key has been HOLDed three
            times in a row. Re-enrolling mints a new card_id and hides a
            counter that did not stick.
      - action: script.guardian_set_display
        data:
          value: HOLD
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.guardian_interior_portal_play_denied
    - conditions:
      - condition: template
        value_template: '{{ enroll_hold | bool and slot_ok | bool }}'
      sequence:
      # Matched write_fail / bad_mac used to fall through to authorize_passage
      # and play welcome. Firmware now retries silently while the tag is on
      # the coil and only emits write_fail when it leaves still failing, so
      # this is the terminal outcome: keep the card, do not open a door.
      # Re-enroll is not the first remedy: it mints a new card_id and resets
      # the counter, which masks a torn rotate. Hold and retry; re-enroll only
      # after three HOLDs on this same key.
      - action: persistent_notification.create
        continue_on_error: true
        data:
          notification_id: guardian_rfid_hold_retry
          title: 'Guardian: hold the key and retry'
          message: >-
            Slot {{ matched_slot | string | trim }} at the {{ source }} reader
            reported {{ scan_result }} (counter
            {{ counter_n | int(0) }}, rotated {{ rotated_b }}). Passage was
            not granted. Keep the key on the reader and tap again. Do not
            re-enroll unless this same key has been HOLDed three times in a
            row — re-enrolling hides a torn write instead of healing it.
      - action: script.guardian_set_display
        data:
          value: HOLD
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.guardian_interior_portal_play_denied
    # A registered card is one factor of a grace challenge, never both. The
    # previous either/or (card alone cleared it) is the loophole this branch
    # exists to close. Doorbell-exit (door shut, keypad unreachable) is handled
    # above so it is not forced through a 30s keypad wait the owner cannot
    # answer.
    - conditions:
      - condition: template
        value_template: '{{ doorbell_exit | bool }}'
      - condition: template
        value_template: '{{ slot_ok | bool }}'
      sequence:
      - action: script.guardian_start_doorbell_exit_pin
        data:
          slot: '{{ matched_slot | string | trim }}'
          convert_challenge: '{{ challenge_active | bool }}'
    - conditions:
      - condition: template
        value_template: '{{ challenge_active | bool }}'
      - condition: template
        value_template: '{{ slot_ok | bool }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_challenge_card_ok
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_mfa_slot
        data:
          value: '{{ matched_slot | string | trim }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_mfa_source
        data:
          value: '{{ source }}'
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.guardian_challenge_pin_ok
            state: 'on'
          sequence:
          - action: script.guardian_clear_entry_challenge
            data:
              method: card
              slot: '{{ matched_slot | string | trim }}'
              detail: >-
                {{ matched_name if matched_name
                   else 'Key ' ~ (matched_slot | string | trim) }} at {{ source }}
                (PIN already entered)
          - action: script.guardian_set_display
            data:
              value: GRANTED
          - action: button.press
            target:
              entity_id: button.guardian_interior_portal_play_welcome
          - action: script.turn_on
            target:
              entity_id: script.guardian_lamp_success
        default:
        # Card is in; PIN is not. Do not restart the 30s clock (a second scan
        # must not extend the window) and do not GRANTED. The green flash is
        # how the scan is acknowledged while the amber hold stays up.
        - action: script.guardian_set_display
          data:
            value: MFA
        - action: script.turn_on
          target:
            entity_id: script.guardian_lamp_success
        - action: button.press
          target:
            entity_id: button.guardian_interior_portal_play_mfa_challenge
        - action: script.guardian_notify_person
          continue_on_error: true
          data:
            slot: '{{ matched_slot | string | trim }}'
            critical: false
            # The flagship "my key" event, and the single biggest source of the
            # noise this feature exists to cut: one push every time you come
            # home. routine, so it stops at Important - but the mine toggle,
            # which is on by default, deliberately lets it through the level
            # floor anyway. That is what "tell me when my card is scanned"
            # means, and the switch that says so is the way to turn it off.
            category: mine
            severity: routine
            title: 'Guardian: card accepted'
            message: >-
              {{ matched_name if matched_name else ('Key ' ~
              (matched_slot | string | trim)) }} was scanned. Super
              surveillance is still on — enter the master PIN at the keypad.
    # Enrollment mode with a card that is ALREADY registered. Without this the
    # tap fell through to the normal matched branch and silently opened a 20s
    # passage window, so the obvious way to check "did that card actually save?"
    # gave no answer to the question being asked.
    - conditions:
      - condition: template
        value_template: '{{ enroll_mode | bool }}'
      - condition: template
        value_template: '{{ slot_ok | bool }}'
      sequence:
      # Applying the session policy here is how an existing card becomes a
      # visitor (or a resident again) without rewriting its hash: enable
      # enrollment, press 0 for guest, tap the card. Stolen cards never reach
      # this branch.
      - variables:
          dup_slot: '{{ matched_slot | string | trim }}'
          desired_policy: "{{ 'visitor' if enroll_as_visitor | bool else 'resident' }}"
          current_policy: "{{ states('input_select.rfid_' ~ (matched_slot | string | trim)
            ~ '_policy') | string | trim }}"
          policy_options: "{{ state_attr('input_select.rfid_' ~ (matched_slot | string | trim)
            ~ '_policy', 'options') | default([], true) | list }}"
          presence_options: "{{ state_attr('input_select.rfid_' ~ (matched_slot | string | trim),
            'options') | default([], true) | list }}"
          dup_pending_name: "{{ states('input_text.guardian_enroll_pending_name')
            | string | trim }}"
      - if:
        - condition: template
          value_template: "{{ desired_policy != current_policy and
            desired_policy in policy_options }}"
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ dup_slot }}_policy
          data:
            option: '{{ desired_policy }}'
        - if:
          - condition: template
            value_template: "{{ desired_policy == 'visitor' and 'Away' in presence_options }}"
          then:
          - action: input_select.select_option
            continue_on_error: true
            target:
              entity_id: input_select.rfid_{{ dup_slot }}
            data:
              option: Away
      # A typed pending name during this session renames the existing key on
      # re-tap (same helper as a fresh enroll). Empty pending leaves the
      # stored name alone. Pending is cleared only after the name sticks.
      - if:
        - condition: template
          value_template: "{{ dup_pending_name not in ['', 'unknown', 'unavailable', 'none'] }}"
        then:
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.rfid_{{ dup_slot }}_name
          data:
            value: '{{ dup_pending_name }}'
        - variables:
            dup_name_back: "{{ states('input_text.rfid_' ~ dup_slot ~ '_name')
              | string | trim }}"
        - if:
          - condition: template
            value_template: '{{ dup_name_back == dup_pending_name }}'
          then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: input_text.guardian_enroll_pending_name
            data:
              value: ''
      # The slot rides along in the state string. The portal reads it as a
      # prefix match, so "which slot is this card already in" is answerable at
      # the door without adding another imported helper for one digit.
      - action: script.guardian_set_display
        data:
          value: 'ENROLL_DUP:{{ matched_slot | string | trim }}'
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      # Re-presenting a card is how someone confirms an enrollment worked, so it
      # keeps the session alive rather than letting the idle timer run down
      # underneath them.
      - action: timer.start
        target:
          entity_id: timer.guardian_enrollment_window
    - conditions:
      - condition: template
        value_template: '{{ slot_ok | bool }}'
      - condition: template
        value_template: '{{ elevated_mode | bool }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id:
          - timer.guardian_entry_window
          - timer.guardian_exit_window
      - action: input_text.set_value
        target:
          entity_id:
          - input_text.pending_entry_slot
          - input_text.pending_exit_slot
        data:
          value: none
      - action: timer.cancel
        target:
          entity_id: timer.guardian_mfa_window
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_mfa_slot
        data:
          value: '{{ matched_slot | string | trim }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_mfa_source
        data:
          value: '{{ source }}'
      # A challenge starts with a full three attempts. The portal literally
      # promises this - it renders "3 - mfa_failed_attempts" as "N left" - but
      # the counter was only ever zeroed on a correct PIN, on reaching three,
      # and at Home Assistant start. A challenge that ended by timing out, by
      # being superseded, or by the alarm being dismissed left its count
      # standing, so failures accumulated across unrelated sessions until the
      # very first wrong digit of some later challenge tripped the alarm.
      - action: input_number.set_value
        target:
          entity_id: input_number.mfa_failed_attempts
        data:
          value: 0
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.portal_mfa_pending
      - action: timer.start
        target:
          entity_id: timer.guardian_mfa_window
      - action: script.guardian_set_display
        data:
          value: MFA
      - action: script.turn_on
        target:
          entity_id: script.guardian_lamp_success
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_mfa_challenge
      - action: script.guardian_notify_person
        continue_on_error: true
        data:
          slot: '{{ matched_slot | string | trim }}'
          critical: false
          category: mine
          severity: routine
          title: 'Guardian: card accepted'
          message: >-
            {{ matched_name if matched_name else ('Key ' ~
            (matched_slot | string | trim)) }} was scanned. Enter the master
            PIN at the keypad to pass.
    - conditions:
      - condition: template
        value_template: '{{ slot_ok | bool }}'
      - condition: template
        value_template: '{{ counter_ok | bool }}'
      - condition: template
        value_template: '{{ scan_result in ['''', ''ok''] }}'
      sequence:
      - action: script.guardian_authorize_passage
        data:
          slot: '{{ matched_slot | string | trim }}'
          source: '{{ source }}'
    - conditions:
      - condition: template
        value_template: '{{ enroll_mode | bool }}'
      - condition: template
        value_template: '{{ target_ok | bool }}'
      - condition: template
        value_template: '{{ not (card_id_norm | length == 16 and card_id_norm is match(''^[0-9a-f]{16}$'')) }}'
      sequence:
      - action: script.guardian_set_display
        data:
          value: HOLD
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - action: timer.start
        target:
          entity_id: timer.guardian_enrollment_window
    - conditions:
      - condition: template
        value_template: '{{ enroll_mode | bool }}'
      - condition: template
        value_template: '{{ target_ok | bool }}'
      sequence:
      # Guarded, and not for the usual cosmetic reason: this is the step whose
      # failure the read-back check and the urgent push below EXIST to report.
      # Unguarded, a write that failed outright took both of them down with it
      # and the enrollment failure was reported by nothing at all - the same
      # shape as the fortieth pass's bugs, with the alert reporting on the very
      # step standing in front of it. Let it fail, then let stored_back see that
      # it failed and say so.
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ target_slot | string | trim }}_card_id
        data:
          value: '{{ card_id_norm }}'
      - action: input_number.set_value
        continue_on_error: true
        target:
          entity_id: input_number.rfid_{{ target_slot | string | trim }}_counter
        data:
          value: '{{ [counter_n | int(0), 1] | max }}'
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ target_slot | string | trim }}_hash
        data:
          value: ''
      - action: input_select.select_option
        continue_on_error: true
        target:
          entity_id: input_select.rfid_{{ target_slot | string | trim }}_policy
        data:
          option: "{{ 'visitor' if enroll_as_visitor | bool else 'resident' }}"
      # continue_on_error, matching the _policy write immediately above, which
      # already had it. input_select.select_option RAISES on an option the helper
      # does not carry - guardian_reconcile_presence says so in its own comment
      # and guards against it with an option_exists test - and a leftover UI
      # helper from before the migration is exactly the disagreement that
      # produces one. Unguarded here it ended the branch in front of the urgent
      # "card did not save" push below. A new card starting on the wrong side of
      # the door is a presence correction away from right; an enrollment failure
      # nobody is told about is not.
      - action: input_select.select_option
        continue_on_error: true
        target:
          entity_id: input_select.rfid_{{ target_slot | string | trim }}
        data:
          # Visitors are never occupants, regardless of which reader enrolled
          # them. Residents still take the reader's side: enrolling at the
          # doorbell means the new card is outside, so hardcoding "At home"
          # started every doorbell-enrolled card on the wrong side of the door.
          option: "{{ 'Away' if enroll_as_visitor | bool else
            ('At home' if source == 'interior_portal' else 'Away') }}"
      # Read the hash back before claiming success.
      #
      # input_text.set_value TRUNCATES silently to the helper's max. These
      # helpers are now declared in packages/guardian_rfid.yaml with max: 64,
      # but a leftover UI helper with a smaller max (the old trap) would still
      # clip. A truncated hash is not 64 characters, so it can never match and
      # is not even counted as occupied: the card enrolls, reports GRANTED, and
      # is then rejected forever. That gets its own unambiguous diagnostic.
      - variables:
          stored_back: "{{ states('input_text.rfid_' ~ (target_slot | string | trim) ~ '_card_id')
            | string | trim | lower }}"
      - if:
        - condition: template
          value_template: '{{ stored_back != card_id_norm }}'
        then:
        - action: persistent_notification.create
          continue_on_error: true
          data:
            notification_id: guardian_enrollment_write_failed
            title: 'Guardian: card did not save'
            message: >-
              Slot {{ target_slot | string | trim }} was written but reads back as
              {{ stored_back | length }} characters instead of 16. The helper
              input_text.rfid_{{ target_slot | string | trim }}_card_id almost certainly has its
              "max" set below 16, which truncates the card_id silently. The YAML
              helper in packages/guardian_rfid.yaml is already max: 16; if a
              leftover UI helper is still winning, delete it and restart.
        - action: script.guardian_notify_person
          continue_on_error: true
          data:
            slot: '{{ target_slot | string | trim }}'
            critical: true
            # An install fault, not a door event: the helper would not hold a
            # 16-character card_id. system, so it is not silenced by somebody
            # muting their own key.
            category: system
            severity: urgent
            title: 'Guardian: card did not save'
            message: >-
              Slot {{ target_slot | string | trim }} did not store a 16-character
              card_id. Check the max length of
              input_text.rfid_{{ target_slot | string | trim }}_card_id.
        - action: script.guardian_set_display
          data:
            value: DENIED_CARD
        - action: button.press
          target:
            entity_id: button.guardian_interior_portal_play_denied
        - action: script.turn_on
          target:
            entity_id: script.guardian_lamp_rejected
        - stop: Enrollment write did not survive; not reporting success.
      # Person name is optional. A non-empty pending name from the Guardian
      # panel (typed before the tap) is written here; an empty one leaves
      # whatever rfid_N_name already holds, so overwriting a slot without
      # typing a new name does not blank the previous person. Pending is
      # cleared only when there was nothing to write, or after the name write
      # reads back — a failed write must not throw away the typed name.
      - variables:
          pending_name: "{{ states('input_text.guardian_enroll_pending_name')
            | string | trim }}"
          pending_name_ok: "{{ pending_name not in ['', 'unknown', 'unavailable', 'none'] }}"
      - if:
        - condition: template
          value_template: '{{ pending_name_ok | bool }}'
        then:
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.rfid_{{ target_slot | string | trim }}_name
          data:
            value: '{{ pending_name }}'
        - variables:
            stored_name_back: "{{ states('input_text.rfid_' ~ (target_slot | string | trim)
              ~ '_name') | string | trim }}"
        - if:
          - condition: template
            value_template: '{{ stored_name_back == pending_name }}'
          then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: input_text.guardian_enroll_pending_name
            data:
              value: ''
          else:
          - action: persistent_notification.create
            data:
              notification_id: guardian_enrollment_name_failed
              title: 'Guardian: key name did not save'
              message: >-
                The card was enrolled in slot {{ target_slot | string | trim }},
                but the person name "{{ pending_name }}" did not stick on
                input_text.rfid_{{ target_slot | string | trim }}_name (reads
                back as "{{ stored_name_back }}"). The pending name was left
                in place — open Keys & PIN and Save on that key, or present
                the same card again during enrollment.
        else:
        - action: input_text.set_value
          continue_on_error: true
          target:
            entity_id: input_text.guardian_enroll_pending_name
          data:
            value: ''
      # The keypad choice is consumed by the card it selected, so the next card
      # goes back to first-free rather than silently overwriting the same slot.
      - action: input_text.set_value
        target:
          entity_id: input_text.guardian_enrollment_slot
        data:
          value: ''
      # Enrollment mode deliberately STAYS ON. It used to switch itself off after
      # one card, which made enrolling a set of cards a sequence of trips back to
      # the Home Assistant UI, and left no moment at which the portal could offer
      # a way out. The idle timer below is what bounds the session instead, and
      # the portal now shows "# to exit".
      - action: timer.start
        target:
          entity_id: timer.guardian_enrollment_window
      - event: guardian.card_enrolled
        event_data:
          slot: '{{ target_slot | string | trim }}'
          source: '{{ source }}'
          name: >-
            {% set from_pending = pending_name if pending_name_ok | bool else '' %}
            {% set raw = states('input_text.rfid_' ~ (target_slot | string | trim)
               ~ '_name') | string | trim %}
            {% set from_slot = raw if raw not in ['', 'unknown', 'unavailable'] else '' %}
            {{ from_slot if from_slot else from_pending }}
      - action: script.guardian_set_display
        data:
          value: GRANTED
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_welcome
      - action: script.turn_on
        target:
          entity_id: script.guardian_lamp_success
    default:
    - event: guardian.unknown_card_scanned
      event_data:
        source: '{{ source }}'
        result: '{{ scan_result }}'
        uid_bytes: '{{ uid_raw | length }}'
    # Reaching here with enrollment mode ON and no target slot means every slot is
    # occupied and nobody has picked one - that is the only remaining case, since
    # a malformed slot counts as empty. Switching enrollment off unconditionally
    # was worse than useless: a card that failed to match because its stored hash
    # was whitespace-padded or uppercase also landed here, and turning enrollment
    # off meant the obvious recovery - enable enrollment, tap the card again -
    # was cancelled by the very tap meant to fix it.
    #
    # The person holding the card is at the door, not at the Home Assistant web
    # UI, and the panel used to tell them "DENIED / Card not recognised" - which
    # is both wrong and unactionable. ENROLL_PICK says what is actually true and
    # what to press. The system will not choose a victim slot on its own.
    #
    # The notification below is always on, not gated by verbose notifications.
    # It prints live helper lengths next to the portal occupancy sensors so
    # "the screen says full" can be told from "the helpers are actually 64
    # characters" without a Developer Tools dump.
    - if:
      - condition: template
        value_template: '{{ enroll_mode | bool }}'
      then:
      - action: persistent_notification.create
        data:
          notification_id: guardian_enrollment_full
          title: 'Guardian: no free card slot'
          message: >-
            Enrollment mode is on, but process_rfid_scan found no writable
            slot. empty_slot='{{ empty_slot | trim }}'
            · target_slot='{{ target_slot | string | trim }}'
            · keypad='{{ states('input_text.guardian_enrollment_slot') }}'.

            Live helper lengths (occupied = 16 hex card_id after trim/lower):
            {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                         | map('trim') | reject('eq', '') | list %}{% for i in ids %}{{ i }}={{
              states('input_text.rfid_' ~ i ~ '_card_id') | string | trim | lower | length
            }}ch{% if not loop.last %}, {% endif %}{% endfor %}.

            Portal sensors (lag if they do not listen to the card_id helpers):
            free={{ states('sensor.guardian_rfid_free_slots') }},
            map={{ states('sensor.guardian_rfid_slot_map') }},
            target={{ states('sensor.guardian_enrollment_target_slot') }}.

            Press a slot digit on the portal keypad to overwrite a slot, or run
            script.guardian_clear_rfid_slot. Developer Tools -> States
            "Set State" does not persist and is not a clear. Enrollment mode
            has been left on.
      - action: script.guardian_set_display
        data:
          value: ENROLL_PICK
      - action: button.press
        target:
          entity_id: button.guardian_interior_portal_play_denied
      - action: timer.start
        target:
          entity_id: timer.guardian_enrollment_window
      - stop: All slots occupied; waiting for a keypad slot selection.
    # DENIED_CARD, not DENIED. They render differently on the portal: DENIED is
    # a PIN result and carries a "N PIN tries left" subtitle, which made a
    # rejected card report a password failure it had nothing to do with, using
    # a counter from an unrelated MFA session.
    - action: script.guardian_set_display
      data:
        value: DENIED_CARD
    - action: button.press
      target:
        entity_id: button.guardian_interior_portal_play_denied
    - action: script.turn_on
      target:
        entity_id: script.guardian_lamp_rejected
    # A rejected card used to produce nothing at all: no push, no persistent
    # notification, not even a data-log row - only a three-second flash on the
    # portal that nobody is necessarily standing in front of. That is why a
    # single mistyped stored hash could go undiagnosed indefinitely.
    - if:
      - condition: state
        entity_id: input_boolean.guardian_verbose_notifications
        state: 'on'
      then:
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: security
          severity: important
          title: 'Guardian: card not recognised'
          message: >-
            An unrecognised card was presented at the {{ source }} reader.
            result={{ scan_result }} card_id_len={{ card_id_norm | length }}
            uid_bytes={{ (uid_raw | length + 1) // 3 if '-' in uid_raw else uid_raw | length }}.

guardian_reconcile_presence:
  alias: Guardian - Reconcile Presence
  description: >-
    Corrects a card's believed location from the reader it was just presented
    to. The doorbell reader is outside the door and the portal reader is inside
    it, so a scan is direct physical evidence of which side the card is on -
    evidence the system previously threw away, only ever updating presence after
    a scan AND a matching door opening.

    In a house with several resident cards someone forgets to scan regularly,
    and every missed scan used to strand that card on the wrong side
    permanently: a card left at "At home" also suppresses the Frigate
    person-detected-while-away alert, whose fallback gate is "all resident
    cards Away". Visitor keys are never occupants; this script will not set
    them At home, and will force Away if they somehow already are.

    Reconciling here, at scan time, rather than when a passage window expires is
    both simpler and strictly more correct - the card is provably at the
    reader's side BEFORE any crossing, so the rule is idempotent and holds
    whether or not a door opening follows.

    This runs before the MFA challenge is answered, so a scan alone moves
    presence without a PIN. That grants nothing: it never unlocks anything, a
    doorbell scan can only ever set "Away", and the only direction that sets
    "At home" - which is the one that could suppress the person-detected-while-
    away alert - requires physical access to the interior portal, i.e. already
    being inside, AND a resident policy. Cards marked Stolen/Lost are excluded
    by the caller. Visitor keys still authorize passage; they just never
    become occupants.
  mode: queued
  max: 10
  fields:
    slot:
      description: RFID slot id
      required: true
    source:
      description: doorbell or interior_portal
      required: true
  sequence:
  # VALIDATE THE SLOT BEFORE BUILDING ANY ENTITY ID OUT OF IT, and stop if it is
  # not on the rack. This ordering is the whole point of the block.
  #
  # slot_ok used to be computed in the SAME variables map as `current:
  # {{ states(entity) }}` and `expected:` — which reads
  # states('input_select.rfid_' ~ slot ~ '_policy') — so the validator ran after
  # both of the things it validates. Home Assistant renders a variables map as a
  # unit; there is no ordering to rely on and no way to short-circuit across
  # entries.
  #
  # With an empty or junk `slot` those two templates render
  # `input_select.rfid_` and `input_select.rfid__policy`. Neither is a valid
  # entity id — a trailing underscore, and a double underscore, both of which
  # Home Assistant's own valid_entity_id pattern rejects — so states() raises
  # TemplateError.
  #
  # And a raising template in a `variables:` block CANNOT BE GUARDED AT ALL.
  # continue_on_error does not apply to a render failure, and TemplateError is
  # one of the exceptions _handle_exception re-raises regardless. So the script
  # aborts, and because it is called blocking from process_rfid_scan the whole
  # scan is lost — the failure mode the fortieth and forty-second passes both
  # exist to prevent, reached through a door neither of them was looking at.
  #
  # Not reachable from process_rfid_scan today, which gates on its own slot_ok
  # first. It is reachable from Developer Tools and from any future caller, and
  # this script re-derives slot_ok precisely because it does not trust its
  # caller — so the validator has to actually run first.
  - variables:
      slot_id: '{{ slot | string | trim }}'
      slot_ok: "{{ (slot | string | trim) in ((states('sensor.guardian_rfid_slots')
        | string).split(',') | map('trim') | reject('eq', '') | list) }}"
  - condition: template
    value_template: "{{ slot_ok | bool and source in ['doorbell', 'interior_portal'] }}"
  # Everything below is now guaranteed a slot that is on the rack, so every
  # entity id built from it is a real one.
  - variables:
      entity: 'input_select.rfid_{{ slot_id }}'
      expected: "{{ 'Away' if (source == 'doorbell' or
        (states('input_select.rfid_' ~ slot_id ~ '_policy')
         | string | trim) == 'visitor') else 'At home' }}"
  - variables:
      current: '{{ states(entity) }}'
      # input_select.select_option RAISES on an option the helper does not have,
      # which would abort process_rfid_scan and lose the whole scan. Option
      # lists are declared in packages/guardian_rfid.yaml, but a leftover UI
      # helper from before the migration could still disagree. Check before
      # writing.
      option_exists: "{{ expected in (state_attr(entity, 'options')
        | default([], true) | list) }}"
  - condition: template
    value_template: "{{ current in ['At home', 'Away'] and
      current != expected and option_exists }}"
  - action: input_select.select_option
    target:
      entity_id: '{{ entity }}'
    data:
      option: '{{ expected }}'
  - event: guardian.presence_corrected
    event_data:
      slot: '{{ slot_id }}'
      name: >-
        {% set raw = states('input_text.rfid_' ~ slot_id ~ '_name')
           | string | trim %}
        {{ raw if raw not in ['', 'unknown', 'unavailable'] else 'Key ' ~ slot_id }}
      source: '{{ source }}'
      from: '{{ current }}'
      to: '{{ expected }}'
      timestamp: '{{ now().isoformat() }}'
  # Deliberately a persistent notification and not a push. Corrections are
  # routine housekeeping, not a security event, and pushing them would train the
  # family to ignore Guardian notifications.
  #
  # continue_on_error, and it is not cosmetic guarding for its own sake. This is
  # the LAST step of a script that process_rfid_scan calls with "action:", i.e.
  # blocking - so an error here does not stop here, it propagates into that
  # script and ends it, and the call site sits in front of the clone alarm and
  # the stolen-key alarm. That is the fortieth pass's bug exactly, one call deep,
  # and preflight could not see it: its raising-domain list is a list of DOMAINS,
  # and a step reading "action: script.guardian_reconcile_presence" matches none
  # of them. persistent_notification. is in that list; it just was not being
  # looked at from here. The forty-first pass teaches preflight to walk into
  # blocking script calls, which is what found this.
  - action: persistent_notification.create
    continue_on_error: true
    data:
      notification_id: 'guardian_presence_corrected_{{ slot_id }}'
      title: 'Guardian: presence corrected'
      message: >-
        {% set raw = states('input_text.rfid_' ~ slot_id ~ '_name')
           | string | trim %}
        {% set who = raw if raw not in ['', 'unknown', 'unavailable']
           else 'Card ' ~ slot_id %}
        {{ who }} was scanned at the
        {{ 'doorbell (outside)' if source == 'doorbell'
           else 'interior portal (inside)' }} reader while recorded as
        "{{ current }}". A scan was missed earlier; it is now "{{ expected }}".

guardian_authorize_passage:
  alias: Guardian - Authorize Passage
  description: >-
    Records intent; presence changes only after the reed switch proves the door
    opened.

    Each window holds a LIST of slots, so several people scanning within the
    same window are all completed by one door opening - previously each scan
    overwrote the last, and when three people left together and two scanned,
    only the last scanner's card flipped.

    The entry and exit windows are also independent now. Cancelling the opposite
    window on every scan meant that person A scanning at the doorbell to come in
    and person B scanning inside to go out seconds later destroyed A's window,
    so A's opening was reclassified by physics into a "keyed entry" push, an
    "unexplained door opening" push, or - in elevated mode - a siren.
  mode: queued
  max: 10
  fields:
    slot:
      required: true
    source:
      required: true
  sequence:
  - variables:
      slot_id: '{{ slot | string | trim }}'
  - condition: template
    value_template: "{{ (slot_id | string | trim) in ((states('sensor.guardian_rfid_slots')
      | string).split(',') | map('trim') | reject('eq', '') | list) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ source == ''doorbell'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_entry_slot
        data:
          # The existing list is inherited ONLY while the timer is genuinely
          # running. If it expired, was cancelled, or was restored across a
          # restart, start a fresh list rather than trusting the input_text.
          #
          # The slot whitelist is sensor.guardian_rfid_slots. Nine ids join
          # to 17 characters; the helper's max is 32, so the write can never
          # be silently rejected.
          value: >-
            {%- set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                          | map('trim') | reject('eq', '') | list -%}
            {%- set active = is_state('timer.guardian_entry_window', 'active') -%}
            {%- set cur = (states('input_text.pending_entry_slot') | string)
                          if active else '' -%}
            {%- set have = cur.split(',') | map('trim')
                           | select('in', ids) | list -%}
            {{ ((have + [slot_id | string | trim]) | unique | list) | join(',') }}
      # timer.start on a running timer restarts the full 20s, so a late scanner
      # extends the window for everyone already queued. That is the right way
      # round for a group walking out together.
      - action: timer.start
        target:
          entity_id: timer.guardian_entry_window
      - action: input_text.set_value
        target:
          entity_id: input_text.last_doorbell_rfid_time
        data:
          value: '{{ now().isoformat() }}'
    - conditions:
      - condition: template
        value_template: '{{ source == ''interior_portal'' }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.pending_exit_slot
        data:
          value: >-
            {%- set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                          | map('trim') | reject('eq', '') | list -%}
            {%- set active = is_state('timer.guardian_exit_window', 'active') -%}
            {%- set cur = (states('input_text.pending_exit_slot') | string)
                          if active else '' -%}
            {%- set have = cur.split(',') | map('trim')
                           | select('in', ids) | list -%}
            {{ ((have + [slot_id | string | trim]) | unique | list) | join(',') }}
      - action: timer.start
        target:
          entity_id: timer.guardian_exit_window
    default:
    - stop: Invalid RFID source; no passage window created.
      error: true
  - action: script.guardian_set_display
    data:
      value: GRANTED
  - action: button.press
    target:
      entity_id: button.guardian_interior_portal_play_welcome
  - action: script.turn_on
    target:
      entity_id: script.guardian_lamp_success
  
guardian_restore_lamp:
  alias: Guardian - Restore Lamp
  mode: parallel
  max: 10
  fields:
    was_on:
      required: true
    prev_brightness:
      required: false
    prev_rgb:
      required: false
    prev_kelvin:
      required: false
  sequence:
  - variables:
      # Challenge amber, alarm red, and success green are Guardian holds, never
      # a colour the camera lamp should be restored to. A restart or cloud lag
      # that snapshots the hold would otherwise paint it back as "previous".
      # Exact (255,150,0) misses Tapo HS round-trips (~255,149,0). Strings are
      # sequences in Jinja, so 'none' must not be treated as an RGB triple.
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
      rgb_hold: >-
        {%- set r = prev_rgb -%}
        {%- if r is none or (r | string | lower | trim) in
            ['none', 'unknown', 'unavailable', ''] -%}
          false
        {%- elif r is sequence and r is not string and r | count >= 3 -%}
          {%- set rv = r[0] | int(-1) -%}
          {%- set gv = r[1] | int(-1) -%}
          {%- set bv = r[2] | int(-1) -%}
          {{ (rv >= 240 and gv >= 100 and gv <= 180 and bv <= 40)
             or (rv >= 240 and gv <= 40 and bv <= 40)
             or (gv >= 240 and rv <= 40 and bv <= 40) }}
        {%- else -%}
          {%- set s = r | string | replace(' ', '') -%}
          {{ s in ['(255,150,0)', '[255,150,0]', '(255,0,0)', '[255,0,0]',
                   '(0,255,0)', '[0,255,0]'] }}
        {%- endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ was_on | bool }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ prev_rgb is not none and prev_rgb | string not in
              [''None'', ''unknown'', ''unavailable'', ''none'']
              and not (rgb_hold | bool) }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lamp }}"
            data:
              rgb_color: '{{ prev_rgb }}'
              brightness: '{{ prev_brightness | int(255) }}'
              transition: 0
        - conditions:
          - condition: template
            value_template: '{{ prev_kelvin is not none and prev_kelvin | int(0) >
              0 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lamp }}"
            data:
              color_temp_kelvin: '{{ prev_kelvin | int }}'
              brightness: '{{ prev_brightness | int(255) }}'
              transition: 0
        default:
        # Brightness-only while the Tapo is still in RGB hold (amber/red/green)
        # leaves that colour on. Drop the hold instead; callers sample if the
        # lamp should come back.
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ rgb_hold | bool }}'
            sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ lamp }}"
              data:
                transition: 0
          default:
          - action: light.turn_on
            target:
              entity_id: "{{ lamp }}"
            data:
              brightness: '{{ prev_brightness | int(255) }}'
              transition: 0
    default:
    - action: light.turn_off
      target:
        entity_id: "{{ lamp }}"
      data:
        transition: 0

guardian_lamp_feedback:
  alias: Guardian - Lamp Feedback Queue
  description: Serializes lamp flashes and restores the complete prior lamp state.
  mode: queued
  max: 10
  fields:
    result:
      required: true
  sequence:
  - variables:
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
  - wait_template: '{{ is_state(''input_boolean.guardian_lamp_sampling'', ''off'')
      }}'
    timeout: 00:00:15
    continue_on_timeout: true
  - condition: template
    value_template: '{{ lamp not in [''none'', '''', ''unknown'', ''unavailable'']
      and states(lamp) not in [''unknown'', ''unavailable'']
      }}'
  - variables:
      # Hold colours are never a restorable previous state. Green leftover is
      # a success flash; amber is the challenge; red is the alarm. Snapshotting
      # any of them and restoring it is how the Tapo stayed orange after the
      # opening had already been authenticated. Exact (255,150,0) misses the
      # Tapo HS round-trip; live checks also use color_mode + hue.
      hold: >-
        {%- set mode = state_attr(lamp, 'color_mode') | string | lower -%}
        {%- set rgb_mode = mode in ['hs', 'rgb', 'xy', 'unknown', 'none', ''] -%}
        {%- set r = state_attr(lamp, 'rgb_color') -%}
        {%- set hs = state_attr(lamp, 'hs_color') -%}
        {%- set rgb_ok = r is sequence and r is not string and r | count >= 3 -%}
        {%- set rv = r[0] | int(-1) if rgb_ok else -1 -%}
        {%- set gv = r[1] | int(-1) if rgb_ok else -1 -%}
        {%- set bv = r[2] | int(-1) if rgb_ok else -1 -%}
        {%- set rgb_hold = (rv >= 240 and gv >= 100 and gv <= 180 and bv <= 40)
            or (rv >= 240 and gv <= 40 and bv <= 40)
            or (gv >= 240 and rv <= 40 and bv <= 40) -%}
        {%- set hs_ok = hs is sequence and hs is not string and hs | count >= 2 -%}
        {%- set h = hs[0] | float(-1) if hs_ok else -1 -%}
        {%- set sat = hs[1] | float(-1) if hs_ok else -1 -%}
        {%- set hs_hold = sat >= 70 and ((h >= 25 and h <= 45)
            or (h <= 15 or h >= 345) or (h >= 100 and h <= 140)) -%}
        {{ rgb_mode and (rgb_hold or hs_hold) }}
  - variables:
      was_on: "{{ is_state(lamp, 'on') and not (hold | bool) }}"
      prev_brightness: '{{ state_attr(lamp, ''brightness'') | int(255)
        }}'
      prev_rgb: "{{ 'none' if hold | bool else state_attr(lamp, 'rgb_color') }}"
      prev_kelvin: '{{ state_attr(lamp, ''color_temp_kelvin'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ result == ''success'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lamp }}"
        data:
          rgb_color:
          - 0
          - 255
          - 0
          brightness: 255
          transition: 0
      - delay: 00:00:01
    - conditions:
      - condition: template
        value_template: '{{ result == ''rejected'' }}'
      sequence:
      - repeat:
          count: 3
          sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ lamp }}"
            data:
              rgb_color:
              - 255
              - 0
              - 0
              brightness: 255
              transition: 0
          - delay: '00:00:00.5'
          - action: light.turn_off
            target:
              entity_id: "{{ lamp }}"
            data:
              transition: 0
          - delay: '00:00:00.5'
  # A card-accepted flash during a live challenge is confirmation only. The
  # amber hold still belongs to the challenge; putting a snapshot back would
  # either re-paint orange as "previous" after auth, or steal the hold.
  - if:
    - condition: template
      value_template: "{{ is_state('input_text.portal_display_state', 'ALARM') }}"
    then:
    - stop: Alarm owns the lamp.
  - if:
    - condition: state
      entity_id: input_boolean.guardian_entry_challenge
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: "{{ lamp }}"
      data:
        rgb_color:
        - 255
        - 150
        - 0
        brightness: 255
        transition: 0
    - stop: Challenge still holds the lamp amber.
  - action: script.guardian_restore_lamp
    data:
      was_on: '{{ was_on }}'
      prev_brightness: '{{ prev_brightness }}'
      prev_rgb: '{{ prev_rgb }}'
      prev_kelvin: '{{ prev_kelvin }}'
  # Tapo cloud lag can still report the hold colour after restore. Do not leave
  # it. Sampling is NOT started here: sample_ambient refuses to run while this
  # script is on. lamp_success samples after this returns.
  - if:
    - condition: template
      value_template: >-
        {% set mode = state_attr(lamp, 'color_mode') | string | lower %}
        {% set rgb_mode = mode in ['hs', 'rgb', 'xy', 'unknown', 'none', ''] %}
        {% set r = state_attr(lamp, 'rgb_color') %}
        {% set hs = state_attr(lamp, 'hs_color') %}
        {% set rgb_ok = r is sequence and r is not string and r | count >= 3 %}
        {% set rv = r[0] | int(-1) if rgb_ok else -1 %}
        {% set gv = r[1] | int(-1) if rgb_ok else -1 %}
        {% set bv = r[2] | int(-1) if rgb_ok else -1 %}
        {% set rgb_hold = (rv >= 240 and gv >= 100 and gv <= 180 and bv <= 40)
            or (rv >= 240 and gv <= 40 and bv <= 40)
            or (gv >= 240 and rv <= 40 and bv <= 40) %}
        {% set hs_ok = hs is sequence and hs is not string and hs | count >= 2 %}
        {% set h = hs[0] | float(-1) if hs_ok else -1 %}
        {% set sat = hs[1] | float(-1) if hs_ok else -1 %}
        {% set hs_hold = sat >= 70 and ((h >= 25 and h <= 45)
            or (h <= 15 or h >= 345) or (h >= 100 and h <= 140)) %}
        {{ is_state(lamp, 'on') and rgb_mode and (rgb_hold or hs_hold) }}
    then:
    - action: light.turn_off
      target:
        entity_id: "{{ lamp }}"

guardian_lamp_success:
  alias: Guardian Lamp Success
  mode: queued
  sequence:
  - variables:
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
  - action: script.guardian_lamp_feedback
    data:
      result: success
  - condition: template
    value_template: "{{ not is_state('input_text.portal_display_state', 'ALARM')
      and not is_state('input_boolean.guardian_entry_challenge', 'on') }}"
  - variables:
      leftover_hold: >-
        {%- set mode = state_attr(lamp, 'color_mode') | string | lower -%}
        {%- set rgb_mode = mode in ['hs', 'rgb', 'xy', 'unknown', 'none', ''] -%}
        {%- set r = state_attr(lamp, 'rgb_color') -%}
        {%- set hs = state_attr(lamp, 'hs_color') -%}
        {%- set rgb_ok = r is sequence and r is not string and r | count >= 3 -%}
        {%- set rv = r[0] | int(-1) if rgb_ok else -1 -%}
        {%- set gv = r[1] | int(-1) if rgb_ok else -1 -%}
        {%- set bv = r[2] | int(-1) if rgb_ok else -1 -%}
        {%- set rgb_hold = (rv >= 240 and gv >= 100 and gv <= 180 and bv <= 40)
            or (rv >= 240 and gv <= 40 and bv <= 40)
            or (gv >= 240 and rv <= 40 and bv <= 40) -%}
        {%- set hs_ok = hs is sequence and hs is not string and hs | count >= 2 -%}
        {%- set h = hs[0] | float(-1) if hs_ok else -1 -%}
        {%- set sat = hs[1] | float(-1) if hs_ok else -1 -%}
        {%- set hs_hold = sat >= 70 and ((h >= 25 and h <= 45)
            or (h <= 15 or h >= 345) or (h >= 100 and h <= 140)) -%}
        {{ is_state(lamp, 'on') and rgb_mode and (rgb_hold or hs_hold) }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ leftover_hold | bool }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: "{{ lamp }}"
      - action: script.guardian_sample_ambient_light
    - conditions:
      - condition: template
        value_template: "{{ is_state(lamp, 'off') }}"
      sequence:
      - action: script.guardian_sample_ambient_light

guardian_lamp_rejected:
  alias: Guardian Lamp Rejected
  mode: queued
  sequence:
  - action: script.guardian_lamp_feedback
    data:
      result: rejected

guardian_lamp_warning:
  alias: Guardian Lamp Warning
  description: >-
    Holds the lamp amber for the duration of an entry challenge, then puts it
    back exactly as it was.

    Deliberately NOT routed through guardian_lamp_feedback: that queue exists to
    serialise short flashes and restores immediately afterwards, whereas this has
    to HOLD for as long as the challenge runs so someone walking in at night can
    see that the system is waiting on them.
  # restart, so a second opening inside one challenge re-arms the hold against
  # the state captured by the first run rather than stacking two restores.
  mode: restart
  sequence:
  - variables:
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
  - condition: template
    value_template: "{{ lamp not in ['none', 'unknown', 'unavailable', '']
      and states(lamp) not in ['unknown', 'unavailable'] }}"
  - variables:
      # A leftover challenge hold is on + near-amber (Tapo reports HS-rounded
      # RGB, not exact 255,150,0). Restoring that snapshot (mode: restart
      # re-reads live attrs) leaves the Tapo stuck amber after the challenge
      # ends. Do not hand that rgb to restore, and do not treat a hold as
      # was_on: brightness-only restore would leave the colour on.
      hold: >-
        {%- set mode = state_attr(lamp, 'color_mode') | string | lower -%}
        {%- set rgb_mode = mode in ['hs', 'rgb', 'xy', 'unknown', 'none', ''] -%}
        {%- set r = state_attr(lamp, 'rgb_color') -%}
        {%- set hs = state_attr(lamp, 'hs_color') -%}
        {%- set rgb_ok = r is sequence and r is not string and r | count >= 3 -%}
        {%- set rv = r[0] | int(-1) if rgb_ok else -1 -%}
        {%- set gv = r[1] | int(-1) if rgb_ok else -1 -%}
        {%- set bv = r[2] | int(-1) if rgb_ok else -1 -%}
        {%- set rgb_hold = (rv >= 240 and gv >= 100 and gv <= 180 and bv <= 40)
            or (rv >= 240 and gv <= 40 and bv <= 40)
            or (gv >= 240 and rv <= 40 and bv <= 40) -%}
        {%- set hs_ok = hs is sequence and hs is not string and hs | count >= 2 -%}
        {%- set h = hs[0] | float(-1) if hs_ok else -1 -%}
        {%- set sat = hs[1] | float(-1) if hs_ok else -1 -%}
        {%- set hs_hold = sat >= 70 and ((h >= 25 and h <= 45)
            or (h <= 15 or h >= 345) or (h >= 100 and h <= 140)) -%}
        {{ rgb_mode and (rgb_hold or hs_hold) }}
  - variables:
      was_on: "{{ is_state(lamp, 'on') and not (hold | bool) }}"
      prev_brightness: "{{ state_attr(lamp, 'brightness') | int(255) }}"
      prev_rgb: "{{ 'none' if hold | bool else state_attr(lamp, 'rgb_color') }}"
      prev_kelvin: "{{ state_attr(lamp, 'color_temp_kelvin') }}"
  - action: light.turn_on
    target:
      entity_id: "{{ lamp }}"
    data:
      rgb_color:
      - 255
      - 150
      - 0
      brightness: 255
      transition: 0
  # The timeout is a backstop only. Every path that ends a challenge clears the
  # boolean, but a restart mid-challenge would otherwise strand the lamp amber
  # forever, which is the same class of bug as the stranded blacked-out lamp
  # that guardian_lamp_presample exists to fix.
  - wait_template: "{{ is_state('input_boolean.guardian_entry_challenge', 'off') }}"
    timeout: 00:05:00
    continue_on_timeout: true
  # A challenge that ended by TIMING OUT raises a major alarm, and the alarm
  # handler owns the lamp from that moment - it is holding it full red. Restoring
  # here would quietly undo the most visible part of an active alarm.
  - condition: template
    value_template: "{{ not is_state('input_text.portal_display_state', 'ALARM') }}"
  - action: script.guardian_restore_lamp
    data:
      was_on: '{{ was_on }}'
      prev_brightness: '{{ prev_brightness }}'
      prev_rgb: '{{ prev_rgb }}'
      prev_kelvin: '{{ prev_kelvin }}'
  - if:
    - condition: template
      value_template: >-
        {% set mode = state_attr(lamp, 'color_mode') | string | lower %}
        {% set rgb_mode = mode in ['hs', 'rgb', 'xy', 'unknown', 'none', ''] %}
        {% set r = state_attr(lamp, 'rgb_color') %}
        {% set hs = state_attr(lamp, 'hs_color') %}
        {% set rgb_ok = r is sequence and r is not string and r | count >= 3 %}
        {% set rv = r[0] | int(-1) if rgb_ok else -1 %}
        {% set gv = r[1] | int(-1) if rgb_ok else -1 %}
        {% set bv = r[2] | int(-1) if rgb_ok else -1 %}
        {% set rgb_hold = (rv >= 240 and gv >= 100 and gv <= 180 and bv <= 40)
            or (rv >= 240 and gv <= 40 and bv <= 40)
            or (gv >= 240 and rv <= 40 and bv <= 40) %}
        {% set hs_ok = hs is sequence and hs is not string and hs | count >= 2 %}
        {% set h = hs[0] | float(-1) if hs_ok else -1 %}
        {% set sat = hs[1] | float(-1) if hs_ok else -1 %}
        {% set hs_hold = sat >= 70 and ((h >= 25 and h <= 45)
            or (h <= 15 or h >= 345) or (h >= 100 and h <= 140)) %}
        {{ is_state(lamp, 'on') and rgb_mode and (rgb_hold or hs_hold) }}
    then:
    - action: light.turn_off
      target:
        entity_id: "{{ lamp }}"
    - action: script.guardian_sample_ambient_light

# Keep this key line. It was deleted once (commit 903d1fd) by a hunk that
# appended the amber cleanup above, which spliced this whole script into
# guardian_lamp_warning as duplicate alias/description/mode/sequence keys.
# Home Assistant takes the LAST of a duplicate key, so guardian_lamp_warning
# silently became this script: the Elevated Opening Supervisor's
# "script.turn_on: guardian_lamp_warning" cancelled the challenge it had just
# opened, and every unauthorised elevated opening went completely unanswered -
# no countdown, no amber, no chirp, no alarm. See the parse check in DEPLOY.md.
guardian_clear_entry_challenge:
  alias: Guardian - Clear Entry Challenge
  description: >-
    Ends a grace challenge successfully after BOTH factors (registered card
    and master PIN) have been presented. Callers must have already set
    guardian_challenge_card_ok and guardian_challenge_pin_ok; this script
    does not re-check them, it is the shared completion path.

    It also clears any PIN challenge that happened to be open, because the
    opening it was guarding has now been accounted for; leaving one running would
    let its own 40s timeout fire a major alarm for an entry that was already
    authenticated.
  mode: queued
  max: 3
  fields:
    method:
      description: card or pin
      required: false
    detail:
      description: Free text for the confirmation push
      required: false
    slot:
      description: RFID slot id when the challenge was answered with a card
      required: false
      example: '1'
  sequence:
  - variables:
      origin: "{{ states('input_text.guardian_challenge_origin') | string | trim }}"
  # Stop the amber hold BEFORE clearing the challenge flag. The warning script
  # waits on that flag; turning the flag off first lets it restore a near-amber
  # snapshot after auth has already cleaned up. script.turn_off aborts the wait
  # without running restore. Timeout/alarm does not call this script, so that
  # path still wakes on the flag and sees ALARM.
  - action: script.turn_off
    target:
      entity_id: script.guardian_lamp_warning
  - action: timer.cancel
    target:
      entity_id:
      - timer.guardian_entry_challenge
      - timer.guardian_mfa_window
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.guardian_entry_challenge
      - input_boolean.portal_mfa_pending
      - input_boolean.guardian_challenge_card_ok
      - input_boolean.guardian_challenge_pin_ok
  - action: input_number.set_value
    target:
      entity_id: input_number.mfa_failed_attempts
    data:
      value: 0
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.guardian_challenge_origin
      - input_text.pending_mfa_slot
      - input_text.pending_mfa_source
    data:
      value: none
  - event: guardian.entry_challenge_cleared
    event_data:
      method: "{{ method | default('unknown', true) }}"
      origin: '{{ origin }}'
      detail: "{{ detail | default('', true) }}"
      timestamp: '{{ now().isoformat() }}'
  # Informational, not high priority. An answered challenge is the system working
  # as designed; only an unanswered one is an alarm. Card answers go to that
  # person; PIN answers have no slot and broadcast.
  - if:
    - condition: template
      value_template: >-
        {{ (slot | default('', true) | string | trim) in
           ((states('sensor.guardian_rfid_slots') | string).split(',')
            | map('trim') | reject('eq', '') | list) }}
    then:
    - action: script.guardian_notify_person
      continue_on_error: true
      data:
        slot: '{{ slot | string | trim }}'
        critical: false
        category: mine
        severity: important
        title: 'Guardian: entry authenticated'
        message: >-
          An elevated-mode opening from {{ origin if origin not in
          ['none', 'unknown', ''] else 'an unknown direction' }} was authenticated
          by {{ method | default('an unknown method', true) }}{{
          ' (' ~ detail ~ ')' if detail | default('', true) | length > 0 else '' }}.
    else:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: security
        severity: important
        title: 'Guardian: entry authenticated'
        message: >-
          An elevated-mode opening from {{ origin if origin not in
          ['none', 'unknown', ''] else 'an unknown direction' }} was authenticated
          by {{ method | default('an unknown method', true) }}{{
          ' (' ~ detail ~ ')' if detail | default('', true) | length > 0 else '' }}.

guardian_doorbell_exit_pin_prompt:
  alias: Guardian - Doorbell Exit PIN Prompt
  description: >-
    Sends the owner-only textInput PIN prompt for the doorbell-exit window.
    critical is false so an unmapped slot NEVER fans the PIN field out through
    broadcast. The reminder automation and the start script both call this;
    the Companion tag replaces the previous shade notification rather than
    stacking copies.
  mode: queued
  max: 5
  fields:
    slot:
      description: RFID slot that scanned at the doorbell
      required: true
      example: '1'
  sequence:
  - variables:
      which: '{{ slot | string | trim }}'
      who: >-
        {% set raw = states('input_text.rfid_' ~ (slot | string | trim) ~ '_name')
                     | string | trim %}
        {{ raw if raw not in ['', 'unknown', 'unavailable', 'none']
           else ('Key ' ~ (slot | string | trim)) }}
      minutes: "{{ states('input_number.guardian_doorbell_exit_pin_minutes') | int(10) }}"
      mapped: "{{ (slot | string | trim) in ((states('sensor.guardian_rfid_slots')
        | string).split(',') | map('trim') | reject('eq', '') | list)
        and (states('input_select.rfid_' ~ (slot | string | trim) ~ '_notify_target')
             | string | trim) not in ['none', '', 'unknown', 'unavailable']
        and (states('input_select.rfid_' ~ (slot | string | trim) ~ '_notify_target')
             | string | trim) in ((states('sensor.guardian_notify_targets_available')
             | string).split(',') | map('trim') | reject('eq', '') | list) }}"
  # Guarded: the push below is not a notice about the exit window, it IS the
  # window - the PIN field that lets this person back in without an alarm. This
  # badge is the fallback for someone already at a browser, and it must not be
  # able to cancel the thing it is a fallback for.
  - action: persistent_notification.create
    continue_on_error: true
    data:
      notification_id: guardian_doorbell_exit_pin
      title: 'Guardian: confirm exit PIN'
      message: >-
        {{ who }} scanned at the doorbell. Enter the master PIN from the
        linked phone within {{ minutes }} minutes, or at the interior keypad
        if you can reach it. An unanswered window becomes a full alarm.
  # companion: doorbell_exit_pin, not nested data:. A script field named
  # data is stringified on the way in, extra is mapping is then false, and
  # notify.send_message drops the PIN field. guardian_notify_person builds
  # the YAML-literal Companion payload itself.
  - action: script.guardian_notify_person
    data:
      slot: '{{ which }}'
      critical: false
      # This one is not a notice, it is the interaction: the PIN field that
      # lets this person out. urgent so it survives every level, and mine
      # because it is addressed to them by name.
      category: mine
      severity: urgent
      companion: doorbell_exit_pin
      title: 'Guardian: confirm your exit'
      message: >-
        Your card was scanned at the doorbell. Super surveillance is on and
        that reader has no keypad, so the master PIN is required from this
        phone within {{ minutes }} minutes. Tap Enter PIN, type it, and send,
        or open Guardian and type it there. An unanswered prompt becomes a
        full alarm.
    response_variable: prompt_result
  - if:
    - condition: template
      value_template: '{{ not (mapped | bool) }}'
    then:
    # Prompt itself must not leave the owner's phone. This household warning
    # has no textInput, so someone else can still act (keypad, or linking a
    # phone) before the 10 minutes become a false alarm.
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: security
        severity: important
        title: 'Guardian: doorbell exit needs a phone'
        message: >-
          {{ who }} scanned at the doorbell while elevated mode was on, but
          that key has no linked phone, so the PIN prompt could not be
          delivered. Enter the master PIN at the interior keypad within
          {{ minutes }} minutes or a full alarm will sound. Link a phone on
          Keys, People & Alerts.

guardian_start_doorbell_exit_pin:
  alias: Guardian - Start Doorbell Exit PIN Window
  description: >-
    Opens the 10-minute phone-PIN window after an elevated doorbell-exit scan.
    If a 30s keypad challenge is running it is converted (one clock only) -
    never via guardian_clear_entry_challenge, which would report the opening
    as authenticated. A second scan while the window is already open updates
    the slot and resends the prompt but does not restart the timer.
  mode: queued
  max: 5
  fields:
    slot:
      required: true
    convert_challenge:
      required: false
      default: false
  sequence:
  - variables:
      which: '{{ slot | string | trim }}'
      converting: "{{ convert_challenge | default(false, true) | string | trim | lower
        in ['true', 'on', 'yes', '1'] }}"
      already: "{{ is_state('input_boolean.guardian_doorbell_exit_pin', 'on') }}"
  - if:
    - condition: template
      value_template: '{{ converting | bool }}'
    then:
    - action: timer.cancel
      target:
        entity_id: timer.guardian_entry_challenge
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.guardian_entry_challenge
        - input_boolean.guardian_challenge_card_ok
        - input_boolean.guardian_challenge_pin_ok
        - input_boolean.portal_mfa_pending
    - action: timer.cancel
      target:
        entity_id: timer.guardian_mfa_window
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_challenge_origin
      data:
        value: none
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_doorbell_exit_slot
    data:
      value: '{{ which }}'
  - if:
    - condition: template
      value_template: '{{ already | bool }}'
    then:
    - action: script.guardian_doorbell_exit_pin_prompt
      data:
        slot: '{{ which }}'
    - stop: Window already open; prompt resent without restarting the clock.
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.guardian_doorbell_exit_pin
  - action: input_number.set_value
    target:
      entity_id: input_number.mfa_failed_attempts
    data:
      value: 0
  - action: timer.start
    target:
      entity_id: timer.guardian_doorbell_exit_pin_window
    data:
      duration: >-
        {% set m = states('input_number.guardian_doorbell_exit_pin_minutes') | int(10) %}
        {{ '00:%02d:00' % (m if m < 60 else 59) }}
  - event: guardian.doorbell_exit_pin_started
    event_data:
      slot: '{{ which }}'
      minutes: "{{ states('input_number.guardian_doorbell_exit_pin_minutes') | int(10) }}"
      timestamp: '{{ now().isoformat() }}'
  - action: script.turn_on
    target:
      entity_id: script.guardian_lamp_success
  - action: button.press
    target:
      entity_id: button.guardian_interior_portal_play_mfa_challenge
    continue_on_error: true
  - action: script.guardian_set_display
    data:
      value: MFA
  - action: script.guardian_doorbell_exit_pin_prompt
    data:
      slot: '{{ which }}'

guardian_clear_doorbell_exit_pin:
  alias: Guardian - Clear Doorbell Exit PIN Window
  description: >-
    Ends the doorbell-exit phone-PIN window successfully. Callers have already
    confirmed the PIN via script.guardian_pin_matches. Does not authorize an
    entry passage window - the person is already outside.
  mode: queued
  max: 3
  fields:
    method:
      description: phone or keypad
      required: false
    slot:
      required: false
  sequence:
  - variables:
      which: >-
        {% set s = slot | default('', true) | string | trim %}
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {{ s if s in ids else (states('input_text.guardian_doorbell_exit_slot')
           | string | trim) }}
  - action: timer.cancel
    target:
      entity_id: timer.guardian_doorbell_exit_pin_window
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_doorbell_exit_pin
  - action: input_number.set_value
    target:
      entity_id: input_number.mfa_failed_attempts
    data:
      value: 0
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_doorbell_exit_slot
    data:
      value: none
  - action: persistent_notification.dismiss
    continue_on_error: true
    data:
      notification_id: guardian_doorbell_exit_pin
  - event: guardian.doorbell_exit_pin_cleared
    event_data:
      method: "{{ method | default('unknown', true) }}"
      slot: '{{ which }}'
      timestamp: '{{ now().isoformat() }}'
  - if:
    - condition: template
      value_template: "{{ states('input_text.portal_display_state') not in
        ['ALARM', 'IDLE'] }}"
    then:
    - action: script.guardian_set_display
      data:
        value: IDLE
  - action: script.turn_on
    target:
      entity_id: script.guardian_lamp_success
  - if:
    - condition: template
      value_template: >-
        {{ (which | string | trim) in
           ((states('sensor.guardian_rfid_slots') | string).split(',')
            | map('trim') | reject('eq', '') | list) }}
    then:
    - action: script.guardian_notify_person
      continue_on_error: true
      data:
        slot: '{{ which }}'
        critical: false
        # Replaces the tagged PIN shade on the same phone. urgent for the same
        # reason the prompt is: a level that suppressed this would leave a
        # dead PIN field sitting on the lock screen with nothing to clear it.
        category: mine
        severity: urgent
        companion: doorbell_exit_done
        title: 'Guardian: exit confirmed'
        message: >-
          The doorbell-exit PIN was accepted
          ({{ method | default('unknown', true) }}). No alarm.

guardian_apply_doorbell_exit_pin:
  alias: Guardian - Apply Doorbell Exit PIN
  description: >-
    Shared success/fail path for the doorbell-exit window. Callers pass the
    typed PIN; compare is script.guardian_pin_matches only. Used by the
    Companion reply automation and by the Guardian panel. Refuses unless the
    window is open. Never stores the PIN.
  mode: queued
  max: 10
  fields:
    pin:
      description: The typed master PIN
      required: true
      selector:
        text:
          type: password
    method:
      description: phone or panel
      required: false
      default: phone
  sequence:
  - condition: state
    entity_id: input_boolean.guardian_doorbell_exit_pin
    state: 'on'
  - action: script.guardian_pin_matches
    data:
      pin: '{{ pin }}'
    response_variable: pin_check
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ pin_check.matches | bool }}'
      sequence:
      - action: script.guardian_clear_doorbell_exit_pin
        data:
          method: "{{ method | default('phone', true) }}"
          slot: "{{ states('input_text.guardian_doorbell_exit_slot') }}"
      - variables:
          result:
            outcome: accepted
            matches: true
      - stop: PIN accepted
        response_variable: result
    default:
    - action: input_number.set_value
      target:
        entity_id: input_number.mfa_failed_attempts
      data:
        value: "{{ states('input_number.mfa_failed_attempts') | int(0) + 1 }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ states('input_number.mfa_failed_attempts') | int(0)
            >= 3 }}"
        sequence:
        - action: input_number.set_value
          target:
            entity_id: input_number.mfa_failed_attempts
          data:
            value: 0
        - action: timer.cancel
          target:
            entity_id: timer.guardian_doorbell_exit_pin_window
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.guardian_doorbell_exit_pin
        - action: input_text.set_value
          target:
            entity_id: input_text.guardian_doorbell_exit_slot
          data:
            value: none
        - action: persistent_notification.dismiss
          continue_on_error: true
          data:
            notification_id: guardian_doorbell_exit_pin
        - event: guardian.major_alarm
          event_data:
            reason: Maximum PIN attempts exceeded (doorbell-exit PIN)
        - variables:
            result:
              outcome: lockout
              matches: false
        - stop: PIN lockout
          response_variable: result
      default:
      - action: script.guardian_doorbell_exit_pin_prompt
        continue_on_error: true
        data:
          slot: "{{ states('input_text.guardian_doorbell_exit_slot') }}"
      - variables:
          result:
            outcome: rejected
            matches: false
            attempts_left: "{{ [0, 3 - (states('input_number.mfa_failed_attempts')
              | int(0))] | max }}"
      - stop: PIN rejected
        response_variable: result

guardian_apply_lamp_sun_mismatch:
  alias: Guardian - Apply Lamp Sun-Mismatch Fallback
  description: >-
    Forces the configured room lamp to the sun-expected state when it has been held in
    the opposite state for input_number.guardian_lamp_mismatch_max_minutes.

    Separate from the sampler's immediate sun clamp. That clamp only fires when
    a valid reading CROSSES a threshold and contradicts the sky (luma >= 90 at
    night becomes on_sun_override). A downstairs window that parks luma inside
    the 45-90 hold band never crosses, so hold restores the previous state and
    a lamp that is already off at dusk stays off all night. This clock fires
    even when the camera number is valid.

    Called from two places with the same rules: the end of
    guardian_sample_ambient_light (after the choose and after clearing
    presample), and Guardian: Lamp Sun-Mismatch Fallback on a :30 offset so a
    dead sampler cannot stick the lamp. from_sampler skips the sampling-flag
    and feedback guards because those are expected to still be on at sample
    end; they must block the independent tick, or a 5s blackout would look
    like "stuck off".
  mode: queued
  max: 2
  fields:
    from_sampler:
      required: false
      default: false
      selector:
        boolean:
    luminance_valid:
      required: false
      default: false
    luminance:
      required: false
      default: 0
  sequence:
  - variables:
      from_sampler: "{{ from_sampler | default(false) | string | trim | lower
        in ['true', 'on', 'yes', '1'] }}"
      luma_ok: "{{ luminance_valid | default(false) | string | trim | lower
        in ['true', 'on', 'yes', '1'] }}"
      luma: '{{ luminance | default(0) | float(0) }}'
      display: "{{ states('input_text.portal_display_state') | string | trim }}"
      sun_ok: "{{ states('sun.sun') not in ['unknown', 'unavailable'] }}"
      sun_elev: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
      lamp_on: "{{ is_state(states('sensor.guardian_lamp_entity'), 'on') }}"
      max_min: "{{ states('input_number.guardian_lamp_mismatch_max_minutes')
        | int(30) }}"
      since_raw: "{{ states('input_text.guardian_lamp_mismatch_since')
        | string | trim }}"
      now_ts: '{{ as_timestamp(utcnow()) }}'
      night: '{{ (states(''sun.sun'') not in [''unknown'', ''unavailable''])
        and (state_attr(''sun.sun'', ''elevation'') | float(0) < -6) }}'
      day: '{{ (states(''sun.sun'') not in [''unknown'', ''unavailable''])
        and (state_attr(''sun.sun'', ''elevation'') | float(0) > 10) }}'
  # Independent tick only. Sample-end calls this while guardian_lamp_sampling
  # is still on; treating that as "stuck off" would force during the blackout
  # and fight presample/watchdog (F-39).
  - if:
    - condition: template
      value_template: "{{ not from_sampler and
        is_state('input_boolean.guardian_lamp_sampling', 'on') }}"
    then:
    - stop: Sample in progress; the sampler applies this at the end of the run.
  - if:
    - condition: template
      value_template: "{{ not from_sampler and
        is_state('script.guardian_lamp_feedback', 'on') }}"
    then:
    - stop: Lamp feedback flash in progress.
  # Alarm pins the bulb full red. A daytime alarm would otherwise look like
  # "on too long" and this would undo the most visible part of the alarm.
  # Challenge/MFA amber is the same class of intentional hold.
  - if:
    - condition: template
      value_template: "{{ display in ['ALARM', 'CHALLENGE', 'MFA'] }}"
    then:
    - stop: Lamp is owned by alarm or an authentication hold.
  - if:
    - condition: template
      value_template: "{{ lamp in ['none', '', 'unknown', 'unavailable']
        or states(lamp) in ['unknown', 'unavailable'] }}"
    then:
    - stop: Lamp entity is not ready.
  # Twilight (-6 to +10) and a missing sun entity have no expected state.
  # Clearing the clock here is load-bearing: accumulating through dusk would
  # force the instant elevation crosses -6, which is the band F-38 left to
  # the camera on purpose.
  - if:
    - condition: template
      value_template: '{{ not (night or day) }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_mismatch_since
      data:
        value: none
    - action: persistent_notification.dismiss
      data:
        notification_id: guardian_lamp_mismatch_timeout
      continue_on_error: true
    - stop: No sun-expected lamp state (twilight or sun missing).
  - if:
    - condition: template
      value_template: '{{ (night and lamp_on) or (day and not lamp_on) }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_mismatch_since
      data:
        value: none
    - action: persistent_notification.dismiss
      data:
        notification_id: guardian_lamp_mismatch_timeout
      continue_on_error: true
    - stop: Lamp already matches the sun-expected state.
  - if:
    - condition: template
      value_template: "{{ since_raw in ['', 'none', 'unknown', 'unavailable']
        or not is_number(since_raw) }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_mismatch_since
      data:
        value: '{{ now_ts }}'
    - stop: Started the sun-mismatch clock.
  - if:
    - condition: template
      value_template: '{{ (now_ts | float(0)) - (since_raw | float(0))
        < (max_min | int(30)) * 60 }}'
    then:
    - stop: Sun-mismatch clock has not yet reached the configured bound.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ night }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lamp }}"
        data:
          # 6500 K, not 4000 K. After dark this lamp is the only illumination the
          # door camera has, and Frigate runs its person detector on that frame.
          # A warm cast made a person at the door not register as one at all;
          # switching the bulb to full white made detection start working
          # immediately (confirmed by hand at the door). Detection is already
          # working against the odds here - a CPU detector, and a detect stream
          # the lamp mount leaves rotated 90 degrees - so do not hand it warm
          # light as well. Keep this in step with the other two turn-on sites.
          color_temp_kelvin: 6500
          brightness_pct: 45
          transition: 1
    - conditions:
      - condition: template
        value_template: '{{ day }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: "{{ lamp }}"
        data:
          transition: 1
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_lamp_mismatch_since
    data:
      value: none
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_lamp_last_result
    data:
      value: >-
        {{ now().strftime('%H:%M') }}
        {{- ' luma=' ~ (luma | round(1)) if luma_ok else '' }}
        {{- ' sun=' ~ (sun_elev | round(1)) if sun_ok else '' }}
        {{- ' on_mismatch' if night else ' off_mismatch' }}
  - action: persistent_notification.create
    data:
      notification_id: guardian_lamp_mismatch_timeout
      title: 'Guardian: lamp forced to match the sun'
      message: >-
        {{ states('input_text.guardian_lamp_last_result') }}. The lamp had
        disagreed with sun elevation for
        {{ states('input_number.guardian_lamp_mismatch_max_minutes') | int(30) }}
        minutes, so it was forced
        {{ 'on' if night else 'off' }} regardless of the camera reading.
        This is separate from the immediate sun clamp: it fires even when
        luminance looks valid. See DEPLOY.md.
  # Sample-end already has a verbose notify after this returns, and would
  # double-push if we also fired here. The independent tick has no such
  # follow-up, so it is the only caller that notifies from this script.
  - if:
    - condition: template
      value_template: "{{ not from_sampler and
        is_state('input_boolean.guardian_verbose_notifications', 'on') }}"
    then:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: system
        severity: routine
        title: 'Guardian: lamp'
        message: "{{ states('input_text.guardian_lamp_last_result') }}"

guardian_lamp_cal_retune:
  alias: Guardian - Retune Lamp Luma Calibration
  description: >-
    Rebuilds the Auto-calibrate mask and hysteresis from luma-samples.jsonl.
    Fired with script.turn_on after the sampling flag is cleared so it cannot
    extend the 60s watchdog or the 15s luminance command_timeout. Does not
    write input_number.guardian_dark_threshold / _bright_threshold.
  mode: single
  sequence:
  - variables:
      was_ready: "{{ states('sensor.guardian_lamp_cal') | int(0) }}"
  - action: shell_command.guardian_luma_retune
    continue_on_error: true
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.guardian_lamp_cal
    continue_on_error: true
  - delay: 00:00:02
  - if:
    - condition: template
      value_template: "{{ was_ready | int(0) != 1 and
        states('sensor.guardian_lamp_cal') | int(0) == 1 }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: guardian_lamp_cal_ready
        title: 'Guardian: lamp auto-calibrate is ready'
        message: >-
          Learned dark={{ state_attr('sensor.guardian_lamp_cal', 'dark') }},
          bright={{ state_attr('sensor.guardian_lamp_cal', 'bright') }}
          from {{ state_attr('sensor.guardian_lamp_cal', 'n_day') }} day and
          {{ state_attr('sensor.guardian_lamp_cal', 'n_night') }} night
          samples ({{ state_attr('sensor.guardian_lamp_cal', 'tiles') }}
          relevant tiles). Manual (this home) is unchanged: switch the luma
          mode back to restore crop p25 and the 45/90 helpers.

guardian_sample_ambient_light:
  alias: Guardian - Sample Camera Brightness
  description: Turns the bulb off briefly, measures the C110 frame, and applies hysteresis.
  # WAS mode: single WITH SIX BLOCKING CALLERS, which is the plainest instance of
  # the silent-drop rule in this repository: single has no queue at all, so the
  # second concurrent blocking call is discarded outright and its caller carries
  # on as though the sample had been taken.
  #
  # The six are "Guardian: Camera-Based Lamp Control", "Guardian: Dismiss Alarm
  # from Phone", "Guardian: Elevated Mode Deactivated", guardian_lamp_success,
  # guardian_lamp_warning and guardian_reset. None reads a response variable, so
  # nothing detected it; the symptom was a lamp calibrated from a sample that was
  # never taken.
  #
  # queued rather than a higher parallel max, because single was doing real work
  # here and that work must be kept. This script blacks the bulb out, measures,
  # and puts the bulb back from prev_brightness/prev_kelvin captured at the top -
  # two concurrent runs would each capture the other's blackout as the "previous"
  # state and leave the lamp off. queued serialises exactly as single does, so
  # that race stays closed; it simply stops throwing the second call away.
  #
  # The trade is explicit: a redundant sample is now taken a moment late instead
  # of being dropped. At a 30-minute sampling cadence that costs nothing, and
  # "Guardian: Camera-Based Lamp Control" already tolerates a late sample - it
  # gates on the script's own last_triggered being over 1800s old.
  mode: queued
  max: 10
  sequence:
  # Variables first so an abort can still write guardian_lamp_last_result.
  # The previous leading conditions returned before that write, so Measure now
  # and the 10-minute tick left Last decision empty and looked like a dead
  # system (helper still on camera.tapo_c110 while live view used door_camera).
  - variables:
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
      camera_entity: >-
        {% set raw = states('input_text.guardian_camera_entity') | string | trim %}
        {% set door = 'camera.door_camera' %}
        {% set door_ok = states(door) not in ['unknown', 'unavailable'] %}
        {% set raw_ok = raw not in ['', 'none', 'unknown', 'unavailable']
           and states(raw) not in ['unknown', 'unavailable'] %}
        {% set unset = raw in ['', 'none', 'unknown', 'unavailable',
           'camera.tapo_c110'] %}
        {% if raw_ok and not unset %}{{ raw }}
        {%- elif unset and door_ok %}{{ door }}
        {%- elif raw_ok %}{{ raw }}
        {%- else %}none{% endif %}
      # Same `none` contract as camera_entity above and lamp below: whatever a
      # household typed into the helper, this holds an entity id or the
      # sentinel. ir_valid still gates every USE of it; this is what keeps the
      # id itself from being the thing that raises.
      ir_entity: >-
        {% set e = states('input_text.guardian_camera_ir_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
  # SPLIT HERE. Everything above produces an entity id; everything below
  # consumes one. They were a single mapping, which is the same ordering bug the
  # next map down already carries a comment about ("script variable maps are not
  # all guaranteed to be ordered") - it was fixed for camera_ok and lamp_ok and
  # left in place for the nine entries here that read `lamp` and `ir_entity`.
  #
  # No live failure today: every consumer below happens to short-circuit on the
  # sentinel before it reaches states(), so an unordered read yields a wrong
  # value rather than a TemplateError. That is luck holding a guarantee, and the
  # guarantee is one step away.
  - variables:
      ir_valid: "{{ ir_entity not in ['', 'none', 'unknown', 'unavailable'] and\n
        \  states(ir_entity) not in ['unknown', 'unavailable'] }}"
      ir_was_on: '{{ ir_valid and is_state(ir_entity, ''on'') }}'
      # Tapo night vision is exposed as a switch on some integrations and as a
      # select ("Night Vision Mode": auto/on/off) on others. The domain was
      # previously hardcoded to switch, and the resulting error was swallowed by
      # continue_on_error, so IR silently stayed on and every dark-scene reading
      # was an IR-illuminated frame measuring far too bright (audit F-08).
      ir_domain: '{{ ir_entity.split(''.'')[0] if ir_valid else '''' }}'
      # For a select we must restore the exact previous option: capturing only a
      # boolean loses "auto", which is the common default.
      ir_prev: '{{ states(ir_entity) if ir_valid else '''' }}'
      ir_off_option: "{{ (state_attr(ir_entity, 'options') or [])\n   | select('match',
        '(?i)^off$') | list | first | default('off', true) if ir_valid else 'off'
        }}"
      was_on: '{{ is_state(lamp, ''on'') }}'
      prev_brightness: '{{ state_attr(lamp, ''brightness'') | int(255)
        }}'
      prev_rgb: '{{ state_attr(lamp, ''rgb_color'') }}'
      prev_kelvin: '{{ state_attr(lamp, ''color_temp_kelvin'') }}'
      # Independent corroboration for the camera, which is the one thing here
      # that can confidently report the opposite of reality. A C110 with night
      # vision left on floods a dark scene with IR and returns ~146 luma - well
      # above the 90 "bright" threshold - so the darker it got, the more certain
      # the system became that it should switch the lamp OFF. Blacking the bulb
      # out two seconds before the frame is taken produces the mirror error in
      # daylight: the auto-exposure has not recovered, the frame reads under 45,
      # and the lamp comes on at noon.
      #
      # Sun elevation cannot be fooled by any of that. It is used as a clamp,
      # not as the primary signal: the camera still decides, but it is not
      # allowed to reach a conclusion that contradicts the sky.
      sun_ok: '{{ states(''sun.sun'') not in [''unknown'', ''unavailable''] }}'
      sun_elev: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
  # Second map so camera_ok sees the resolved camera_entity from above, not an
  # empty sibling (script variable maps are not all guaranteed to be ordered).
  - variables:
      camera_ok: "{{ camera_entity not in ['', 'none', 'unknown', 'unavailable']
        and states(camera_entity) not in ['unknown', 'unavailable'] }}"
      lamp_ok: "{{ lamp not in ['none', '', 'unknown', 'unavailable']
        and states(lamp) not in ['unknown', 'unavailable'] }}"
  - if:
    - condition: state
      entity_id: input_boolean.guardian_lamp_sampling
      state: 'on'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_last_result
      data:
        value: "{{ now().strftime('%H:%M') }} FAILED already_running hold"
    - stop: Sample already running, or the sampling flag is stuck on
  - if:
    - condition: template
      value_template: "{{ is_state('input_text.portal_display_state', 'ALARM') }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_last_result
      data:
        # "HELD", not "FAILED". Declining to sample while the alarm has the
        # bulb pinned red is this script working correctly - the lamp is not
        # available to black out, and a frame taken through a red flash says
        # nothing about the sky. It is not a measurement failure.
        #
        # The word matters beyond the wording: the system fault list in
        # packages/guardian.yaml raises LUMA on "'FAILED' in
        # guardian_lamp_last_result", so every alarm used to light a luminance
        # fault on the dashboard and the portal's diagnostics page for as long
        # as it ran. That was invisible while alarms were rare; a stolen key
        # now raises one on a scan, which is what surfaced it.
        #
        # The sibling holds above and below (already_running, challenge,
        # feedback) are the same class of non-failure and still say FAILED.
        # Left alone deliberately - they are not on this path.
        value: "{{ now().strftime('%H:%M') }} HELD alarm"
    - stop: Alarm owns the lamp
  - if:
    - condition: template
      value_template: "{{ is_state('input_boolean.guardian_entry_challenge', 'on')
        or is_state('input_boolean.guardian_doorbell_exit_pin', 'on') }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_last_result
      data:
        value: "{{ now().strftime('%H:%M') }} FAILED challenge hold"
    - stop: Challenge owns the lamp
  - if:
    - condition: state
      entity_id: script.guardian_lamp_feedback
      state: 'on'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_last_result
      data:
        value: "{{ now().strftime('%H:%M') }} FAILED feedback hold"
    - stop: Lamp feedback flash in progress
  - if:
    - condition: template
      value_template: '{{ not lamp_ok }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_last_result
      data:
        value: "{{ now().strftime('%H:%M') }} FAILED lamp_unavailable hold"
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_lamp_fail_streak
      data:
        value: "{{ [(states('input_number.guardian_lamp_fail_streak') | int(0)
          + 1), 99] | min }}"
    - action: persistent_notification.create
      data:
        notification_id: guardian_luminance_unusable
        title: 'Guardian: ambient light sampling failed'
        message: >-
          The configured lamp (sensor.guardian_lamp_entity) is unknown or
          unavailable, so the sampler cannot
          switch it. Last result:
          {{ states('input_text.guardian_lamp_last_result') }}.
    - stop: Lamp entity is not ready
  - if:
    - condition: template
      value_template: '{{ not camera_ok }}'
    then:
    - variables:
        abort_decision: >-
          {% if sun_ok and (sun_elev | float(0)) < -6 %}on_sun
          {%- elif sun_ok and (sun_elev | float(0)) > 10 %}off_sun
          {%- else %}hold{% endif %}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ abort_decision | trim == 'on_sun' }}"
        sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ lamp }}"
          data:
            # 6500 K for the same reason as the other two turn-on sites: a warm
            # lamp is the only light the door camera has after dark, and it made
            # Frigate fail to recognise a person as one.
            color_temp_kelvin: 6500
            brightness_pct: 45
            transition: 1
      - conditions:
        - condition: template
          value_template: "{{ abort_decision | trim == 'off_sun' }}"
        sequence:
        - action: light.turn_off
          target:
            entity_id: "{{ lamp }}"
          data:
            transition: 1
    - action: input_text.set_value
      target:
        entity_id: input_text.guardian_lamp_last_result
      data:
        value: >-
          {{ now().strftime('%H:%M') }} FAILED camera_unavailable
          {{- ' sun=' ~ (sun_elev | float(0) | round(1)) if sun_ok else '' }}
          {{ abort_decision | trim }}
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_lamp_fail_streak
      data:
        value: "{{ [(states('input_number.guardian_lamp_fail_streak') | int(0)
          + 1), 99] | min }}"
    - action: persistent_notification.create
      data:
        notification_id: guardian_luminance_unusable
        title: 'Guardian: ambient light sampling failed'
        message: >-
          No usable camera for a snapshot (helper
          "{{ states('input_text.guardian_camera_entity') }}", resolved
          "{{ camera_entity }}"). The lamp fell back to sun elevation and was
          {{ 'switched on' if abort_decision | trim == 'on_sun'
             else ('switched off' if abort_decision | trim == 'off_sun'
             else 'left as it was') }}. Set More → Install to camera.door_camera
          and Save. See DEPLOY.md.
    - if:
      - condition: template
        value_template: "{{ states('input_number.guardian_lamp_fail_streak') | int(0)
          == 3 }}"
      then:
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: routine
          title: '⚠️ Guardian: ambient light sampling broken'
          message: >-
            Three consecutive failed readings. The lamp is running on sun
            elevation alone. Check input_text.guardian_camera_entity.
    - stop: Camera entity is not ready
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.guardian_lamp_sampling
  # Record what we are about to destroy, BEFORE destroying it. Everything below
  # this line can be interrupted - a restart, a snapshot that never returns, the
  # script being stopped by hand - and every one of those paths used to leave
  # the bulb dark with the only copy of its previous state held in a script
  # variable that died with the run. "Guardian: Lamp Sampling Watchdog" reads
  # this back and restores the lamp 60s later.
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_lamp_presample
    data:
      value: >-
        {{ ('on|' ~ prev_brightness | int(255) ~ '|' ~ (prev_kelvin | int(0)))
           if was_on | bool else 'off' }}
  - action: light.turn_off
    target:
      entity_id: "{{ lamp }}"
    data:
      transition: 0
  - if:
    - condition: template
      value_template: '{{ ir_domain == ''switch'' }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: '{{ ir_entity }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ ir_domain == ''select'' }}'
    then:
    - action: select.select_option
      target:
        entity_id: '{{ ir_entity }}'
      data:
        option: '{{ ir_off_option }}'
      continue_on_error: true
  # The camera needs time to drop the IR cut filter and re-expose after night
  # vision is disabled, on top of the lamp transition settling.
  #
  # The no-IR case was cut to 2s to shorten the visible night-time blackout.
  # That was a mistake: 2s is inside the C110's auto-exposure recovery window,
  # so the frame is still adapted to the lit scene and reads far darker than the
  # room actually is - which is half of "the lamp wants to come on during the
  # day". 4s costs two extra seconds of darkness at most twice an hour and
  # removes a systematic measurement error.
  - delay:
      seconds: "{{ 5 if ir_domain in ['switch', 'select'] else 4 }}"
  - action: camera.snapshot
    target:
      entity_id: '{{ camera_entity }}'
    data:
      # NOT under /config/www. Home Assistant serves that tree as /local with no
      # authentication at all, so a snapshot written there is a live frame of the
      # front door readable by anything that can reach port 8123 - every device
      # on the LAN and every node on the tailnet - with no login and no log line.
      # Nothing ever fetched this file over HTTP: the only consumer is
      # guardian-luminance.py, which opens it from disk.
      filename: /config/guardian/ambient.jpg
    continue_on_error: true
  - delay: 00:00:01
  # The command_line command is static, so the probe cannot read the mode
  # helper. Write luma-run.env immediately before forcing the sensor update.
  # Missing file -> the probe measures Manual. continue_on_error: a scripts
  # reload before the package restart must not abort the sample.
  - action: shell_command.guardian_luma_write_run
    continue_on_error: true
  # Script variables are rendered to TEXT and then literal_eval'd. str(datetime)
  # is "2026-08-14 20:00:00.123456+00:00", which does not literal_eval, so
  # '{{ utcnow() }}' produced a *string* and the comparison below was
  # datetime > str - a TypeError on every single run. The wait could therefore
  # never complete, wait.completed was always false, luminance_valid was always
  # false, and the choose at the end of this script always fell into the
  # do-nothing default branch. The lamp has never been switched by luminance.
  #
  # as_timestamp() renders as a plain float literal, which literal_eval parses
  # back to a float, so both sides of the comparison are numbers and it cannot
  # raise. (Audit F-09 flagged this comparison as a secondary risk; only the
  # last_updated -> last_reported half of that fix was applied.)
  - variables:
      sample_marker: '{{ as_timestamp(utcnow()) }}'
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.guardian_camera_luminance
    continue_on_error: true
  # last_updated only advances when the state VALUE changes, so two consecutive
  # identical readings left this waiting until it timed out, dropping the flow
  # into the do-nothing default branch. last_reported advances on every update
  # regardless of whether the value changed (audit F-09).
  - wait_template: >-
      {{ is_number(states('sensor.guardian_camera_luminance')) and
         as_timestamp(states.sensor.guardian_camera_luminance.last_reported, 0)
           > (sample_marker | float(0)) }}
    timeout: 00:00:10
    continue_on_timeout: true
  - variables:
      luminance_valid: '{{ wait.completed and is_number(states(''sensor.guardian_camera_luminance''))
        }}'
      luminance: '{{ states(''sensor.guardian_camera_luminance'') | float(0) }}'
      # Fallbacks match the helper initials in packages/guardian.yaml (45/90).
      # They previously read 55/85, a narrower band than the helpers actually
      # ship with, so a missing or unknown helper silently changed the
      # hysteresis rather than behaving like a present one.
      #
      # Auto-calibrate with a ready profile uses sensor.guardian_lamp_cal
      # attributes instead, computed inside the decision template from live
      # state so a bool script variable cannot stringify and lie. These two
      # remain the Manual (this home) helpers and are never written by retune.
      dark_threshold: '{{ states(''input_number.guardian_dark_threshold'') | float(45)
        }}'
      bright_threshold: '{{ states(''input_number.guardian_bright_threshold'') | float(90)
        }}'
  - if:
    - condition: template
      value_template: '{{ ir_domain == ''switch'' and ir_was_on }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: '{{ ir_entity }}'
      continue_on_error: true
  - if:
    - condition: template
      value_template: "{{ ir_domain == 'select' and\n   ir_prev not in ['', 'unknown',
        'unavailable'] }}"
    then:
    - action: select.select_option
      target:
        entity_id: '{{ ir_entity }}'
      data:
        option: '{{ ir_prev }}'
      continue_on_error: true
  # One verdict, computed once, so the branch taken below and the line written
  # to guardian_lamp_last_result can never disagree about what happened.
  #
  #   on_sun_override  - camera claims bright while the sun is well below the
  #                      horizon. The camera is demonstrably wrong; it is night.
  #   off_sun_override - camera claims dark while the sun is well up. Mirror
  #                      case: the auto-exposure has not recovered from the
  #                      blackout.
  #   on_camera        - measured dark, and the sun does not contradict it
  #   off_camera       - measured bright, and the sun does not contradict it
  #   on_sun           - no usable reading, but the sun is well below the horizon
  #   off_sun          - no usable reading, but the sun is well up
  #   off_day_hold     - usable reading inside the hysteresis band, and the sun
  #                      is well up. Leave the lamp off after the blackout
  #                      instead of restoring a lamp that was already on.
  #   hold             - genuinely ambiguous: inside the hysteresis band at
  #                      night or twilight, or nothing usable at all
  #   on_mismatch / off_mismatch - applied AFTER this choose, by
  #                      guardian_apply_lamp_sun_mismatch, when the lamp has
  #                      disagreed with the sky for too long even though the
  #                      camera number looked valid (typically hold at night)
  #
  # The two override verdicts are the fix for the reported behaviour, and they
  # do more than a clamp would. Merely refusing to act on a contradicted reading
  # leaves a lamp that is already off staying off all night, because a camera
  # that reports 146 luma in the dark reports it on every single sample. A
  # reading that contradicts the sky is not just untrustworthy - it is evidence
  # about which way it is wrong, so the correct action is the opposite one.
  #
  # Between -6 and +10 degrees the sky is genuinely ambiguous and the camera
  # decides alone. That band covers dusk and dawn, which is exactly where a
  # measurement beats a clock and the whole reason for sampling at all.
  #
  # Auto-calibrate before the profile is ready skips the camera threshold
  # branches (on_camera / off_camera / sun-override) and uses on_sun / off_sun
  # / hold, so an unlearned framing cannot invent daylight at night.
  #
  # The two sun-only verdicts replace what used to be a silent no-op. When the
  # measurement chain is completely broken the lamp now still does the obviously
  # right thing after dark, instead of holding whatever state it happened to be
  # in and reporting nothing anywhere.
  - variables:
      decision: >-
        {% set auto = states('input_select.guardian_lamp_luma_mode')
           | string | trim == 'Auto-calibrate' %}
        {% set cal_ready = auto
           and states('sensor.guardian_lamp_cal') not in ['unknown', 'unavailable', '']
           and (states('sensor.guardian_lamp_cal') | int(0) == 1)
           and is_number(state_attr('sensor.guardian_lamp_cal', 'dark'))
           and is_number(state_attr('sensor.guardian_lamp_cal', 'bright'))
           and (state_attr('sensor.guardian_lamp_cal', 'dark') | float(0))
               < (state_attr('sensor.guardian_lamp_cal', 'bright') | float(0)) %}
        {% set dark = (state_attr('sensor.guardian_lamp_cal', 'dark') | float(45))
           if cal_ready else (dark_threshold | float(45)) %}
        {% set bright = (state_attr('sensor.guardian_lamp_cal', 'bright') | float(90))
           if cal_ready else (bright_threshold | float(90)) %}
        {% set band_ok = dark < bright %}
        {% set night = sun_ok and sun_elev < -6 %}
        {% set day = sun_ok and sun_elev > 10 %}
        {% if auto and not cal_ready %}
          {%- if night %}on_sun
          {%- elif day %}off_sun
          {%- else %}hold{% endif %}
        {%- elif luminance_valid and band_ok and luminance >= bright
              and night %}on_sun_override
        {%- elif luminance_valid and band_ok and luminance <= dark
              and day %}off_sun_override
        {%- elif luminance_valid and band_ok and luminance <= dark
              %}on_camera
        {%- elif luminance_valid and band_ok and luminance >= bright
              and not (sun_ok and sun_elev < -3) %}off_camera
        {%- elif not luminance_valid and night %}on_sun
        {%- elif not luminance_valid and day %}off_sun
        {%- elif luminance_valid and day %}off_day_hold
        {%- else %}hold{% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ decision | trim in ['on_camera', 'on_sun',
          'on_sun_override'] }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: "{{ lamp }}"
        data:
          # 6500 K, not 4000 K. After dark this lamp is the only illumination the
          # door camera has, and Frigate runs its person detector on that frame.
          # A warm cast made a person at the door not register as one at all;
          # switching the bulb to full white made detection start working
          # immediately (confirmed by hand at the door). Detection is already
          # working against the odds here - a CPU detector, and a detect stream
          # the lamp mount leaves rotated 90 degrees - so do not hand it warm
          # light as well. Keep this in step with the other two turn-on sites.
          color_temp_kelvin: 6500
          brightness_pct: 45
          transition: 1
    - conditions:
      - condition: template
        value_template: "{{ decision | trim in ['off_camera', 'off_sun',
          'off_sun_override', 'off_day_hold'] }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: "{{ lamp }}"
        data:
          transition: 1
    # Night or twilight hysteresis, or nothing usable at all: put the lamp back
    # exactly as it was. Daytime band readings are off_day_hold above, not here.
    default:
    - action: script.guardian_restore_lamp
      data:
        was_on: '{{ was_on }}'
        prev_brightness: '{{ prev_brightness }}'
        prev_rgb: '{{ prev_rgb }}'
        prev_kelvin: '{{ prev_kelvin }}'
  # The sample is over. Clear the stash, or the watchdog would one day restore a
  # lamp state captured by some long-finished run.
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_lamp_presample
    data:
      value: none
  # What the lamp did, and why, in one line. A wrong decision used to be
  # completely invisible: the failure notification below only ever fired when
  # the reading was UNUSABLE, so a reading that was valid but wrong switched the
  # lamp and said nothing. This is now visible in the UI, in the history graph,
  # and on the portal's diagnostics page.
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_lamp_last_result
    data:
      value: >-
        {{ now().strftime('%H:%M') }}
        {{- ' luma=' ~ (luminance | round(1)) if luminance_valid else ' FAILED' }}
        {{- ' sun=' ~ (sun_elev | round(1)) if sun_ok else '' }} {{ decision | trim }}
        {%- set auto = states('input_select.guardian_lamp_luma_mode')
             | string | trim == 'Auto-calibrate' %}
        {%- set cal_ready = auto
             and (states('sensor.guardian_lamp_cal') | int(0) == 1)
             and is_number(state_attr('sensor.guardian_lamp_cal', 'dark'))
             and is_number(state_attr('sensor.guardian_lamp_cal', 'bright'))
             and (state_attr('sensor.guardian_lamp_cal', 'dark') | float(0))
                 < (state_attr('sensor.guardian_lamp_cal', 'bright') | float(0)) %}
        {%- if cal_ready %} auto
        {%- elif auto %} learn
        {%- else %} manual{% endif %}
  - action: input_number.set_value
    target:
      entity_id: input_number.guardian_lamp_fail_streak
    data:
      value: >-
        {{ 0 if luminance_valid else
           [(states('input_number.guardian_lamp_fail_streak') | int(0) + 1), 99] | min }}
  - if:
    - condition: template
      value_template: '{{ luminance_valid }}'
    then:
    # A good reading clears any standing failure notice.
    - action: persistent_notification.dismiss
      data:
        notification_id: guardian_luminance_unusable
      continue_on_error: true
    else:
    # The fixed notification_id makes this self-replacing, so a persistently
    # broken sampler produces one notification, not one per run.
    - action: persistent_notification.create
      data:
        notification_id: guardian_luminance_unusable
        title: 'Guardian: ambient light sampling failed'
        message: >-
          sensor.guardian_camera_luminance did not produce a fresh number.
          Reading: {{ states('sensor.guardian_camera_luminance') }}. The lamp
          fell back to sun elevation and was {{
            'switched on' if decision | trim == 'on_sun'
            else ('switched off' if decision | trim == 'off_sun'
            else 'left as it was') }}. Check, in order:
          /config/guardian/ exists and is writable; guardian-luminance.py is at
          /config/guardian/; the camera entity
          input_text.guardian_camera_entity is correct. See DEPLOY.md.
    # A persistent notification is a badge in the web UI that is easy never to
    # look at - which is how a sampler that had never once worked went unnoticed
    # for months. Three consecutive failures means the chain is genuinely broken
    # rather than the Tapo integration having dropped the camera for one run, so
    # escalate to the phones. Exactly once: the streak only equals 3 on one run.
    - if:
      - condition: template
        value_template: "{{ states('input_number.guardian_lamp_fail_streak') | int(0)
          == 3 }}"
      then:
      - action: script.guardian_notify_broadcast
        continue_on_error: true
        data:
          category: system
          severity: routine
          title: '⚠️ Guardian: ambient light sampling broken'
          message: >-
            Three consecutive failed readings. The lamp is running on sun
            elevation alone. See the Guardian notification in Home Assistant
            for what to check.
  # An override means the camera produced a perfectly good number that
  # contradicts the sky. The lamp is now correct either way, but the
  # measurement is not. on_sun_override at night is almost always unconfigured
  # IR (a dark scene reading ~146). off_sun_override at noon is almost always
  # auto-exposure still recovering from the blackout, not a missing night-vision
  # entity — Frigate has none, and the placeholder on Install must not be saved.
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ decision | trim == 'on_sun_override' }}"
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: guardian_luminance_contradicts_sun
          title: 'Guardian: camera brightness disagrees with the sun'
          message: >-
            {{ states('input_text.guardian_lamp_last_result') }}. The camera
            claimed bright while the sun is well down, so the lamp was switched
            on. Most likely cause: input_text.guardian_camera_ir_entity is
            "{{ states('input_text.guardian_camera_ir_entity') }}" - set it to
            the camera's real night-vision entity so infrared is disabled during
            the measurement. Leave it blank if the camera is Frigate (no IR
            entity). Failing that, in Manual mode retune
            input_number.guardian_dark_threshold / _bright_threshold against the
            luma values in the history of input_text.guardian_lamp_last_result.
    - conditions:
      - condition: template
        value_template: "{{ decision | trim == 'off_sun_override' }}"
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: guardian_luminance_contradicts_sun
          title: 'Guardian: camera brightness disagrees with the sun'
          message: >-
            {{ states('input_text.guardian_lamp_last_result') }}. The camera
            claimed dark while the sun is well up, so the lamp was switched off.
            The still was likely still adapting after the measurement blackout.
            Do not set a night-vision entity unless one actually exists. If this
            repeats on every daytime sample, raise the delay before
            camera.snapshot or check rotate= on More → Lamp.
    default:
    - if:
      - condition: template
        value_template: "{{ decision | trim in ['on_camera', 'off_camera',
          'off_day_hold'] }}"
      then:
      - action: persistent_notification.dismiss
        data:
          notification_id: guardian_luminance_contradicts_sun
        continue_on_error: true
  # After the choose and after clearing presample. Hold may have just restored
  # the lamp to off at night; if that disagreement has lasted long enough this
  # forces it on and overwrites last_result with on_mismatch / off_mismatch.
  # from_sampler is required: the sampling flag is still on, and the independent
  # tick treats that flag as "do not force".
  - action: script.guardian_apply_lamp_sun_mismatch
    data:
      from_sampler: true
      luminance_valid: '{{ luminance_valid }}'
      luminance: '{{ luminance }}'
  - if:
    - condition: state
      entity_id: input_boolean.guardian_verbose_notifications
      state: 'on'
    then:
    - action: script.guardian_notify_broadcast
      continue_on_error: true
      data:
        category: system
        severity: routine
        title: 'Guardian: lamp'
        message: "{{ states('input_text.guardian_lamp_last_result') }}"
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_lamp_sampling
  # After the flag is cleared, so retune cannot extend the 60s watchdog or
  # fight presample restore. script.turn_on: a blocking call would serialise
  # behind the 2s cal-sensor wait.
  - action: script.turn_on
    target:
      entity_id: script.guardian_lamp_cal_retune
    continue_on_error: true

guardian_occupancy_pulse:
  alias: Guardian - Occupancy Lamp Pulse
  mode: queued
  max: 3
  sequence:
  # Same guard every other writer to the Tapo carries, and it was the only one
  # missing it. The lamp-sampling wait below says nothing about ALARM or an open
  # challenge, so a /5 time pattern in elevated mode after dark could fire during
  # a live siren, replace full red with 2700 K warm white for up to 30 seconds,
  # and then hand the bulb to guardian_restore_lamp - which recognises red as a
  # Guardian hold, refuses to restore it, and turns the lamp OFF. The simulation
  # meant to make the house look occupied extinguished the alarm's most visible
  # signal, and did the same to challenge amber mid-window.
  #
  # Here in the script rather than in "Guardian: Occupancy Simulation", so a
  # manual invocation from Developer Tools is covered too, and so it matches
  # guardian_lamp_success / guardian_lamp_feedback / guardian_sample_ambient_light.
  - condition: template
    value_template: "{{ not is_state('input_text.portal_display_state', 'ALARM')
      and not is_state('input_boolean.guardian_entry_challenge', 'on')
      and not is_state('input_boolean.guardian_doorbell_exit_pin', 'on') }}"
  - wait_template: '{{ is_state(''input_boolean.guardian_lamp_sampling'', ''off'')
      }}'
    timeout: 00:00:15
    continue_on_timeout: false
  - variables:
      # Always a valid entity id or the `none` sentinel - never the raw sensor
      # state. sensor.guardian_lamp_entity reads `unknown` on a half-copied
      # install and in the startup window, and `unknown` is not an entity id:
      # it fails the service schema with vol.Invalid, which is one of the
      # exceptions continue_on_error re-raises rather than swallows. Every
      # light.* step below that takes `lamp` as its target was therefore able
      # to end its whole sequence. `none` is ENTITY_MATCH_NONE - always valid,
      # matches nothing - and every consumer here already handles it.
      lamp: >-
        {% set e = states('sensor.guardian_lamp_entity') | string | trim %}
        {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
  - condition: template
    value_template: "{{ lamp not in ['none', '', 'unknown', 'unavailable']
      and states(lamp) not in ['unknown', 'unavailable'] }}"
  - variables:
      was_on: '{{ is_state(lamp, ''on'') }}'
      prev_brightness: '{{ state_attr(lamp, ''brightness'') | int(255)
        }}'
      prev_rgb: '{{ state_attr(lamp, ''rgb_color'') }}'
      prev_kelvin: '{{ state_attr(lamp, ''color_temp_kelvin'') }}'
  - action: light.turn_on
    target:
      entity_id: "{{ lamp }}"
    data:
      color_temp_kelvin: 2700
      brightness_pct: '{{ range(20, 80) | random }}'
      transition: 2
  - delay:
      seconds: '{{ range(5, 30) | random }}'
  - action: script.guardian_restore_lamp
    data:
      was_on: '{{ was_on }}'
      prev_brightness: '{{ prev_brightness }}'
      prev_rgb: '{{ prev_rgb }}'
      prev_kelvin: '{{ prev_kelvin }}'

# Copies currently-discovered notify object ids onto every
# rfid_N_notify_target select. YAML options are only `none` at parse time;
# without this, the Keys picker offers phones the select will reject
# ("Invalid option … possible options: none"). The options: template is the
# entire action data value so Home Assistant native-types it as a list.
# After set_options, re-apply rfid_N_notify_saved if the select is still
# none and that object id is in the new list — YAML options: [none] made
# restore-state drop the phone before this script ran.
#
# The restore no longer also demands that the saved id be in the discovery CSV.
# The options list it is being checked against was just built from that same
# CSV, so the second test only ever added a way to lose the link on a boot where
# the sensor changed between the two repeats.
guardian_refresh_notify_target_options:
  alias: Guardian - Refresh RFID Notify Target Options
  description: >-
    Sets each rfid_N_notify_target options list to none plus the current
    sensor.guardian_notify_targets_available object ids, then restores
    rfid_N_notify_saved onto the select when the select is still empty
    and the saved id is in that list. A blank discovery list is a no-op, never
    a reset to none.
  mode: queued
  max: 3
  sequence:
  - repeat:
      for_each: "{{ (states('sensor.guardian_rfid_slots') | string).split(',') | map('trim') | reject('eq', '') | list }}"
      sequence:
      # Nothing discovered means nothing is known, NOT that every phone is gone.
      # Writing ['none'] here was destructive: Home Assistant fail-safes a select
      # whose value left its options back to none, the persist automation
      # mirrored that none into rfid_N_notify_saved, and the link was then
      # unrecoverable by any restart. A blank discovery list now leaves the
      # options exactly as they were.
      - if:
        - condition: template
          value_template: >-
            {{ (states('sensor.guardian_notify_targets_available')
                | string | trim) not in ['unknown', 'unavailable', 'none', ''] }}
        then:
        - action: input_select.set_options
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ repeat.item }}_notify_target
          data:
            options: >
              {% set raw = states('sensor.guardian_notify_targets_available')
                           | string | trim %}
              {{ ['none'] + (raw.split(',') | map('trim')
                 | reject('eq', '') | list) }}
  - repeat:
      for_each: "{{ (states('sensor.guardian_rfid_slots') | string).split(',') | map('trim') | reject('eq', '') | list }}"
      sequence:
      - variables:
          saved: >-
            {{ states('input_text.rfid_' ~ repeat.item ~ '_notify_saved')
               | string | trim }}
      - if:
        - condition: template
          value_template: >-
            {% set current = states('input_select.rfid_' ~ repeat.item
               ~ '_notify_target') | string | trim %}
            {% set saved = states('input_text.rfid_' ~ repeat.item
               ~ '_notify_saved') | string | trim %}
            {% set options = state_attr('input_select.rfid_' ~ repeat.item
               ~ '_notify_target', 'options') | default([], true) | list %}
            {{ current in ['none', '', 'unknown', 'unavailable']
               and saved not in ['none', '', 'unknown', 'unavailable']
               and saved in options }}
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ repeat.item }}_notify_target
          data:
            option: '{{ saved }}'

# Closed-set room-lamp picker. YAML options are only none; this copies
# sensor.guardian_lights_available onto input_select.guardian_lamp_target,
# then restores guardian_lamp_saved. With nothing saved the target stays
# `none` and the household picks a bulb on More -> Lamp; there is no
# preferred make. This used to auto-select tapo_lamp on first run, which was
# the last place a specific bulb in one specific house leaked into the
# defaults. A later notify.{{ x }}-style injection cannot happen: consumers
# use sensor.guardian_lamp_entity, which only emits light.<id> when id is in
# the discovery CSV.
guardian_refresh_lamp_options:
  alias: Guardian - Refresh Lamp Options
  description: >-
    Sets guardian_lamp_target options to none plus discovered light object
    ids, then restores guardian_lamp_saved if it is still a live light.
  mode: queued
  max: 3
  sequence:
  - action: input_select.set_options
    continue_on_error: true
    target:
      entity_id: input_select.guardian_lamp_target
    data:
      options: >
        {% set raw = states('sensor.guardian_lights_available') | string | trim %}
        {% if raw in ['unknown', 'unavailable', 'none', ''] %}
          {{ ['none'] }}
        {% else %}
          {{ ['none'] + (raw.split(',') | map('trim')
             | reject('eq', '') | list) }}
        {% endif %}
  - if:
    - condition: template
      value_template: >-
        {% set current = states('input_select.guardian_lamp_target') | string | trim %}
        {% set saved = states('input_text.guardian_lamp_saved') | string | trim %}
        {% set options = state_attr('input_select.guardian_lamp_target', 'options')
           | default([], true) | list %}
        {% set avail = (states('sensor.guardian_lights_available') | string).split(',')
           | map('trim') | reject('eq', '') | list %}
        {{ current in ['none', '', 'unknown', 'unavailable']
           and saved not in ['none', '', 'unknown', 'unavailable']
           and saved in options
           and saved in avail }}
    then:
    - action: input_select.select_option
      continue_on_error: true
      target:
        entity_id: input_select.guardian_lamp_target
      data:
        option: "{{ states('input_text.guardian_lamp_saved') | string | trim }}"

# Per-person / household alert routing. Everyday call sites go through these
# two scripts. When every slot target is none, guardian_notify_broadcast
# fans out to sensor.guardian_notify_targets_available (the same closed set
# the picker uses). A YAML notify group cannot be that set — it loads once
# at parse time — so there is no notify.guardian_alerts in this repo.
#
# Injection rule: never action: notify.{{ x }} with an open string. Recipients
# are templated only after x is in the closed set - the live notify domain
# unioned with sensor.guardian_notify_targets_available (the same list copied
# onto the input_select options). The sensor alone was not safe to depend on:
# it was trigger-based, so it could read `unknown` while the picker still
# showed a phone, and every mapped alert was then skipped as "not linked".
#
# notify.send_message accepts title and message only; nested mobile_app extra
# data (ttl / priority / actions, including behavior: textInput) cannot ride
# that service. Those keys go out on the Companion SERVICE, notify.mobile_app_
# <device slug>, resolved from the device registry into `svc` - NOT on
# notify.<entity object id>, which is what the picker stores and which is not a
# service at all. Every payload alert in this house was failing silently on
# that mistake behind continue_on_error. No svc means no service to carry a
# payload, so those sends decline to send_message with the words rather than
# inventing a name; guardian_notify_person also logs notify_payload_dropped,
# which the broadcast deliberately does not - one dropped payload per phone per
# fan-out would bury the log it is trying to be visible in.
#
# Nested data through a script field is routinely stringified, so a PIN
# prompt must NOT pass data.actions into guardian_notify_person. It sets
# companion: doorbell_exit_pin and this script emits a YAML-literal payload.
#
# ---------------------------------------------------------------------------
# PER-PERSON FILTERING
#
# Both scripts now answer a second question before they send. Routing asks
# "which phone", filtering asks "does the person holding it want this". Every
# alert carries four tags:
#
#   category      one of mine / security / access / presence / camera / system
#   severity      routine < important < urgent
#   nonmaskable   true only for the alerts that override an explicit Off
#   subject_slot  which person the event is ABOUT, when that is known
#
# Each recipient slot is then tested against its own two helpers,
# input_select.rfid_N_notify_level and input_text.rfid_N_notify_mute, read
# DIRECTLY here in the slot loop - never through a template sensor. There is a
# sensor.guardian_notify_prefs and nothing on this path may consult it; see the
# note above it in packages/guardian_rfid.yaml, and the note below on why a
# trigger-based sensor going `unknown` under this decision once took every
# alert in the house down. The failure mode is worse for preferences than for
# routing: an `unknown` would read as "everyone has opted out of everything".
#
# The rule, in order:
#   1. nonmaskable            -> send, full stop
#   2. category is muted      -> skip
#   3. subject_slot is this   -> send, ignoring the level floor. This is what
#      person, mine not muted     makes "Urgent only, but always tell me when
#                                 MY key is used" expressible at all, and it is
#                                 the reason this is a level PLUS toggles and
#                                 not one flat radio - loudness and subject are
#                                 two axes and one control cannot say both.
#   4. severity >= floor      -> send, else skip
#
# Two invariants. Break either and the feature becomes a way to lose alerts:
#
#   FAIL OPEN. The field defaults are category: system, severity: important,
#   which pass at the default level. A call site nobody has tagged yet behaves
#   exactly as it did before this change. Unknown level strings and unparseable
#   mute lists both fall back to the permissive default too. Silence is never
#   the safe direction here; this is the same reasoning as `rack_ready` below,
#   where an install fault had been reported as a verdict about the user.
#
#   OFF IS NOT A KILL SWITCH. Major alarm, stolen card and portal tamper pass
#   nonmaskable: true and reach every linked phone regardless of preference. A
#   settings screen on a burglar alarm that can silently disable the burglar
#   alarm is not a settings screen, it is a trap, and the household member who
#   set it to Off six months ago will not remember doing so. The panel states
#   this in plain words on the same screen. Keep nonmaskable an explicit field
#   at the call sites rather than deriving it from severity == urgent: the set
#   of alerts allowed to override a person's stated wish should be short,
#   deliberate, and greppable, not whatever a future tag happens to imply.
#
# Two people on one phone: their preferences are UNIONed - the phone rings if
# either wants it. Slot-level opt-out cannot be enforced against a device two
# people share, so this errs toward delivery.
# ---------------------------------------------------------------------------
# ONE Companion send, alone in its own script run.
#
# THIS EXISTS BECAUSE continue_on_error CANNOT GUARD A SERVICE NAME. Home
# Assistant's _ScriptRun._handle_exception re-raises vol.Invalid, TemplateError
# and ServiceNotFound whatever continue_on_error says - it only swallows
# HomeAssistantError, i.e. a device that is reachable in principle and did not
# answer. "action: notify.{{ svc }}" against a service that no longer exists
# raises ServiceNotFound, and every one of the four call sites that used to make
# that call directly carried a comment saying continue_on_error handled it.
#
# What that cost, in guardian_notify_broadcast, was the whole fan-out: the call
# sits inside "repeat: for_each" over the recipients, an error inside a repeat
# ends the entire run, and the exception was never caught - so ONE stale phone
# meant every recipient after it in the list got no alarm push at all, silently.
#
# svc is derived from the device registry (mobile_app_<slugified device name>)
# and is never checked against the live SERVICE registry, because a template has
# no way to ask. The entity check one condition up - "target in allowed" - only
# proves the notify ENTITY exists. Those are different registries and Home
# Assistant is actively migrating mobile_app from the first to the second, so
# the gap between them is widening, not closing.
#
# Fired with script.turn_on, this runs in its own context: a ServiceNotFound in
# here still logs loudly and cannot reach the caller's sequence. The trade is
# that the caller no longer learns whether the send worked - which it never did
# anyway, because continue_on_error was hiding the outcome it failed to catch.
#
# The injection rule from guardian_notify_broadcast still holds and is not
# weakened by moving the call: every caller resolves svc from the device
# registry and refuses to call at all when it is empty. Nothing here templates a
# service name from an open string.
guardian_notify_send_one:
  alias: Guardian - Notify Send One
  description: >-
    Sends one already-resolved Companion notification. Called only with
    script.turn_on, so a service name that no longer resolves cannot end the
    caller's sequence. Not a routing decision - the caller has already made it.
  # One service call per run, finishing in milliseconds. A single broadcast
  # spawns one run per recipient and several alerts can be in flight at once, so
  # the depth is set far above any household's recipient count on purpose: a run
  # dropped here is an alarm push dropped in silence, which is the exact failure
  # this script was written to end.
  mode: parallel
  max: 60
  fields:
    svc:
      description: Companion service object id, e.g. mobile_app_pixel_8
      required: true
    title:
      description: Notification title
      required: true
    message:
      description: Notification body
      required: true
    payload:
      description: Nested mobile_app data (ttl, priority, actions).
      required: false
  sequence:
  # Guarded so an empty svc is a no-op rather than a call to "notify.". The
  # callers all test svc != '' first; this is the second copy of that test,
  # because this script is the only thing standing between a bad name and the
  # log.
  - condition: template
    value_template: "{{ svc | default('', true) | string | trim != '' }}"
  - action: notify.{{ svc }}
    data:
      title: '{{ title }}'
      message: '{{ message }}'
      data: "{{ payload if payload is mapping else {} }}"

guardian_notify_broadcast:
  alias: Guardian - Notify Broadcast
  description: >-
    Sends one alert to every unique non-none rfid_N_notify_target. If no slot
    has a phone linked, fans out to every object id in
    sensor.guardian_notify_targets_available and logs that. If that list is
    also empty, logs only.
  # max WAS 20 AGAINST A DEMAND OF 36, and the call it could drop was the worst
  # one in the system: a blocking call to a parallel script already at max is
  # discarded silently, so an alarm escalation reached nobody's phone and
  # reported success.
  #
  # Seventeen units call this blocking. Sixteen are single or queued and hold one
  # run each; the seventeenth is guardian_notify_person at parallel/max: 20, and
  # every one of those runs can reach the blocking call here in its is_critical
  # branch - the branch that forwards the nonmaskable tags so a major alarm
  # escalating out of an unlinked slot is not filtered away by somebody's Off.
  # 20 + 16 = 36.
  #
  # WORTH RECORDING, BECAUSE IT IS THE EASY MISTAKE: the first count of this came
  # to 21, by leaving out the callers that pass continue_on_error. That flag has
  # NOTHING to do with dropping. It decides what happens when a callee RAISES; a
  # call that is discarded for want of a queue slot never runs, never raises, and
  # is invisible to it. A guarded blocking call occupies capacity and is deceived
  # by a drop exactly like an unguarded one. Count every blocking call.
  #
  # 40 clears the demand with margin. A max is a ceiling, not a reservation, so
  # the cost of the headroom is nothing until it is used. check_blocking_call_capacity
  # in tools/guardian-preflight.py computes both sides from the call graph and
  # fails if this goes short again - including if guardian_notify_person's own
  # max is raised without raising this one, which is the coupling that made the
  # original number wrong.
  mode: parallel
  max: 40
  fields:
    title:
      description: Notification title
      required: true
      example: 'Guardian: test'
      selector:
        text:
    message:
      description: Notification body
      required: true
      example: Test message
      selector:
        text:
          multiline: true
    payload:
      description: >-
        Optional nested mobile_app payload (ttl, priority, actions). Named
        payload, not data: a script field named data is stringified on the way
        in, extra is mapping is then false, and the priority/ttl that must wake
        a phone at 2am is dropped. Same class as guardian_notify_person's
        companion: workaround.
      required: false
    category:
      description: >-
        Which kind of alert this is, for per-person filtering: mine, security,
        access, presence, camera or system. Defaults to system, which passes at
        the default level, so an untagged call site keeps its old behaviour.
      required: false
      default: system
      example: camera
      selector:
        text:
    severity:
      description: routine, important or urgent. Defaults to important.
      required: false
      default: important
      example: urgent
      selector:
        text:
    nonmaskable:
      description: >-
        Overrides every preference, including Off. True only for major alarm
        and stolen card. Deliberately not derived from severity.
      required: false
      default: false
      selector:
        boolean:
    subject_slot:
      description: >-
        The slot this event is ABOUT, when that is known. That person receives
        it even at Urgent only, unless they have muted the mine category.
      required: false
      default: ''
      example: '1'
      selector:
        text:
  sequence:
  - variables:
      extra: "{{ payload if payload is mapping else {} }}"
      # The four tags, coerced once. `| string | trim` on subj is not optional:
      # a script field rendering the text 1 comes back as the INTEGER 1, and
      # 1 != '1' in Jinja, so an uncoerced compare against a slot id is always
      # False. That single omission is documented at length in
      # guardian_notify_person below, where it made every phone link in this
      # house dead for the entire life of the feature.
      cat: "{{ category | default('system', true) | string | trim | lower }}"
      sev: "{{ severity | default('important', true) | string | trim | lower }}"
      nomask: '{{ nonmaskable | default(false, true) | bool }}'
      subj: "{{ subject_slot | default('', true) | string | trim }}"
      # Same closed set as guardian_notify_person: the live notify domain first,
      # the discovery sensor second, unioned. The sensor alone could be blank
      # for ten minutes after a template reload, which silently reduced a
      # broadcast to nothing at all.
      allowed: >-
        {% set skip = ['guardian_data_log', 'persistent_notification',
                       'guardian_alerts'] %}
        {% set live = states.notify | map(attribute='object_id')
                      | reject('in', skip) | list %}
        {% set csv = (states('sensor.guardian_notify_targets_available')
                      | string).split(',') | map('trim') | reject('eq', '') | list %}
        {{ (live + csv) | unique | list }}
  - variables:
      # Every linked phone, BEFORE preferences are applied. Kept separate from
      # slot_ids because "nobody has linked a phone" and "everybody linked one
      # and none of them wants this" are different facts with different
      # remedies, and the fallback fan-out below is right for the first and
      # catastrophic for the second - it would post every muted alert to every
      # phone in the house, which is the exact behaviour this feature exists to
      # end.
      linked_ids: >-
        {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                       | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(ids=[]) %}
        {% for i in slots %}
          {% set t = states('input_select.rfid_' ~ i ~ '_notify_target')
                     | string | trim %}
          {% if t not in ['none', '', 'unknown', 'unavailable'] and t in allowed
             and t not in ns.ids %}
            {% set ns.ids = ns.ids + [t] %}
          {% endif %}
        {% endfor %}
        {{ ns.ids | join(',') }}
      # The same rack walk, now asking each slot whether it wants this alert.
      # See the PER-PERSON FILTERING note above for the rule and why it is
      # written out here rather than read from a sensor.
      #
      # Note the dedupe by target and NOT by decision: a phone two slots share
      # is added the first time any of those slots says yes, so preferences are
      # unioned across the people behind one device.
      slot_ids: >-
        {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                       | map('trim') | reject('eq', '') | list %}
        {% set floors = {'Everything': 0, 'Important': 1,
                         'Urgent only': 2, 'Off': 3} %}
        {% set ranks = {'routine': 0, 'important': 1, 'urgent': 2} %}
        {% set rank = ranks.get(sev, 1) %}
        {% set ns = namespace(ids=[]) %}
        {% for i in slots %}
          {% set t = states('input_select.rfid_' ~ i ~ '_notify_target')
                     | string | trim %}
          {% set lvl = states('input_select.rfid_' ~ i ~ '_notify_level')
                       | string | trim %}
          {# Anything unexpected - unknown, unavailable, a helper that has not
             merged - reads as the permissive default. Fail open. #}
          {% set floor = floors.get(lvl, 1) %}
          {% set raw = states('input_text.rfid_' ~ i ~ '_notify_mute')
                       | string | trim %}
          {% set muted = raw.split(',') | map('trim') | reject('eq', '') | list
                         if raw not in ['unknown', 'unavailable'] else [] %}
          {% set wants = nomask
             or (cat not in muted
                 and ((subj != '' and subj == i and 'mine' not in muted)
                      or rank >= floor)) %}
          {% if wants and t not in ['none', '', 'unknown', 'unavailable']
             and t in allowed and t not in ns.ids %}
            {% set ns.ids = ns.ids + [t] %}
          {% endif %}
        {% endfor %}
        {{ ns.ids | join(',') }}
      avail_ids: '{{ allowed | join(",") }}'
  - variables:
      using_fallback: >-
        {{ (linked_ids | string).split(',') | map('trim')
           | reject('eq', '') | list | count == 0 }}
      # Phones exist and are linked, and preferences ruled all of them out.
      # This is a correct, quiet outcome - not a fault, and not a reason to
      # fall back to anything.
      filtered_empty: >-
        {{ (linked_ids | string).split(',') | map('trim')
           | reject('eq', '') | list | count > 0
           and (slot_ids | string).split(',') | map('trim')
           | reject('eq', '') | list | count == 0 }}
      recipient_ids: >-
        {% if (slot_ids | string).split(',') | map('trim')
              | reject('eq', '') | list | count > 0 %}
          {{ slot_ids }}
        {% elif (linked_ids | string).split(',') | map('trim')
                | reject('eq', '') | list | count > 0 %}
          {{ '' }}
        {% else %}
          {{ avail_ids }}
        {% endif %}
  # Nobody linked to this house wanted this one. Log it and stop, BEFORE the
  # fallback branch below - reaching that would fan a filtered alert out to
  # every discovered phone and undo the whole feature.
  - if:
    - condition: template
      value_template: '{{ filtered_empty | bool }}'
    then:
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.guardian_data_log
      data:
        message: >-
          {{ {'log_type': 'notify_filtered', 'timestamp': now().isoformat(),
              'scope': 'broadcast', 'category': cat, 'severity': sev,
              'subject_slot': subj, 'linked': linked_ids,
              'title': title, 'message': message} | to_json }}
    - variables:
        result:
          decision: filtered
          recipients: ''
          recipient_count: 0
    - stop: Notify routing complete
      response_variable: result
  # The no-linked-phone fallback stays UNFILTERED on purpose. Preferences are
  # attached to a key, and this branch only runs when no key is linked to any
  # phone at all - so there is nobody whose stated wish is being overridden,
  # and every recipient here is a discovered device rather than a person. The
  # filtered_empty stop above is what keeps a muted alert from ever arriving
  # here.
  - if:
    - condition: template
      value_template: '{{ using_fallback | bool }}'
    then:
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.guardian_data_log
      data:
        message: >-
          {{ {'log_type': 'notify_fallback', 'timestamp': now().isoformat(),
              'title': title, 'message': message,
              'recipients': recipient_ids} | to_json }}
    # continue_on_error: this is a notice ABOUT a delivery problem, standing in
    # the middle of a fan-out. Unguarded it could end the broadcast it is
    # describing - and this script is called blocking from
    # guardian_notification_selftest, so the failure propagated out into whatever
    # was running next. Preflight found it once it learned to walk into blocking
    # script calls.
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_notify_fallback
        title: 'Guardian: alert used discovered companion apps'
        message: >-
          No RFID slot has a phone linked, so this alert
          {% if (recipient_ids | string).split(',') | map('trim')
                | reject('eq', '') | list | count == 0 %}
          was logged only — no companion-app notify targets are registered.
          {% else %}
          went to every discovered companion app
          ({{ recipient_ids }}).
          {% endif %}
          Link a phone on Keys, People & Alerts to stop broadcasting to all
          of them.
  - if:
    - condition: template
      value_template: >-
        {{ (recipient_ids | string).split(',') | map('trim')
           | reject('eq', '') | list | count == 0 }}
    then:
    - variables:
        result:
          decision: fallback
          recipients: ''
          recipient_count: 0
    - stop: Notify routing complete
      response_variable: result
  - repeat:
      for_each: "{{ (recipient_ids | string).split(',') | map('trim') | reject('eq', '') | list }}"
      sequence:
      # The Companion SERVICE for this recipient, or '' when it has none. The
      # picker stores notify ENTITY object ids, and notify.<entity object id> is
      # not a service - those calls errored into continue_on_error and every
      # payload broadcast vanished. See the same resolution, and the same
      # reasoning, in guardian_notify_person.
      - variables:
          svc: >-
            {% set ent = 'notify.' ~ repeat.item %}
            {% if repeat.item.startswith('mobile_app_') %}
              {{ repeat.item }}
            {% elif ent in integration_entities('mobile_app') %}
              {% set dev = device_id(ent) %}
              {% if dev %}
                {% set nm = device_attr(dev, 'name') or device_attr(dev, 'name_by_user') %}
                {{ ('mobile_app_' ~ (nm | slugify)) if nm else '' }}
              {% else %}
                {{ '' }}
              {% endif %}
            {% else %}
              {{ '' }}
            {% endif %}
      - if:
        - condition: template
          value_template: '{{ repeat.item in allowed }}'
        then:
        # notify.send_message carries title and message only - it has nowhere to
        # put the nested mobile_app payload. The callers that pass one mean it:
        # a major alarm, an unauthorised elevated opening, an unexplained
        # opening, a portal or doorbell outage all send priority: high / ttl: 0
        # precisely so the push wakes a phone asleep in another room at 2am.
        # Routing those through send_message delivered them as ordinary
        # notifications to every LINKED phone, while the no-linked-phone
        # fallback above kept the priority - so linking a phone, which is the
        # thing the picker exists to encourage, quietly made Guardian's most
        # urgent alerts the easiest ones to sleep through. Use the Companion
        # service form whenever there is a payload and a service to carry it.
        - choose:
          - conditions:
            - condition: template
              value_template: >-
                {{ extra is mapping and extra | count > 0 and svc != '' }}
            sequence:
            # Isolated in its own run - see guardian_notify_send_one. This call
            # is inside a repeat, and an error inside a repeat ends the run, so
            # a ServiceNotFound here used to silently cancel the push to every
            # recipient after this one. continue_on_error never caught it.
            - action: script.turn_on
              continue_on_error: true
              target:
                entity_id: script.guardian_notify_send_one
              data:
                variables:
                  svc: '{{ svc }}'
                  title: '{{ title }}'
                  message: '{{ message }}'
                  payload: '{{ extra }}'
          default:
          - action: notify.send_message
            continue_on_error: true
            target:
              entity_id: notify.{{ repeat.item }}
            data:
              title: '{{ title }}'
              message: '{{ message }}'
  - variables:
      result:
        decision: "{{ 'fallback' if using_fallback | bool else 'targets' }}"
        recipients: '{{ recipient_ids }}'
        recipient_count: "{{ (recipient_ids | string).split(',') | map('trim') | reject('eq', '') | list | count }}"
  - stop: Notify routing complete
    response_variable: result

guardian_notify_person:
  alias: Guardian - Notify Person
  description: >-
    Sends one alert to the phone linked to a single RFID slot. Unmapped and
    critical falls back to broadcast; unmapped and not critical is skipped
    and logged. Slot is validated against sensor.guardian_rfid_slots.
  mode: parallel
  max: 20
  fields:
    slot:
      description: Slot id (1-9)
      required: true
      example: '1'
      selector:
        text:
    title:
      description: Notification title
      required: true
      example: 'Guardian: test'
      selector:
        text:
    message:
      description: Notification body
      required: true
      example: Test message
      selector:
        text:
          multiline: true
    data:
      description: Optional nested mobile_app payload (ttl, priority, actions)
      required: false
    companion:
      description: >-
        doorbell_exit_pin builds a YAML-literal textInput payload for the
        mapped phone. doorbell_exit_done replaces that tagged shade without
        a PIN field. Do not pass those payloads through the data field.
      required: false
      default: none
      example: doorbell_exit_pin
      selector:
        text:
    critical:
      description: If true, unmapped slots fall back to broadcast instead of skip
      required: false
      default: false
      selector:
        boolean:
    category:
      description: >-
        mine, security, access, presence, camera or system. Defaults to mine -
        this script sends to one named person, and all but a handful of its
        callers are telling that person about their own key. Defaults to
        passing at the default level either way.
      required: false
      default: mine
      example: mine
      selector:
        text:
    severity:
      description: routine, important or urgent. Defaults to important.
      required: false
      default: important
      example: urgent
      selector:
        text:
    nonmaskable:
      description: >-
        Overrides every preference, including Off. True only for major alarm
        and stolen card.
      required: false
      default: false
      selector:
        boolean:
    subject_slot:
      description: >-
        The slot this event is ABOUT. Defaults to slot, because a per-person
        alert is nearly always about the person receiving it. Pass it
        explicitly only when telling one person about a different key.
      required: false
      default: ''
      example: '1'
      selector:
        text:
  sequence:
  - variables:
      which: '{{ slot | string | trim }}'
      extra: "{{ data if data is mapping else {} }}"
      kind: "{{ companion | default('none', true) | string | trim }}"
      is_critical: '{{ critical | default(false, true) | bool }}'
      # The four filtering tags. See the PER-PERSON FILTERING note above
      # guardian_notify_broadcast for the rule these feed.
      #
      # subj defaults to `which`, not to '': this script exists to tell one
      # named person something, and every current caller - card accepted, card
      # denied, the doorbell exit PIN challenge, a newly enrolled key - is
      # telling them about their own key. So a person-directed alert reaches
      # that person even at Urgent only, and the way to stop it is the mine
      # toggle, which is precisely the control that names it.
      #
      # `| string | trim` throughout, and read the long note further down on
      # what happens when that is left off a slot comparison.
      cat: "{{ category | default('mine', true) | string | trim | lower }}"
      sev: "{{ severity | default('important', true) | string | trim | lower }}"
      nomask: '{{ nonmaskable | default(false, true) | bool }}'
      subj: >-
        {{ (subject_slot | default('', true) | string | trim)
           if (subject_slot | default('', true) | string | trim) != ''
           else (slot | string | trim) }}
      # Can this install answer "what is the slot rack" AT ALL, as opposed to
      # answering "slot 1 is not in it"? Those are different facts and the
      # difference is the whole point of this variable.
      #
      # sensor.guardian_rfid_slots lives in packages/guardian_rfid.yaml and its
      # state is the static string 1,2,3,4,5,6,7,8,9. When that package has not
      # merged - copied without the full restart packages require, or not copied
      # at all - the entity does not exist, states() returns `unknown`, the
      # membership test below is false, and `target` collapses to 'none'. Every
      # downstream check then reports the household has not linked a phone.
      #
      # That is a lie, and it is the specific lie that made this bug so
      # expensive: a key with a phone plainly selected in the picker was told
      # "this key has no phone linked", so a deployment fault was read as a
      # setup mistake and the search went looking in the wrong half of the
      # system. An infrastructure failure must never be reported as a verdict
      # about the user's configuration. Below, a false `rack_ready` produces its
      # own skip reason, `not_ready`, which says what is actually wrong.
      #
      # Deliberately NOT fixed by inlining 1-9 here. The rack is one list in one
      # place on purpose (see the note on that sensor); a second copy is how it
      # drifts. The defect was never the dependency, it was reporting the
      # dependency's absence as the user's fault.
      rack_ready: >-
        {{ states('sensor.guardian_rfid_slots')
           not in ['unknown', 'unavailable', 'none', ''] }}
      # `which | string`, not bare `which` - and this one character is what made
      # every phone link in this house dead for the entire life of the feature.
      #
      # Home Assistant re-parses a rendered template into a native Python type.
      # `which` above renders the text 1 and comes back as the INTEGER 1, not
      # the string '1'. Both halves of that are load-bearing here:
      #
      #   'input_select.rfid_' ~ which ~ '_notify_target'   ~ stringifies, so the
      #                                                     entity id is correct
      #   which in ['1','2','3', ...]                       1 != '1' in Jinja, so
      #                                                     ALWAYS False
      #
      # So the slot was ruled off the rack, `target` fell to the else branch,
      # and a key with a phone plainly selected reported "no phone linked". The
      # helper was always fine - every read of it, in the panel and in
      # script.guardian_selfcheck, returned the phone - which is exactly why
      # three previous passes hardened the wrong things: the picker, the
      # discovery sensor, the restore mirror. None of them was ever consulted,
      # because this comparison had already decided the answer.
      #
      # Every other slot check in this system coerces inside the template -
      # `(matched_slot | string | trim) in (...)` - and works. Intermediate
      # values inside one template keep their Jinja types; only the final
      # rendered result is converted. These two lines were the only ones that
      # compared the already-converted variable, and they are the only two on
      # the notification path. Never compare a script variable to a list of
      # strings without `| string`.
  # SPLIT. `target` reads `which`, which is declared in the map above it, and
  # Home Assistant does not guarantee one entry of a variables mapping sees
  # another's value. This is the notification path, and this exact mapping has
  # already produced one silent, house-wide failure: `which` coming back as the
  # integer 1 rather than the string '1' made every membership test false and
  # reported every linked phone as unlinked, for the whole life of the feature.
  # The ordering hazard sitting underneath that is the same shape of bug waiting
  # for a different trigger.
  #
  # An unordered read renders `input_select.rfid__notify_target` - a double
  # underscore, which Home Assistant's own valid_entity_id rejects. Today the
  # `if ... else 'none'` is evaluated before the states() call and short-circuits
  # to the sentinel, so it cannot raise. If that conditional is ever
  # restructured, states() raises TemplateError, and inside a `variables:` block
  # that is UNGUARDABLE - continue_on_error has no action to attach to. The
  # script would abort in front of every send below it, silently, on the path
  # that carries the major-alarm push.
  - variables:
      target: "{{ states('input_select.rfid_' ~ which ~ '_notify_target') | string | trim if (which | string | trim) in ((states('sensor.guardian_rfid_slots') | string).split(',') | map('trim') | reject('eq', '') | list) else 'none' }}"
      # THE closed set. Live notify entities first, the discovery sensor second,
      # unioned. It used to be the sensor alone, and that is what made every
      # linked phone unreachable on the live house: the sensor was trigger-based,
      # so a template reload or a slow mobile_app load left it `unknown` while
      # the picker - which renders from the select's own persisted options -
      # still showed the phone. The set the send decision is made against must be
      # the one that cannot go blank underneath it. Both halves are closed sets
      # of real object ids, so the notify.{{ }} injection guard is unchanged.
      allowed: >-
        {% set skip = ['guardian_data_log', 'persistent_notification',
                       'guardian_alerts'] %}
        {% set live = states.notify | map(attribute='object_id')
                      | reject('in', skip) | list %}
        {% set csv = (states('sensor.guardian_notify_targets_available')
                      | string).split(',') | map('trim') | reject('eq', '') | list %}
        {{ (live + csv) | unique | list }}
  - variables:
      selected: >-
        {{ target not in ['none', '', 'unknown', 'unavailable'] }}
      # Same `| string` coercion as `target` above, for the same reason: bare
      # `which` is an int here and never matches the string slot ids. Left
      # unfixed this line alone would keep every send skipped even with `target`
      # resolving correctly.
      mapped: >-
        {{ (which | string | trim) in
             ((states('sensor.guardian_rfid_slots') | string).split(',')
             | map('trim') | reject('eq', '') | list)
           and target not in ['none', '', 'unknown', 'unavailable']
           and target in allowed }}
      # The Companion notify SERVICE for this target, or '' when there is none.
      #
      # notify.send_message carries title and message only, so every payload
      # branch below needs the legacy service. The picker stores the notify
      # ENTITY object id (notify.your_phone), and the service is a different
      # name (notify.mobile_app_your_phone) built from the device name at
      # registration - calling notify.<entity object id> is not a service at all,
      # and with continue_on_error every payload alert died silently. Resolve it
      # from the device registry, and only for entities that really belong to
      # mobile_app; anything else falls back to send_message rather than
      # inventing a service name that does not exist.
      svc: >-
        {% set ent = 'notify.' ~ target %}
        {% if target in ['none', '', 'unknown', 'unavailable'] %}
          {{ '' }}
        {% elif target.startswith('mobile_app_') %}
          {{ target }}
        {% elif ent in integration_entities('mobile_app') %}
          {% set dev = device_id(ent) %}
          {% if dev %}
            {% set nm = device_attr(dev, 'name') or device_attr(dev, 'name_by_user') %}
            {{ ('mobile_app_' ~ (nm | slugify)) if nm else '' }}
          {% else %}
            {{ '' }}
          {% endif %}
        {% else %}
          {{ '' }}
        {% endif %}
  # Does the person in slot `which` want this one? Their two helpers, read
  # directly - never through sensor.guardian_notify_prefs. See the PER-PERSON
  # FILTERING note above guardian_notify_broadcast for the rule, the fail-open
  # invariant, and why Off is not a kill switch.
  - variables:
      wants: >-
        {% set floors = {'Everything': 0, 'Important': 1,
                         'Urgent only': 2, 'Off': 3} %}
        {% set ranks = {'routine': 0, 'important': 1, 'urgent': 2} %}
        {% set lvl = states('input_select.rfid_' ~ which ~ '_notify_level')
                     | string | trim %}
        {# Unknown, unavailable, or a helper that never merged all read as the
           permissive default. A missing preference must never mean silence. #}
        {% set floor = floors.get(lvl, 1) %}
        {% set raw = states('input_text.rfid_' ~ which ~ '_notify_mute')
                     | string | trim %}
        {% set muted = raw.split(',') | map('trim') | reject('eq', '') | list
                       if raw not in ['unknown', 'unavailable'] else [] %}
        {{ nomask
           or (cat not in muted
               and ((subj == (which | string | trim) and 'mine' not in muted)
                    or ranks.get(sev, 1) >= floor)) }}
  # Filtered, and the branch order matters. This sits BEFORE the is_critical
  # fallback below: `critical` decides what happens to a slot with no phone
  # linked, which is a configuration gap, and it must never be read as licence
  # to fan an alert this person has explicitly declined out to the whole
  # household.
  #
  # Logged, but no persistent_notification. The notify_skipped shade further
  # down exists to report a misconfiguration the household can fix; a
  # preference that was honoured is not a fault, and a settings screen that
  # nags every time it works is one people turn off.
  - if:
    - condition: template
      value_template: '{{ not wants | bool }}'
    then:
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.guardian_data_log
      data:
        message: >-
          {{ {'log_type': 'notify_filtered', 'timestamp': now().isoformat(),
              'scope': 'person', 'slot': which, 'category': cat,
              'severity': sev, 'subject_slot': subj, 'target': target,
              'title': title, 'message': message} | to_json }}
    - variables:
        result:
          decision: filtered
          reason: preference
          target: '{{ target }}'
          recipients: ''
          recipient_count: 0
    - stop: Notify routing complete
      response_variable: result
  - if:
    - condition: template
      value_template: '{{ mapped | bool }}'
    then:
    # Re-check the closed set at the call site so a stale target variable
    # cannot skip the injection control. send_message cannot carry Companion
    # actions, so every payload branch needs svc - the mobile_app SERVICE - and
    # declines to a plain send_message when there is none rather than calling a
    # service name that does not exist. doorbell_exit_pin is a YAML-literal
    # payload, not extra, because nested data through a script field is
    # stringified.
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ kind == 'doorbell_exit_pin' and svc != ''
               and target in allowed }}
        sequence:
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.guardian_data_log
          data:
            message: >-
              {{ {'log_type': 'notify_companion', 'kind': kind,
                  'target': target | trim, 'service': svc, 'slot': which,
                  'timestamp': now().isoformat()} | to_json }}
        # svc is resolved from the device registry a few steps earlier, so a
        # device renamed or unregistered in between makes this a service that
        # does not exist. This used to be a direct "action: notify.{{ svc }}"
        # with continue_on_error and a comment saying that covered it. It did
        # not: ServiceNotFound is one of the exceptions continue_on_error
        # re-raises, so the raise still skipped the is_critical
        # fallback-to-broadcast at the foot of this script - the very thing the
        # guard was there to protect. Isolated in its own run instead; see
        # guardian_notify_send_one.
        #
        # The payload rides as a variable rather than a script field, so the
        # nesting survives - the same reason the major alarm push moved to
        # script.turn_on in the forty-first pass.
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: script.guardian_notify_send_one
          data:
            variables:
              svc: '{{ svc }}'
              title: '{{ title }}'
              message: '{{ message }}'
              payload:
                ttl: 0
                priority: high
                tag: guardian_doorbell_exit_pin
                persistent: true
                sticky: true
                channel: alarm_stream
                importance: high
                url: /guardian
                clickAction: /guardian
                push:
                  sound: default
                  interruption-level: time-sensitive
                actions:
                - action: GUARDIAN_DOORBELL_EXIT_PIN
                  title: Enter PIN
                  behavior: textInput
                  textInputButtonTitle: Confirm
                  textInputPlaceholder: Master PIN
      - conditions:
        - condition: template
          value_template: >-
            {{ kind == 'doorbell_exit_done' and svc != ''
               and target in allowed }}
        sequence:
        # Isolated for the same reason as the branch above.
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: script.guardian_notify_send_one
          data:
            variables:
              svc: '{{ svc }}'
              title: '{{ title }}'
              message: '{{ message }}'
              payload:
                tag: guardian_doorbell_exit_pin
                ttl: 0
                priority: high
                persistent: false
                sticky: false
                url: /guardian
                clickAction: /guardian
      - conditions:
        - condition: template
          value_template: >-
            {{ extra is mapping and extra | count > 0 and svc != ''
               and target in allowed }}
        sequence:
        # Isolated for the same reason as the two branches above. This is the
        # branch the major alarm and the stolen card reach when they address a
        # single person, so a stale service name here was a nonmaskable alert
        # that raised instead of arriving.
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: script.guardian_notify_send_one
          data:
            variables:
              svc: '{{ svc }}'
              title: '{{ title }}'
              message: '{{ message }}'
              payload: '{{ extra }}'
      # A payload was meant for this target and it has no Companion service -
      # a notify entity from some other integration, or a device that is no
      # longer in the registry. Send the words rather than nothing, and say so
      # in the log: a priority: high that silently became an ordinary push is
      # exactly the kind of downgrade that has to be visible somewhere.
      - conditions:
        - condition: template
          value_template: >-
            {{ svc == ''
               and (kind in ['doorbell_exit_pin', 'doorbell_exit_done']
                    or (extra is mapping and extra | count > 0)) }}
        sequence:
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.guardian_data_log
          data:
            message: >-
              {{ {'log_type': 'notify_payload_dropped', 'kind': kind,
                  'target': target | trim, 'slot': which,
                  'timestamp': now().isoformat()} | to_json }}
        - action: notify.send_message
          continue_on_error: true
          target:
            entity_id: notify.{{ target | trim }}
          data:
            title: '{{ title }}'
            message: '{{ message }}'
      default:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.{{ target | trim }}
        data:
          title: '{{ title }}'
          message: '{{ message }}'
    # DELIVERY IS NOT CONFIRMED HERE, AND THE FIELD SAYS SO.
    #
    # Every send branch above carries continue_on_error, which is correct and
    # must stay: one phone whose notify service has gone away must not take down
    # a major-alarm push to everybody else. But it means this script cannot tell
    # a delivered notification from a swallowed failure, and it returned
    # `decision: person` either way.
    #
    # That was load-bearing in the wrong place. guardian_notification_selftest
    # asserts `decision == 'person'` as a PASS - so the one tool a household runs
    # to answer "can this alarm reach my phone?" reported success on a house
    # where every send was failing. A check that cannot fail for the reason
    # people run it is worse than no check, because it is trusted.
    #
    # `decision` still means routing, which is all it ever meant. `delivery`
    # names the thing that is genuinely unknown. Home Assistant's notify
    # platforms give no delivery receipt, so `unconfirmed` is the honest answer
    # and not a placeholder for a better one - the only real confirmation is a
    # phone that buzzes.
    - variables:
        result:
          decision: person
          delivery: unconfirmed
          recipients: '{{ target }}'
          recipient_count: 1
    - stop: Notify routing complete
      response_variable: result
  - if:
    - condition: template
      value_template: '{{ is_critical | bool }}'
    then:
    # Forward the tags. Dropping them here would re-default this alert to
    # system/important on the far side - so a major alarm escalating out of an
    # unlinked slot would arrive stripped of nonmaskable and could then be
    # filtered away by somebody's Off, which is the one outcome the
    # nonmaskable flag exists to prevent.
    - action: script.guardian_notify_broadcast
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        payload: '{{ extra }}'
        category: '{{ cat }}'
        severity: '{{ sev }}'
        nonmaskable: '{{ nomask }}'
        subject_slot: '{{ subj }}'
      response_variable: broadcast_result
    - variables:
        result:
          decision: broadcast
          recipients: "{{ broadcast_result.recipients | default('', true) }}"
          recipient_count: "{{ broadcast_result.recipient_count | default(0, true) }}"
    - stop: Notify routing complete
      response_variable: result
  # Three different failures used to report as one. Each has a different
  # remedy, performed by a different person, so collapsing them wastes the
  # household's time on the wrong half of the system.
  #
  #   not_ready       Guardian itself is not fully installed on this box -
  #                   packages/guardian_rfid.yaml has not merged, so there is no
  #                   slot rack to look a phone up in. Nothing about the
  #                   household's setup is wrong. Fix: finish the deploy and do
  #                   a full restart.
  #   not_selected    A real, answerable state: this slot has no phone picked.
  #                   Fix: pick one on Keys, People & Alerts.
  #   not_registered  A phone IS picked and Home Assistant cannot see a notify
  #                   target by that name - a reinstalled companion app, a
  #                   renamed device, a phone that has not checked in since the
  #                   last restart. Fix: open the app on that phone.
  #
  # Order matters. When the rack is missing, `target` was forced to 'none'
  # further up, so `selected` is false and this would otherwise fall through to
  # not_selected - the exact misreport this branch exists to prevent. Test
  # readiness first, before believing anything derived from it.
  - variables:
      skip_reason: "{{ 'not_ready' if not rack_ready | bool else ('not_registered' if selected | bool else 'not_selected') }}"
  - action: notify.send_message
    continue_on_error: true
    target:
      entity_id: notify.guardian_data_log
    data:
      message: >-
        {{ {'log_type': 'notify_skipped', 'timestamp': now().isoformat(),
            'slot': which, 'reason': skip_reason, 'target': target,
            'title': title, 'message': message} | to_json }}
  # Same reasoning as guardian_notify_broadcast's fallback notice: a report that
  # an alert could not be routed must never be the thing that ends the run it is
  # reporting on.
  - action: persistent_notification.create
    continue_on_error: true
    data:
      notification_id: guardian_notify_skipped
      title: 'Guardian: person alert skipped'
      message: >-
        {% if skip_reason == 'not_ready' %}
        Guardian is not fully installed on this Home Assistant: the RFID slot
        rack (sensor.guardian_rfid_slots) is missing, so no key can be looked
        up and no alert can be routed. Nothing is wrong with your keys or your
        phones. Copy packages/guardian_rfid.yaml into /config/packages/ and
        restart Home Assistant fully - packages do not merge on a reload. More
        -> Diagnostics shows which files are missing.
        {% elif skip_reason == 'not_registered' %}
        Slot {{ which }} is linked to "{{ target }}", but Home Assistant has no
        notify target by that name right now, so this non-critical alert was not
        sent. Open the companion app on that phone, then re-pick it on Keys,
        People & Alerts.
        {% else %}
        Slot {{ which }} has no linked phone; this non-critical alert was
        not sent. Link a phone on Keys, People & Alerts.
        {% endif %}
  - variables:
      result:
        decision: skip
        reason: '{{ skip_reason }}'
        target: '{{ target }}'
        recipients: ''
        recipient_count: 0
  - stop: Notify routing complete
    response_variable: result

guardian_notify_test:
  alias: Guardian - Notify Test
  description: >-
    Sends one clearly-labelled test alert to the phone currently picked in a
    single slot's Alerts go to selector. Behind the Send test alert button on
    Keys, People & Alerts, so a household can prove the link works without
    staging a real door event.

    Deliberately a thin wrapper over guardian_notify_person with
    critical: false. That script already resolves
    input_select.rfid_N_notify_target, validates the slot against
    sensor.guardian_rfid_slots and the target against the live notify domain
    before templating notify.{{ x }}, and returns
    decision / reason / recipients / recipient_count - so this adds no
    second, unvalidated notify path. critical: false also matters: a test must
    reach the one phone that is selected or nothing at all. Falling back to
    broadcast would light up every phone in the house and, worse, would report
    success for a slot whose link is actually broken.

    Wording lives here rather than in the panel, next to every other Guardian
    message. The unmapped case needs no branch: the panel disables the button
    while the selector reads none, and if it is cleared between render and tap,
    guardian_notify_person's skip path posts guardian_notify_skipped and
    returns decision: skip with a reason - not_selected or not_registered -
    which the panel reports honestly, each with its own wording.

    Sent nonmaskable, so notification preferences cannot swallow it. A test
    exists to prove the pipe works; one that a muted category silently ate
    would look exactly like a broken phone link.
  mode: parallel
  max: 4
  fields:
    slot:
      description: RFID slot id whose Alerts go to selector should be tested.
      required: true
      example: '1'
      selector:
        text:
  sequence:
  - variables:
      which: '{{ slot | string | trim }}'
      who: >-
        {% set n = states('input_text.rfid_' ~ (slot | string | trim) ~ '_name')
                   | string | trim %}
        {{ n if n not in ['', 'none', 'unknown', 'unavailable']
           else 'key ' ~ (slot | string | trim) }}
  - action: script.guardian_notify_person
    data:
      slot: '{{ which }}'
      critical: false
      # nonmaskable, and this is the one place where that flag is not about
      # urgency. The button says "Send test alert" and the household is
      # standing there watching for the buzz; a test that a preference quietly
      # swallowed would read as a broken phone link and send someone off to
      # debug routing that is working perfectly. A test proves the pipe, so it
      # must not be subject to the thing being configured.
      category: system
      severity: urgent
      nonmaskable: true
      title: 'Guardian: test alert'
      message: >-
        Test alert for {{ who }}, sent {{ now().strftime('%H:%M:%S') }} from
        Keys, People & Alerts. Nothing happened at the door - this only
        confirms that alerts about this key reach this phone.
    response_variable: sent
  - variables:
      result:
        decision: "{{ sent.decision | default('skip') }}"
        reason: "{{ sent.reason | default('') }}"
        target: "{{ sent.target | default('') }}"
        recipients: "{{ sent.recipients | default('') }}"
        recipient_count: "{{ sent.recipient_count | default(0) | int(0) }}"
  - stop: Test alert routing complete
    response_variable: result

guardian_notification_selftest:
  alias: Guardian - Notification Self-Test
  description: >-
    Proves routing and delivery. Asserts unmapped+critical broadcasts,
    mapped+non-critical reaches only that person, unmapped+non-critical is
    skipped and logged, and the zero-linked-phone fallback fans out to
    sensor.guardian_notify_targets_available (skipped when phones are
    already linked). Then asserts per-person filtering: a routine/system
    alert reaches the first linked slot only if that slot's own helpers say
    it should, and the same alert marked nonmaskable reaches it regardless.
    Reads preferences, never writes them. Run this before trusting any other
    Guardian alert: everyday call sites set continue_on_error, so a broken
    target fails silently.
  mode: single
  sequence:
  # Guarded, or the self-test can fail in its own preamble and report nothing -
  # which looks identical to the notification path being broken, the one thing
  # this script exists to distinguish.
  - action: persistent_notification.create
    continue_on_error: true
    data:
      notification_id: guardian_notify_selftest
      title: 'Guardian: notification self-test running'
      message: >-
        Exercising person/broadcast routing and the discovered-companion
        fallback. If this notice is still showing and no result appeared
        beside it, a call raised.
  - variables:
      stamp: "{{ now().strftime('%H:%M:%S') }}"
      mapped_slot: >-
        {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                       | map('trim') | reject('eq', '') | list %}
        {% set avail = (states('sensor.guardian_notify_targets_available')
                        | string).split(',') | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(slot='') %}
        {% for i in slots %}
          {% set t = states('input_select.rfid_' ~ i ~ '_notify_target')
                     | string | trim %}
          {% if ns.slot == '' and t not in ['none', '', 'unknown', 'unavailable']
             and t in avail %}
            {% set ns.slot = i %}
          {% endif %}
        {% endfor %}
        {{ ns.slot }}
      live_recipients: >-
        {% set slots = (states('sensor.guardian_rfid_slots') | string).split(',')
                       | map('trim') | reject('eq', '') | list %}
        {% set avail = (states('sensor.guardian_notify_targets_available')
                        | string).split(',') | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(ids=[]) %}
        {% for i in slots %}
          {% set t = states('input_select.rfid_' ~ i ~ '_notify_target')
                     | string | trim %}
          {% if t not in ['none', '', 'unknown', 'unavailable'] and t in avail
             and t not in ns.ids %}
            {% set ns.ids = ns.ids + [t] %}
          {% endif %}
        {% endfor %}
        {{ ns.ids | join(',') }}
  # Cases 1-4 test ROUTING and must be immune to whatever this household has
  # configured, so they all pass nonmaskable: true. Without it, a member who
  # had muted the system category would turn case 3 from 'person' into
  # 'filtered' and the self-test would report a routing fault that does not
  # exist - a test whose result depends on the setting it is not testing is
  # worse than no test. Cases 5 and 6 below are the ones that do test
  # filtering, and they assert against the live helpers rather than changing
  # them: a self-test must never write a household's preferences.
  #
  # 1. unmapped + critical → broadcast
  - action: script.guardian_notify_person
    data:
      slot: '0'
      critical: true
      nonmaskable: true
      title: 'Guardian: selftest unmapped-critical'
      message: 'unmapped+critical at {{ stamp }}'
    response_variable: a1
  # 2. zero-phones → discovered companion fallback (live when nobody is
  #    linked; otherwise the fallback path is not the one under test)
  - if:
    - condition: template
      value_template: "{{ (live_recipients | string).split(',') | map('trim') | reject('eq', '') | list | count == 0 }}"
    then:
    - action: script.guardian_notify_broadcast
      data:
        nonmaskable: true
        title: 'Guardian: selftest zero-phones'
        message: 'zero-phones fallback at {{ stamp }}'
      response_variable: a2
    else:
    - variables:
        a2:
          decision: skipped_has_targets
          recipients: ''
          recipient_count: 0
  # 3. mapped + non-critical → only that person
  - if:
    - condition: template
      value_template: "{{ mapped_slot | trim | length > 0 }}"
    then:
    - action: script.guardian_notify_person
      data:
        slot: '{{ mapped_slot }}'
        critical: false
        nonmaskable: true
        title: 'Guardian: selftest mapped-person'
        message: 'mapped+non-critical at {{ stamp }}'
      response_variable: a3
    else:
    - variables:
        a3:
          decision: skipped_no_mapped_slot
          recipients: ''
          recipient_count: 0
  # 4. unmapped + non-critical → skipped-but-logged
  - action: script.guardian_notify_person
    data:
      slot: '0'
      critical: false
      nonmaskable: true
      title: 'Guardian: selftest unmapped-skip'
      message: 'unmapped+non-critical at {{ stamp }}'
    response_variable: a4
  # 5. per-person filtering is actually consulted.
  #
  # Sends the quietest thing there is - system / routine, with subject_slot
  # blanked so the mine bypass cannot carry it - to the first linked slot, then
  # asserts the outcome matches what that slot's OWN helpers say it should be.
  # Read the expectation from the helpers rather than hardcoding it: this test
  # has to pass on a household that has configured anything at all, and it is
  # meaningful either way round. A slot on Everything must receive it; a slot
  # on anything else must come back decision: filtered. If the filter were
  # bypassed entirely, the second case fails; if it rejected everything, the
  # first does.
  - if:
    - condition: template
      value_template: "{{ mapped_slot | trim | length > 0 }}"
    then:
    - action: script.guardian_notify_person
      data:
        slot: '{{ mapped_slot }}'
        critical: false
        category: system
        severity: routine
        subject_slot: 'none'
        title: 'Guardian: selftest filter'
        message: 'routine/system filter probe at {{ stamp }}'
      response_variable: a5
    # 6. nonmaskable overrides the same slot's preferences, whatever they are.
    - action: script.guardian_notify_person
      data:
        slot: '{{ mapped_slot }}'
        critical: false
        category: system
        severity: routine
        subject_slot: 'none'
        nonmaskable: true
        title: 'Guardian: selftest nonmaskable'
        message: 'nonmaskable probe at {{ stamp }}'
      response_variable: a6
    else:
    - variables:
        a5:
          decision: skipped_no_mapped_slot
        a6:
          decision: skipped_no_mapped_slot
  - variables:
      # What slot mapped_slot's helpers say should have happened to case 5.
      # Same fail-open reading as the delivery path: an unrecognised level is
      # Important.
      probe_expected: >-
        {% if mapped_slot | trim | length == 0 %}
          {{ 'skipped_no_mapped_slot' }}
        {% else %}
          {% set lvl = states('input_select.rfid_' ~ mapped_slot
                              ~ '_notify_level') | string | trim %}
          {% set raw = states('input_text.rfid_' ~ mapped_slot
                              ~ '_notify_mute') | string | trim %}
          {% set muted = raw.split(',') | map('trim') | reject('eq', '') | list
                         if raw not in ['unknown', 'unavailable'] else [] %}
          {{ 'person' if lvl == 'Everything' and 'system' not in muted
             else 'filtered' }}
        {% endif %}
      a1_ok: "{{ (a1.decision | default('', true)) == 'broadcast' }}"
      a2_ok: >-
        {{ (a2.decision | default('', true)) == 'fallback'
           if (live_recipients | string).split(',') | map('trim') | reject('eq', '') | list | count == 0
           else (a2.decision | default('', true)) == 'skipped_has_targets' }}
      a3_ok: >-
        {{ (a3.decision | default('', true)) == 'skipped_no_mapped_slot'
           if mapped_slot | trim | length == 0
           else ((a3.decision | default('', true)) == 'person'
                 and a3.recipient_count | int(0) == 1) }}
      a4_ok: "{{ (a4.decision | default('', true)) == 'skip' }}"
      a5_ok: "{{ (a5.decision | default('', true)) == probe_expected | trim }}"
      a6_ok: >-
        {{ (a6.decision | default('', true)) == 'skipped_no_mapped_slot'
           if mapped_slot | trim | length == 0
           else (a6.decision | default('', true)) == 'person' }}
      all_ok: >-
        {{ a1_ok | bool and a2_ok | bool and a3_ok | bool and a4_ok | bool
           and a5_ok | bool and a6_ok | bool }}
  - action: persistent_notification.dismiss
    data:
      notification_id: guardian_notify_selftest
  - action: persistent_notification.create
    data:
      notification_id: guardian_notify_selftest_ok
      # "routing passed", never a bare "passed". Every one of the six checks
      # below reads a `decision`, and a decision is what this system chose to
      # do - not what arrived. The sends themselves carry continue_on_error, so
      # a house with every phone unreachable produces exactly this notification
      # with exactly these six passes. Naming the title after what was actually
      # measured is the difference between a check and a reassurance.
      title: >-
        Guardian: notification routing self-test
        {{ 'passed' if all_ok | bool else 'FAILED' }}
      message: >-
        {{ stamp }}.
        1 unmapped+critical→broadcast: {{ 'pass' if a1_ok | bool else 'FAIL' }}
        ({{ a1.decision | default('?', true) }}).
        2 zero-phones→discovered:
        {{ 'pass' if a2_ok | bool else 'FAIL' }}
        ({{ a2.decision | default('?', true) }}{% if (live_recipients | string).split(',') | map('trim') | reject('eq', '') | list | count > 0 %};
        phones are linked, empty-list branch not live this run{% endif %}).
        3 mapped+non-critical→person: {{ 'pass' if a3_ok | bool else 'FAIL' }}
        ({{ a3.decision | default('?', true) }}, n={{ a3.recipient_count | default(0, true) }}).
        4 unmapped+non-critical→skip: {{ 'pass' if a4_ok | bool else 'FAIL' }}
        ({{ a4.decision | default('?', true) }}).
        5 preference honoured: {{ 'pass' if a5_ok | bool else 'FAIL' }}
        ({{ a5.decision | default('?', true) }}, expected
        {{ probe_expected | trim }}{% if mapped_slot | trim | length > 0 %};
        slot {{ mapped_slot }} is on
        {{ states('input_select.rfid_' ~ mapped_slot ~ '_notify_level') }}{% endif %}).
        6 nonmaskable overrides: {{ 'pass' if a6_ok | bool else 'FAIL' }}
        ({{ a6.decision | default('?', true) }}).

        WHAT THIS DID AND DID NOT PROVE. Six passes mean Guardian picked the
        right recipient for each case and handed the message to Home Assistant.
        They do NOT mean anything arrived: notify has no delivery receipt, and
        every send here is deliberately guarded so one dead phone cannot stop an
        alarm reaching the others — so a failed send looks identical to a
        successful one from in here. Checks 3 and 6 report
        delivery={{ a3.delivery | default('unconfirmed', true) }}.
        The only real confirmation is a handset that buzzed. If none did, start
        with companion-app notification permissions and battery optimisation,
        then re-check the phone linked to the key in Settings.

# ---------------------------------------------------------------------------
# Slot writes and house-mode arming go through these scripts so a second Home
# Assistant account cannot edit someone else's key from Developer Tools. The
# panel is not enough: Home Assistant has no general per-service ACL, so the
# check lives here on context.user_id. Empty roster = single-account mode
# (today's behaviour). context.user_id empty is a device/automation and is
# allowed - never put this refuse in front of an alarm.
# ---------------------------------------------------------------------------
guardian_refresh_ha_roster:
  alias: Guardian - Refresh HA User Roster
  description: >-
    Persists the administrator and user id lists the panel read from
    config/auth/list. Bootstrap (empty admin list) is allowed so the first
    owner can write them; afterwards only a caller already on the admin list
    may refresh. Do not trust a client-supplied is_admin flag.
  mode: queued
  max: 4
  fields:
    admin_ids:
      required: true
      example: abcdef1234567890
    user_ids:
      required: true
      example: abcdef1234567890
  sequence:
  - variables:
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% set current = (states('input_text.guardian_ha_admin_ids') | string).split(',')
           | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
        {{ uid == '' or (current | length) == 0 or uid in current }}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: Only an administrator can refresh the Home Assistant user roster.
    - stop: Unauthorized.
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_ha_admin_ids
    data:
      value: "{{ (admin_ids | default('', true) | string)[:255] }}"
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_ha_user_ids
    data:
      value: "{{ (user_ids | default('', true) | string)[:255] }}"

guardian_set_house_mode:
  alias: Guardian - Set House Mode
  description: >-
    Arms or clears enrollment, PIN-change, or the Super Surveillance switch.
    Administrator (or single-account) only. Device-driven paths do not use
    this script.
  mode: queued
  max: 4
  fields:
    mode:
      required: true
      example: enrollment
    enabled:
      required: true
      example: true
  sequence:
  - variables:
      which: "{{ mode | default('', true) | string | trim | lower }}"
      want_on: "{{ enabled | bool }}"
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% if uid == '' %}true
        {% else %}
          {% set admins = (states('input_text.guardian_ha_admin_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set users = (states('input_text.guardian_ha_user_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {{ uid in admins or (users | length) <= 1 }}
        {% endif %}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: That house setting is an administrator action.
    - stop: Unauthorized.
  - if:
    - condition: template
      value_template: "{{ which not in ['enrollment', 'pin_change', 'super_surveillance'] }}"
    then:
    - stop: Unknown mode.
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ which == 'enrollment' and want_on | bool }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_enrollment_mode
    - conditions:
      - condition: template
        value_template: "{{ which == 'enrollment' }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_enrollment_mode
    - conditions:
      - condition: template
        value_template: "{{ which == 'pin_change' and want_on | bool }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.guardian_pin_change_mode
    - conditions:
      - condition: template
        value_template: "{{ which == 'pin_change' }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guardian_pin_change_mode
    - conditions:
      - condition: template
        value_template: "{{ which == 'super_surveillance' and want_on | bool }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.super_surveillance_mode
    - conditions:
      - condition: template
        value_template: "{{ which == 'super_surveillance' }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.super_surveillance_mode

guardian_slot_write:
  alias: Guardian - Write RFID Slot Field
  description: >-
    The only script that writes a person's name, notify prefs, HA user link,
    presence, or policy from the panel. Notify prefs (notify_level,
    notify_mute) are mapped-owner, bootstrap, or single-account; name and
    notify_target stay personal including house admins; everything else is
    administrator, single-account, or bootstrap (empty admin list). Fail
    closed. Unauthorized, invalid-slot, unknown-op, and a write that did
    not stick stop with error: true so the panel can report a refused
    write; there is no alarm below this. continue_on_error stays on the
    persistent notification only.
  mode: queued
  max: 8
  fields:
    slot:
      required: true
      example: '1'
    op:
      required: true
      example: name
    payload:
      required: false
      example: ''
  sequence:
  - variables:
      which: "{{ slot | default('', true) | string | trim }}"
      which_op: "{{ op | default('', true) | string | trim | lower }}"
      # payload, never value: a script field named value is merged into
      # input_text.set_value's own value, so the ha_user_id write can run and
      # still leave the helper unknown. Do not use default(..., true) — that
      # treats '' as missing and would turn unlink into a no-op.
      raw: "{{ payload | default('') | string }}"
      personal: "{{ which_op in ['name', 'notify_level', 'notify_mute', 'notify_target'] }}"
      notify_pref: "{{ which_op in ['notify_level', 'notify_mute'] }}"
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% set opx = op | default('', true) | string | trim | lower %}
        {% set sl = slot | default('', true) | string | trim %}
        {% set personal = opx in ['name', 'notify_level', 'notify_mute', 'notify_target'] %}
        {% set notify_pref = opx in ['notify_level', 'notify_mute'] %}
        {% if uid == '' %}true
        {% else %}
          {% set admins = (states('input_text.guardian_ha_admin_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set users = (states('input_text.guardian_ha_user_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set mapped = states('input_text.rfid_' ~ sl ~ '_ha_user_id') | string | trim %}
          {% set mapped_ok = mapped not in ['', 'unknown', 'unavailable', 'none'] %}
          {% set bootstrap = (admins | length) == 0 or (users | length) <= 1 %}
          {% set owner = mapped_ok and mapped == uid %}
          {{ (notify_pref and (bootstrap or owner))
             or (not notify_pref and (uid in admins or bootstrap or (personal and owner))) }}
        {% endif %}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: >-
          You cannot change {{ which_op }} on key {{ which }}.
    - stop: Unauthorized.
      error: true
  - if:
    - condition: template
      value_template: "{{ which not in ((states('sensor.guardian_rfid_slots') | string).split(',')
        | map('trim') | reject('eq', '') | list) }}"
    then:
    - stop: Invalid slot.
      error: true
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'name' }}"
      sequence:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ which }}_name
        data:
          value: "{{ raw[:32] }}"
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'notify_level' }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ raw | trim in (state_attr('input_select.rfid_'
            ~ which ~ '_notify_level', 'options') | default([], true) | list) }}"
        then:
        - action: input_select.select_option
          target:
            entity_id: input_select.rfid_{{ which }}_notify_level
          data:
            option: "{{ raw | trim }}"
        - if:
          - condition: template
            value_template: "{{ (states('input_select.rfid_' ~ which
              ~ '_notify_level') | string | trim) != (raw | trim) }}"
          then:
          - stop: The notification level was not saved.
            error: true
        else:
        - stop: Invalid notify level.
          error: true
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'notify_mute' }}"
      sequence:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ which }}_notify_mute
        data:
          value: >-
            {% set allowed = ['mine', 'security', 'access', 'presence', 'camera', 'system'] %}
            {% set toks = (raw | string).split(',') | map('trim') | reject('eq', '') | list %}
            {{ allowed | select('in', toks) | list | join(',') }}
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'notify_target' }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ raw | trim in (state_attr('input_select.rfid_'
            ~ which ~ '_notify_target', 'options') | default([], true) | list) }}"
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ which }}_notify_target
          data:
            option: "{{ raw | trim }}"
        - if:
          - condition: template
            value_template: "{{ (raw | trim) == 'none' }}"
          then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: input_text.rfid_{{ which }}_notify_saved
            data:
              value: ''
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'ha_user_id' }}"
      sequence:
      - repeat:
          for_each: "{{ (states('sensor.guardian_rfid_slots') | string).split(',')
            | map('trim') | reject('eq', '') | reject('eq', which) | list }}"
          sequence:
          - if:
            - condition: template
              value_template: >-
                {% set got = states('input_text.rfid_' ~ repeat.item
                   ~ '_ha_user_id') | string | trim %}
                {% set got_n = '' if got in ['unknown', 'unavailable', 'none'] else got %}
                {{ (raw[:64] | trim) != '' and got_n == (raw[:64] | trim) }}
            then:
            - action: input_text.set_value
              continue_on_error: true
              target:
                entity_id: input_text.rfid_{{ repeat.item }}_ha_user_id
              data:
                value: ''
      # A YAML input_text with no initial: starts as unknown and has never
      # been restored. The first set_value of a real id into that state does
      # not always stick; writing empty first establishes restore state.
      # Never put initial: on this helper — that would unlink on every start.
      - if:
        - condition: template
          value_template: >-
            {{ (states('input_text.rfid_' ~ which ~ '_ha_user_id')
               | string | trim) in ['unknown', 'unavailable'] }}
        then:
        - action: input_text.set_value
          target:
            entity_id: input_text.rfid_{{ which }}_ha_user_id
          data:
            entity_id: input_text.rfid_{{ which }}_ha_user_id
            value: ''
      - action: input_text.set_value
        target:
          entity_id: input_text.rfid_{{ which }}_ha_user_id
        data:
          entity_id: input_text.rfid_{{ which }}_ha_user_id
          value: "{{ raw[:64] | trim }}"
      - if:
        - condition: template
          value_template: >-
            {% set got = states('input_text.rfid_' ~ which
               ~ '_ha_user_id') | string | trim %}
            {% set got_n = '' if got in ['unknown', 'unavailable', 'none'] else got %}
            {{ got_n != (raw[:64] | trim) }}
        then:
        - stop: The Home Assistant account was not saved.
          error: true
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'presence' }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ raw | trim in (state_attr('input_select.rfid_'
            ~ which, 'options') | default([], true) | list) }}"
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ which }}
          data:
            option: "{{ raw | trim }}"
    - conditions:
      - condition: template
        value_template: "{{ which_op == 'policy' }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ raw | trim in (state_attr('input_select.rfid_'
            ~ which ~ '_policy', 'options') | default([], true) | list) }}"
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ which }}_policy
          data:
            option: "{{ raw | trim }}"
    default:
    - stop: Unknown op.
      error: true

# Carries the version of THIS FILE in a place the state machine can read.
#
# scripts.yaml cannot declare a template sensor, and scripts.yaml going stale
# while the panel is current is the single most misleading failure this system
# has: the new panel renders, every control works, and the old logic underneath
# answers questions about a version of itself that no longer exists. There was
# no way to detect it from inside Home Assistant, so it was diagnosed by hand.
#
# A script's alias IS its friendly_name attribute, so the version rides in the
# state machine for free - no helper, no automation, no extra restart-created
# state. sensor.guardian_version reads the last space-separated token of this
# alias, so keep the version the final word. It is never called and does
# nothing; running it is harmless.
guardian_version_marker:
  alias: Guardian - Backend Version 2.32.5
  description: >-
    Version marker for scripts.yaml, read by sensor.guardian_version and shown
    on More -> Diagnostics. Does nothing when run. Bump the version in this
    alias whenever the other halves are bumped - packages/guardian.yaml,
    packages/guardian_rfid.yaml, GUARDIAN_UI_VERSION in guardian-panel.js and
    the ?v= in configuration.yaml.
  mode: single
  sequence:
  - stop: Version marker

# Everything the household needs to answer "is Guardian actually installed and
# can it reach a phone", in one call, with no Developer Tools.
#
# This exists because the alternative was a debugging session: rendering
# templates by hand, grepping /config over SSH, and comparing files against a
# git commit. That is a reasonable thing to ask of the person who wrote the
# system and an unreasonable thing to ask of anyone who adopts it, and none of
# what it establishes is actually hidden from Home Assistant - it just had
# nowhere to be shown. More -> Diagnostics calls this and renders the result.
#
# Read-only by construction: it sends nothing, sets nothing, and touches no
# helper. Running it can never change what it is reporting on.
guardian_selfcheck:
  alias: Guardian - Self Check
  description: >-
    Reports deployment and alert-routing health as a response variable: which
    halves of Guardian are installed and whether their versions agree, whether
    the RFID slot rack is readable, how many notify targets Home Assistant can
    see, and per slot whether its linked phone is currently reachable. Sends
    nothing and changes nothing.
  # Read-only, so there is nothing to serialise and no reason a second tap
  # should be refused while the first is still rendering.
  mode: parallel
  max: 4
  sequence:
  - variables:
      # `missing` rather than `unknown`: the distinction the whole check exists
      # to make is "this half is not here" versus "this half says something
      # unexpected", and unknown reads as the latter.
      pkg_guardian: >-
        {{ states('sensor.guardian_version') if has_value('sensor.guardian_version')
           else 'missing' }}
      pkg_rfid: >-
        {{ states('sensor.guardian_rfid_version') if has_value('sensor.guardian_rfid_version')
           else 'missing' }}
      scripts_version: >-
        {% set a = state_attr('script.guardian_version_marker', 'friendly_name') %}
        {{ (a | string).split(' ') | last if a else 'missing' }}
      # The version out of the marker automation's alias, not a presence probe.
      #
      # This asked whether ONE automation existed, which a stale automations.yaml
      # answers yes to just as readily as a current one - so the largest runtime
      # file in Guardian, holding the Major Alarm Handler and every watchdog,
      # was the only half whose disagreement this check structurally could not
      # see. It reported "healthy" for the case it exists to catch.
      #
      # 'missing' covers both an automations.yaml that has not been copied and
      # one too old to carry the marker; both want the same remedy.
      #
      # Matched on the alias PREFIX, not on an entity id. See the long note at
      # the same attribute in packages/guardian.yaml: an automation's entity id
      # is slugified from its alias and then frozen by the entity registry, so
      # every id-based lookup here is either wrong now or wrong after the next
      # version bump. Keep these two templates identical.
      automations_version: >-
        {% set marker = states.automation
                     | selectattr('name', 'defined')
                     | selectattr('name', 'search',
                                  '^Guardian - Automations Version ')
                     | map(attribute='name') | list | first %}
        {{ (marker | string).split(' ') | last if marker else 'missing' }}
      rack_ready: >-
        {{ states('sensor.guardian_rfid_slots')
           not in ['unknown', 'unavailable', 'none', ''] }}
      slots: >-
        {{ (states('sensor.guardian_rfid_slots') | string).split(',')
           | map('trim') | reject('eq', '') | list }}
      live_targets: >-
        {% set skip = ['guardian_data_log', 'persistent_notification',
                       'guardian_alerts'] %}
        {{ states.notify | map(attribute='object_id')
           | reject('in', skip) | unique | list | sort }}
  - variables:
      # One row per occupied slot, in the same shape the panel renders. `state`
      # is the verdict a real alert to this slot would reach right now, using
      # the same vocabulary guardian_notify_person returns, so what Diagnostics
      # shows and what a door event does cannot drift apart.
      #
      # `helper` is reported because a UI-created helper in .storage can shadow
      # the YAML one under a slightly different object id. The panel's entity
      # resolver falls back to a suffix match, so the browser can be reading one
      # helper while this script reads another - a divergence that otherwise
      # presents as "the picker shows a phone but the backend says none".
      links: >-
        {% set ns = namespace(rows=[]) %}
        {% for s in slots %}
          {% set ent = 'input_select.rfid_' ~ s ~ '_notify_target' %}
          {% set name = states('input_text.rfid_' ~ s ~ '_name') | string | trim %}
          {% set card = states('input_text.rfid_' ~ s ~ '_card_id') | string | trim %}
          {% set picked = states(ent) | string | trim %}
          {% set linked = picked not in ['none', '', 'unknown', 'unavailable'] %}
          {% set ns.rows = ns.rows + [{
               'slot': s,
               'name': name if name not in ['', 'unknown', 'unavailable'] else '',
               'occupied': card | length == 16,
               'helper': 'present' if states(ent) not in ['unknown', 'unavailable'] else 'missing',
               'target': picked if linked else '',
               'state': ('not_ready' if not rack_ready
                         else ('not_selected' if not linked
                               else ('ok' if picked in live_targets else 'not_registered'))) }] %}
        {% endfor %}
        {{ ns.rows }}
  - variables:
      result:
        scripts: '{{ scripts_version }}'
        package_guardian: '{{ pkg_guardian }}'
        package_rfid: '{{ pkg_rfid }}'
        automations: '{{ automations_version }}'
        rack_ready: '{{ rack_ready }}'
        slot_count: '{{ slots | count }}'
        targets: '{{ live_targets | join(",") }}'
        target_count: '{{ live_targets | count }}'
        links: '{{ links }}'
        # True only when every half is present AND every present half agrees
        # with scripts.yaml. A disagreement is reported rather than resolved -
        # this script cannot know which version is the intended one.
        #
        # automations.yaml is compared by VERSION here as of 2.24.0. It used to
        # be the one half admitted on presence alone, which made a stale copy of
        # the file carrying the Major Alarm Handler the single deployment fault
        # this check could not see.
        versions_agree: >-
          {{ scripts_version != 'missing'
             and pkg_guardian == scripts_version
             and pkg_rfid == scripts_version
             and automations_version == scripts_version }}
  - stop: Self check complete
    response_variable: result

# Day one, in one call.
#
# Guardian's helpers all live in packages/ now, so nothing has to be created by
# hand any more - but a fresh install still is not a working install, and until
# now nothing said why. Two different problems were both invisible:
#
# 1. Helpers that deliberately carry no YAML `initial:` (so restore_state can
#    keep a household's value across a restart) have nothing to restore on a
#    FIRST boot. Home Assistant falls back to each input_number's `min`, so a
#    brand-new install silently comes up with dark threshold 0, bright
#    threshold 0, a 10-second entry challenge and a 2-minute doorbell-exit PIN
#    window. Those are not errors; they are wrong numbers that look deliberate.
#    DEPLOY.md has recorded the recommended first-boot values since the
#    thirty-fourth pass and nothing has ever applied them.
#
# 2. Several things Guardian depends on cannot be expressed in YAML at all -
#    the File notify integration behind notify.guardian_data_log, the MQTT
#    integration behind the Frigate person triggers, the Companion app that is
#    the only source of notify targets. Each of those failed later, somewhere
#    else, as a symptom that did not name its cause.
#
# So: apply the documented numbers exactly once, then say - by entity id and by
# value - what is still missing. Every line is actionable. Nothing here is a
# generic error, and nothing here blames the household for an absent
# integration (the same rule guardian_notify_person's `not_ready` follows).
#
# It writes at most once, gated on input_boolean.guardian_setup_complete, so
# running it again is a re-check rather than a reset. It never invents a PIN
# and never guesses guardian_luma_rotate - both are reported instead, because
# one is a credential and the other depends on how the camera is physically
# mounted.
#
# The deployment half of the answer is NOT re-derived here: it calls
# script.guardian_selfcheck and folds in what that already knows. One copy.
guardian_setup_wizard:
  alias: Guardian - Setup Wizard
  description: >-
    First-boot setup and install check. Applies this release's recommended
    default values once (guarded by input_boolean.guardian_setup_complete),
    then reports every remaining thing a fresh Home Assistant still needs -
    each one named by entity id, integration or script, with the value or the
    exact menu path it wants. Leaves one persistent notification and returns
    the same findings as a response variable.
  # single, unlike the read-only guardian_selfcheck: this one writes helpers,
  # and two concurrent runs could both see "first run" and both apply defaults.
  mode: single
  fields:
    apply_defaults:
      description: >-
        Write the recommended first-boot values for helpers that have none.
        Ignored once input_boolean.guardian_setup_complete is on, unless force
        is also set. Pass false to re-check and report without writing.
      required: false
      default: true
      example: true
      selector:
        boolean:
    force:
      description: >-
        Apply the defaults again even though setup has already run. This
        overwrites values the household may have chosen deliberately.
      required: false
      default: false
      example: false
      selector:
        boolean:
  sequence:
  # default() on every field: an omitted script field is undefined, not its
  # declared default - the `default:` above is metadata for the Actions UI.
  - variables:
      first_run: "{{ not is_state('input_boolean.guardian_setup_complete', 'on') }}"
      wants_write: '{{ apply_defaults | default(true) | bool }}'
      forced: '{{ force | default(false) | bool }}'
  # | bool on each, the same defensive coercion guardian_selfcheck uses on
  # every boolean it renders: a script variable comes back through Home Assistant's
  # native-type conversion, and this file has already been bitten once by
  # trusting what a rendered template's Python type would be (thirty-seventh
  # pass, the missing | string that made every phone link report unlinked).
  - variables:
      writing: >-
        {{ (wants_write | bool) and ((first_run | bool) or (forced | bool)) }}

  # ---- 1. The documented first-boot numbers -------------------------------
  # Values from DEPLOY.md thirty-fourth pass, "Recommended first-boot numbers
  # if restore_state has nothing". Every one is in step and within bounds, so
  # set_value can never be silently rejected. guardian_luma_rotate is
  # deliberately absent: 0 (no rotation) is the correct default for a camera
  # that is not mounted on its side, and this script cannot know how yours is.
  - if:
    - condition: template
      value_template: '{{ writing }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_dark_threshold
      data:
        value: 45
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_bright_threshold
      data:
        value: 90
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_lamp_mismatch_max_minutes
      data:
        value: 30
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_entry_challenge_seconds
      data:
        value: 30
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_empty_house_grace_seconds
      data:
        value: 10
    - action: input_number.set_value
      target:
        entity_id: input_number.guardian_doorbell_exit_pin_minutes
      data:
        value: 10
    # The camera key frigate/config.yml actually declares. Only written when
    # the helper holds nothing: a household that already named their camera
    # must not have it replaced by this repo's example.
    - if:
      - condition: template
        value_template: >-
          {{ states('input_text.guardian_frigate_camera_name') | string | trim
             in ['', 'none', 'unknown', 'unavailable'] }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.guardian_frigate_camera_name
        data:
          value: door_camera
    # Only when the choice is not a choice. With two or more cameras this is
    # human judgment - which one points at the door - and a wrong guess here
    # would be measured for luminance and shown as the live view.
    - if:
      - condition: template
        value_template: >-
          {{ states('input_text.guardian_camera_entity') | string | trim
             in ['', 'none', 'unknown', 'unavailable']
             and (states.camera | list | count) == 1 }}
      then:
      - action: input_text.set_value
        target:
          entity_id: input_text.guardian_camera_entity
        data:
          value: "{{ states.camera | map(attribute='entity_id') | list | first }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.guardian_setup_complete

  # ---- 2. What the backend already knows about itself ---------------------
  # Blocking on purpose, and safe: guardian_selfcheck is mode: parallel,
  # read-only, and returns a response. This is the same call the panel's
  # Diagnostics page makes. Do not re-derive its answers below.
  - action: script.guardian_selfcheck
    response_variable: sc

  # ---- 3. Findings --------------------------------------------------------
  - variables:
      blank: ['', 'none', 'unknown', 'unavailable']
      pin_hash: "{{ states('input_text.portal_pin_hash') | string | trim | lower }}"
      data_log_present: >-
        {{ states.notify | map(attribute='object_id')
           | select('eq', 'guardian_data_log') | list | count > 0 }}
      notify_count: '{{ sc.target_count | default(0) | int(0) }}'
      camera_id: >-
        {% set raw = states('input_text.guardian_camera_entity') | string | trim %}
        {% set door = 'camera.door_camera' %}
        {% if raw not in ['', 'none', 'unknown', 'unavailable', 'camera.tapo_c110']
           and states(raw) not in ['unknown', 'unavailable'] %}{{ raw }}
        {%- elif states(door) not in ['unknown', 'unavailable'] %}{{ door }}
        {%- else %}{% endif %}
      # A representative slice of the portal, not all 55 references: door
      # contact, handle, link status, the LED and one sound button cover every
      # domain the automations reach into, so if these five are present the
      # rest of that device's ids are too.
      portal_missing: >-
        {% set ids = ['binary_sensor.guardian_interior_portal_door_contact',
                      'binary_sensor.guardian_interior_portal_handle_depressed',
                      'binary_sensor.guardian_interior_portal_status',
                      'light.guardian_interior_portal_portal_led',
                      'button.guardian_interior_portal_play_denied'] %}
        {% set ns = namespace(gone=[]) %}
        {% for i in ids %}
          {% if states(i) in ['unknown', 'unavailable'] %}
            {% set ns.gone = ns.gone + [i] %}
          {% endif %}
        {% endfor %}
        {{ ns.gone }}
      doorbell_found: >-
        {{ states('sensor.guardian_doorbell_entities') | string | trim
           not in ['none', '', 'unknown', 'unavailable'] }}
      lamp_id: "{{ states('sensor.guardian_lamp_entity') | string | trim }}"
      frigate_key: >-
        {{ states('input_text.guardian_frigate_camera_name') | string | trim }}
      rotate: "{{ states('input_number.guardian_luma_rotate') | int(0) }}"
      trackers: >-
        {{ states('sensor.guardian_presence_trackers_resolved') | string | trim }}
  - variables:
      # Blockers stop Guardian doing its job at all. Warnings are things that
      # will be true once the devices are flashed. Info is a decision the
      # household still has to make, not a defect.
      #
      # Built _raw and squashed in the next step. A YAML folded scalar keeps a
      # MORE-indented line literally rather than folding it, so these
      # multi-line Jinja string literals arrive carrying their own newlines and
      # leading spaces - which markdown then renders as indented code blocks.
      # One regex_replace afterwards is cheaper than fighting the indentation
      # of every entry, and it applies to the response variable too, so the
      # panel gets the same clean text the notification does.
      blockers_raw: >-
        {% set ns = namespace(f=[]) %}
        {% if sc.package_guardian == 'missing' %}
          {% set ns.f = ns.f + ['**packages/guardian.yaml did not load.** Copy it to
             `/config/packages/` and restart Home Assistant fully - a YAML reload
             does not merge packages.'] %}
        {% endif %}
        {% if sc.package_rfid == 'missing' or not (sc.rack_ready | bool) %}
          {% set ns.f = ns.f + ['**packages/guardian_rfid.yaml did not load**, so
             `sensor.guardian_rfid_slots` is absent and no key can be looked up or
             alerted. Copy it to `/config/packages/` and restart fully.'] %}
        {% endif %}
        {% if sc.scripts == 'missing' %}
          {% set ns.f = ns.f + ['**scripts.yaml is not the one this release ships.**
             Copy it to `/config/scripts.yaml` and reload scripts.'] %}
        {% endif %}
        {% if sc.automations == 'missing' %}
          {% set ns.f = ns.f + ['**automations.yaml did not load.** Copy it to
             `/config/automations.yaml` and reload automations.'] %}
        {% endif %}
        {% if not (sc.versions_agree | bool)
              and sc.package_guardian != 'missing' and sc.scripts != 'missing' %}
          {% set ns.f = ns.f + ['**Guardian files are from different versions** -
             scripts.yaml ' ~ sc.scripts ~ ', packages/guardian.yaml '
             ~ sc.package_guardian ~ ', packages/guardian_rfid.yaml '
             ~ sc.package_rfid ~ '. Copy the whole release again and restart.'] %}
        {% endif %}
        {% if not (pin_hash is match('^[0-9a-f]{64}$')) %}
          {% set ns.f = ns.f + ['**No master PIN is set.** Elevated mode, the entry
             challenge and PIN change all need one. Developer Tools -> Actions ->
             `script.guardian_set_pin`, enter 4-6 digits, then confirm with
             `script.guardian_verify_pin`. Never fill
             `input_text.portal_pin_hash` by hand - Windows tooling emits
             uppercase hex, which is 64 characters and can never match.'] %}
        {% endif %}
        {% if notify_count | int(0) == 0 %}
          {% set ns.f = ns.f + ['**No notify targets exist**, so Guardian cannot
             raise an alarm to anyone. Install the Home Assistant Companion app on
             at least one phone and sign in to this instance; each registered
             device appears as a `notify.*` entity. Then link one to a key on
             Guardian -> Keys.'] %}
        {% endif %}
        {% if not (data_log_present | bool) %}
          {% set ns.f = ns.f + ['**`notify.guardian_data_log` does not exist**, so
             every door, scan and challenge event goes unrecorded. This one cannot
             be provisioned by YAML. Settings -> Devices & Services -> Add
             Integration -> **File** -> Notify, file
             `/config/guardian_data_log.jsonl`, and leave **Timestamp OFF** - a
             timestamp prefix breaks JSONL parsing. Name it so the entity id is
             `notify.guardian_data_log`.'] %}
        {% endif %}
        {% if camera_id | trim | length == 0 %}
          {% set ns.f = ns.f + ['**No door camera is configured.** Live view and
             every lamp luminance sample need one. Set
             `input_text.guardian_camera_entity` to your camera entity id on
             Guardian -> More -> Install (Save), or in Developer Tools ->
             States.'] %}
        {% endif %}
        {{ ns.f }}
      warnings_raw: >-
        {% set ns = namespace(f=[]) %}
        {% if portal_missing | count > 0 %}
          {% set ns.f = ns.f + ['**The interior portal has not been adopted yet.**
             Missing: `' ~ (portal_missing | join('`, `')) ~ '`. Expected before you
             flash it. Automations address the portal by these exact ids, so do not
             rename the device or its entities in Home Assistant - unlike the
             doorbell, the portal is not resolved by suffix.'] %}
        {% endif %}
        {% if not (doorbell_found | bool) %}
          {% set ns.f = ns.f + ['**The doorbell has not been adopted yet** -
             `sensor.guardian_doorbell_entities` found nothing ending in
             `smart_doorbell_doorbell_*`. Expected before you flash it. The
             DOORBELL fault on the portal screen is this, and clears itself.'] %}
        {% endif %}
        {% if lamp_id in ['none', '', 'unknown', 'unavailable'] %}
          {% set ns.f = ns.f + ['**No room lamp is chosen**, so lamp feedback and
             auto-switching do nothing. Pick one on Guardian -> More -> Lamp; the
             list is whatever `sensor.guardian_lights_available` currently sees.
             There is no default make to fall back to.'] %}
        {% endif %}
        {{ ns.f }}
      info_raw: >-
        {% set ns = namespace(f=[]) %}
        {% set ns.f = ns.f + ['**Frigate person detection cannot be verified from
           here.** It arrives over MQTT, not the Frigate integration. Confirm the
           MQTT integration is configured, that `frigate/config.yml` has an
           `mqtt:` block pointing at your broker, and that its camera key matches
           `input_text.guardian_frigate_camera_name`, currently `'
           ~ (frigate_key if frigate_key not in ['', 'none', 'unknown', 'unavailable']
              else '(unset)') ~ '`. The trigger topic is `frigate/events`.'] %}
        {% if rotate | int(0) == 0 %}
          {% set ns.f = ns.f + ['Lamp luminance reads the camera still unrotated
             (`input_number.guardian_luma_rotate` is 0). Correct for an upright
             camera. If yours is mounted on its side, set it to 90 - this script
             will not guess, because a wrong rotation measures the wrong part of
             the room.'] %}
        {% endif %}
        {% if trackers in ['', 'none', 'unknown', 'unavailable'] %}
          {% set ns.f = ns.f + ['No presence trackers are configured (opt-in).
             While empty, the person-detected-while-away alert relies on every
             resident card reading Away, so one unscanned exit suppresses it
             indefinitely. Add phones on Guardian -> More -> Install.'] %}
        {% endif %}
        {{ ns.f }}
  - variables:
      blockers: >-
        {{ blockers_raw | map('regex_replace', '\s+', ' ') | map('trim') | list }}
      warnings: >-
        {{ warnings_raw | map('regex_replace', '\s+', ' ') | map('trim') | list }}
      info: >-
        {{ info_raw | map('regex_replace', '\s+', ' ') | map('trim') | list }}
  - variables:
      ready: '{{ blockers | count == 0 }}'
      # Built as one Jinja list joined on newlines rather than as a multi-line
      # YAML scalar: a folded scalar treats a more-indented line as literal, so
      # a markdown list written directly in YAML would come out with the
      # indentation baked in and render as a code block.
      message: >-
        {% set ns = namespace(l=[]) %}
        {% set ns.l = ns.l + [
          ('Recommended first-boot values applied.' if writing
           else ('Re-check only - no values were written.' if not first_run
                 else 'No values were written (apply_defaults was false).'))
          ~ ' '
          ~ ('Guardian is ready. Nothing is outstanding.' if ready
             else (blockers | count | string
                   ~ ' thing(s) are still needed before Guardian works.')), ''] %}
        {% for b in blockers %}
          {% set ns.l = ns.l + ['- ' ~ b, ''] %}
        {% endfor %}
        {% if warnings | count > 0 %}
          {% set ns.l = ns.l + ['**Waiting on hardware**', ''] %}
          {% for w in warnings %}
            {% set ns.l = ns.l + ['- ' ~ w, ''] %}
          {% endfor %}
        {% endif %}
        {% if info | count > 0 %}
          {% set ns.l = ns.l + ['**Worth knowing**', ''] %}
          {% for i in info %}
            {% set ns.l = ns.l + ['- ' ~ i, ''] %}
          {% endfor %}
        {% endif %}
        {% set ns.l = ns.l + ['', ('Re-run this from Guardian -> More -> Install
          -> Setup check, or Developer Tools -> Actions ->
          `script.guardian_setup_wizard`. The full first-install path is in
          INSTALL.md.') | regex_replace('\s+', ' ') | trim] %}
        {{ ns.l | join('\n') }}
  - action: persistent_notification.create
    data:
      # Fixed id: re-running replaces the notice rather than stacking a second
      # copy of a list the household has already read.
      notification_id: guardian_setup
      title: >-
        {{ 'Guardian setup: ready' if ready
           else 'Guardian setup: ' ~ (blockers | count) ~ ' item(s) outstanding' }}
      message: '{{ message }}'
  - variables:
      result:
        ready: '{{ ready }}'
        defaults_applied: '{{ writing }}'
        first_run: '{{ first_run }}'
        blockers: '{{ blockers }}'
        warnings: '{{ warnings }}'
        info: '{{ info }}'
        blocker_count: '{{ blockers | count }}'
        # Folded in from guardian_selfcheck rather than recomputed, so the
        # Setup check and the Backend self check can never disagree.
        scripts: '{{ sc.scripts }}'
        package_guardian: '{{ sc.package_guardian }}'
        package_rfid: '{{ sc.package_rfid }}'
        automations: '{{ sc.automations }}'
        versions_agree: '{{ sc.versions_agree }}'
        rack_ready: '{{ sc.rack_ready }}'
        target_count: '{{ sc.target_count }}'
  - stop: Setup wizard complete
    response_variable: result

# Single source of truth for "does this PIN match the stored master hash"
# and for "what is the SHA-256 of this PIN". F-32/F-33 were a second
# hand-written copy of this expression drifting from the first. Every
# consumer - guardian_verify_pin, the Master PIN handler, keypad PIN change -
# must call this rather than re-deriving trim / lower / sha256.
#
# Returns {hash, stored, matches}. hash is sha256(trim(pin)); stored is the
# normalised portal_pin_hash; matches is true only when stored is a 64-character
# digest and the two are equal. Touches nothing.
guardian_pin_matches:
  alias: Guardian - PIN Matches
  description: >-
    Canonical PIN hash and compare. Returns hash, stored, and matches so
    callers cannot invent a second expression. Does not write helpers, does
    not touch the fail counter, does not change the display.
  # parallel, not single. Four callers reach this - "Guardian: Master PIN Entry
  # Handler", guardian_apply_doorbell_exit_pin, "Guardian: PIN Change Handler"
  # and guardian_verify_pin. The handler is mode: queued so it cannot collide
  # with itself, but a keypad PIN and a Companion phone reply arriving in the
  # same moment are two DIFFERENT callers: under single the second call was
  # dropped with a log warning, its response_variable was never set, and the
  # calling run then failed rendering pin_check.matches. A dropped attempt is a
  # failed attempt that never reaches input_number.mfa_failed_attempts, which is
  # the same brute-force gap mode: queued was introduced on the handler to close
  # (F-13).
  #
  # Safe HERE specifically because this script writes no helper, does not touch
  # the fail counter and does not change the display - it hashes, compares and
  # returns, so concurrent runs have nothing to corrupt. Do not copy parallel to
  # a script that writes state on the strength of this comment.
  mode: parallel
  max: 10
  fields:
    pin:
      description: The PIN to hash and, if a master hash is stored, to compare.
      required: true
      example: '1234'
      selector:
        text:
          type: password
  sequence:
  - variables:
      result:
        hash: '{{ pin | string | trim | string | sha256 }}'
        stored: "{{ states('input_text.portal_pin_hash') | string | trim | lower }}"
        matches: "{{ (states('input_text.portal_pin_hash') | string | trim | lower
          | length == 64) and ((pin | string | trim | string | sha256) ==
          (states('input_text.portal_pin_hash') | string | trim | lower)) }}"
  - stop: PIN match result
    response_variable: result

guardian_set_pin:
  alias: Guardian - Set Master PIN
  description: >-
    Stores a new master PIN. Hashes it with EXACTLY the expression the verifier
    uses, which is the point: input_text.portal_pin_hash was previously
    populated by hand, and a hash produced by any other tool is a coin flip.
    Windows tooling (Get-FileHash, certutil) emits uppercase hex, and
    "echo 1234 | sha256sum" hashes a trailing newline - both give 64 characters
    that look right, pass every sanity check, and can never match. Run this from
    Developer Tools -> Actions so the plaintext is never written to a helper.

    Requires the CURRENT PIN unless the portal's PIN-change flow is running or
    no PIN is set yet. See the authorisation note in the sequence.
  mode: single
  fields:
    pin:
      description: The new PIN, 4 to 6 digits. Not stored anywhere in plaintext.
      required: true
      example: '1234'
      selector:
        text:
          type: password
    current_pin:
      description: >-
        The PIN being replaced. Required when one is already set and you are
        calling this directly rather than through the portal keypad flow.
      required: false
      default: ''
      example: '1234'
      selector:
        text:
          type: password
  sequence:
  # Authorisation, and be precise about what it is worth. Home Assistant has no
  # per-service permissions: any account that can log in - admin or not - can
  # call any script over the REST or WebSocket API, whatever the UI shows them.
  # This gate raises the cost of replacing the master PIN from one API call to
  # two, and that is the honest ceiling on it. Route 2 below passes on
  # input_boolean.guardian_pin_change_mode being on, and turning that on is
  # itself a service call any account can make - so an account that wants the
  # PIN changed sets the boolean and calls this, with no knowledge of the old
  # one. This comment used to claim the gate stopped "every HA account and every
  # leaked long-lived token"; it does not, and a reader who believed it would
  # hand out logins on a false premise. That is the same class of untrue claim
  # the fortieth pass removed from GUARDIAN_UI.md.
  #
  # It is kept rather than tightened because it cannot be tightened from inside
  # Home Assistant: any nonce this script could demand is a helper the same
  # caller can write, and the keypad flow spans several events with nowhere to
  # hold the verified old PIN except a helper - which would mean storing a
  # plaintext PIN to protect a PIN. What the gate does buy is real: it stops an
  # ACCIDENTAL call from Developer Tools, and it makes the portal flow the only
  # path that reaches here without the current PIN. The boundary that actually
  # matters is the Home Assistant account, and README.md says so in those words.
  #
  # Three ways to pass, in the order they are checked:
  #
  #   1. No PIN is set yet (stored hash is not 64 chars). First install has to
  #      work - INSTALL.md section 6 tells you to run exactly this script.
  #   2. input_boolean.guardian_pin_change_mode is on. That is the portal flow,
  #      which has ALREADY demanded and verified the current PIN before it gets
  #      here, and turns the boolean off immediately afterwards. Turning the
  #      mode on from the UI does not reach this script on its own.
  #   3. current_pin was supplied and matches.
  #
  # Comparison is script.guardian_pin_matches, the same canonical hash-and-
  # compare every other caller uses. This deliberately does NOT touch
  # input_number.mfa_failed_attempts: that counter belongs to the door
  # challenge, and letting an API caller drive it to three would hand anyone a
  # remote way to raise a major alarm.
  - action: script.guardian_pin_matches
    data:
      pin: "{{ current_pin | default('', true) }}"
    response_variable: current_check
  - variables:
      authorised: >-
        {{ (current_check.stored | length != 64)
           or is_state('input_boolean.guardian_pin_change_mode', 'on')
           or (current_check.matches | bool) }}
  - if:
    - condition: template
      value_template: '{{ not (authorised | bool) }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: guardian_set_pin
        title: 'Guardian: PIN not changed'
        message: >-
          The current PIN was not supplied or did not match, so nothing was
          stored and the existing PIN still applies. Pass current_pin when
          calling this action directly, or change the PIN at the interior
          keypad, which asks for the old one first.
    - stop: Current PIN not verified
  # Developer Tools passes a digits-only PIN as an int. A template whose whole
  # result is "1234" is then native-typed back to int, and the sha256 filter
  # does value.encode() - AttributeError: 'int' object has no attribute
  # 'encode'. Hash in the same expression as | string so encode sees a str
  # and the stored result is 64 hex characters, which will not coerce.
  - if:
    - condition: template
      # 4 to 6 digits. The portal keypad sends digits only and its buffer is
      # capped at six, so a longer PIN could never be entered; the lower bound
      # matches the minimum length the firmware will now submit.
      value_template: "{{ (pin | string | trim) is match('^[0-9]{4,6}$') }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.portal_pin_hash
      data:
        value: '{{ pin | string | trim | string | sha256 }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.mfa_failed_attempts
      data:
        value: 0
    # Read it back. input_text.portal_pin_hash is a UI helper whose max length
    # this repo cannot see, and a write longer than max is rejected SILENTLY -
    # which would leave a truncated hash that fails every comparison for a
    # completely different reason than the one just fixed.
    - variables:
        stored_back: "{{ states('input_text.portal_pin_hash') | string | trim }}"
    - action: persistent_notification.create
      data:
        notification_id: guardian_set_pin
        title: >-
          {{ 'Guardian: master PIN updated' if stored_back | length == 64
             else 'Guardian: PIN hash was REJECTED' }}
        message: >-
          {% if stored_back | length == 64 %}
            A new {{ (pin | string | trim) | length }}-digit PIN was stored as a
            SHA-256 hash at {{ now().strftime('%H:%M:%S') }}. The PIN itself was
            not written anywhere. Confirm with script.guardian_verify_pin before
            relying on it.
          {% else %}
            The hash was written but read back {{ stored_back | length }}
            characters instead of 64, so input_text.portal_pin_hash has a max
            length below 64 and silently truncated it. Raise that helper's
            maximum to at least 64 in Settings -> Devices & Services -> Helpers,
            then run this again.
          {% endif %}
    else:
    - action: persistent_notification.create
      data:
        notification_id: guardian_set_pin
        title: 'Guardian: PIN not changed'
        message: >-
          The value supplied is not 4 to 6 digits, so nothing was stored and the
          existing PIN still applies.

guardian_verify_pin:
  alias: Guardian - Verify Master PIN
  description: >-
    Reports whether a PIN matches the stored hash. Touches nothing - not the
    fail counter, not the portal display, not the alarm path - so it is safe to
    run at any time, including while super surveillance is on. Comparison is
    script.guardian_pin_matches; this script only formats the notification.
  mode: single
  fields:
    pin:
      description: The PIN to test.
      required: true
      example: '1234'
      selector:
        text:
          type: password
  sequence:
  - action: script.guardian_pin_matches
    data:
      pin: '{{ pin }}'
    response_variable: pin_check
  - variables:
      entered: '{{ pin_check.hash }}'
      stored: '{{ pin_check.stored }}'
      raw: "{{ states('input_text.portal_pin_hash') | string }}"
  - action: persistent_notification.create
    data:
      notification_id: guardian_verify_pin
      title: >-
        {{ 'Guardian: PIN matches' if pin_check.matches | bool
           else 'Guardian: PIN does NOT match' }}
      message: >-
        Entered hash starts {{ entered[:12] }}. Stored hash starts
        {{ stored[:12] if stored else '(empty)' }}, length {{ stored | length }}.
        {% if stored | length != 64 %}
          The stored value is not a 64-character SHA-256 hash, so no PIN can
          ever be accepted. Set one with script.guardian_set_pin.
        {% elif raw != stored %}
          The stored value only matches after normalising - it contains
          uppercase characters or surrounding whitespace. Verification now
          tolerates that, but re-set it with script.guardian_set_pin to remove
          the ambiguity.
        {% endif %}

guardian_clear_rfid_slot:
  alias: Guardian - Clear RFID Slot
  description: >-
    Empties one card_id and counter, or every slot, by writing
    input_text.set_value with an empty string and resetting the rolling
    counter to 0. Also wipes any leftover rfid_N_hash (no longer a
    credential, still a cloning oracle if left sitting), clears that
    slot's person name, resets that slot's policy to resident, and unlinks
    that slot's notify target so a reused position does not inherit the
    previous person's phone, and clears rfid_N_notify_saved so a later
    options refresh cannot resurrect the mapping. Notification preferences
    (rfid_N_notify_level / _notify_mute) go back to the shipped default for
    the same reason: they describe a person, not a position.

    Presence (input_select.rfid_N At home/Away) is left alone. A missing
    card_id already makes the card unmatchable; flipping who-is-home here
    would change occupancy independently of anyone walking through the door.
    Occupancy readers skip unoccupied slots, so a leftover At home on an
    empty rack position is not counted as someone home.
  mode: queued
  max: 4
  fields:
    slot:
      description: Slot id (1-9), or all.
      required: true
      example: '1'
      selector:
        select:
          options:
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
            - '6'
            - '7'
            - '8'
            - '9'
            - all
  sequence:
  - variables:
      which: '{{ slot | string | trim | lower }}'
      slot_ids: "{{ (states('sensor.guardian_rfid_slots') | string).split(',')
                   | map('trim') | reject('eq', '') | list }}"
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% if uid == '' %}true
        {% else %}
          {% set admins = (states('input_text.guardian_ha_admin_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set users = (states('input_text.guardian_ha_user_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {{ uid in admins or (users | length) <= 1 }}
        {% endif %}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: Clearing a key is an administrator action.
    - stop: Unauthorized.
  - if:
    - condition: template
      value_template: "{{ which != 'all' and (which | string | trim) not in
        ((states('sensor.guardian_rfid_slots') | string).split(',')
         | map('trim') | reject('eq', '') | list) }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: guardian_clear_rfid_slot
        title: 'Guardian: slot not cleared'
        message: >-
          slot must be one of {{ states('sensor.guardian_rfid_slots') }}, or all.
    - stop: Invalid slot.
  - repeat:
      for_each: "{{ (states('sensor.guardian_rfid_slots') | string).split(',')
        | map('trim') | reject('eq', '') | list if (which | string | trim) == 'all'
        else [which | string | trim] }}"
      sequence:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ repeat.item }}_card_id
        data:
          value: ''
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ repeat.item }}_hash
        data:
          value: ''
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ repeat.item }}_name
        data:
          value: ''
      - action: input_number.set_value
        continue_on_error: true
        target:
          entity_id: input_number.rfid_{{ repeat.item }}_counter
        data:
          value: 0
      - if:
        - condition: template
          value_template: "{{ 'resident' in (state_attr('input_select.rfid_'
            ~ repeat.item ~ '_policy', 'options') | default([], true) | list) }}"
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ repeat.item }}_policy
          data:
            option: resident
      - if:
        - condition: template
          value_template: "{{ 'none' in (state_attr('input_select.rfid_'
            ~ repeat.item ~ '_notify_target', 'options') | default([], true) | list) }}"
        then:
        - action: input_select.select_option
          continue_on_error: true
          target:
            entity_id: input_select.rfid_{{ repeat.item }}_notify_target
          data:
            option: none
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ repeat.item }}_notify_saved
        data:
          value: ''
      # Notification preferences belong to the person, not the position. A
      # reused slot must start from the shipped default rather than inheriting
      # what the last holder chose - otherwise a new key silently arrives with
      # somebody else's Off, and the first anyone learns of it is an alert that
      # never came.
      - action: input_select.select_option
        continue_on_error: true
        target:
          entity_id: input_select.rfid_{{ repeat.item }}_notify_level
        data:
          option: Important
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ repeat.item }}_notify_mute
        data:
          value: ''
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.rfid_{{ repeat.item }}_ha_user_id
        data:
          value: ''
  - variables:
      leftover: >-
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(s=[]) %}
        {% for i in ids %}
          {% set n = states('input_text.rfid_' ~ i ~ '_card_id')
                     | string | trim | lower | length %}
          {% set ns.s = ns.s + [i ~ '=' ~ n ~ 'ch'] %}
        {% endfor %}
        {{ ns.s | join(', ') }}
      uncleared: >-
        {% set ids = (states('sensor.guardian_rfid_slots') | string).split(',')
                     | map('trim') | reject('eq', '') | list %}
        {% set wanted = ids if (which | string | trim) == 'all' else [which | string | trim] %}
        {% set ns = namespace(s=[]) %}
        {% for i in wanted %}
          {% if (states('input_text.rfid_' ~ i ~ '_card_id')
                 | string | trim | lower | length) == 16 %}
            {% set ns.s = ns.s + [i] %}
          {% endif %}
        {% endfor %}
        {{ ns.s | join(',') }}
  - action: persistent_notification.create
    data:
      notification_id: guardian_clear_rfid_slot
      title: >-
        {{ 'Guardian: card slot(s) cleared' if uncleared | trim | length == 0
           else 'Guardian: card slot clear incomplete' }}
      message: >-
        Requested '{{ which }}'. Helper lengths after the write:
        {{ leftover }}. Occupied is 16 hex characters after trim/lower.
        Presence (At home/Away) was not changed. Policy was reset to resident.
        The person name on that slot was cleared.
        {% if uncleared | trim | length > 0 %}
          Slot(s) {{ uncleared }} still read 16 characters, so the write
          did not stick - either input_text.set_value was rejected (helper
          min length above 0) or a stored value came back. Raise min to 0
          in Settings -> Devices & Services -> Helpers, then run this again.
        {% endif %}

guardian_create_ss_program:
  alias: Guardian - Create Super Surveillance Program
  description: >-
    Claims the first free Super Surveillance rack position and turns it into a
    program the panel will list. Home Assistant cannot create a helper at
    runtime, so the rack in packages/guardian.yaml is pre-provisioned and this
    only claims a position - which is why creating one needs no restart and no
    YAML edit.

    Free means: on sensor.guardian_ss_programs (the rack) and not on
    sensor.guardian_ss_programs_created. That second sensor holds the only copy
    of the created predicate; this script does not re-derive it.

    Defaults are the window packages/guardian.yaml documents as the recommended
    first-boot: enabled, every day, 00:00-05:00. A created program is therefore
    live immediately and will elevate tonight until it is edited. The name is
    left empty on purpose - the panel falls back to "Program N" and the
    household types over it.
  mode: single
  sequence:
  - variables:
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% if uid == '' %}true
        {% else %}
          {% set admins = (states('input_text.guardian_ha_admin_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set users = (states('input_text.guardian_ha_user_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {{ uid in admins or (users | length) <= 1 }}
        {% endif %}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: Super Surveillance programs are an administrator action.
    - stop: Unauthorized.
  - variables:
      free: >-
        {% set rack = (states('sensor.guardian_ss_programs') | string).split(',')
                      | map('trim') | reject('eq', '') | list %}
        {% set made = (states('sensor.guardian_ss_programs_created')
                       | string).split(',') | map('trim') | reject('eq', '') | list %}
        {% set ns = namespace(id='') %}
        {% for p in rack %}
          {% if ns.id == '' and p not in made %}
            {% set ns.id = p %}
          {% endif %}
        {% endfor %}
        {{ ns.id }}
  - if:
    - condition: template
      value_template: "{{ free | trim | length == 0 }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: guardian_ss_program
        title: 'Guardian: no free program slot'
        message: >-
          All {{ state_attr('sensor.guardian_ss_programs', 'count') | int(0) }}
          Super Surveillance positions are in use. Delete a program on
          More -> Security to free one. Adding capacity is a YAML change:
          duplicate a helper block in packages/guardian.yaml, append the id to
          sensor.guardian_ss_programs and to the trigger list on
          sensor.guardian_ss_programs_created, then restart.
    - stop: Rack full.
  - repeat:
      for_each: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']
      sequence:
      - action: input_boolean.turn_on
        continue_on_error: true
        target:
          entity_id: input_boolean.guardian_ss_{{ free }}_{{ repeat.item }}
  - action: input_number.set_value
    continue_on_error: true
    target:
      entity_id: input_number.guardian_ss_{{ free }}_start
    data:
      value: 0
  - action: input_number.set_value
    continue_on_error: true
    target:
      entity_id: input_number.guardian_ss_{{ free }}_end
    data:
      value: 5
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_ss_{{ free }}_name
    data:
      value: ''
  - action: input_boolean.turn_on
    continue_on_error: true
    target:
      entity_id: input_boolean.guardian_ss_{{ free }}_enabled
  # _created last: it is what makes the program appear, so every other helper
  # is already written by the time the panel and elevated_mode see it. A card
  # never flashes up half-configured.
  - action: input_boolean.turn_on
    continue_on_error: true
    target:
      entity_id: input_boolean.guardian_ss_{{ free }}_created
  - variables:
      result:
        program: '{{ free }}'
  - stop: Program created
    response_variable: result

guardian_delete_ss_program:
  alias: Guardian - Delete Super Surveillance Program
  description: >-
    Returns one Super Surveillance position to the unclaimed pool: clears
    _created so the panel stops listing it, and wipes the configuration on it -
    enabled off, every day off, name empty, hours 0/0 - so a position claimed
    again later does not inherit the previous program's schedule. Same
    tear-down contract as guardian_clear_rfid_slot.

    Unconditional on purpose. It does not look at _enabled, so deleting a
    disabled program and deleting an enabled one are the same operation. Nothing
    here is reachable from a toggle: enable/disable writes only _enabled, and
    only this script clears _created.
  mode: queued
  max: 4
  fields:
    program:
      description: Program id from sensor.guardian_ss_programs.
      required: true
      example: '1'
      selector:
        text:
  sequence:
  - variables:
      which: '{{ program | string | trim }}'
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% if uid == '' %}true
        {% else %}
          {% set admins = (states('input_text.guardian_ha_admin_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set users = (states('input_text.guardian_ha_user_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {{ uid in admins or (users | length) <= 1 }}
        {% endif %}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: Super Surveillance programs are an administrator action.
    - stop: Unauthorized.
  - if:
    - condition: template
      value_template: "{{ (program | string | trim) not in
        ((states('sensor.guardian_ss_programs') | string).split(',')
         | map('trim') | reject('eq', '') | list) }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: guardian_ss_program
        title: 'Guardian: program not deleted'
        message: >-
          program must be one of {{ states('sensor.guardian_ss_programs') }}.
    - stop: Invalid program.
  # _created first, so the program leaves the list in one step rather than
  # being watched as it empties itself.
  - action: input_boolean.turn_off
    continue_on_error: true
    target:
      entity_id: input_boolean.guardian_ss_{{ which }}_created
  - action: input_boolean.turn_off
    continue_on_error: true
    target:
      entity_id: input_boolean.guardian_ss_{{ which }}_enabled
  - repeat:
      for_each: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']
      sequence:
      - action: input_boolean.turn_off
        continue_on_error: true
        target:
          entity_id: input_boolean.guardian_ss_{{ which }}_{{ repeat.item }}
  - action: input_text.set_value
    continue_on_error: true
    target:
      entity_id: input_text.guardian_ss_{{ which }}_name
    data:
      value: ''
  - action: input_number.set_value
    continue_on_error: true
    target:
      entity_id: input_number.guardian_ss_{{ which }}_start
    data:
      value: 0
  - action: input_number.set_value
    continue_on_error: true
    target:
      entity_id: input_number.guardian_ss_{{ which }}_end
    data:
      value: 0
  - if:
    - condition: template
      value_template: "{{ (which | string | trim) in
        ((states('sensor.guardian_ss_programs_created') | string).split(',')
         | map('trim') | reject('eq', '') | list) }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: guardian_ss_program
        title: 'Guardian: program delete incomplete'
        message: >-
          Program {{ which }} still reads as created. One of the writes did not
          stick - check Settings -> Devices & Services -> Helpers for a UI copy
          of guardian_ss_{{ which }}_created shadowing the YAML helper, then
          run this again.
  - variables:
      result:
        program: '{{ which }}'
  - stop: Program deleted
    response_variable: result

guardian_reset_auth:
  alias: Guardian - Reset Authentication State
  description: >-
    Returns the access-control state machine to idle. Grants nothing: a fresh
    scan and PIN are still required, and the Elevated Opening Supervisor still
    alarms on any unauthorised opening. Called by the auth watchdog, on leaving
    elevated mode, at startup, and by guardian_reset.
  # queued, not single. Four different callers can invoke this, and two of them
  # (leaving elevated mode, and the watchdog noticing what that left behind) can
  # legitimately fire seconds apart. mode: single would DROP the second call
  # with a log warning - in a recovery path, where being skipped is the one
  # thing it must never do. Every step is idempotent, so running twice costs
  # nothing.
  #
  # max WAS 3, AND THE CALLER COUNT IS 4. That reasoning above stopped one step
  # short: choosing queued over single avoids the drop at two callers and does
  # nothing about the drop at four. A blocking call against a queued script
  # already at max is discarded silently - it does not raise, and the caller
  # proceeds as though it ran - so the fourth concurrent caller got the one
  # outcome this script exists to prevent, and got it without a log line anyone
  # would connect to a siren.
  #
  # The four are "Guardian: Startup State Recovery", "Guardian: Auth State
  # Watchdog", "Guardian: Elevated Mode Deactivated" and script.guardian_reset -
  # all mode: single, so each holds at most one blocking call, and at a Home
  # Assistant start three of them can genuinely overlap while somebody presses
  # the reset button for the fourth. What that fourth call would have dropped is
  # the teardown of timer.guardian_entry_challenge, timer.guardian_mfa_window and
  # timer.guardian_doorbell_exit_pin_window, each of which counts down to
  # guardian.major_alarm on its own: the siren fires at whoever is standing
  # there, for an entry that was already accounted for.
  #
  # 10 is not a guess and it is not headroom for its own sake. The invariant is
  # capacity >= the number of callers that can hold a blocking call at once, and
  # check_blocking_call_capacity in tools/guardian-preflight.py now computes both
  # sides of that from the call graph and fails if it is ever violated again.
  # Raise this number when a fifth caller appears; the check will say so.
  mode: queued
  max: 10
  sequence:
  - action: timer.cancel
    target:
      entity_id:
      - timer.guardian_mfa_window
      - timer.guardian_entry_window
      - timer.guardian_exit_window
      # An entry challenge left running counts down to a full alarm on its own,
      # so it belongs in exactly the same recovery path as a stranded PIN
      # challenge - and for exactly the same reason.
      - timer.guardian_entry_challenge
      # PIN-change is an input_boolean that restores across a restart while
      # its 40s timer does not. Leaving the mode on with no timer is the same
      # stranded mid-flow as a restored portal_mfa_pending (F-19/F-31/F-36).
      - timer.guardian_pin_change_window
      # Same restore: false class. An unanswered doorbell-exit window becomes
      # a full alarm; it cannot be allowed to survive a reset or a restart.
      - timer.guardian_doorbell_exit_pin_window
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.portal_mfa_pending
      - input_boolean.guardian_entry_challenge
      - input_boolean.guardian_challenge_card_ok
      - input_boolean.guardian_challenge_pin_ok
      - input_boolean.guardian_doorbell_exit_pin
      - input_boolean.guardian_pin_change_mode
  - action: input_number.set_value
    target:
      entity_id:
      - input_number.mfa_failed_attempts
      - input_number.guardian_pin_change_fails
    data:
      value: 0
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.pending_mfa_slot
      - input_text.pending_mfa_source
      - input_text.pending_entry_slot
      - input_text.pending_exit_slot
      - input_text.guardian_pending_direction
      - input_text.guardian_challenge_origin
      - input_text.guardian_pin_change_step
      - input_text.guardian_doorbell_exit_slot
    data:
      value: none
  - action: persistent_notification.dismiss
    continue_on_error: true
    data:
      notification_id: guardian_doorbell_exit_pin
  # Never overwrite an active ALARM with IDLE - silencing an alarm is a
  # deliberate act, and guardian_reset does it explicitly. Everything else is a
  # transient screen that should not survive a reset.
  - if:
    - condition: template
      value_template: "{{ states('input_text.portal_display_state') not in
        ['ALARM', 'IDLE'] }}"
    then:
    - action: script.guardian_set_display
      data:
        value: IDLE

guardian_reset:
  alias: Guardian - Reset System
  description: >-
    Full recovery. Clears the authentication state machine, every latch, a
    wedged ALARM, and every Guardian notification, then hands the lamp back to
    automatic control. Use when the system is behaving inconsistently - it is
    the documented way out of a stuck state.

    Deliberately Home Assistant-side only: it is reachable from
    input_button.guardian_reset and from this action, and NOT from the portal
    keypad, because clearing a live PIN challenge from the wall panel is
    precisely what an intruder would want to do.
  mode: single
  fields:
    restart_devices:
      description: Also reboot the interior portal and the doorbell.
      required: false
      default: false
      example: false
      selector:
        boolean:
  sequence:
  - variables:
      auth_allowed: >-
        {% set uid = context.user_id | default('', true) | string | trim %}
        {% if uid == '' %}true
        {% else %}
          {% set admins = (states('input_text.guardian_ha_admin_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {% set users = (states('input_text.guardian_ha_user_ids') | string).split(',')
             | map('trim') | reject('eq', '') | reject('in', ['unknown', 'unavailable', 'none']) | list %}
          {{ uid in admins or (users | length) <= 1 }}
        {% endif %}
  - if:
    - condition: template
      value_template: "{{ not (auth_allowed | bool) }}"
    then:
    - action: persistent_notification.create
      continue_on_error: true
      data:
        notification_id: guardian_auth_refused
        title: 'Guardian: not allowed'
        message: Resetting Guardian is an administrator action.
    - stop: Unauthorized.
  - action: script.guardian_reset_auth
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.guardian_enrollment_mode
      - input_boolean.guardian_lamp_sampling
      - input_boolean.guardian_portal_offline_notified
      - input_boolean.guardian_doorbell_offline_notified
  # A separate guarded turn_off for input_boolean.guest_bypass stood here. That
  # helper, its automation and its panel mapping were all removed in the
  # forty-first pass - it was written by one automation and read by nothing.
  - action: input_number.set_value
    target:
      entity_id: input_number.guardian_lamp_fail_streak
    data:
      value: 0
  - action: input_text.set_value
    target:
      entity_id:
      - input_text.guardian_alarm_reason
      - input_text.guardian_lamp_presample
      - input_text.guardian_lamp_mismatch_since
    data:
      value: none
  # Enrollment mode no longer disables itself after a card, so a reset has to be
  # the thing that ends a session somebody walked away from. The boolean is
  # already turned off above; this clears what the session left behind.
  - action: timer.cancel
    target:
      entity_id: timer.guardian_enrollment_window
  - action: input_text.set_value
    target:
      entity_id: input_text.guardian_enrollment_slot
    data:
      value: ''
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.guardian_enroll_as_visitor
  # This is the only path out of a wedged alarm other than the phone
  # notification action. "Guardian: Major Alarm Handler" loops on
  # "while portal_display_state == ALARM", so writing IDLE ends the siren.
  - action: script.guardian_set_display
    data:
      value: IDLE
  - repeat:
      for_each:
      - guardian_stolen_card
      - guardian_unknown_direction
      - guardian_luminance_unusable
      - guardian_luminance_contradicts_sun
      - guardian_lamp_cal_ready
      - guardian_lamp_mismatch_timeout
      - guardian_lamp_sample_stuck
      - guardian_enrollment_full
      - guardian_enrollment_write_failed
      - guardian_enrollment_name_failed
      - guardian_enrollment_timeout
      - guardian_pin_change_blocked
      - guardian_pin_change_no_hash
      - guardian_clear_rfid_slot
      - guardian_auth_watchdog
      - guardian_notify_selftest
      - guardian_notify_selftest_ok
      - guardian_notify_fallback
      - guardian_notify_skipped
      - guardian_doorbell_exit_pin
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ repeat.item }}'
        continue_on_error: true
  - repeat:
      for_each: >-
        {% set ns = namespace(ids=[]) %}
        {% for i in (states('sensor.guardian_rfid_slots') | string).split(',')
                    | map('trim') | reject('eq', '') %}
          {% set ns.ids = ns.ids + ['guardian_presence_corrected_' ~ i] %}
        {% endfor %}
        {{ ns.ids }}
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ repeat.item }}'
        continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ restart_devices | default(false) | bool }}'
    then:
    - action: button.press
      target:
        entity_id: button.guardian_interior_portal_restart
      continue_on_error: true
    # The attribute is '' on any install where no doorbell has been flashed,
    # and '' is not a valid entity id: vol.Invalid, which continue_on_error
    # re-raises. So on a portal-only house this step ended the reset here -
    # before the ambient re-sample, before the guardian.system_reset event, and
    # before the confirmation push. The household pressed Reset, got a partial
    # reset, and was told nothing at all. The `none` sentinel makes the step a
    # no-op instead of an abort.
    - action: button.press
      target:
        entity_id: >-
          {% set e = state_attr('sensor.guardian_doorbell_entities', 'restart')
             | default('', true) | string | trim %}
          {{ e if e is match('^(?!.+__)(?!_)[\da-z_]+(?<!_)\.(?!_)[\da-z_]+(?<!_)$') else 'none' }}
      continue_on_error: true
    # A reboot takes both units off the network for roughly ten seconds. Both
    # offline watchdogs require five minutes before they alert, so no false
    # alarm is possible and nothing needs suppressing. The pause is only so the
    # confirmation below is not sent while the devices are mid-restart.
    - delay: 00:00:15
  # Sampling was just forced off above, so this cannot be blocked by a stale
  # flag. It re-decides the lamp from scratch rather than leaving it wherever
  # the alarm or an interrupted sample left it.
  - action: script.guardian_sample_ambient_light
  - event: guardian.system_reset
  - action: script.guardian_notify_broadcast
    continue_on_error: true
    data:
      category: system
      severity: important
      title: 'Guardian: system reset'
      message: >-
        All Guardian state was reset at {{ now().strftime('%H:%M:%S') }}. No
        access was granted. Scan a card as normal.
